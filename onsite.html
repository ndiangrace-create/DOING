<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOING｜現場工作台 / Onsite</title>
<style>
:root{--ink:#242536;--muted:#737589;--line:#e9e9ef;--aqua:#7dc8ca;--mint:#cae9e0;--cream:#f3d2ac;--coral:#f3b8b1;--bg:#f8f9fb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:900px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950}.sub{font-size:12px;color:var(--muted)}
main{max-width:900px;margin:auto;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,input,button{font:inherit}select,input{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}input{flex:1;min-width:180px}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:var(--aqua);color:#fff}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.ok{background:#65b996}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 8px 22px rgba(43,47,65,.06)}.card h3{margin:0;font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.65;margin-top:5px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}.hidden{display:none!important}

/* DOING ONSITE PRODUCT DESIGN */
:root{--ink:#202332!important;--muted:#74798a!important;--line:#e5ebee!important;--aqua:#58bfc1!important;--mint:#dff5ef!important;--cream:#fff0d7!important;--coral:#ffd9d3!important;--bg:#f5f9fa!important;--deep:#319da0}
body{background:linear-gradient(180deg,#f9fcfc,#f4f8f9)!important}header{background:rgba(255,255,255,.92)!important}.head{max-width:1080px!important;padding:10px 16px!important}.brand{font-size:18px!important;letter-spacing:-.02em}.onsite-shell{max-width:1080px;margin:auto;padding:14px 14px 40px}.onsite-hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;padding:20px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(125deg,#edf9f6,#fff 60%,#fff7e9);box-shadow:0 15px 38px rgba(42,70,84,.07);margin-bottom:12px}.onsite-hero small{font-size:9px;letter-spacing:.12em;font-weight:950;color:#398d8f}.onsite-hero h1{margin:5px 0 4px;font-size:27px}.onsite-hero p{margin:0;color:var(--muted);font-size:12px}.live-dot{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;color:#3a8b79}.live-dot i{width:9px;height:9px;background:#56c59c;border-radius:50%;box-shadow:0 0 0 6px rgba(86,197,156,.12)}main{max-width:none!important;padding:0!important}.control{display:grid;grid-template-columns:minmax(220px,.7fr) 1fr auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:8px;box-shadow:0 9px 25px rgba(42,70,84,.05);margin-bottom:10px}.control select,.control input{border:0!important;background:#f7f9fa!important;min-height:44px}.summary-band{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.sum{padding:12px;border:1px solid var(--line);background:#fff;border-radius:16px}.sum span{display:block;font-size:8px;color:var(--muted)}.sum b{display:block;font-size:19px;margin-top:4px}.sum:nth-child(1){background:linear-gradient(145deg,#effaf7,#fff)}.filterbar{display:flex;gap:6px;margin-bottom:12px}.filterbar button{border-radius:999px!important}.grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))!important;gap:11px!important}.card{border-radius:21px!important;padding:15px!important;box-shadow:0 11px 30px rgba(42,70,84,.06)!important;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#dfe8e9}.card.checked:before{background:#5bc69c}.card h3{font-size:18px!important}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px!important;line-height:1.4!important}.meta span{padding:8px;border-radius:11px;background:#f8fafb;border:1px solid #edf1f2;font-size:10px;color:#6f7583}.meta b{display:block;color:#29313d;margin-top:2px;font-size:11px}.actions button{border-radius:12px!important}.actions .ok{background:linear-gradient(135deg,#3ba97e,#64c99f)!important}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);background:#233039;color:#fff;padding:10px 14px;border-radius:999px;font-size:11px;opacity:0;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.login{background:radial-gradient(circle at 20% 20%,#dff5ef,transparent 34%),radial-gradient(circle at 82% 72%,#fff0d7,transparent 32%),#f7fafb!important}.loginbox{border-radius:29px!important;box-shadow:0 30px 80px rgba(42,70,84,.13)!important;padding:28px!important}.loginbox h1{font-size:27px;margin-bottom:5px}button{background:linear-gradient(135deg,var(--deep),var(--aqua))!important}.secondary{background:#fff!important}@media(max-width:700px){.onsite-shell{padding:9px}.onsite-hero{grid-template-columns:1fr;padding:16px;border-radius:22px}.control{grid-template-columns:1fr}.summary-band{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr!important}.meta{grid-template-columns:1fr 1fr}.head{padding:9px}.brand{font-size:16px}}

</style></head>
<body>
<section id="login" class="login"><div class="loginbox"><h1>DOING 現場工作台</h1><p class="sub">使用已授權的 Google 帳號登入。</p><button id="loginBtn">使用 Google 登入</button><div id="loginErr" class="sub" style="margin-top:12px"></div></div></section>
<section id="app" class="hidden"><header><div class="head"><div><div class="brand">DOING｜現場工作台</div><div id="who" class="sub"></div></div><button id="logout" class="secondary">登出</button></div></header><main><div class="onsite-shell"><section class="onsite-hero"><div><small>LIVE OPERATIONS</small><h1>今天現場，先看需要處理的人。</h1><p>名單、付款、位置、設備與報到狀態集中在同一個手機工作台。</p></div><div class="live-dot"><i></i>即時讀取資料庫</div></section><div class="control"><select id="session"></select><input id="search" placeholder="搜尋品牌／姓名／電話"><button id="refresh" class="secondary">重新整理</button></div><div id="summaryBand" class="summary-band"></div><div class="filterbar"><button class="secondary filt" data-f="unchecked">未報到</button><button class="secondary filt" data-f="checked">已報到</button><button class="secondary filt" data-f="all">全部</button></div><div id="list" class="grid"><div class="empty">載入中…</div></div></div></main></section><div id="toast" class="toast"></div>
<script>
const API='https://tobeloved-api.ndiangrace.workers.dev', $=id=>document.getElementById(id);
const S={token:'',email:'',tenant:'',sessions:[],rows:[],filter:'unchecked'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function decode(t){try{const s=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(s+'='.repeat((4-s.length%4)%4)))}catch(e){return{}}}
async function get(action,p={}){const q=new URLSearchParams({action,email:S.email||'_',token:S.token,...p});if(S.tenant)q.set('tenant',S.tenant);const r=await fetch(API+'?'+q);const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'讀取失敗');return j}
async function post(action,p={}){const body={action,email:S.email,token:S.token,...p};if(S.tenant)body.tenant=S.tenant;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'操作失敗');return j}
async function boot(){const u=new URL(location.href),t=u.searchParams.get('admin_token')||localStorage.getItem('doing_admin_token')||'';if(t){S.token=t;localStorage.setItem('doing_admin_token',t);history.replaceState({},'',location.pathname)}const d=decode(S.token);S.email=d.email||'';S.tenant=d.tenant_id||'';if(!S.token){return}try{const me=await get('adminMe');S.email=me.email||S.email;S.tenant=me.tenant_id||S.tenant;$('who').textContent=(me.display_name||me.name||S.email)+'｜'+(me.tenant_name||me.tenant?.name||'');$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadSessions()}catch(e){$('loginErr').textContent=e.message}}
async function loadSessions(){try{const rows=await get('onsiteSessions');S.sessions=Array.isArray(rows)?rows:(rows.sessions||[]);$('session').innerHTML=S.sessions.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||x.title||'場次')+'</option>').join('');if(S.sessions.length)await loadRows();else $('list').innerHTML='<div class="empty">目前沒有授權場次</div>'}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadRows(){const sid=$('session').value;if(!sid)return;try{const rows=await get('onsiteRegs',{sessionId:sid});S.rows=Array.isArray(rows)?rows:(rows.rows||[]);render()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function checked(r){return String(r.checkinStatus||r.checkin||'').includes('已報到')}
function render(){const kw=$('search').value.trim().toLowerCase();const all=S.rows||[],done=all.filter(checked).length,undone=all.length-done,paid=all.filter(r=>/已繳費|已付款|免費/.test(String(r.payStatus||r.paymentStatus||''))).length;$('summaryBand').innerHTML='<div class="sum"><span>本場名單</span><b>'+all.length+'</b></div><div class="sum"><span>已報到</span><b>'+done+'</b></div><div class="sum"><span>未報到</span><b>'+undone+'</b></div><div class="sum"><span>付款完成／免費</span><b>'+paid+'</b></div>';let a=all.filter(r=>S.filter==='all'||(S.filter==='checked'?checked(r):!checked(r)));if(kw)a=a.filter(r=>((r.brand||'')+(r.name||'')+(r.phone||'')).toLowerCase().includes(kw));$('list').innerHTML=a.length?a.map(r=>'<article class="card '+(checked(r)?'checked':'')+'"><h3>'+esc(r.brand||r.name||'報名者')+'</h3><div class="sub">'+esc(r.name||'')+'｜'+esc(r.phone||'')+'</div><div class="meta"><span>位置<b>'+esc(r.stallNo||r.stallNumber||'—')+'</b></span><span>付款<b>'+esc(r.payStatus||r.paymentStatus||'—')+'</b></span><span>設備<b>'+esc(r.equipmentText||r.totalEquipmentText||'設備自備')+'</b></span><span>報到<b>'+esc(r.checkinStatus||'未報到')+'</b></span></div><div class="actions">'+(checked(r)?'<button class="secondary" disabled>已完成報到</button>':'<button class="ok" onclick="doCheckin(\''+esc(r.id||r.regId)+'\')">完成報到</button>')+'</div></article>').join(''):'<div class="empty">沒有符合條件的名單</div>'}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2600)}
async function doCheckin(id){try{await post('checkin',{regId:id,sessionId:$('session').value});toast('已完成報到');await loadRows()}catch(e){toast(e.message)}}
$('loginBtn').onclick=()=>location.href=API+'/auth/google/start';$('logout').onclick=()=>{localStorage.removeItem('doing_admin_token');location.reload()};$('refresh').onclick=loadRows;$('session').onchange=loadRows;$('search').oninput=render;document.querySelectorAll('.filt').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});boot();
</script></body></html>
