<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DOING</title>
<style>html,body{margin:0;min-height:100%;background:#fff}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}</style>
</head>
<body>
<script>
(()=>{
  'use strict';
  const here=new URL(location.href);
  const params=here.searchParams;
  const hash=here.hash||'';
  // member.html is redirect-only. All explicit member sections, including #home,
  // must stay inside the internal member panel instead of bouncing back to index.
  const special=params.get('embed')==='1'||params.has('staff_invite')||params.has('registration_invite')||/^#(?:home|activities|brands|account|operations)$/i.test(hash);
  if(special){
    const target=new URL('member-panel.html',here);
    target.search=here.search;
    target.hash=hash;
    location.replace(target.toString());
    return;
  }
  const target=new URL('index.html',here);
  const memberToken=params.get('member_token');
  const memberStatus=params.get('member_status');
  const memberError=params.get('member_login_error')||params.get('login_error');
  if(memberToken){target.searchParams.set('member_token',memberToken);target.searchParams.set('doing_login_flow','workspace');}
  if(memberStatus)target.searchParams.set('member_status',memberStatus);
  if(memberError)target.searchParams.set('member_login_error',memberError);
  location.replace(target.toString());
})();
</script>
</body>
</html>
