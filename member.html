<style>
:root{--ink:#303947;--muted:#66717f;--line:#dce7e8;--main:#188f92;--soft:#e9f7f5;--warn:#9c6717;--danger:#b83d4b;--shadow:0 12px 35px rgba(44,71,82,.11)}
*{box-sizing:border-box}html{font-size:17px}body{margin:0;background:#f6f9fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top-in{width:min(1120px,100%);min-height:62px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.home{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:950}.home img{width:40px;height:40px;object-fit:contain}.who{min-width:0;text-align:right}.who b,.who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{color:var(--muted);font-size:13px}
.shell{width:min(1120px,100%);margin:auto;padding:12px 14px 30px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;border:1px solid #d3e8e6;border-radius:20px;background:linear-gradient(135deg,#eefaf8,#fff5fb);box-shadow:var(--shadow)}.hero h1{margin:2px 0;font-size:clamp(23px,3vw,31px)}.hero p{margin:0;color:var(--muted)}.logout{border:0;border-radius:13px;padding:11px 14px;background:#edf1f3;color:#495563;font-weight:900;min-height:44px}
.tabs{position:sticky;top:62px;z-index:15;display:flex;gap:7px;margin:10px 0;padding:7px;border:1px solid var(--line);border-radius:17px;background:rgba(246,249,250,.97);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1 0 auto;min-width:118px;min-height:46px;border:0;border-radius:12px;background:#fff;color:#53606e;font-weight:950}.tab.active{background:var(--main);color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0;padding:15px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 5px 18px rgba(49,69,77,.06)}.card h2,.card h3{margin:0 0 5px}.card h2{font-size:20px}.card h3{font-size:18px}.card p{margin:3px 0;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:9px}.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;background:var(--soft);color:#217a72;font-size:14px;font-weight:950}.status.pending{background:#fff3d5;color:var(--warn)}.status.danger{background:#ffe7e9;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:13px;padding:10px 14px;background:var(--main);color:#fff;text-decoration:none;font-weight:950}.btn.secondary{background:#eef3f4;color:#43515f}.btn.outline{background:#fff;color:var(--main);box-shadow:inset 0 0 0 1px #9bcfd0}.empty{padding:24px;border:1px dashed #bfcfd2;border-radius:17px;background:#fff;text-align:center;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{padding:12px;border-radius:15px;background:#fff;border:1px solid var(--line)}.kpi b{display:block;font-size:21px}.kpi small{color:var(--muted)}
.activity{display:grid;grid-template-columns:1fr auto;gap:8px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}.activity b{font-size:17px}.activity small{display:block;color:var(--muted)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;font-weight:850}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{width:100%;min-height:48px;border:1px solid #cbdadc;border-radius:12px;background:#fff;padding:10px 12px;color:var(--ink)}.field textarea{min-height:82px}.savebar{position:sticky;bottom:8px;display:flex;gap:8px;margin-top:12px;padding:8px;border-radius:16px;background:rgba(246,249,250,.96)}.savebar .btn{flex:1}.message{min-height:24px;color:var(--danger);font-weight:850}.loading{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:680px){html{font-size:16px}.top-in{min-height:58px;padding:7px 10px}.home img{width:36px;height:36px}.shell{padding:9px 9px 22px}.hero{padding:12px 13px;border-radius:17px}.hero h1{font-size:22px}.hero p{font-size:14px}.logout{padding:9px 11px;min-height:42px}.tabs{top:58px;margin:8px 0;padding:5px;border-radius:14px}.tab{min-width:102px;min-height:44px;padding:7px 10px}.grid{grid-template-columns:1fr}.card{padding:13px}.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.activity{grid-template-columns:1fr}.actions .btn{flex:1 1 135px}.panel{min-height:calc(100vh - 140px)}}
@media(min-width:900px){.identity-layout{display:grid;grid-template-columns:320px 1fr;gap:10px}.identity-layout .wide{grid-column:2}.compact-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.panel{max-height:calc(100vh - 168px);overflow:auto;padding-right:3px}}
</style>

<style id="member-brand-refresh">
body{min-height:100vh;background:radial-gradient(circle at 6% 2%,var(--doing-pink),transparent 24%),radial-gradient(circle at 94% 5%,var(--doing-blue),transparent 25%),linear-gradient(180deg,#fffafd,var(--doing-bg))!important}
.top{background:rgba(255,253,253,.91)!important;border-bottom:1px solid var(--doing-line)!important;box-shadow:0 8px 28px rgba(91,70,103,.08)!important}.top-in{width:min(1180px,100%);min-height:72px}.home{gap:10px}.home img{width:46px;height:46px;filter:drop-shadow(0 7px 12px rgba(91,70,103,.13))}.home-copy{display:grid;line-height:1.15}.home-copy b{font-size:19px;letter-spacing:.08em}.home-copy small{margin-top:4px;color:var(--doing-muted);font-size:13px}.who b{font-size:17px}
.shell{width:min(1180px,100%);padding:16px 16px 34px}.hero{position:relative;isolation:isolate;min-height:142px;overflow:hidden;padding:22px 26px;border:4px solid #fff!important;border-radius:30px!important;background:linear-gradient(125deg,#fff 0%,var(--doing-pink) 47%,var(--doing-blue) 100%)!important;box-shadow:var(--doing-shadow)!important}.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border-radius:50%;border:10px solid rgba(255,255,255,.52)}.hero:before{width:150px;height:150px;right:10%;top:-88px}.hero:after{width:88px;height:88px;right:25%;bottom:-62px}.hero-copy{max-width:720px}.eyebrow{display:inline-flex;margin-bottom:5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.75);color:var(--doing-primary-dark);font-size:13px;font-weight:950;letter-spacing:.08em}.hero h1{font-size:clamp(25px,3vw,36px)!important}.hero p{font-size:16px;color:var(--doing-ink)!important;opacity:.78}.hero-spark{position:absolute;right:28px;bottom:13px;font-size:62px;line-height:1;filter:drop-shadow(0 8px 14px rgba(91,70,103,.12));transform:rotate(8deg)}
.tabs{top:72px;margin:12px 0;padding:7px!important;border-radius:22px!important;background:linear-gradient(135deg,var(--doing-pink),var(--doing-blue),var(--doing-yellow))!important}.tab{min-width:120px}.panel{padding:2px}.card{position:relative;overflow:hidden;padding:17px!important;border:3px solid #fff!important}.identity-layout .card:nth-child(4n+1){background:linear-gradient(145deg,#fff,var(--doing-pink))!important}.identity-layout .card:nth-child(4n+2){background:linear-gradient(145deg,#fff,var(--doing-blue))!important}.identity-layout .card:nth-child(4n+3){background:linear-gradient(145deg,#fff,var(--doing-yellow))!important}.identity-layout .card:nth-child(4n){background:linear-gradient(145deg,#fff,var(--doing-green))!important}.status{border:2px solid #fff;box-shadow:0 4px 12px rgba(91,70,103,.06)}.activity,.kpi,.empty{border:2px solid #fff!important;background:rgba(255,255,255,.9)!important;box-shadow:0 8px 20px rgba(91,70,103,.07)}.panel>.row{margin:4px 2px 11px}.logout{border:3px solid #fff!important}.savebar{background:rgba(255,250,253,.92);box-shadow:0 8px 25px rgba(91,70,103,.1)}
@media(max-width:680px){.top-in{min-height:62px}.home img{width:40px;height:40px}.home-copy b{font-size:17px}.home-copy small{font-size:12px}.who{max-width:44%}.shell{padding:10px 9px 24px}.hero{min-height:116px;padding:16px 15px;border-radius:23px!important}.hero h1{font-size:23px!important}.hero p{font-size:14px;max-width:78%}.hero-spark{right:12px;bottom:9px;font-size:42px}.tabs{top:62px;margin:8px 0;padding:5px!important;border-radius:17px!important}.tab{min-width:104px}.card{padding:13px!important}.identity-layout{gap:8px}.panel>.row h2{font-size:21px}}
</style>

<body>
<header class="top"><div class="top-in"><a class="home" href="index.html" aria-label="回到 DOING 首頁"><img src="doing-logo.png" alt="DOING"><span class="home-copy"><b>DOING</b><small>← 回到活動首頁</small></span></a><div class="who"><b id="topName">我的 DOING</b><small id="topRole">會員中心</small></div></div></header>
<main class="shell">
  <section id="loginView" class="hero"><div class="hero-copy"><span class="eyebrow">MY DOING</span><h1>把參加、品牌與營運放在一起</h1><p>一個帳號，就能帶著你的每一種身分繼續前進。</p></div><button class="btn" id="lineLogin">使用 LINE 登入</button><span class="hero-spark" aria-hidden="true">✦</span></section>
  <section id="appView" class="hidden">
    <div class="hero"><div class="hero-copy"><span class="eyebrow">MY DOING</span><h1 id="hello">你好</h1><p id="identityLine">正在整理你的多重身分</p></div><button class="logout" id="logout">登出</button><span class="hero-spark" aria-hidden="true">✦</span></div>
    <nav class="tabs" aria-label="我的 DOING 分頁">
      <button class="tab active" data-page="home">總覽</button><button class="tab" data-page="activities">我的活動</button><button class="tab" data-page="brands">我的品牌</button><button class="tab" data-page="operations">我的營運</button><button class="tab" data-page="account">帳號設定</button>
    </nav>
    <section class="panel active" data-panel="home"><div id="overview" class="identity-layout"></div></section>
    <section class="panel" data-panel="activities"><div class="row"><h2>我的活動</h2><button class="btn secondary" id="refreshActivities">重新整理</button></div><div id="activityStats" class="kpis"></div><div id="activities" class="stack" style="margin-top:10px"></div></section>
    <section class="panel" data-panel="brands"><div class="row"><h2>我的品牌</h2><button class="btn secondary" data-go="account">編輯資料</button></div><div id="brands" class="grid"></div></section>
    <section class="panel" data-panel="operations"><div class="row"><h2>我的營運</h2><a id="newOperationBtn" class="btn outline hidden" href="index.html#apply">開設另一個營運單位</a></div><div id="operations" class="grid"></div></section>
    <section class="panel" data-panel="account"><div class="row"><h2>帳號與品牌資料</h2><span class="status">LINE 已連結</span></div><form id="profileForm" class="form"><label class="field">姓名<input name="name" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">手機<input name="phone" required inputmode="tel"></label><label class="field">所在縣市<input name="city"></label><label class="field">LINE 帳號<input name="lineId"></label><label class="field">品牌名稱<input name="brandName"></label><label class="field">品牌類別<select name="category"><option value="">尚未建立品牌</option><option>餐飲美食</option><option>手作設計</option><option>文創選物</option><option>服飾配件</option><option>生活用品</option><option>親子兒童</option><option>寵物相關</option><option>收藏娛樂</option><option>美業服務</option><option>體驗／服務</option><option>其他</option></select></label><label class="field full">品牌介紹<textarea name="brandIntro"></textarea></label><label class="field">主要品項<input name="items"></label><label class="field">Instagram<input name="instagram" type="url"></label><label class="field">Facebook<input name="facebook" type="url"></label><label class="field">作品／介紹網址<input name="photoUrl" type="url"></label><label class="field">公司登記名稱<input name="company"></label><label class="field">統一編號<input name="taxId"></label><div class="field full"><div id="formMessage" class="message"></div><div class="savebar"><button type="button" class="btn secondary" data-go="home">取消</button><button class="btn" type="submit">儲存資料</button></div></div></form></section>
  </section>
</main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',TOKEN_KEY='doing_member_token';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state={token:'',profile:null,applications:[],workspaces:[],activities:[]};
async function apiGet(action,p={}){const u=new URL(API);u.searchParams.set('action',action);Object.entries(p).forEach(([k,v])=>v!==undefined&&v!==null&&u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):v));const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'讀取失敗');return d.data??d.result??d}
async function apiPost(action,b={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'儲存失敗');return d.data??d.result??d}
function cleanReturn(){const u=new URL(location.href);['member_token','member_status','member_login_error'].forEach(k=>u.searchParams.delete(k));history.replaceState({},'',u.pathname+u.search+u.hash)}
function login(){const u=new URL(API+'/auth/line/start');u.searchParams.set('return_url',new URL('member.html',location.href).toString());location.href=u}
function switchPage(page){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===page));history.replaceState({},'',location.pathname+'#'+page);window.scrollTo({top:0,behavior:'auto'})}
function statusMeta(s){return ({pending:['審核中','pending'],google_verification_pending:['等待驗證','pending'],supplement_required:['待補件','danger'],approved:['已通過',''],active:['使用中',''],rejected:['未通過','danger']}[s]||[s||'處理中','pending'])}
function identityText(){const x=['會員'];if(state.profile?.brand)x.push('攤商品牌');if(state.applications.length)x.push('營運申請者');if(state.workspaces.length)x.push('主辦／工作人員');return x.join('・')}
function renderOverview(){const p=state.profile||{},app=state.applications[0],space=state.workspaces[0],sm=app?statusMeta(app.status):null;$('overview').innerHTML=`<article class="card"><div class="row"><h2>會員身分</h2><span class="status">已完成</span></div><p>${esc(p.name)}｜${esc(p.phone)}</p><div class="actions"><button class="btn secondary" data-go="account">編輯資料</button><button class="btn" data-go="activities">我的活動</button></div></article><div class="wide grid"><article class="card"><div class="row"><h3>攤商／品牌</h3><span class="status">${p.brand?'已建立':'尚未建立'}</span></div><p>${p.brand?esc(p.brand)+'｜'+esc(p.sellCat||'未分類'):'需要擺攤時再建立品牌資料'}</p><div class="actions"><button class="btn secondary" data-go="brands">查看品牌</button></div></article><article class="card"><div class="row"><h3>主辦／營運</h3><span class="status ${space?'':sm?.[1]||''}">${space?'可管理':sm?esc(sm[0]):'尚未申請'}</span></div><p>${esc(space?.name||app?.unitName||'需要經營時再申請')}</p><div class="actions"><button class="btn secondary" data-go="operations">查看營運</button>${space?`<a class="btn" href="admin.html?tenant=${encodeURIComponent(space.id)}">進入後台</a>`:!app?'<a class="btn" href="index.html#apply">申請營運帳號</a>':''}</div></article></div>`;wireGo()}
function renderBrands(){const p=state.profile||{};$('brands').innerHTML=p.brand?`<article class="card"><div class="row"><h3>${esc(p.brand)}</h3><span class="status">${esc(p.sellCat||'未分類')}</span></div><p>${esc(p.brandIntro||'尚未填寫品牌介紹')}</p><p>${esc(p.sellItem||'')}</p><div class="actions"><button class="btn" data-go="account">編輯品牌</button></div></article>`:'<div class="empty">目前尚未建立品牌<br><button class="btn" data-go="account" style="margin-top:10px">建立品牌資料</button></div>';wireGo()}
function renderOperations(){const cards=[];$('newOperationBtn').classList.toggle('hidden',!state.workspaces.length);for(const w of state.workspaces){cards.push(`<article class="card"><div class="row"><h3>${esc(w.name)}</h3><span class="status ${w.isLocked?'danger':''}">${w.isLocked?'唯讀鎖定':'可管理'}</span></div><p>${esc(w.role||'主辦工作空間')}</p>${w.lockedReason?`<p>${esc(w.lockedReason)}</p>`:''}<div class="actions"><a class="btn" href="admin.html?tenant=${encodeURIComponent(w.id)}">進入主辦後台</a></div></article>`)}for(const a of state.applications.filter(a=>!state.workspaces.some(w=>w.name===a.unitName))){const m=statusMeta(a.status);cards.push(`<article class="card"><div class="row"><h3>${esc(a.unitName)}</h3><span class="status ${m[1]}">${esc(m[0])}</span></div><p>${esc((a.industryCategories||[]).join('、')||'營運帳號申請')}</p><p>${esc((a.useCases||[]).join('、'))}</p>${a.status==='supplement_required'?'<div class="actions"><a class="btn" href="index.html#apply">補充申請資料</a></div>':''}</article>`)}$('operations').innerHTML=cards.length?cards.join(''):'<div class="empty">尚未申請營運帳號<br><a class="btn" href="index.html#apply" style="margin-top:10px">申請營運帳號</a></div>'}
function activityStatus(r){return r.paymentStatus||r.payment_status||r.status||r.reviewStatus||'已報名'}
function renderActivities(){const rows=state.activities||[],counts={all:rows.length,pending:0,paid:0,upcoming:0};rows.forEach(r=>{const s=activityStatus(r);if(/待|審核/.test(s))counts.pending++;if(/已繳|已付款/.test(s))counts.paid++;if(!/取消|退款|完成/.test(s))counts.upcoming++});$('activityStats').innerHTML=[['全部',counts.all],['進行中',counts.upcoming],['待處理',counts.pending],['已付款',counts.paid]].map(x=>`<div class="kpi"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('activities').innerHTML=rows.length?rows.map(r=>`<article class="activity"><div><b>${esc(r.sessionName||r.eventTitle||'活動')}</b><small>${esc(r.tenantName||'')}｜${esc(r.venue||'')}</small></div><span class="status">${esc(activityStatus(r))}</span></article>`).join(''):'<div class="empty">目前沒有活動紀錄<br><a class="btn" href="index.html" style="margin-top:10px">前往找活動</a></div>'}
async function loadActivities(){try{state.activities=await apiGet('getMyRegsGlobal',{member_token:state.token});if(!Array.isArray(state.activities))state.activities=[];renderActivities()}catch(e){$('activities').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function fillForm(){const p=state.profile||{},f=$('profileForm'),vals={name:p.name,email:p.email,phone:p.phone,city:p.city,lineId:p.lineId,brandName:p.brand,category:p.sellCat,brandIntro:p.brandIntro,items:p.sellItem,instagram:p.ig,facebook:p.fb,photoUrl:p.photo,company:p.company,taxId:p.taxId};Object.entries(vals).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v||''})}
async function saveProfile(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f),btn=f.querySelector('[type=submit]'),msg=$('formMessage'),app=state.applications[0],brandName=String(fd.get('brandName')||'').trim();msg.textContent='';btn.disabled=true;try{await apiPost('savePlatformMemberProfile',{member_token:state.token,name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone'),city:fd.get('city'),lineId:fd.get('lineId'),vendor:brandName?{brandName,brandIntro:fd.get('brandIntro'),category:fd.get('category'),items:fd.get('items'),instagram:fd.get('instagram'),facebook:fd.get('facebook'),photoUrl:fd.get('photoUrl'),company:fd.get('company'),taxId:fd.get('taxId')}:{},systemApplication:app?{enabled:true,unitName:app.unitName,industryCategories:app.industryCategories||[],useCases:app.useCases||[]}:{enabled:false}});await loadProfile();switchPage('home')}catch(err){msg.textContent=err.message}finally{btn.disabled=false}}
function wireGo(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>switchPage(x.dataset.go))}
function render(){const p=state.profile||{};$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('topName').textContent=p.name||'我的 DOING';$('topRole').textContent=identityText();$('hello').textContent=(p.name||'會員')+'，你好';$('identityLine').textContent=identityText();renderOverview();renderBrands();renderOperations();fillForm();wireGo();const page=(location.hash||'#home').slice(1);switchPage(['home','activities','brands','operations','account'].includes(page)?page:'home')}
async function loadProfile(){const d=await apiGet('getPlatformMemberProfile',{member_token:state.token});state.profile=d.profile||null;state.applications=Array.isArray(d.applications)?d.applications:[];state.workspaces=Array.isArray(d.workspaces)?d.workspaces:[];if(!d.complete){location.href='index.html?openMemberProfile=1';return}render()}
async function init(){const u=new URL(location.href),incoming=u.searchParams.get('member_token'),err=u.searchParams.get('member_login_error');state.token=incoming||localStorage.getItem(TOKEN_KEY)||'';if(incoming)localStorage.setItem(TOKEN_KEY,incoming);if(incoming||err)cleanReturn();if(err){$('loginView').insertAdjacentHTML('beforeend','<p style="color:var(--danger)">登入未完成，請重新使用 LINE 登入</p>')}if(!state.token)return;let last;for(let i=0;i<(incoming?3:1);i++){try{if(i)await new Promise(r=>setTimeout(r,500*i));await loadProfile();await loadActivities();return}catch(e){last=e}}localStorage.removeItem(TOKEN_KEY);state.token='';$('loginView').insertAdjacentHTML('beforeend','<p style="color:var(--danger)">'+esc(last?.message||'登入已失效')+'</p>')}
$('lineLogin').onclick=login;$('logout').onclick=()=>{localStorage.removeItem(TOKEN_KEY);location.href='index.html'};$('refreshActivities').onclick=loadActivities;$('profileForm').onsubmit=saveProfile;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>switchPage(x.dataset.page));wireGo();init();
</script>
</body>
</html>
