<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DOING Guide</title><link rel="stylesheet" href="doing-system.css?v=20260817-system5"><style>body{margin:0;background:#f7fbfb;color:#2f3947;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.shell{max-width:980px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #d8e6e8;border-radius:16px;padding:16px}.hero h1{margin:4px 0}.hero p,.card p{color:#66717f;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.tag{display:inline-block;border:1px solid #d8e6e8;border-radius:8px;padding:5px 8px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.top a{color:#2f3947;text-decoration:none;font-weight:800}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><a id="hub">← DOING Hub</a><b>DOING Guide</b></div><section class="hero"><small>DOING 2.0｜第四開發主線</small><h1>導覽員／導覽預約</h1><p>先建立獨立產品入口。後續再針對導覽員、路線、集合地點、梯次、語言、團體／散客、行前通知與天候改期等情境設計。</p><span class="tag">已建入口｜功能後續開發</span></section><section class="grid"><article class="card"><h2>導覽路線／梯次</h2><p>未來管理路線、集合地點、場次、時間與容量。</p></article><article class="card"><h2>導覽員</h2><p>未來處理帶團人員、可用時段、語言與人員指派。</p></article><article class="card"><h2>報名／通知／QR</h2><p>可共用 DOING 正式報名、付款、通知與 QR 能力，但操作頁獨立。</p></article><article class="card"><h2>資料規則</h2><p>先檢查現有 booking／event 核心能否承載，真正不足時才提出新增資料結構，未確認前不新增。</p></article></section></main><script>'use strict';const p=new URL(location.href).searchParams,u=new URL('doing-2.html',location.href);for(const k of ['tenant','admin_token','token']){const v=p.get(k);if(v)u.searchParams.set(k,v)}document.getElementById('hub').href=u.toString();</script></body></html>
