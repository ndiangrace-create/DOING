<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DOING 2.0 Hub</title><link rel="stylesheet" href="doing-system.css?v=20260817-system5"><style>body{margin:0;background:#f7fbfb;color:#2f3947;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #d8e6e8;border-radius:16px}.hero{padding:18px}.hero h1{margin:4px 0}.hero p{color:#66717f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.card{padding:16px;text-decoration:none;color:inherit}.card h2{margin:0 0 6px}.card p{margin:0;color:#66717f;line-height:1.6}.tag{display:inline-block;margin-top:10px;border:1px solid #d8e6e8;border-radius:8px;padding:5px 8px;font-size:13px}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="shell"><section class="hero"><small>DOING 2.0</small><h1>DOING Hub</h1><p>同一個登入、同一套 Core／Supabase，依工作情境進入各自獨立頁面。Hub 不承載各產品的日常營運操作。</p></section><section class="grid"><a class="card" data-product="market"><h2>DOING Market</h2><p>市集／活動／體驗。現在主線。</p><span class="tag">進行中</span></a><a class="card" data-product="project"><h2>DOING Project</h2><p>室內設計／工程專案。第二開發主線。</p><span class="tag">已建入口，後續開發</span></a><a class="card" data-product="booking"><h2>DOING Booking</h2><p>美類／一般服務預約。第三開發主線。</p><span class="tag">已建入口，後續開發</span></a><a class="card" data-product="guide"><h2>DOING Guide</h2><p>導覽員／導覽預約。第四開發主線。</p><span class="tag">已建入口，後續開發</span></a></section></main><script>'use strict';const p=new URL(location.href).searchParams;function go(file){const u=new URL(file,location.href);for(const k of ['tenant','admin_token','token']){const v=p.get(k);if(v)u.searchParams.set(k,v)}location.href=u.toString()}const map={market:'market-center.html',project:'project-center.html',booking:'booking-2-center.html',guide:'guide-center.html'};document.querySelectorAll('[data-product]').forEach(a=>a.onclick=e=>{e.preventDefault();go(map[a.dataset.product])});</script></body></html>
