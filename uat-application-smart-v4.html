<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING｜智慧申請 UAT v4</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--warn:#fff8e8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:1000px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:1000px;margin:auto;padding:16px 14px 72px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{color:var(--main);font-weight:900}.hero h1{font-size:clamp(27px,5vw,43px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:76px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice span span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-height:82px;resize:vertical}.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--sky);color:#4d6269;line-height:1.6}.presetbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.preset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}.btn:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;color:var(--muted)}.result{display:grid;gap:14px}.resultbox{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.resultbox h3{margin:0 0 10px}.analysis{white-space:pre-wrap;line-height:1.8;font-size:16px}.packages{display:grid;gap:12px}.package{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.package h4{margin:0 0 8px;font-size:19px}.package .sub{color:var(--muted);font-size:13px;margin-bottom:8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:10px;background:var(--mint);font-weight:850}.chip.work{background:var(--sky)}.shared{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shared div{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fafcfc}.status{font-size:13px;color:var(--muted);margin-top:8px}.warning{background:var(--warn);padding:11px 12px;border-radius:12px;line-height:1.55}@media(max-width:700px){.choices,.shared{grid-template-columns:1fr}.actions .btn{flex:1}.actions .btn.ghost{flex:0 0 100%}.hero,.card{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v4</b><span class="badge">工作包版｜不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>先組出你的工作，再談模組</small><h1>你不需要知道自己屬於哪個系統。</h1><p>DOING 會先辨識你同時在做哪些工作，再替每份工作掛上需要的能力。共用日曆、收款、檔案、通知與財務只顯示一次。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev';
const state={step:0,works:new Set(),needs:new Set(),details:new Set(),other:'',aiReply:'',aiSource:'',aiError:''};
const workChoices=[
 ['beauty','美容美髮／美甲／按摩／SPA','需要安排服務時間的個人服務'],
 ['course','自己開課／手作／團體教學','有日期、時段、名額或多人一起參加'],
 ['event','自己辦活動／講座／展演','我是主辦，不只是去參加'],
 ['market','自己辦市集／招募攤商','我要審核、管理品牌或現場位置'],
 ['vendor','擺攤／餐車／參加別人的市集','我是參加者，不是主辦'],
 ['consign','百貨寄賣／通路合作','商品寄放在別人的場域販售，之後抽成或結算'],
 ['commerce','團購／代購／商品販售','會整理商品、訂單、數量、取貨或出貨'],
 ['project','設計／網站／婚禮／接案','接到需求後持續一段時間完成'],
 ['construction','室內設計／裝修／工程','會有丈量、設計、施工、驗收等階段'],
 ['guide','導覽／帶團／戶外體驗','日期、集合、名額，可能受天氣或場地影響'],
 ['rental','場地／教室／設備出租','同一時段不能重複使用'],
 ['home','到府／照護／維修服務','到客戶指定地點提供服務'],
 ['other','其他工作','找不到適合的再補充']
];
const needChoices=[
 ['schedule','不要再一直私訊喬時間'],['calendar','把不同工作的行程放在一起'],['payment','付款、訂金、對帳不要分散'],['registration','報名、名單、通知放在一起'],['customer','客人資料與回訪不要散掉'],['position','排位、座位、攤位比較好管理'],['inventory','商品、庫存、寄賣數量要清楚'],['settlement','抽成、分潤、通路結算要清楚'],['condition','天氣、潮汐、場地等成行條件要能管理'],['projectflow','專案階段、進度、驗收要能追'],['team','團隊分工、排班、權限要整理'],['files','照片、檔案、附件不要找不到'],['finance','想知道每份工作真正賺多少'],['checkin','報到／核銷不要再翻名單'],['explore','沒有特定問題，先看看 DOING 能怎麼幫']
];
const detailChoices=[
 ['one_to_one','一對一或指定人員服務'],['duration','不同服務時間長度不同'],['group_slot','同一時段多人一起開始'],['capacity','日期或時段有名額上限'],['review','送出資料後要先審核'],['seat','要替參加單位安排位置'],['resource','人員／房間／設備不能撞時段'],['repeat_customer','同一位客人會持續回來'],['consign_stock','寄賣要記錄上架、庫存、售出與退回'],['consign_split','寄賣／通路需要抽成或結算'],['external_condition','工作會受天氣、潮汐、海況、場地或交通影響'],['min_people','需要達到最低人數才成行'],['stages','案子會分幾個階段完成'],['handoff','同一案子會由不同人接續處理'],['orders','要管理商品、訂單、數量、取貨或出貨']
];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function progress(){ $('progress').innerHTML=[0,1,2,3].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('') }
function cards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b><span>${d}</span></span></label>`).join('')+'</div>'}
function bind(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>{x.checked?set.add(x.value):set.delete(x.value);})}
function relevantDetails(){const W=state.works,N=state.needs,keys=new Set();const add=(...a)=>a.forEach(x=>keys.add(x));
 if(W.has('beauty')||W.has('rental')||W.has('home'))add('one_to_one','duration','resource','repeat_customer');
 if(W.has('course')||W.has('guide')||W.has('event'))add('group_slot','capacity');
 if(W.has('market'))add('review','seat','capacity');
 if(W.has('consign'))add('consign_stock','consign_split');
 if(W.has('commerce')||W.has('vendor'))add('orders');
 if(W.has('guide'))add('external_condition','min_people');
 if(W.has('project')||W.has('construction'))add('stages','handoff');
 if(N.has('condition'))add('external_condition','min_people'); if(N.has('inventory'))add('consign_stock','orders'); if(N.has('settlement'))add('consign_split'); if(N.has('projectflow'))add('stages','handoff'); if(N.has('position'))add('seat');
 return detailChoices.filter(x=>keys.has(x[0]));}
function nav(label='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<button class="btn ghost" id="reset">重新開始</button>'}<span class="hint">只勾真的有發生的。</span><button class="btn primary" id="next">${label}</button></div>`}
function preset(id){state.works.clear();state.needs.clear();state.details.clear();state.other='';if(id==='a'){['beauty','market','consign'].forEach(x=>state.works.add(x));['schedule','payment','position','inventory','settlement','calendar'].forEach(x=>state.needs.add(x));['one_to_one','duration','review','seat','consign_stock','consign_split'].forEach(x=>state.details.add(x));}if(id==='b'){['guide'].forEach(x=>state.works.add(x));['registration','condition','calendar'].forEach(x=>state.needs.add(x));['group_slot','capacity','external_condition','min_people'].forEach(x=>state.details.add(x));}if(id==='c'){['construction','course'].forEach(x=>state.works.add(x));['projectflow','files','payment','calendar'].forEach(x=>state.needs.add(x));['stages','handoff','group_slot','capacity'].forEach(x=>state.details.add(x));}render();}
function packageModel(){const W=state.works,D=state.details,N=state.needs,p=[];const push=(name,entry,items)=>p.push({name,entry,items:[...new Set(items)]});
 if(W.has('beauty'))push('美容／美甲服務','預約',[D.has('one_to_one')&&'一對一服務',D.has('duration')&&'服務時長',D.has('repeat_customer')&&'顧客紀錄',N.has('payment')&&'收款／訂金',N.has('calendar')&&'工作日曆'].filter(Boolean));
 if(W.has('course'))push('課程／手作','課程',[D.has('group_slot')&&'多人時段',D.has('capacity')&&'名額',N.has('registration')&&'報名／通知',N.has('payment')&&'收款',N.has('files')&&'照片／檔案'].filter(Boolean));
 if(W.has('event'))push('活動主辦','活動',[D.has('capacity')&&'名額',N.has('registration')&&'報名／通知',N.has('checkin')&&'報到／核銷',N.has('payment')&&'收款'].filter(Boolean));
 if(W.has('market'))push('市集主辦','市集',[D.has('review')&&'攤商審核',D.has('seat')&&'排位',D.has('capacity')&&'名額',N.has('payment')&&'收款',N.has('checkin')&&'報到'].filter(Boolean));
 if(W.has('vendor'))push('擺攤／參加市集','會員參與',[N.has('calendar')&&'行程',N.has('payment')&&'付款紀錄'].filter(Boolean));
 if(W.has('consign'))push('百貨寄賣／通路合作','商品／寄賣',[D.has('consign_stock')&&'上架／庫存／售出／退回',D.has('consign_split')&&'抽成／結算',N.has('payment')&&'對帳',N.has('finance')&&'損益'].filter(Boolean));
 if(W.has('commerce'))push('團購／商品販售','商品／票券',[D.has('orders')&&'訂單／數量／取貨',N.has('payment')&&'收款',N.has('inventory')&&'庫存'].filter(Boolean));
 if(W.has('project')||W.has('construction'))push(W.has('construction')?'室內設計／工程':'接案專案','專案',[D.has('stages')&&'案件階段',D.has('handoff')&&'團隊交接',N.has('files')&&'照片／檔案',N.has('payment')&&'階段收款',N.has('projectflow')&&'進度／驗收'].filter(Boolean));
 if(W.has('guide'))push('導覽／戶外體驗','活動／課程',[D.has('group_slot')&&'多人時段',D.has('capacity')&&'名額',D.has('external_condition')&&'天氣／潮汐／場地條件',D.has('min_people')&&'最低成行人數',N.has('registration')&&'報名／通知'].filter(Boolean));
 if(W.has('rental'))push('場地／設備出租','預約',[D.has('resource')&&'資源撞期',N.has('calendar')&&'日曆',N.has('payment')&&'收款'].filter(Boolean));
 if(W.has('home'))push('到府服務','預約',[D.has('one_to_one')&&'一對一服務',N.has('calendar')&&'工作日曆',N.has('payment')&&'收款'].filter(Boolean));
 return p;}
function sharedTools(){const N=state.needs,D=state.details,out=[];if(N.has('calendar')||N.has('schedule'))out.push('工作日曆／日曆同步');if(N.has('payment'))out.push('收款／訂金／對帳');if(N.has('files'))out.push('照片／檔案');if(N.has('registration'))out.push('通知提醒');if(N.has('finance')||N.has('settlement'))out.push('進階財務');if(N.has('team')||D.has('handoff'))out.push('團隊／權限／排班');if(N.has('customer')||D.has('repeat_customer'))out.push('顧客管理／回訪');if(N.has('checkin'))out.push('QR 報到／核銷');if(N.has('inventory')||D.has('orders')||D.has('consign_stock'))out.push('商品／庫存');if(N.has('condition')||D.has('external_condition'))out.push('成行條件／改期通知');return [...new Set(out)];}
function aiPayload(){const mapUse=[];if(state.works.has('market'))mapUse.push('market');if(state.works.has('event')||state.works.has('guide'))mapUse.push('event');if(state.works.has('course'))mapUse.push('workshop');if(state.works.has('beauty')||state.works.has('home'))mapUse.push('beauty');if(state.works.has('rental'))mapUse.push('resource_booking');if(!mapUse.length)mapUse.push('general');const pp=[];const m={schedule:'schedule',calendar:'schedule',payment:'payment',registration:'status',position:'seating',team:'staff_mix',files:'scattered',finance:'finance',checkin:'checkin',inventory:'extras',settlement:'finance',condition:'reschedule',projectflow:'status',customer:'repeat_data'};state.needs.forEach(k=>m[k]&&pp.push(m[k]));if(!pp.length)pp.push('other');const labels=workChoices.filter(x=>state.works.has(x[0])).map(x=>x[1]);const detailLabels=detailChoices.filter(x=>state.details.has(x[0])).map(x=>x[1]);return {action:'analyzeDoingApplication',topic:'summary',useCases:[...new Set(mapUse)],painPoints:[...new Set(pp)],workSituations:['one_brand_many_jobs'],openAnswers:{industry:labels.join('、'),work:`工作組合：${labels.join('、')}。工作方式：${detailLabels.join('、')}。${state.other||''}`,pain:`最想改善：${needChoices.filter(x=>state.needs.has(x[0])).map(x=>x[1]).join('、')}`}}}
async function analyze(){state.aiReply='';state.aiError='';render();try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(aiPayload())});const j=await r.json();if(!r.ok||!j||!j.reply)throw new Error(j&&j.error||'智慧分析暫時無法完成');state.aiReply=j.reply;state.aiSource=j.source||'smart';}catch(e){state.aiError=String(e.message||e);state.aiReply='DOING 已依你的工作組合完成規則理解；智慧文字分析目前暫時不可用，但不影響下方工作包與共用工具建議。';state.aiSource='rules';}render();}
function render(){progress();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><div><h2>你現在同時在做哪些工作？</h2><p>不要選產業身份，只勾「你真的有在做的工作」。可以很多種。</p></div><span class="count">${state.works.size} 項</span></div><div class="presetbar"><button class="preset" data-p="a">測試：美甲＋市集＋寄賣</button><button class="preset" data-p="b">測試：導覽＋天氣潮汐</button><button class="preset" data-p="c">測試：室內設計＋手作</button></div>${cards(workChoices,state.works)}<div class="field"><label>其他工作補充（選填）</label><textarea id="other" placeholder="例如：平日正職，假日另外做團購"></textarea></div>${nav()}`;bind(state.works);$('other').value=state.other;$('other').oninput=e=>state.other=e.target.value;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>preset(b.dataset.p));}
 if(state.step===1){s.innerHTML=`<div class="head"><div><h2>你現在最想先改善哪些事情？</h2><p>這裡只問你的麻煩，不問你想要什麼系統功能。</p></div><span class="count">${state.needs.size} 項</span></div>${cards(needChoices,state.needs)}${nav()}`;bind(state.needs);}
 if(state.step===2){const items=relevantDetails();s.innerHTML=`<div class="head"><div><h2>再確認幾個真的會影響工作方式的差異</h2><p>這些題目是依你前面選的工作動態出現，不會所有人都問。</p></div><span class="count">${items.length} 題</span></div>${cards(items,state.details)}<div class="note">如果某件事前面已經說清楚，這裡不再重複問。</div>${nav('讓 DOING 幫我整理 →')}`;bind(state.details);}
 if(state.step===3){const packs=packageModel(),shared=sharedTools();s.innerHTML=`<div class="result"><div class="resultbox"><h3>DOING 怎麼理解你</h3><div class="analysis">${esc(state.aiReply||'正在準備分析…')}</div><div class="status">分析來源：${esc(state.aiSource||'等待分析')}${state.aiError?'｜已使用規則備援':''}</div></div><div class="resultbox"><h3>你的工作組合</h3><div class="packages">${packs.map(p=>`<div class="package"><h4>${esc(p.name)}</h4><div class="sub">主要工作入口：${esc(p.entry)}</div><div class="chips">${p.items.length?p.items.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="status">目前沒有額外能力需要確認</span>'}</div></div>`).join('')}</div></div><div class="resultbox"><h3>這些工作共用的底座</h3><div class="shared">${shared.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="warning">這裡呈現的是「怎麼替你組工作平台」，不是把 DOING 全部功能列給你。正式可用模組仍由系統規則與平台核准。</div>${nav('重新分析')}</div>`;}
 if(state.step<3){$('next').onclick=()=>{if(state.step===0&&!state.works.size)return alert('請至少選一種工作');if(state.step===1&&!state.needs.size)state.needs.add('explore');state.step++;render();if(state.step===3)analyze();};}else $('next').onclick=()=>analyze();if($('back'))$('back').onclick=()=>{state.step--;render()};if($('reset'))$('reset').onclick=()=>{state.works.clear();state.needs.clear();state.details.clear();state.other='';render()};}
render();
</script>
</body>
</html>
