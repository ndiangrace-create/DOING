<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜單場工作台</title><link rel="stylesheet" href="/doing-kawaii-current.css?v=20260825-1"><link rel="stylesheet" href="/doing-market-current.css?v=20260825-1"></head><body class="mk-body">
<header class="mk-top"><div class="mk-top-in"><a id="marketBack" class="mk-brand"><img src="/doing-logo.png" alt="DOING"><span><b id="sessionTitle">DOING Market｜單場工作台</b><small id="sessionMeta">場次資料載入中…</small></span></a><div class="mk-actions"><button id="reloadAll" class="mk-btn secondary small">重新整理</button><a id="backBtn" class="mk-btn secondary small">回場次</a></div></div></header>
<main class="mk-shell"><div class="mk-title"><div><span class="mk-kicker">單場管理</span><h1 id="workTitle">場次工作台</h1><p>審核、付款、排位、設備、通知、現場、退款與結案都留在這一層。</p></div></div><div id="kpis" class="mk-stats"></div>
<nav class="mk-session-tabs"><button class="active" data-tab="overview">總覽</button><button data-tab="registrations">報名審核</button><button data-tab="payments">付款</button><button data-tab="seat">排位／設備</button><button data-tab="notice">通知</button><button data-tab="onsite">現場</button><button data-tab="closeout">退款／結案</button><button data-tab="settings">場次設定</button></nav>
<section id="overview" class="mk-panel active"><div class="mk-grid"><article class="mk-card"><h3>報名與審核</h3><p>待審核、待補件、候補、錄取與未錄取。</p><button class="mk-btn" data-go="registrations">進入審核</button></article><article class="mk-card"><h3>付款</h3><p>應繳、付款回報、確認與提醒。</p><button class="mk-btn" data-go="payments">處理付款</button></article><article class="mk-card"><h3>排位／設備</h3><p>已繳費後排位，設備以正式場次設定為準。</p><button class="mk-btn" data-go="seat">進入排位</button></article><article class="mk-card"><h3>現場</h3><p>活動日搜尋後直接報到。</p><button class="mk-btn green" data-go="onsite">現場報到</button></article></div></section>
<section id="registrations" class="mk-panel"><div class="mk-toolbar"><input id="regSearch" placeholder="搜尋品牌、姓名、電話、Email"><select id="regFilter"><option value="all">全部</option><option value="pending">待審核</option><option value="needinfo">待補件</option><option value="waitlist">候補</option><option value="approved">已錄取</option><option value="rejected">未錄取</option></select><button id="reloadRegs" class="mk-btn secondary">重新整理</button></div><div id="regList" class="mk-list"></div></section>
<section id="payments" class="mk-panel"><div class="mk-toolbar"><input id="paySearch" placeholder="搜尋品牌、姓名"><select id="payFilter"><option value="all">全部</option><option value="unpaid">待繳費</option><option value="pending">待確認付款</option><option value="paid">已繳費</option></select></div><div id="payList" class="mk-list"></div></section>
<section id="seat" class="mk-panel"><div class="mk-grid"><article class="mk-card"><div class="mk-title" style="margin:0 0 10px"><div><h3>排位</h3><p>可單筆指定、解除或批次排位。</p></div><button id="reloadSeat" class="mk-btn secondary small">重新整理</button></div><div class="mk-form-grid"><div class="mk-field"><label>已繳費報名</label><select id="assignReg"></select></div><div class="mk-field"><label>可用攤位</label><select id="assignStall"></select></div></div><div class="mk-actions" style="margin-top:10px"><button id="assignSeat" class="mk-btn">指定排位</button><button id="batchSeat" class="mk-btn secondary">批次排位</button></div><div id="seatBoard" class="mk-seat-board" style="margin-top:12px"></div></article><article class="mk-card"><div class="mk-title" style="margin:0 0 10px"><div><h3>設備／加購</h3><p>設定寫回正式場次 equip_json。</p></div><button id="addEquip" class="mk-btn secondary small">＋新增設備</button></div><div id="equipRows" class="mk-list"></div><div class="mk-actions" style="margin-top:10px"><button id="saveEquip" class="mk-btn">儲存設備設定</button></div><hr style="border:0;border-top:1px solid var(--mk-line);margin:14px 0"><h3>本場設備使用</h3><div id="equipUsage"></div></article></div></section>
<section id="notice" class="mk-panel"><article class="mk-card"><h3>通知／行前</h3><div class="mk-form-grid"><div class="mk-field"><label>通知對象</label><select id="noticeTarget"><option value="all">全部報名</option><option value="已錄取">已錄取</option><option value="候補">候補</option><option value="待補件">待補件</option></select></div><div class="mk-field full"><label>通知內容</label><textarea id="noticeContent" placeholder="輸入要傳給這場報名者的通知"></textarea></div></div><div class="mk-actions" style="margin-top:10px"><button id="sendNotice" class="mk-btn">送出通知</button><button id="remindUnpaid" class="mk-btn secondary">提醒所有待繳費</button></div><p id="noticeResult"></p></article></section>
<section id="onsite" class="mk-panel"><div class="mk-toolbar"><input id="onsiteSearch" placeholder="搜尋品牌、姓名、電話"><button id="reloadOnsite" class="mk-btn secondary">重新整理</button></div><div id="onsiteList" class="mk-list"></div></section>
<section id="closeout" class="mk-panel"><div class="mk-grid"><article class="mk-card"><h3>退款處理</h3><p>先取得後端退款建議，再由主辦確認。</p><div id="refundList" class="mk-list"></div></article><article class="mk-card"><h3>本場財務</h3><div id="financeSummary"></div><div class="mk-actions" style="margin-top:10px"><button id="reloadFinance" class="mk-btn secondary">重新整理財務</button></div></article><article class="mk-card"><h3>結案檢查</h3><div id="closeoutChecklist"></div></article></div></section>
<section id="settings" class="mk-panel"><article class="mk-card"><h3>場次設定</h3><div class="mk-form-grid"><div class="mk-field"><label>場次名稱</label><input id="setName"></div><div class="mk-field"><label>地點</label><input id="setVenue"></div><div class="mk-field"><label>基本費用</label><input id="setFee" type="number" min="0"></div><div class="mk-field"><label>押金</label><input id="setDeposit" type="number" min="0"></div><div class="mk-field"><label>名額</label><input id="setLimit" type="number" min="0"></div><div class="mk-field"><label>審核</label><select id="setReview"><option value="yes">需要審核</option><option value="no">免審核</option></select></div><div class="mk-field full"><label>日期／時段（每行：日期|開始|結束）</label><textarea id="setDates"></textarea></div><div class="mk-field full"><label>活動說明</label><textarea id="setDesc"></textarea></div></div><div class="mk-actions" style="margin-top:10px"><button id="saveSession" class="mk-btn">儲存場次</button></div></article></section><div id="gate" class="mk-empty mk-hidden">請從正式工作空間進入這個場次。</div></main><div id="toast" class="mk-toast"></div>
<script>'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',Q=new URL(location.href).searchParams,T=String(Q.get('tenant')||'').trim().toLowerCase(),TOKEN=String(Q.get('admin_token')||Q.get('token')||'').trim(),SID=String(Q.get('sessionId')||Q.get('session_id')||'').trim(),S={session:null,rows:[],seat:null,equipUsage:null,email:''};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function jwtEmail(v){try{const s=String(v||'').split('.')[1];if(!s)return'';const raw=s.replace(/-/g,'+').replace(/_/g,'/');return String(JSON.parse(decodeURIComponent(escape(atob(raw+'='.repeat((4-raw.length%4)%4))))).email||'').trim().toLowerCase()}catch(_){return''}}function toast(msg){const b=$('toast');b.textContent=msg;b.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>b.classList.remove('show'),2300)}
async function api(action,extra={},post=false){if(!S.email)S.email=jwtEmail(TOKEN);const base={action,tenant:T,token:TOKEN,email:S.email,...extra};if(post){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(base)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'操作失敗');return d.data??d.result??d}const u=new URL(API);Object.entries(base).forEach(([k,v])=>{if(v!==''&&v!=null)u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v))});const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}
const rid=r=>String(r?.id||r?.regId||r?.registrationId||''),review=r=>String(r?.reviewStatus||r?.review_status||r?.status||'待審核'),pay=r=>String(r?.paymentStatus||r?.payment_status||r?.payStatus||'未繳費'),check=r=>String(r?.checkinStatus||r?.checkin_status||r?.checkin||'未報到'),brand=r=>String(r?.brand||r?.brandName||r?.brand_name||r?.name||'未填品牌'),paid=r=>/已繳|已付款|paid|confirmed/i.test(pay(r)),pendingPay=r=>/待確認|回報|reported/i.test(pay(r));function isReview(r,s){return review(r).includes(s)||({pending:/待審|報名成功/,needinfo:/補件/,waitlist:/候補/,approved:/已錄取|approved/i,rejected:/未錄取|不錄取|rejected/i}[s]?.test(review(r)))}
function parseDates(raw){return String(raw||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{const [date,start,end]=line.split('|').map(x=>String(x||'').trim());return{date,label:date,start,end}})}function datesText(rows){return(Array.isArray(rows)?rows:[]).map(x=>typeof x==='string'?x:[x.date||x.label||'',x.start||'',x.end||''].join('|')).filter(Boolean).join('\n')}
function tab(name){document.querySelectorAll('.mk-session-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.mk-panel').forEach(p=>p.classList.toggle('active',p.id===name));try{sessionStorage.setItem('doing_market_session_tab',name)}catch(_){}if(name==='registrations')renderRegs();if(name==='payments')renderPay();if(name==='onsite')renderOnsite();if(name==='seat')Promise.allSettled([loadSeat(),loadEquipUsage()]);if(name==='closeout')Promise.allSettled([loadRefunds(),loadFinance()])}
function filterRows(mode){const inp=mode==='pay'?$('paySearch'):mode==='onsite'?$('onsiteSearch'):$('regSearch'),q=inp.value.trim().toLowerCase();let rows=S.rows.filter(r=>!q||[brand(r),r.name,r.phone,r.mobile,r.email].filter(Boolean).join(' ').toLowerCase().includes(q));if(mode==='reg'){const f=$('regFilter').value;if(f!=='all')rows=rows.filter(r=>isReview(r,f))}if(mode==='pay'){const f=$('payFilter').value;if(f==='unpaid')rows=rows.filter(r=>isReview(r,'approved')&&!paid(r)&&!pendingPay(r));if(f==='pending')rows=rows.filter(pendingPay);if(f==='paid')rows=rows.filter(paid)}return rows}
function regCard(r,mode){let actions='';const id=rid(r);if(mode==='reg'){actions=`<button class="mk-btn small" data-status="已錄取" data-id="${esc(id)}">錄取</button><button class="mk-btn secondary small" data-status="候補" data-id="${esc(id)}">候補</button><button class="mk-btn warn small" data-status="待補件" data-id="${esc(id)}">補件</button><button class="mk-btn danger small" data-status="未錄取" data-id="${esc(id)}">未錄取</button>`}if(mode==='pay'){if(pendingPay(r))actions+=`<button class="mk-btn small" data-confirm-pay="${esc(id)}">確認付款</button>`;if(isReview(r,'approved')&&!paid(r))actions+=`<button class="mk-btn secondary small" data-remind="${esc(id)}">付款提醒</button>`}if(mode==='onsite'&&!/已報到|checked/i.test(check(r)))actions=`<button class="mk-btn green small" data-checkin="${esc(id)}">報到</button>`;return `<article class="mk-row"><div class="mk-row-main"><div class="mk-row-title">${esc(brand(r))}</div><div class="mk-row-sub">${esc(r.name||'')}｜${esc(r.phone||r.mobile||'')}｜${esc(r.email||'')}</div><div class="mk-tags"><span class="mk-tag">審核：${esc(review(r))}</span><span class="mk-tag">付款：${esc(pay(r))}</span><span class="mk-tag">${esc(check(r))}</span>${r.stall_number||r.stallNumber?`<span class="mk-tag">位置：${esc(r.stall_number||r.stallNumber)}</span>`:''}</div></div><div class="mk-row-actions">${actions}</div></article>`}
function wireRegActions(box){box.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('updateRegStatus',{regId:b.dataset.id,status:b.dataset.status,reviewStatus:b.dataset.status},true);toast(`已更新：${b.dataset.status}`);await loadRows()}catch(e){toast(e.message)}finally{b.disabled=false}});box.querySelectorAll('[data-confirm-pay]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('confirmPayment',{regId:b.dataset.confirmPay,sessionId:SID},true);toast('付款已確認');await loadRows()}catch(e){toast(e.message)}finally{b.disabled=false}});box.querySelectorAll('[data-remind]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('sendPaymentReminder',{regId:b.dataset.remind,sessionId:SID},true);toast('付款提醒已送出')}catch(e){toast(e.message)}finally{b.disabled=false}});box.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('checkin',{regId:b.dataset.checkin,sessionId:SID},true);toast('報到完成');await loadRows()}catch(e){toast(e.message)}finally{b.disabled=false}})}
function renderRegs(){const rows=filterRows('reg');$('regList').innerHTML=rows.length?rows.map(r=>regCard(r,'reg')).join(''):'<div class="mk-empty">沒有符合名單。</div>';wireRegActions($('regList'))}function renderPay(){const rows=filterRows('pay');$('payList').innerHTML=rows.length?rows.map(r=>regCard(r,'pay')).join(''):'<div class="mk-empty">沒有符合名單。</div>';wireRegActions($('payList'))}function renderOnsite(){const rows=filterRows('onsite');$('onsiteList').innerHTML=rows.length?rows.map(r=>regCard(r,'onsite')).join(''):'<div class="mk-empty">沒有符合名單。</div>';wireRegActions($('onsiteList'))}
function renderKpi(){const c=fn=>S.rows.filter(fn).length,items=[['all',S.rows.length,'報名','blue','registrations'],['pending',c(r=>isReview(r,'pending')),'待審核','beige','registrations'],['approved',c(r=>isReview(r,'approved')),'已錄取','green','registrations'],['unpaid',c(r=>isReview(r,'approved')&&!paid(r)&&!pendingPay(r)),'待繳費','lilac','payments'],['pendingPay',c(pendingPay),'待確認','beige','payments'],['paid',c(paid),'已繳費','green','payments'],['checkin',c(r=>/已報到|checked/i.test(check(r))),'已報到','blue','onsite'],['refund',c(r=>/退款|退費|refund/i.test(String(r.refundStatus||r.refund_status||r.transferStatus||r.transfer_status||''))),'退款','lilac','closeout']];$('kpis').innerHTML=items.map(([f,v,l,cl,t])=>`<button class="mk-stat ${cl}" data-kpi="${f}" data-kpi-tab="${t}"><b>${v}</b><span>${l}</span></button>`).join('');document.querySelectorAll('[data-kpi]').forEach(b=>b.onclick=()=>{if(b.dataset.kpiTab==='registrations')$('regFilter').value=['pending','approved'].includes(b.dataset.kpi)?b.dataset.kpi:'all';if(b.dataset.kpiTab==='payments')$('payFilter').value=b.dataset.kpi==='unpaid'?'unpaid':b.dataset.kpi==='pendingPay'?'pending':b.dataset.kpi==='paid'?'paid':'all';tab(b.dataset.kpiTab)})}
async function loadRows(){try{const d=await api('getSessionRegistrations',{sessionId:SID});S.rows=Array.isArray(d)?d:(d.rows||d.registrations||[]);renderKpi();renderRegs();renderPay();renderOnsite()}catch(e){$('regList').innerHTML=`<div class="mk-empty">${esc(e.message)}</div>`}}
function equipObject(s){const e=s?.equip||s?.equipJson||s?.equip_json||{};if(typeof e==='string'){try{return JSON.parse(e)||{}}catch(_){return{}}}return e&&typeof e==='object'?e:{}}
function renderEquipEditor(){const e=equipObject(S.session),entries=Object.entries(e);$('equipRows').innerHTML=entries.length?entries.map(([k,v])=>equipRow(k,v)).join(''):'<div class="mk-empty">尚未設定設備，可新增。</div>';wireEquipRows()}
function equipRow(k,v={}){const name=typeof v==='object'?(v.name||v.label||k):k,price=typeof v==='object'?Number(v.price||0):Number(v||0),open=typeof v==='object'?v.open!==false:true;return `<article class="mk-row" data-equip-row><div class="mk-form-grid" style="flex:1"><div class="mk-field"><label>設備代號</label><input data-ekey value="${esc(k)}"></div><div class="mk-field"><label>顯示名稱</label><input data-ename value="${esc(name)}"></div><div class="mk-field"><label>單價</label><input data-eprice type="number" min="0" value="${price}"></div><div class="mk-field"><label>狀態</label><select data-eopen><option value="yes" ${open?'selected':''}>開放</option><option value="no" ${!open?'selected':''}>停用</option></select></div></div><div class="mk-row-actions"><button class="mk-btn danger small" data-remove-equip>刪除</button></div></article>`}
function wireEquipRows(){document.querySelectorAll('[data-remove-equip]').forEach(b=>b.onclick=()=>{b.closest('[data-equip-row]').remove();if(!document.querySelector('[data-equip-row]'))$('equipRows').innerHTML='<div class="mk-empty">尚未設定設備，可新增。</div>'})}
function readEquip(){const out={};document.querySelectorAll('[data-equip-row]').forEach((r,i)=>{const key=(r.querySelector('[data-ekey]').value.trim()||`equipment_${i+1}`).replace(/\s+/g,'_'),name=r.querySelector('[data-ename]').value.trim()||key,price=Math.max(0,Number(r.querySelector('[data-eprice]').value)||0),open=r.querySelector('[data-eopen]').value==='yes';out[key]={name,label:name,price,open}});return out}
async function loadSession(){try{const d=await api('getSessionDashboard',{sessionId:SID}),s=d.session||d;S.session=s;const name=s.name||s.sessionName||'場次工作台';$('sessionTitle').textContent=name;$('workTitle').textContent=name;$('sessionMeta').textContent=[(Array.isArray(s.dates)&&s.dates[0]?.date)||'',s.venue||''].filter(Boolean).join('｜');$('setName').value=name;$('setVenue').value=s.venue||'';$('setFee').value=Number(s.fee||0);$('setDeposit').value=Number(s.deposit||0);$('setLimit').value=Number(s.limit||s.limit_count||0);$('setReview').value=s.needReview||s.need_review?'yes':'no';$('setDates').value=datesText(s.dates);$('setDesc').value=s.desc||s.description||'';renderEquipEditor()}catch(e){$('sessionMeta').textContent=e.message}}
async function loadSeat(){try{const d=await api('adminSeatBoard',{sessionId:SID});S.seat=d;const seats=Array.isArray(d)?d:(d.seats||d.stalls||d.rows||[]),available=seats.filter(x=>!(x.registrationId||x.regId||x.registration_id||x.occupied));$('seatBoard').innerHTML=seats.length?seats.map(x=>{const code=x.stallCode||x.seatCode||x.code||x.stall_number||x.id||'',reg=x.registrationId||x.regId||x.registration_id||'',who=x.brandName||x.brand||x.name||'';return `<div class="mk-seat ${reg?'used':'available'}"><b>${esc(code)}</b><small>${reg?esc(who||'已使用'):'可用'}</small>${reg?`<button class="mk-btn secondary small" data-unassign="${esc(reg)}" data-stall="${esc(code)}" style="margin-top:5px">解除</button>`:''}</div>`}).join(''):'<div class="mk-empty">尚未建立攤位／排位圖。</div>';$('assignStall').innerHTML='<option value="">選擇攤位</option>'+available.map(x=>{const c=x.stallCode||x.seatCode||x.code||x.stall_number||x.id||'';return `<option value="${esc(c)}">${esc(c)}</option>`}).join('');$('assignReg').innerHTML='<option value="">選擇報名</option>'+S.rows.filter(r=>paid(r)&&!(r.stall_number||r.stallNumber)).map(r=>`<option value="${esc(rid(r))}">${esc(brand(r))}</option>`).join('');document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('adminUnassignSeat',{sessionId:SID,regId:b.dataset.unassign,stallCode:b.dataset.stall},true);toast('已解除排位');await Promise.all([loadSeat(),loadRows()])}catch(e){toast(e.message)}finally{b.disabled=false}})}catch(e){$('seatBoard').innerHTML=`<div class="mk-empty">${esc(e.message)}</div>`}}
async function assignSeat(){const regId=$('assignReg').value,stallCode=$('assignStall').value;if(!regId||!stallCode)return toast('請選報名與攤位');const b=$('assignSeat');b.disabled=true;try{await api('adminAssignSeat',{sessionId:SID,regId,stallCode},true);toast('排位完成');await Promise.all([loadSeat(),loadRows()])}catch(e){toast(e.message)}finally{b.disabled=false}}
async function batchSeat(){if(!confirm('將對已繳費且尚未排位者執行批次排位，確定？'))return;const b=$('batchSeat');b.disabled=true;try{const d=await api('runBatchAssign',{sessionId:SID,mode:'random'},true);toast(`批次排位完成${d.count!=null?'：'+d.count+' 筆':''}`);await Promise.all([loadSeat(),loadRows()])}catch(e){toast(e.message)}finally{b.disabled=false}}
async function saveEquip(){const b=$('saveEquip');b.disabled=true;try{await api('updateSession',{id:SID,sessionId:SID,equip:readEquip()},true);toast('設備設定已儲存');await Promise.all([loadSession(),loadEquipUsage()])}catch(e){toast(e.message)}finally{b.disabled=false}}
async function loadEquipUsage(){try{const d=await api('getSessionEquipmentDetails',{sessionId:SID});S.equipUsage=d;const rows=Array.isArray(d)?d:(d.rows||d.items||d.registrations||[]);$('equipUsage').innerHTML=rows.length?rows.map(x=>`<div class="mk-row"><div class="mk-row-main"><div class="mk-row-title">${esc(x.name||x.label||x.brand||x.brand_name||'設備')}</div><div class="mk-row-sub">${esc(x.detail||x.summary||x.quantity||x.qty||'')}</div></div></div>`).join(''):'<div class="mk-empty">目前沒有設備使用資料。</div>'}catch(e){$('equipUsage').innerHTML=`<div class="mk-empty">${esc(e.message)}</div>`}}
async function sendNotice(){const content=$('noticeContent').value.trim();if(!content)return toast('請輸入通知內容');const b=$('sendNotice');b.disabled=true;try{const d=await api('sendNotify',{sessionId:SID,target:$('noticeTarget').value,content,message:content,sessionName:S.session?.name||S.session?.sessionName||''},true);$('noticeResult').textContent=`通知完成：成功 ${d.sent??'-'}，略過 ${d.skipped??'-'}`;toast('通知已處理')}catch(e){toast(e.message)}finally{b.disabled=false}}
async function remindUnpaid(){const rows=S.rows.filter(r=>isReview(r,'approved')&&!paid(r));if(!rows.length)return toast('目前沒有待繳費名單');const b=$('remindUnpaid');b.disabled=true;let ok=0,fail=0;for(const r of rows){try{await api('sendPaymentReminder',{regId:rid(r),sessionId:SID},true);ok++}catch(_){fail++}}b.disabled=false;$('noticeResult').textContent=`付款提醒：成功 ${ok}，失敗 ${fail}`;toast('付款提醒處理完成')}
async function loadRefunds(){const rows=S.rows.filter(r=>/退款|退費|refund/i.test(String(r.refundStatus||r.refund_status||r.transferStatus||r.transfer_status||'')));$('refundList').innerHTML=rows.length?rows.map(r=>`<article class="mk-row"><div class="mk-row-main"><div class="mk-row-title">${esc(brand(r))}</div><div class="mk-row-sub">${esc(r.name||'')}｜${esc(r.refundStatus||r.refund_status||r.transferStatus||r.transfer_status||'退款')}</div></div><div class="mk-row-actions"><button class="mk-btn warn small" data-refund="${esc(rid(r))}">退款建議／確認</button></div></article>`).join(''):'<div class="mk-empty">目前沒有退款申請。</div>';document.querySelectorAll('[data-refund]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const s=await api('getRefundSuggestion',{regId:b.dataset.refund,sessionId:SID}),amount=Number(s.refundAmount??s.amount??0);if(confirm(`後端建議退款 NT$ ${amount}，確認執行？`)){await api('confirmRefund',{regId:b.dataset.refund,sessionId:SID,amount},true);toast('退款已確認');await loadRows();await loadRefunds()}}catch(e){toast(e.message)}finally{b.disabled=false}})}
async function loadFinance(){try{let d;try{d=await api('financeReport',{sessionId:SID,period:'all'})}catch(_){d=await api('financeOverview',{sessionId:SID})}const s=d.summary||d;$('financeSummary').innerHTML=`<div class="mk-stats"><div class="mk-stat green"><b>${esc(s.incomeTotal??s.totalIncome??'-')}</b><span>收入</span></div><div class="mk-stat beige"><b>${esc(s.refundTotal??s.totalRefund??'-')}</b><span>退款</span></div><div class="mk-stat blue"><b>${esc(s.expenseTotal??s.totalExpense??'-')}</b><span>支出</span></div><div class="mk-stat lilac"><b>${esc(s.netTotal??s.net??'-')}</b><span>結餘</span></div></div>`}catch(e){$('financeSummary').innerHTML=`<div class="mk-empty">${esc(e.message)}</div>`}renderCloseout()}
function renderCloseout(){const pendingReview=S.rows.filter(r=>isReview(r,'pending')).length,pendingPay=S.rows.filter(r=>isReview(r,'approved')&&!paid(r)).length,pendingRefund=S.rows.filter(r=>/待.*退款|退款.*待|refund.*pending/i.test(String(r.refundStatus||r.refund_status||r.transferStatus||r.transfer_status||''))).length;$('closeoutChecklist').innerHTML=`<div class="mk-list"><div class="mk-row"><b>待審核</b><span>${pendingReview} 筆</span></div><div class="mk-row"><b>待繳／待確認</b><span>${pendingPay} 筆</span></div><div class="mk-row"><b>待退款</b><span>${pendingRefund} 筆</span></div></div>${pendingReview||pendingPay||pendingRefund?'<p>尚有未完成工作，先處理完再結案。</p>':'<p>主要營運待辦已清空，可進行正式財務結案。</p>'}`}
async function saveSession(){const b=$('saveSession');b.disabled=true;try{await api('updateSession',{id:SID,sessionId:SID,name:$('setName').value.trim(),venue:$('setVenue').value.trim(),fee:Number($('setFee').value)||0,deposit:Number($('setDeposit').value)||0,limit:Number($('setLimit').value)||0,needReview:$('setReview').value==='yes',dates:parseDates($('setDates').value),desc:$('setDesc').value.trim()},true);toast('場次已儲存');await loadSession()}catch(e){toast(e.message)}finally{b.disabled=false}}
async function init(){S.email=jwtEmail(TOKEN);if(!T||!TOKEN||!S.email||!SID){document.querySelectorAll('.mk-panel').forEach(p=>p.classList.remove('active'));$('gate').classList.remove('mk-hidden');return}await Promise.allSettled([loadRows(),loadSession()]);const focus=Q.get('focus')||'',requested=Q.get('tab')||'';let initial=requested;try{if(!initial)initial=sessionStorage.getItem('doing_market_session_tab')||'overview'}catch(_){initial=initial||'overview'}if(focus==='pending'){$('regFilter').value='pending';initial='registrations'}if(focus==='approved'){$('regFilter').value='approved';initial='registrations'}if(focus==='unpaid'){$('payFilter').value='unpaid';initial='payments'}if(focus==='paid'){$('payFilter').value='paid';initial='payments'}if(focus==='refund')initial='closeout';tab(initial)}
document.querySelectorAll('.mk-session-tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));$('regSearch').oninput=renderRegs;$('regFilter').onchange=renderRegs;$('paySearch').oninput=renderPay;$('payFilter').onchange=renderPay;$('onsiteSearch').oninput=renderOnsite;$('reloadRegs').onclick=loadRows;$('reloadOnsite').onclick=loadRows;$('reloadSeat').onclick=loadSeat;$('assignSeat').onclick=assignSeat;$('batchSeat').onclick=batchSeat;$('addEquip').onclick=()=>{if(!$('equipRows').querySelector('[data-equip-row]'))$('equipRows').innerHTML='';$('equipRows').insertAdjacentHTML('beforeend',equipRow('',{}));wireEquipRows()};$('saveEquip').onclick=saveEquip;$('sendNotice').onclick=sendNotice;$('remindUnpaid').onclick=remindUnpaid;$('reloadFinance').onclick=loadFinance;$('saveSession').onclick=saveSession;$('reloadAll').onclick=()=>Promise.allSettled([loadRows(),loadSession(),loadSeat(),loadEquipUsage(),loadFinance()]);const back=new URL('/market/',location.origin);back.searchParams.set('tenant',T);back.searchParams.set('admin_token',TOKEN);$('backBtn').href=back.toString();$('marketBack').href=back.toString();init();
</script></body></html>
