name: Fix DOING homepage crop and first paint

on:
  push:
    paths:
      - '.github/workflows/fix-doing-home-layout.yml'

permissions:
  contents: write

jobs:
  fix-home-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Add first-paint boot mode before body renders.
          marker='<title>DOING｜活動報名與預約</title>'
          boot='''<title>DOING｜活動報名與預約</title>\n<script>try{if(!new URLSearchParams(location.search).get('tenant'))document.documentElement.classList.add('doing-global-boot')}catch(e){}</script>'''
          if 'doing-global-boot' not in s:
              if marker not in s: raise SystemExit('title marker missing')
              s=s.replace(marker,boot,1)

          old_stage='.doing-svg-stage{position:relative;width:min(100vw,1366px);margin:0 auto;aspect-ratio:1024.5/1728;background:#fff;overflow:hidden}.doing-svg-stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;user-select:none}'
          new_stage='.doing-svg-stage{position:relative;width:min(100vw,1366px);margin:0 auto;aspect-ratio:1366/2174;background:#fff;overflow:hidden}.doing-svg-stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center bottom;pointer-events:none;user-select:none}'
          if old_stage not in s: raise SystemExit('stage css marker missing')
          s=s.replace(old_stage,new_stage,1)

          reps={
            'left:48.6%;top:47.2%;width:43.3%;height:5.25%':'left:48.6%;top:44.04%;width:43.3%;height:5.56%',
            'left:4.2%;top:70.8%;width:42.6%;height:26.6%':'left:4.2%;top:69.05%;width:42.6%;height:28.19%',
            'left:55.2%;top:82.4%;width:7.5%;height:4.7%':'left:55.2%;top:81.35%;width:7.5%;height:4.98%',
            'left:65.3%;top:82.2%;width:8.7%;height:5.1%':'left:65.3%;top:81.14%;width:8.7%;height:5.40%',
            'left:75.2%;top:81.6%;width:10.8%;height:5.7%':'left:75.2%;top:80.50%;width:10.8%;height:6.04%',
            'left:87.4%;top:81.3%;width:9.5%;height:6.1%':'left:87.4%;top:80.18%;width:9.5%;height:6.46%',
            'left:65.2%;top:91.0%;width:30.5%;height:5.5%':'left:65.2%;top:90.46%;width:30.5%;height:5.83%'
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit(f'coordinate marker missing: {a}')
              s=s.replace(a,b,1)

          css_marker='body.doing-global-mode>.top,body.doing-global-mode>.bottom-nav{display:none!important}'
          boot_css='''html.doing-global-boot body{background:#fff!important}\nhtml.doing-global-boot body>.top,html.doing-global-boot body>.bottom-nav{display:none!important}\nhtml.doing-global-boot #doingGlobalFixedNav.hidden{display:flex!important}\nhtml.doing-global-boot #doingGlobalArtHome.hidden{display:block!important}\nhtml.doing-global-boot #pageSessions>.hero,html.doing-global-boot #pageSessions>#announcements,html.doing-global-boot #pageSessions>#eventSection,html.doing-global-boot #pageSessions>.section-title,html.doing-global-boot #pageSessions>#sessionGrid,html.doing-global-boot .site-footer{display:none!important}\n'''+css_marker
          if css_marker not in s: raise SystemExit('global mode marker missing')
          s=s.replace(css_marker,boot_css,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify homepage patch
        run: |
          grep -q 'DOING-home.webp' index.html
          grep -q 'aspect-ratio:1366/2174' index.html
          grep -q 'doing-global-boot' index.html
          ! grep -q 'DOING-home.svg' index.html
      - name: Commit
        run: |
          git config user.name 'DOING Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: crop embedded nav and remove homepage flash'
          git push
