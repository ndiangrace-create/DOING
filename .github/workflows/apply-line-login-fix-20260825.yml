name: Apply LINE Login Fix 20260825

on:
  push:
    branches: [fix/line-login-logo-20260825]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/line-login-logo-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded transform
        run: node scripts/apply-line-login-fix-20260825.mjs
      - name: Verify exact delta
        run: |
          git diff --check
          git diff --exit-code -- worker.js worker.txt >/dev/null && { echo 'Expected Worker delta missing'; exit 1; } || true
          cmp worker.js worker.txt
          grep -F "initial_amr_display:'lineqr'" worker.js
          grep -F "transientMemberLoadKeepsToken:true" scripts/e2e-home-kawaii.mjs
      - name: Commit transformed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js worker.txt member-current.html scripts/e2e-home-kawaii.mjs
          if git diff --cached --quiet; then
            echo 'No transform changes needed'
            exit 0
          fi
          git commit -m "Fix LINE login fallback and member session retention [skip ci]"
          git push origin HEAD:fix/line-login-logo-20260825
