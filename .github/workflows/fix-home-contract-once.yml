name: Fix Home Contract Once
on:
  push:
    branches: [release/home-line-ready-20260825]
    paths:
      - '.github/workflows/fix-home-contract-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/home-line-ready-20260825
          fetch-depth: 0
      - name: Align only approved label
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f='scripts/build-doing-2-site.mjs';
          let s=fs.readFileSync(f,'utf8');
          const old="'申請室內設計進度系統'";
          const next="'申請室內設計系統'";
          if((s.split(old).length-1)!==1)throw new Error('expected exactly one old contract label');
          fs.writeFileSync(f,s.replace(old,next));
          NODE
          rm .github/workflows/fix-home-contract-once.yml
          git diff --check
          node scripts/build-doing-2-site.mjs
      - name: Commit exact validation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-doing-2-site.mjs .github/workflows/fix-home-contract-once.yml
          git commit -m 'Align approved interior application label [home-contract-fixed]'
          git push origin HEAD:release/home-line-ready-20260825
