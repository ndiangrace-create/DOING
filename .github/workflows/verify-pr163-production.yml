name: Verify PR163 Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-pr163-production.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for live Pages to match PR163
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..36}; do
            curl -fsSL --max-time 20 https://doing.2b-love.com/apply/ -o /tmp/apply.html || true
            curl -fsSL --max-time 20 https://doing.2b-love.com/doing-smart-activation-v5.js -o /tmp/apply.js || true
            curl -fsSL --max-time 20 https://doing.2b-love.com/doing-formal-application-bridge.js -o /tmp/bridge.js || true
            if grep -q '申請 DOING 營運帳號' /tmp/apply.html 2>/dev/null \
              && grep -q '一頁填完，LINE 驗證後直接開通' /tmp/apply.js 2>/dev/null \
              && grep -q 'submitApplication' /tmp/apply.js 2>/dev/null \
              && grep -q 'routeResolvedMemberState' /tmp/bridge.js 2>/dev/null \
              && grep -q 'readMemberState' /tmp/bridge.js 2>/dev/null; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = "1"
          ! grep -q '← 上一步' /tmp/apply.js
          ! grep -q '下一步 →' /tmp/apply.js
      - name: Verify live Core remains healthy
        shell: bash
        run: |
          set -euo pipefail
          API='https://tobeloved-api.ndiangrace.workers.dev'
          code="$(curl -sS --max-time 20 -o /tmp/discovery.json -w '%{http_code}' "$API?action=publicDiscovery")"
          test "$code" -ge 200 -a "$code" -lt 500
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'));"
      - name: Real-browser live single-page smoke
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              await page.goto('https://doing.2b-love.com/apply/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#submitApplication').waitFor({timeout:15000});
              if(await page.locator('#submitApplication').count()!==1)throw new Error('submit CTA count mismatch');
              if(await page.getByText('上一步',{exact:false}).count())throw new Error('legacy previous step still visible');
              if(await page.getByText('下一步',{exact:false}).count())throw new Error('legacy next step still visible');
              const title=await page.locator('h1').first().textContent().catch(()=>null);
              if(!String(title||'').includes('申請 DOING 營運帳號'))throw new Error('single-page title missing');
              await page.close();
            }
          } finally {await browser.close();}
          NODE
