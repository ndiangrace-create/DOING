# One-time cleanup accelerator: 2026-08-24
name: DOING Repository Hygiene Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-hygiene-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every historical branch except main first
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" = "main" ] && continue
            git push origin --delete "$branch" || true
            count=$((count+1))
          done < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')
          echo "Deleted historical branches: $count"
      - name: Delete stored Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)"
          count=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
            count=$((count+1))
          done <<< "$ids"
          echo "Deleted artifacts: $count"
      - name: Report cleanup completion
        run: echo 'Repository branch/artifact cleanup completed; workflow will be removed after verification.'
