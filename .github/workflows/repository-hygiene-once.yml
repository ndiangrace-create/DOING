name: DOING Repository Hygiene Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-hygiene-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete stored Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)"
          count=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            count=$((count+1))
          done <<< "$ids"
          echo "Deleted artifacts: $count"
      - name: Delete old completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.status == \"completed\" and .id != ${GITHUB_RUN_ID}) | .id" || true)"
          count=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || true
            count=$((count+1))
          done <<< "$ids"
          echo "Deleted completed workflow runs: $count"
      - name: Delete every historical branch except main
        shell: bash
        run: |
          set -euo pipefail
          count=0
          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | while read -r branch; do
            [ "$branch" = "main" ] && continue
            git push origin --delete "$branch" || true
            echo "Deleted branch: $branch"
          done
      - name: Remove this one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DOING repository hygiene'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/repository-hygiene-once.yml
          git add -u .github/workflows/repository-hygiene-once.yml
          git commit -m 'chore: remove one-time repository cleanup workflow'
          git push origin HEAD:main
