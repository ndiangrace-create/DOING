name: TEMP Market Tenant Session Source Patch
on:
  push:
    branches: [fix/market-complete-session-flow-20260826]
    paths:
      - '.github/workflows/market-tenant-session-source-temp.yml'
      - 'scripts/patch-market-tenant-session-source-20260826.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-complete-session-flow-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch tenant-scoped Market session source
        run: node scripts/patch-market-tenant-session-source-20260826.mjs
      - name: Validate syntax and contract
        run: |
          node --check doing-market-public-2bl.js
          grep -q "return currentTenant()?tenantRows" doing-market-public-2bl.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'doing-closed-loop-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add doing-market-public-2bl.js
          git commit -m 'Use tenant sessions after inline Market hydration'
          git push origin HEAD:fix/market-complete-session-flow-20260826
