name: DOING Safe Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doing-tobeloved-api-production
  cancel-in-progress: false

env:
  TARGET_WORKER: tobeloved-api
  FORBIDDEN_WORKER: 2bl-v7

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fixed production target
        run: |
          test "$TARGET_WORKER" = "tobeloved-api"
          test "$TARGET_WORKER" != "$FORBIDDEN_WORKER"
          test -f worker.js
          test -f worker.txt
          cmp worker.js worker.txt
      - name: Parse canonical source files
        run: |
          node -e "import('./worker.js')"
          for f in doing-attribution.js doing-home-refresh.js doing-member-return-direct.js doing-global-entry.js doing-workspace-product-router.js doing-smart-activation.js doing-smart-activation-v5.js doing-formal-application-bridge.js doing-auto-activation-status.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const pages=['doing-2.html','register.html','member-panel.html','workspace.html','smart-application.html','market-center.html','market-public.html','market-session.html','booking-2-center.html','project-center.html','guide-center.html','world-tree.html'];
          for(const f of pages){const source=fs.readFileSync(f,'utf8');let count=0;for(const match of source.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){if(match[1].trim())new vm.Script(match[1],{filename:`${f}#script${++count}`})}}
          NODE
      - name: Reject retired root pages
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html member.html admin.html onsite.html platform.html operations-center.html photo.html consignment.html about.html booking-center.html; do test ! -e "$f"; done
          ! find . -maxdepth 1 -type f -name 'uat-application-*.html' | grep -q .
          test -d legacy-pages
          test -d tests/uat
      - name: Build canonical site
        run: |
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-v19.mjs
      - name: Validate unified entry and product routes
        run: |
          node scripts/validate-unified-entry.mjs
          node scripts/validate-booking-center.mjs
          node scripts/validate-member-panel-return.mjs
          node scripts/validate-application-login-flow.mjs
          node scripts/validate-fixed-product-application.mjs
          node scripts/validate-formal-application-closure.mjs
      - name: Validate SSOT and Core safety
        run: |
          node scripts/validate-data-sources.mjs
          node scripts/validate-market-app-core-contracts.mjs
          node scripts/validate-market-auth-role-separation.mjs
          node scripts/validate-market-member-oauth-primary-return.mjs
      - name: Validate Market regressions
        run: |
          node scripts/validate-market-green-closure.mjs
      - name: Validate world tree and reusable checkpoints
        run: |
          node scripts/validate-world-tree-mindmap.mjs
          node scripts/validate-test-records.mjs
      - name: Verify member and tenant safety invariants
        run: |
          grep -q "platform_member_id" worker.js
          grep -q "verifiedRegOwnerGuard" worker.js
          grep -q "member_token" register.html
          grep -q "createMemberWorkspaceAdminSession" doing-global-entry.js
          grep -q "new URL('/workspace/',location.origin)" doing-global-entry.js
          ! grep -q "Math.random(" worker.js
          cmp worker.js worker.txt

  cloudflare-audit:
    runs-on: ubuntu-latest
    outputs:
      compatibility_date: ${{ steps.audit.outputs.compatibility_date }}
    steps:
      - name: Verify Cloudflare secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Read only the target Worker settings
        id: audit
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers"
          scripts="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CF_TOKEN}" "${base}/scripts")"
          count="$(jq --arg id "$TARGET_WORKER" '[.result[] | select(.id==$id)] | length' <<<"$scripts")"
          test "$count" = "1"
          settings="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CF_TOKEN}" "${base}/scripts/${TARGET_WORKER}/settings")"
          date="$(jq -r '.result.compatibility_date // empty' <<<"$settings")"
          test -n "$date"
          unsafe="$(jq '[.result.bindings[]? | select(.type != "plain_text" and .type != "secret_text" and .type != "json")] | length' <<<"$settings")"
          test "$unsafe" = "0"
          echo "compatibility_date=$date" >> "$GITHUB_OUTPUT"
          jq -n --arg worker "$TARGET_WORKER" --arg date "$date" '{worker:$worker,compatibility_date:$date,audit:"passed"}' > cloudflare-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-cloudflare-audit
          path: cloudflare-audit.json
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, cloudflare-audit]
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment-only Wrangler config
        env:
          COMPATIBILITY_DATE: ${{ needs.cloudflare-audit.outputs.compatibility_date }}
        run: |
          jq -n --arg name "$TARGET_WORKER" --arg main "worker.js" --arg date "$COMPATIBILITY_DATE" '{name:$name,main:$main,compatibility_date:$date}' > wrangler.deploy.json
      - name: Deploy only to tobeloved-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.deploy.json --keep-vars
      - name: Verify deployed Worker responds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers"
          deployments="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CF_TOKEN}" "${base}/scripts/${TARGET_WORKER}/deployments")"
          deployment_id="$(jq -r '.result.deployments[0].id // empty' <<<"$deployments")"
          test -n "$deployment_id"
          jq -n --arg worker "$TARGET_WORKER" --arg deployment_id "$deployment_id" --arg commit "$GITHUB_SHA" '{worker:$worker,deployment_id:$deployment_id,commit:$commit,verified:true}' > deployment-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-production-deployment
          path: deployment-result.json
          retention-days: 90
