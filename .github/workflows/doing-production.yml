name: DOING Safe Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/market-logo-upload-20260823]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-formal-application-closure-once:
    if: github.event_name == 'push' && github.ref_name == 'fix/market-logo-upload-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-logo-upload-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch formal application closure
        shell: python
        run: |
          from pathlib import Path
          def once(text,old,new,label):
              if new in text:return text
              n=text.count(old)
              if n!=1:raise SystemExit(f'{label}: unsafe match count={n}')
              return text.replace(old,new,1)
          for name in ('worker.js','worker.txt'):
              p=Path(name);text=p.read_text(encoding='utf-8')
              text=once(text,"const fallback=mode==='platform'?platformSiteUrl(env):mode==='organizer_signup'?doingSiteUrl(env)+'#apply':doingSiteUrl(env);","const fallback=mode==='platform'?platformSiteUrl(env):mode==='organizer_signup'?new URL('apply/',doingSiteUrl(env)).toString():doingSiteUrl(env);",name+' line fallback')
              text=once(text,"const memberTarget=safeDoingReturnUrl(env,statePayload&&statePayload.return_url),applicationTarget=new URL(doingSiteUrl(env)),adminTarget=new URL(adminLoginSiteUrl(env)),platformTarget=new URL(platformSiteUrl(env));applicationTarget.hash='apply';","const memberTarget=safeDoingReturnUrl(env,statePayload&&statePayload.return_url),applicationTarget=new URL('apply/',doingSiteUrl(env)),adminTarget=new URL(adminLoginSiteUrl(env)),platformTarget=new URL(platformSiteUrl(env));",name+' application target')
              old="const activationRows=await dbGet(env,'tenant_apply_logs',`id=eq.${encodeURIComponent(applicationId)}&select=status,tenant_id,note`).catch(()=>[]),activation=activationRows[0]||{},activationStatus=String(activation.status||'pending');\n      if(activationStatus==='approved'){"
              new="const activationRows=await dbGet(env,'tenant_apply_logs',`id=eq.${encodeURIComponent(applicationId)}&select=status,tenant_id,note`).catch(()=>[]),activation=activationRows[0]||{},activationStatus=String(activation.status||'pending');\n      const applicationMemberToken=await issueMemberToken({email:member.email,provider:'line',provider_subject:lineSubject,display_name:lineName,avatar_url:lineAvatar},env);\n      applicationTarget.searchParams.set('member_token',applicationMemberToken);applicationTarget.searchParams.set('member_status',platformMemberComplete(member)?'ready':'profile_required');\n      if(activationStatus==='approved'){"
              text=once(text,old,new,name+' member handoff')
              text=text.replace("if(mode==='platform'||tenant==='platform')","if(mode==='platform')")
              text=text.replace("if(mode==='admin'||tenant){","if(mode==='admin'){")
              text=text.replace("if(statePayload.mode==='platform'||tenant==='platform')","if(statePayload.mode==='platform')")
              text=text.replace("if(statePayload.mode==='admin'||tenant){","if(statePayload.mode==='admin'){")
              text=text.replace("doingSiteUrl(env)+'#apply'","new URL('apply/',doingSiteUrl(env)).toString()")
              text=text.replace("const u=new URL(doingSiteUrl(env));u.hash='apply';","const u=new URL('apply/',doingSiteUrl(env));")
              p.write_text(text,encoding='utf-8')
          if Path('worker.js').read_bytes()!=Path('worker.txt').read_bytes():raise SystemExit('worker mirrors diverged')
          p=Path('doing-smart-activation-v5.js');text=p.read_text(encoding='utf-8')
          text=once(text,"}catch(e){err(e.message||'申請資料保存失敗');b.disabled=false;b.textContent='我要申請｜使用 LINE 驗證 →'}}","}catch(e){const message=e.message||'申請資料保存失敗';if(/此會員已是正式營運方|已有自己的 DOING 工作空間/.test(message)){const target=new URL('/me/',location.origin);target.hash='operations';const token=localStorage.getItem('doing_member_token')||'';if(token){location.href=target.toString();return}const a=new URL(API+'/auth/line/start');a.searchParams.set('mode','member');a.searchParams.set('return_url',target.toString());location.href=a.toString();return}if(/此會員已有進行中的營運申請|已有進行中的工作空間申請/.test(message)){const target=new URL('/me/',location.origin);target.searchParams.set('post_application','1');target.hash='operations';const token=localStorage.getItem('doing_member_token')||'';if(token){location.href=target.toString();return}const a=new URL(API+'/auth/line/start');a.searchParams.set('mode','member');a.searchParams.set('return_url',target.toString());location.href=a.toString();return}err(message);b.disabled=false;b.textContent='我要申請｜使用 LINE 驗證 →'}}",'duplicate recovery')
          text=once(text,"render();\n})();","""render();
(async function recoverExistingWorkspace(){
 const q=new URL(location.href).searchParams;if(['application_status','application_id','member_token','member_login_error','login_error'].some(k=>q.has(k)))return;
 const token=localStorage.getItem('doing_member_token')||'';if(!token)return;
 try{const r=await fetch(API+'?action=getPlatformMemberProfile&member_token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)return;const data=d.data??d.result??d,spaces=Array.isArray(data.workspaces)?data.workspaces:[];if(!spaces.length)return;const target=new URL('/me/',location.origin);target.hash='operations';form.innerHTML='<div id="d2a"><section class="h"><small>DOING 營運帳號</small><h2>你的工作空間已經開通</h2><p>這個會員已經有自己的 DOING 工作空間，不需要重新申請。</p></section><section class="c"><button class="b pri" id="existingWorkspaceBtn" type="button">進入我的 DOING</button></section></div>';document.getElementById('existingWorkspaceBtn').onclick=()=>location.href=target.toString()}catch(_){}
})();
})();""",'existing workspace preflight')
          p.write_text(text,encoding='utf-8')
          p=Path('doing-application-completion.js');text=p.read_text(encoding='utf-8');text=once(text,"if(!['approved','auto_activated'].includes(status)) return;","if(!['approved','auto_activated','existing_workspace'].includes(status)) return;",'completion existing workspace');p.write_text(text,encoding='utf-8')
      - name: Verify product patch
        run: |
          cmp worker.js worker.txt
          node --check worker.js
          node --check doing-smart-activation-v5.js
          node --check doing-application-completion.js
          ! grep -F "mode==='platform'||tenant==='platform'" worker.js
          ! grep -F "mode==='admin'||tenant" worker.js
          grep -F "new URL('apply/',doingSiteUrl(env))" worker.js >/dev/null
          grep -F "applicationMemberToken" worker.js >/dev/null
          grep -F "你的工作空間已經開通" doing-smart-activation-v5.js >/dev/null
          grep -F "existing_workspace" doing-application-completion.js >/dev/null
      - name: Commit product patch once
        run: |
          if git diff --quiet -- worker.js worker.txt doing-smart-activation-v5.js doing-application-completion.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js worker.txt doing-smart-activation-v5.js doing-application-completion.js
          git commit -m 'fix: close formal organizer application flow'
          git push origin HEAD:fix/market-logo-upload-20260823
