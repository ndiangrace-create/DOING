name: DOING Safe Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: doing-tobeloved-api-production
  cancel-in-progress: false

env:
  TARGET_WORKER: tobeloved-api
  FORBIDDEN_WORKER: 2bl-v7

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One-time Google supplement closure repair
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/world-tree-uat-settings-ssot-20260820'
        run: |
          git fetch origin "${GITHUB_HEAD_REF}:${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          node scripts/fix-google-supplement-closure.mjs
          if git diff --quiet -- worker.js worker.txt; then
            echo 'Google supplement closure already repaired.'
          else
            git config user.name 'DOING Release Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add worker.js worker.txt
            git commit -m 'DOING v20：恢復 Google 補件閉環並修正 Worker 語法'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Verify fixed production target
        run: |
          test "$TARGET_WORKER" = "tobeloved-api"
          test "$TARGET_WORKER" != "$FORBIDDEN_WORKER"
          test -f worker.js
          test -f worker.txt
          cmp worker.js worker.txt
      - name: Parse JavaScript and HTML scripts
        run: |
          node -e "import('./worker.js')"
          node --check doing-attribution.js
          node --check doing-home-refresh.js
          test ! -f doing-home-refresh-core.js || node --check doing-home-refresh-core.js
          test ! -f doing-about-refresh.js
          test ! -f doing-about-refresh.css
          node --check doing-smart-activation.js
          node --check doing-global-entry.js
          node --check doing-auto-activation-status.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const f of ['index.html','register.html','member.html','member-panel.html','admin.html','onsite.html','platform.html','about.html','photo.html']){
            const source=fs.readFileSync(f,'utf8');let count=0;
            for(const match of source.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
              if(!match[1].trim())continue;
              new vm.Script(match[1],{filename:`${f}#script${++count}`});
            }
          }
          NODE
      - name: Validate authoritative Supabase data sources
        run: node scripts/validate-data-sources.mjs
      - name: Validate responsive mobile and desktop framework
        run: node scripts/validate-responsive-layout.mjs
      - name: Validate frontstage user-facing copy
        run: node scripts/validate-frontstage-copy.mjs
      - name: Validate DOING homepage visual standard
        run: node scripts/validate-visual-standard.mjs
      - name: Validate platform attribution flow
        run: node scripts/validate-platform-attribution.mjs
      - name: Validate capability world map
        run: node scripts/validate-capabilities.mjs
      - name: Validate mobile seat map
        run: node scripts/validate-seat-map.mjs
      - name: Validate tenant application and module flow
        run: |
          node scripts/validate-tenant-application.mjs
          node scripts/validate-login-providers.mjs
          node scripts/validate-organizer-application-e2e.mjs
          node scripts/validate-member-brand-e2e.mjs
          node scripts/validate-role-module-access.mjs
      - name: Validate full system routes, buttons and settings
        run: |
          node scripts/validate-full-system.mjs
          node scripts/validate-navigation-actions.mjs
          node scripts/validate-smart-oauth-top.mjs
          node scripts/validate-application-social-required.mjs
          node scripts/validate-platform-operations-e2e.mjs
          node scripts/validate-naming-autoactivation-retention.mjs
      - name: Validate compact admin visual consistency
        run: node scripts/validate-admin-consistency.mjs
      - name: Validate reusable test records
        run: node scripts/validate-test-records.mjs
      - name: Verify unified visual shell and private long press
        run: |
          for page in member-panel.html admin.html onsite.html platform.html photo.html; do
            grep -q 'doing-system.css?v=20260817-system5' "$page"
            grep -q 'doing-app' "$page"
          done
          grep -q 'member-panel.html' member.html
          grep -q 'index.html' member.html
          ! grep -q 'doing-app' member.html
          ! grep -q 'doing-logo.png' member.html
          grep -q 'smart-application.html' about.html
          ! grep -q 'apply-wrap' about.html
          ! grep -q 'smart-flow-guide' about.html
          grep -q "hiddenAdminSelector='#brandHoldTarget,.doing-nav-brand'" index.html
          grep -q "document.addEventListener('pointerdown'" index.html
          grep -q "e.target.closest?.(hiddenAdminSelector)" index.html
          grep -q "setTimeout(openHiddenAdminEntry,3000)" index.html
          grep -q "Math.hypot" index.html
          HOME_UI=doing-home-refresh.js
          test ! -f doing-home-refresh-core.js || HOME_UI=doing-home-refresh-core.js
          grep -q "brand.dataset.hiddenAdminTarget='true'" "$HOME_UI"
          grep -q "setAttribute('draggable','false')" "$HOME_UI"
          if [ -f doing-home-refresh-core.js ]; then
            grep -q "doing-home-refresh-core.js" doing-home-refresh.js
            grep -q "handoffToWorkspace" doing-home-refresh.js
            grep -q "createMemberWorkspaceAdminSession" doing-home-refresh.js
          fi
          grep -q -- '-webkit-touch-callout:none' doing-home-refresh.css
          grep -q "u.searchParams.set('tenant','platform')" index.html
          ! grep -q 'navigator.vibrate' index.html
          ! grep -q 'holdPulse' index.html
          ! grep -q "classList.add('holding')" index.html
          grep -q 'platform_super_admin' worker.js
      - name: Verify member and tenant safety invariants
        run: |
          grep -q "platform_member_id" worker.js
          grep -q "verifiedRegOwnerGuard" worker.js
          grep -q "member_token" index.html
          grep -q "member_token" register.html
          ! grep -q "Math.random(" worker.js

  cloudflare-audit:
    runs-on: ubuntu-latest
    outputs:
      compatibility_date: ${{ steps.audit.outputs.compatibility_date }}
    steps:
      - name: Verify Cloudflare secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Read only the target Worker settings
        id: audit
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers"
          scripts="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CF_TOKEN}" "${base}/scripts")"
          count="$(jq --arg id "$TARGET_WORKER" '[.result[] | select(.id==$id)] | length' <<<"$scripts")"
          test "$count" = "1"
          settings="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CF_TOKEN}" "${base}/scripts/${TARGET_WORKER}/settings")"
          date="$(jq -r '.result.compatibility_date // empty' <<<"$settings")"
          test -n "$date"
          unsafe="$(jq '[.result.bindings[]? | select(.type != "plain_text" and .type != "secret_text" and .type != "json")] | length' <<<"$settings")"
          test "$unsafe" = "0"
          echo "compatibility_date=$date" >> "$GITHUB_OUTPUT"
          jq -n --arg worker "$TARGET_WORKER" --arg date "$date" '{worker:$worker,compatibility_date:$date,audit:"passed"}' > cloudflare-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-cloudflare-audit
          path: cloudflare-audit.json
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, cloudflare-audit]
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment-only Wrangler config
        env:
          COMPATIBILITY_DATE: ${{ needs.cloudflare-audit.outputs.compatibility_date }}
        run: |
          jq -n --arg name "$TARGET_WORKER" --arg main "worker.js" --arg date "$COMPATIBILITY_DATE" \
            '{name:$name,main:$main,compatibility_date:$date}' > wrangler.deploy.json
      - name: Deploy only to tobeloved-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.deploy.json --keep-vars
      - name: Verify deployed Worker responds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers"
          deployments="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CF_TOKEN}" "${base}/scripts/${TARGET_WORKER}/deployments")"
          deployment_id="$(jq -r '.result.deployments[0].id // empty' <<<"$deployments")"
          test -n "$deployment_id"
          jq -n --arg worker "$TARGET_WORKER" --arg deployment_id "$deployment_id" --arg commit "$GITHUB_SHA" \
            '{worker:$worker,deployment_id:$deployment_id,commit:$commit,verified:true}' > deployment-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-production-deployment
          path: deployment-result.json
          retention-days: 90
