name: DOING Market Auth Role Separation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  include-market-admin-entry-asset-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/market-logo-upload-20260823' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Include secure Market admin entry asset in built site
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/build-doing-2-site.mjs')
          text=path.read_text(encoding='utf-8')
          old="'doing-market-completion-v16.js','doing-member-return-direct.js'"
          new="'doing-market-completion-v16.js','doing-market-admin-entry.js','doing-member-return-direct.js'"
          if new in text:
              pass
          elif text.count(old)==1:
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          else:
              raise SystemExit(f'Unsafe build asset patch state: {text.count(old)}')
      - name: Commit asset wiring if changed
        run: |
          if git diff --quiet -- scripts/build-doing-2-site.mjs; then
            echo "Market admin entry asset already included."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-doing-2-site.mjs
          git commit -m "build: include Market admin entry asset"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Market auth role separation
        run: node scripts/validate-market-auth-role-separation.mjs
      - name: Validate Market member OAuth primary return
        run: node scripts/validate-market-member-oauth-primary-return.mjs
