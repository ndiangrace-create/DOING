name: Fix original DOING nav

on:
  push:
    paths:
      - '.github/workflows/fix-doing-original-nav-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append final nav override
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="doing-original-canva-nav-20260814">'
          if marker not in s:
              css = r'''<style id="doing-original-canva-nav-20260814">
.doing-global-fixed-nav{position:fixed!important;top:10px!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;z-index:1000!important;display:flex!important;gap:10px!important;align-items:center!important;justify-content:center!important;padding:0!important;background:transparent!important;backdrop-filter:none!important;box-shadow:none!important;white-space:nowrap!important;max-width:calc(100vw - 18px)!important;border:0!important;border-radius:0!important;overflow:visible!important}
.doing-global-fixed-nav.hidden{display:none!important}
.g-pill{flex:0 0 170px!important;width:170px!important;height:56px!important;min-height:56px!important;padding:0!important;border:0!important;border-radius:999px!important;color:transparent!important;text-indent:-9999px!important;overflow:hidden!important;background-image:url('DOING-home.webp')!important;background-repeat:no-repeat!important;background-size:1366px 2304px!important;box-shadow:none!important;text-decoration:none!important;display:block!important;cursor:pointer!important}
.g-pill:nth-child(1){background-position:-445px -31px!important}
.g-pill:nth-child(2){background-position:-625px -31px!important}
.g-pill:nth-child(3){background-position:-804px -31px!important}
.g-pill:nth-child(4){background-position:-983px -31px!important}
.g-pill:nth-child(5){background-position:-1163px -31px!important}
.g-pill.purple,.g-pill.green,.g-pill.yellow,.g-pill.pink,.g-pill.blue{background-color:transparent!important}
@media(max-width:760px){.doing-global-fixed-nav{left:8px!important;right:8px!important;transform:none!important;top:7px!important;overflow-x:auto!important;justify-content:flex-start!important;max-width:none!important;padding:0 0 4px!important;scrollbar-width:none!important}.doing-global-fixed-nav::-webkit-scrollbar{display:none}.g-pill{flex:0 0 170px!important;width:170px!important;height:56px!important;min-height:56px!important}}
</style>'''
              if '</head>' not in s:
                  raise SystemExit('missing head end')
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'doing-original-canva-nav-20260814' index.html
          grep -q "background-image:url('DOING-home.webp')" index.html
          grep -q 'g-pill:nth-child(5)' index.html
      - name: Commit
        run: |
          git config user.name 'DOING Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: show original Canva buttons as fixed navigation'
          git push
