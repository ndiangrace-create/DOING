name: DOING 2.0 DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doing-2-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doing-2-dns
  cancel-in-progress: false

env:
  CF_ZONE_NAME: 2b-love.com
  CF_CUSTOM_DOMAIN: doing.2b-love.com
  CF_PAGES_TARGET: doing-2.pages.dev

jobs:
  ensure-dns:
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Ensure doing.2b-love.com CNAME
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json')
          zones="$(curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=${CF_ZONE_NAME}&account.id=${CF_ACCOUNT}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zones")"
          test -n "$zone_id"

          list="$(curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=CNAME&name=${CF_CUSTOM_DOMAIN}")"
          record_id="$(jq -r '.result[0].id // empty' <<<"$list")"
          payload="$(jq -nc --arg type CNAME --arg name "$CF_CUSTOM_DOMAIN" --arg content "$CF_PAGES_TARGET" '{type:$type,name:$name,content:$content,ttl:1,proxied:true}')"

          if [ -n "$record_id" ]; then
            curl --fail-with-body -sS -X PUT "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" > dns-result.json
          else
            curl --fail-with-body -sS -X POST "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" > dns-result.json
          fi

          jq -e '.success == true' dns-result.json >/dev/null
          jq -n --arg domain "$CF_CUSTOM_DOMAIN" --arg target "$CF_PAGES_TARGET" --arg zone "$zone_id" '{domain:$domain,target:$target,zone_id:$zone,status:"dns-ready"}' > doing-2-dns-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-2-dns-evidence
          path: doing-2-dns-evidence.json
          retention-days: 90
