name: DOING 2.0 Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'doing-2.html'
      - 'doing-2-shell.js'
      - 'doing-2-home-v11.css'
      - 'doing-2-home-v11.js'
      - 'doing-home-logo-slot-v12.css'
      - 'doing-home-logo-slot-v12.js'
      - 'doing-candy-theme.css'
      - 'doing-application-contract-v12.js'
      - 'doing-market-v18.css'
      - 'doing-market-v19-layout.css'
      - 'doing-market-auth-bridge-v19.js'
      - 'market-center.html'
      - 'market-public.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'guide-center.html'
      - 'smart-application.html'
      - 'workspace.html'
      - 'member-panel.html'
      - 'register.html'
      - 'world-tree.html'
      - 'doing-world-tree-current.json'
      - 'doing-member-return-direct.js'
      - 'doing-application-completion.js'
      - 'doing-workspace-product-router.js'
      - 'doing-smart-activation-v5.js'
      - 'doing-auto-activation-status.js'
      - 'doing-global-entry.js'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/postprocess-market-v19.mjs'
      - 'scripts/validate-member-panel-return.mjs'
      - 'scripts/validate-application-login-flow.mjs'
      - 'scripts/validate-fixed-product-application.mjs'
      - 'scripts/validate-doing-v11-home-e2e.mjs'
      - 'scripts/validate-home-real-ui-v11.mjs'
      - 'scripts/validate-v12-closure.mjs'
      - 'scripts/validate-doing2-short-route-cleanup.mjs'
      - 'scripts/validate-world-tree-mindmap.mjs'
      - 'DOING_2.0_MARKET_2BL_UI_PARITY_20260823.md'
      - '.github/workflows/doing-2-site.yml'
  push:
    branches: [main]
    paths:
      - 'doing-2.html'
      - 'doing-2-shell.js'
      - 'doing-2-home-v11.css'
      - 'doing-2-home-v11.js'
      - 'doing-home-logo-slot-v12.css'
      - 'doing-home-logo-slot-v12.js'
      - 'doing-candy-theme.css'
      - 'doing-application-contract-v12.js'
      - 'doing-market-v18.css'
      - 'doing-market-v19-layout.css'
      - 'doing-market-auth-bridge-v19.js'
      - 'market-center.html'
      - 'market-public.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'guide-center.html'
      - 'smart-application.html'
      - 'workspace.html'
      - 'member-panel.html'
      - 'register.html'
      - 'world-tree.html'
      - 'doing-world-tree-current.json'
      - 'doing-member-return-direct.js'
      - 'doing-application-completion.js'
      - 'doing-workspace-product-router.js'
      - 'doing-smart-activation-v5.js'
      - 'doing-auto-activation-status.js'
      - 'doing-global-entry.js'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/postprocess-market-v19.mjs'
      - 'scripts/validate-member-panel-return.mjs'
      - 'scripts/validate-application-login-flow.mjs'
      - 'scripts/validate-fixed-product-application.mjs'
      - 'scripts/validate-doing-v11-home-e2e.mjs'
      - 'scripts/validate-home-real-ui-v11.mjs'
      - 'scripts/validate-v12-closure.mjs'
      - 'scripts/validate-doing2-short-route-cleanup.mjs'
      - 'scripts/validate-world-tree-mindmap.mjs'
      - 'DOING_2.0_MARKET_2BL_UI_PARITY_20260823.md'
      - '.github/workflows/doing-2-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doing-2-site
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: doing-2
  CF_CUSTOM_DOMAIN: doing.2b-love.com

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate member panel LINE return
        run: node scripts/validate-member-panel-return.mjs
      - name: Validate application login workspace Market journey
        run: node scripts/validate-application-login-flow.mjs
      - name: Validate fixed product application
        run: node scripts/validate-fixed-product-application.mjs
      - name: Validate v11 public home end-to-end contracts
        run: node scripts/validate-doing-v11-home-e2e.mjs
      - name: Validate real homepage visual and live cards
        run: node scripts/validate-home-real-ui-v11.mjs
      - name: Validate v12 application/theme/topbar closure
        run: node scripts/validate-v12-closure.mjs
      - name: Validate DOING 2.0 short hierarchy cleanup
        run: node scripts/validate-doing2-short-route-cleanup.mjs
      - name: Validate true world tree mind map
        run: node scripts/validate-world-tree-mindmap.mjs
      - name: Build DOING 2.0 site
        run: |
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-v19.mjs
      - name: Validate only short hierarchy is published
        run: |
          test -f .doing-2-site/index.html
          for f in \
            market/index.html \
            market/public/index.html \
            market/session/index.html \
            project/index.html \
            booking/index.html \
            guide/index.html \
            workspace/index.html \
            me/index.html \
            apply/index.html \
            register/index.html \
            world-tree/index.html; do
            test -f ".doing-2-site/$f"
          done
          test -f .doing-2-site/doing-world-tree-current.json
          test -f .doing-2-site/doing-market-v19-layout.css
          test -f .doing-2-site/doing-market-auth-bridge-v19.js

          for f in \
            doing-2.html market-center.html market-public.html market-session.html \
            project-center.html booking-2-center.html guide-center.html workspace.html \
            member.html member-panel.html smart-application.html register.html admin.html onsite.html \
            platform.html operations-center.html photo.html consignment.html about.html; do
            test ! -e ".doing-2-site/$f"
          done

          for d in admin onsite platform operations photo consignment about member; do
            test ! -e ".doing-2-site/$d"
          done

          grep -q 'doing-member-return-direct.js' .doing-2-site/me/index.html
          grep -q 'doing-smart-activation-v5.js' .doing-2-site/apply/index.html
          grep -q 'doing-application-contract-v12.js' .doing-2-site/apply/index.html
          grep -q 'doing-application-completion.js' .doing-2-site/apply/index.html
          grep -q 'doing-workspace-product-router.js' .doing-2-site/workspace/index.html
          grep -q 'doing-market-v19-layout.css' .doing-2-site/market/index.html
          grep -q 'doing-market-auth-bridge-v19.js' .doing-2-site/market/index.html
          grep -q 'doing-market-auth-bridge-v19.js' .doing-2-site/market/session/index.html
          grep -q 'doing-market-v19-layout.css' .doing-2-site/market/public/index.html
          for page in sessions todos onsite members leads finance consignment settings; do
            grep -q "data-page=\"$page\"" .doing-2-site/market/index.html
          done
          grep -q 'overall-grid' .doing-2-site/world-tree/index.html
          grep -q 'market-map' .doing-2-site/world-tree/index.html
          grep -q 'DOING 2.0 世界樹' .doing-2-site/world-tree/index.html
          ! grep -R -E -q '(admin|onsite|platform|operations-center|photo|consignment|member-panel|smart-application)\.html' .doing-2-site
          ! grep -R -q '2bl-v7' .doing-2-site
      - uses: actions/upload-artifact@v4
        with:
          name: doing-2-site
          path: .doing-2-site
          retention-days: 14

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-validate
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Build site
        run: |
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-v19.mjs
      - name: Ensure Cloudflare Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${CF_PAGES_PROJECT}")"
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_PAGES_PROJECT}\",\"production_branch\":\"main\"}" "${base}" > project-create.json
          elif [ "$status" != "200" ]; then
            cat project.json; exit 1
          fi
      - name: Deploy DOING 2.0 site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .doing-2-site --project-name doing-2 --branch main --commit-dirty=true
      - name: Attach doing.2b-love.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PAGES_PROJECT}/domains"
          code="$(curl -sS -o domain.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_CUSTOM_DOMAIN}\"}" "$url")"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then cat domain.json; exit 1; fi
      - name: Record deployment evidence
        run: |
          jq -n --arg domain "$CF_CUSTOM_DOMAIN" --arg project "$CF_PAGES_PROJECT" --arg commit "$GITHUB_SHA" '{domain:$domain,project:$project,commit:$commit,status:"deployed"}' > doing-2-site-deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-2-site-deployment
          path: doing-2-site-deployment.json
          retention-days: 90
