name: DOING 2.0 Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'doing-2.html'
      - 'market-center.html'
      - 'market-public.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'guide-center.html'
      - 'market/**'
      - 'project/**'
      - 'booking/**'
      - 'guide/**'
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/doing-2-site.yml'
  push:
    branches: [main]
    paths:
      - 'doing-2.html'
      - 'market-center.html'
      - 'market-public.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'guide-center.html'
      - 'market/**'
      - 'project/**'
      - 'booking/**'
      - 'guide/**'
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/doing-2-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doing-2-site
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: doing-2
  CF_CUSTOM_DOMAIN: doing.2b-love.com

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build DOING 2.0 site
        run: node scripts/build-doing-2-site.mjs
      - name: Validate root and product routes
        run: |
          test -f .doing-2-site/index.html
          grep -q 'DOING 2.0 Hub' .doing-2-site/index.html
          for f in market/index.html market/public/index.html market/session/index.html project/index.html booking/index.html guide/index.html; do test -f ".doing-2-site/$f"; done
          grep -q 'market-center.html' .doing-2-site/market/index.html
          grep -q 'market-public.html' .doing-2-site/market/public/index.html
          grep -q 'market-session.html' .doing-2-site/market/session/index.html
          ! grep -R -q '2bl-v7' .doing-2-site
      - uses: actions/upload-artifact@v4
        with:
          name: doing-2-site
          path: .doing-2-site
          retention-days: 14

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-validate
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Build site
        run: node scripts/build-doing-2-site.mjs
      - name: Ensure Cloudflare Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${CF_PAGES_PROJECT}")"
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' \
              --data "{\"name\":\"${CF_PAGES_PROJECT}\",\"production_branch\":\"main\"}" "${base}" > project-create.json
          elif [ "$status" != "200" ]; then
            cat project.json; exit 1
          fi
      - name: Deploy DOING 2.0 site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .doing-2-site --project-name doing-2 --branch main --commit-dirty=true
      - name: Attach doing.2b-love.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PAGES_PROJECT}/domains"
          code="$(curl -sS -o domain.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_CUSTOM_DOMAIN}\"}" "$url")"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then cat domain.json; exit 1; fi
      - name: Record deployment evidence
        run: |
          jq -n --arg domain "$CF_CUSTOM_DOMAIN" --arg project "$CF_PAGES_PROJECT" --arg commit "$GITHUB_SHA" '{domain:$domain,project:$project,commit:$commit,status:"deployed"}' > doing-2-site-deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: doing-2-site-deployment
          path: doing-2-site-deployment.json
          retention-days: 90
