name: DOING Canonical Auth Routes Once
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/doing-2-site.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/unified-entry-login-cleanup-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonicalize member, register, Worker and Safe Production
        shell: python
        run: |
          from pathlib import Path
          import re

          # /me/ raw source: no retired page URLs and one workspace action.
          p=Path('member-panel.html');t=p.read_text(encoding='utf-8')
          t=t.replace("new URL('member.html',location.href)","new URL('/me/',location.origin)")
          t=t.replace("new URL('member.html#account',location.href)","new URL('/me/#account',location.origin)")
          t=t.replace("new URL('admin.html',location.href)","new URL('/workspace/',location.origin)")
          t=t.replace("new URL('operations-center.html',location.href)","new URL('/workspace/',location.origin)")
          t=t.replace('href="about.html#apply"','href="/apply/"').replace("href='about.html#apply'","href='/apply/'")
          t=t.replace('href="platform.html"','href="/workspace/#platform"')
          t=t.replace("location.href='index.html'","location.href='/'").replace('href="index.html"','href="/"')
          t=t.replace("if(!d.complete){location.href='index.html?openMemberProfile=1';return}","if(!d.complete){render();switchPage('account');return}")
          t=re.sub(r'<button class="btn secondary" data-workspace-calendar="[^"]+">[^<]*</button>','',t)
          t=re.sub(r'<button class="btn secondary" data-workspace-operations="[^"]+">[^<]*</button>','',t)
          t=t.replace('直接進入主辦後台','進入工作空間').replace('進入主辦後台','進入工作空間')
          p.write_text(t,encoding='utf-8')

          # Public registration: no direct admin OAuth and no retired admin URL.
          p=Path('register.html');t=p.read_text(encoding='utf-8')
          t=t.replace('href="index.html"','href="/"').replace('href="member.html"','href="/me/"')
          t=t.replace('a[href="index.html"],a[href="member.html"]','a[href="/"],a[href="/me/"]')
          t=t.replace("location.href='admin.html?tenant='+encodeURIComponent(tenant)+'&from=register'","location.href='/me/#operations'")
          t=t.replace("$('adminGoogleBtn').onclick=()=>{const u=new URL(API+'/auth/google/start');u.searchParams.set('mode','admin');location.href=u.toString()};\n$('adminLineBtn').onclick=()=>{location.href=API+'/auth/line/start?mode=admin'};","$('adminGoogleBtn')?.remove();\n$('adminLineBtn')?.remove();")
          p.write_text(t,encoding='utf-8')

          p=Path('doing-home-refresh.js');t=p.read_text(encoding='utf-8')
          t=re.sub(r"function startMyDoingLineLogin\(\)\{[^\n]*\}","function startMyDoingLineLogin(){clearMarketMemberReturn();location.assign('/me/')}",t,count=1)
          p.write_text(t,encoding='utf-8')

          p=Path('doing-home-refresh-core.js');t=p.read_text(encoding='utf-8')
          t=t.replace("location.href='member.html#operations'","location.href='/me/#operations'")
          t=t.replace("location.href='member.html'","location.href='/me/'")
          t=t.replace("new URL('admin.html',location.href)","new URL('/workspace/',location.origin)")
          p.write_text(t,encoding='utf-8')

          # Core canonical public routes.
          for name in ('worker.js','worker.txt'):
              p=Path(name);t=p.read_text(encoding='utf-8')
              old="""function adminLoginSiteUrl(env) {
  return env.DOING_LOGIN_URL || doingSiteUrl(env);
}

function adminSiteUrl(env) {
  return env.DOING_ADMIN_URL || doingPageUrl(env, 'admin.html');
}

function platformSiteUrl(env) {
  return env.DOING_PLATFORM_URL || doingPageUrl(env, 'platform.html');
}
"""
              new="""function memberSiteUrl(env) {
  return new URL('me/', doingSiteUrl(env)).toString();
}

function applicationSiteUrl(env) {
  return new URL('apply/', doingSiteUrl(env)).toString();
}

function workspaceSiteUrl(env) {
  return new URL('workspace/', doingSiteUrl(env)).toString();
}

function adminLoginSiteUrl(env) {
  return env.DOING_LOGIN_URL || memberSiteUrl(env);
}

function adminSiteUrl(env) {
  return env.DOING_ADMIN_URL || workspaceSiteUrl(env);
}

function platformSiteUrl(env) {
  return env.DOING_PLATFORM_URL || new URL('workspace/#platform', doingSiteUrl(env)).toString();
}
"""
              if new not in t:
                  if old not in t: raise SystemExit(name+': auth helper block not found')
                  t=t.replace(old,new,1)
              t=t.replace("doingPageUrl(env,'member.html')","memberSiteUrl(env)").replace("doingPageUrl(env, 'member.html')","memberSiteUrl(env)")
              t=t.replace("doingPageUrl(env,'about.html')","applicationSiteUrl(env)")
              t=t.replace("adminUrl:`admin.html?tenant=${encodeURIComponent(tid)}`","adminUrl:new URL('me/#operations',doingSiteUrl(env)).toString()")
              t=t.replace("admin_url:base+'admin.html?tenant='+encodeURIComponent(tenantId)","admin_url:new URL('me/#operations',base).toString()")
              t=t.replace("const fallback=mode==='platform'?platformSiteUrl(env):mode==='organizer_signup'?doingSiteUrl(env)+'#apply':doingSiteUrl(env);","const fallback=mode==='platform'?platformSiteUrl(env):mode==='organizer_signup'?applicationSiteUrl(env):memberSiteUrl(env);")
              t=t.replace("const memberTarget=safeDoingReturnUrl(env,statePayload&&statePayload.return_url),applicationTarget=new URL(doingSiteUrl(env)),adminTarget=new URL(adminLoginSiteUrl(env)),platformTarget=new URL(platformSiteUrl(env));applicationTarget.hash='apply';","const memberTarget=safeDoingReturnUrl(env,statePayload&&statePayload.return_url),applicationTarget=new URL(applicationSiteUrl(env)),adminTarget=new URL(adminLoginSiteUrl(env)),platformTarget=new URL(platformSiteUrl(env));")
              t=t.replace('<p>請回到申請頁重新填寫並使用原 Google 帳號完成送出：</p><p><a href="${page}#apply">前往 DOING 營運帳號申請</a></p>','<p>請回到申請頁補充資料：</p><p><a href="${page}">前往 DOING 營運帳號申請</a></p>')
              p.write_text(t,encoding='utf-8')
          if Path('worker.js').read_bytes()!=Path('worker.txt').read_bytes(): raise SystemExit('worker.js and worker.txt diverged')

          # Update auth regression to canonical /me/ fallback.
          p=Path('scripts/validate-market-auth-role-separation.mjs');t=p.read_text(encoding='utf-8')
          t=t.replace("const fallback=mode==='platform'?platformSiteUrl(env):mode==='organizer_signup'?doingSiteUrl(env)+'#apply':doingSiteUrl(env);","const fallback=mode==='platform'?platformSiteUrl(env):mode==='organizer_signup'?applicationSiteUrl(env):memberSiteUrl(env);")
          p.write_text(t,encoding='utf-8')
          p=Path('scripts/validate-market-member-oauth-primary-return.mjs');t=p.read_text(encoding='utf-8')
          t=t.replace("assert.equal(fallback.payload.return_url,'https://doing.2b-love.com/');","assert.equal(fallback.payload.return_url,'https://doing.2b-love.com/me/');")
          t=t.replace("assert.equal(fallback.location.pathname,'/');","assert.equal(fallback.location.pathname,'/me/');")
          t=t.replace("defaultDoingSite:'https://doing.2b-love.com/'","defaultMemberSite:'https://doing.2b-love.com/me/'")
          p.write_text(t,encoding='utf-8')

          # Safe Production validates canonical source files, never retired pages.
          p=Path('.github/workflows/doing-production.yml');t=p.read_text(encoding='utf-8')
          t=t.replace("for(const f of ['index.html','register.html','member.html','member-panel.html','admin.html','onsite.html','platform.html','about.html','photo.html','operations-center.html','consignment.html']){","for(const f of ['doing-2.html','smart-application.html','register.html','member-panel.html','workspace.html','market-public.html','market-center.html','market-session.html','project-center.html','booking-2-center.html','guide-center.html','world-tree.html']){")
          start=t.index('      - name: Verify unified visual shell and private long press')
          end=t.index('      - name: Verify member and tenant safety invariants',start)
          block="""      - name: Verify unified entry and canonical source pages
        run: |
          for page in doing-2.html smart-application.html member-panel.html workspace.html market-public.html market-center.html market-session.html project-center.html booking-2-center.html guide-center.html register.html world-tree.html; do test -f \"$page\"; done
          for retired in index.html member.html admin.html onsite.html platform.html operations-center.html photo.html consignment.html about.html booking-center.html; do test ! -e \"$retired\"; done
          grep -q 'd2-home-account-actions' doing-2-home-v11.js
          grep -q \"new URL('/me/',location.origin)\" doing-member-return-direct.js
          grep -q 'createMemberWorkspaceAdminSession' doing-global-entry.js
          grep -q \"new URL('/workspace/',location.origin)\" doing-global-entry.js
          ! grep -q 'mode=admin' register.html
          ! grep -q 'admin.html' register.html
          grep -q 'platform_super_admin' worker.js
"""
          t=t[:start]+block+t[end:]
          t=t.replace('          grep -q "member_token" index.html\n          grep -q "member_token" register.html','          grep -q "member_token" doing-member-return-direct.js\n          grep -q "member_token" register.html')
          p.write_text(t,encoding='utf-8')
      - name: Validate canonical routes
        run: |
          node --check worker.js
          cmp worker.js worker.txt
          node --check doing-member-return-direct.js
          node --check doing-global-entry.js
          node --check doing-home-refresh.js
          node --check doing-home-refresh-core.js
          ! grep -q 'mode=admin' register.html
          ! grep -q 'admin.html' register.html
          ! grep -q 'member.html' member-panel.html
          ! grep -q 'admin.html' member-panel.html
          ! grep -q 'operations-center.html' member-panel.html
          ! grep -q 'about.html#apply' member-panel.html
          node scripts/validate-market-auth-role-separation.mjs
          node scripts/validate-market-member-oauth-primary-return.mjs
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-v19.mjs
          node scripts/validate-unified-entry.mjs
      - name: Restore normal Site workflow and commit
        run: |
          git checkout HEAD^ -- .github/workflows/doing-2-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: canonicalize all public login and return routes'
          git push origin HEAD:${{ github.head_ref }}
