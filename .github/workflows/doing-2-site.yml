name: DOING Route Shell Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/doing-2-site.yml'
      - '.github/workflows/doing-market-2-validation.yml'
      - '.github/workflows/booking-center-validation.yml'
      - 'DOING_UI_REBUILD_CHECKPOINT_20260825.md'
  push:
    branches: [main]
    paths:
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/doing-2-site.yml'
      - '.github/workflows/doing-market-2-validation.yml'
      - '.github/workflows/booking-center-validation.yml'
      - 'DOING_UI_REBUILD_CHECKPOINT_20260825.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doing-route-shell-site
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: doing-2
  CF_CUSTOM_DOMAIN: doing.2b-love.com

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build route-only clean slate site
        run: node scripts/build-doing-2-site.mjs
      - name: Validate preserved formal routes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            market/index.html
            market/public/index.html
            market/session/index.html
            project/index.html
            booking/index.html
            guide/index.html
            workspace/index.html
            me/index.html
            apply/index.html
            register/index.html
            world-tree/index.html
          )
          for f in "${files[@]}"; do
            test -s ".doing-2-site/$f"
            grep -q 'data-doing-ui-state="rebuild-shell"' ".doing-2-site/$f"
          done
          test -s .doing-2-site/_headers
          test -s .doing-2-site/_redirects
          html_count="$(find .doing-2-site -type f -name '*.html' | wc -l | tr -d ' ')"
          test "$html_count" = "12"
      - name: Prove old operation UI is not deployed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -Ei '<script|<form|<button|tobeloved-api|supabase\.co|localStorage|sessionStorage|2bl-v7' .doing-2-site --include='*.html'
          test ! -e .doing-2-site/doing-system.css
          test ! -e .doing-2-site/doing-global-entry.js
          test ! -e .doing-2-site/market-center.html
          test ! -e .doing-2-site/member-panel.html
          test ! -e .doing-2-site/workspace.html
          test ! -e .doing-2-site/register.html
      - name: Diff quality
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}...HEAD

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-validate
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Build route-only clean slate site
        run: node scripts/build-doing-2-site.mjs
      - name: Ensure Cloudflare Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${CF_PAGES_PROJECT}")"
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_PAGES_PROJECT}\",\"production_branch\":\"main\"}" "${base}" > project-create.json
          elif [ "$status" != "200" ]; then
            cat project.json
            exit 1
          fi
      - name: Deploy DOING route shells
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .doing-2-site --project-name doing-2 --branch main --commit-dirty=true
      - name: Ensure doing.2b-love.com is attached
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PAGES_PROJECT}/domains"
          code="$(curl -sS -o domain.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_CUSTOM_DOMAIN}\"}" "$url")"
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then exit 0; fi
          if jq -e '.errors[]? | select(.code==8000018)' domain.json >/dev/null 2>&1; then echo "Custom domain already attached; continuing."; exit 0; fi
          cat domain.json
          exit 1
      - name: Verify deployment completed
        run: echo "DOING route-only site deployed for $GITHUB_SHA"
