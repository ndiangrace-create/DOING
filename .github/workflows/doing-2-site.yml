name: DOING 2.0 Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'doing-2.html'
      - 'doing-2-shell.js'
      - 'doing-2-home-v11.css'
      - 'doing-2-home-v11.js'
      - 'doing-home-logo-slot-v12.css'
      - 'doing-home-logo-slot-v12.js'
      - 'doing-candy-theme.css'
      - 'doing-member-return-direct.js'
      - 'doing-global-entry.js'
      - 'doing-workspace-product-router.js'
      - 'doing-application-contract-v12.js'
      - 'doing-formal-application-bridge.js'
      - 'doing-smart-activation-v5.js'
      - 'market-center.html'
      - 'market-public.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'modules/booking/booking-center.html'
      - 'guide-center.html'
      - 'smart-application.html'
      - 'workspace.html'
      - 'member-panel.html'
      - 'register.html'
      - 'world-tree.html'
      - 'doing-world-tree-current.json'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/postprocess-market-v19.mjs'
      - 'scripts/validate-member-panel-return.mjs'
      - 'scripts/validate-application-login-flow.mjs'
      - 'scripts/validate-fixed-product-application.mjs'
      - 'scripts/validate-formal-application-closure.mjs'
      - 'scripts/validate-unified-entry.mjs'
      - 'scripts/validate-booking-center.mjs'
      - 'scripts/validate-doing-v11-home-e2e.mjs'
      - 'scripts/validate-home-real-ui-v11.mjs'
      - 'scripts/validate-v12-closure.mjs'
      - 'scripts/validate-doing2-short-route-cleanup.mjs'
      - 'scripts/validate-world-tree-mindmap.mjs'
      - '.github/workflows/doing-2-site.yml'
  push:
    branches: [main]
    paths:
      - 'doing-2.html'
      - 'doing-2-shell.js'
      - 'doing-2-home-v11.css'
      - 'doing-2-home-v11.js'
      - 'doing-home-logo-slot-v12.css'
      - 'doing-home-logo-slot-v12.js'
      - 'doing-candy-theme.css'
      - 'doing-member-return-direct.js'
      - 'doing-global-entry.js'
      - 'doing-workspace-product-router.js'
      - 'doing-application-contract-v12.js'
      - 'doing-formal-application-bridge.js'
      - 'doing-smart-activation-v5.js'
      - 'market-center.html'
      - 'market-public.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'modules/booking/booking-center.html'
      - 'guide-center.html'
      - 'smart-application.html'
      - 'workspace.html'
      - 'member-panel.html'
      - 'register.html'
      - 'world-tree.html'
      - 'doing-world-tree-current.json'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/postprocess-market-v19.mjs'
      - '.github/workflows/doing-2-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doing-2-site
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: doing-2
  CF_CUSTOM_DOMAIN: doing.2b-love.com

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate member panel LINE return
        run: node scripts/validate-member-panel-return.mjs
      - name: Validate application login workspace journey
        run: node scripts/validate-application-login-flow.mjs
      - name: Validate single-page application
        run: |
          node scripts/validate-fixed-product-application.mjs
          node scripts/validate-formal-application-closure.mjs
      - name: Validate homepage contracts
        run: |
          node scripts/validate-doing-v11-home-e2e.mjs
          node scripts/validate-home-real-ui-v11.mjs
          node scripts/validate-v12-closure.mjs
      - name: Validate short hierarchy and world tree
        run: |
          node scripts/validate-doing2-short-route-cleanup.mjs
          node scripts/validate-world-tree-mindmap.mjs
      - name: Build canonical site
        run: |
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-v19.mjs
      - name: Validate unified entry and preserved booking capability
        run: |
          node scripts/validate-unified-entry.mjs
          node scripts/validate-booking-center.mjs
      - name: Validate only canonical short routes are published
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html market/index.html market/public/index.html market/session/index.html project/index.html booking/index.html guide/index.html workspace/index.html me/index.html apply/index.html register/index.html world-tree/index.html; do
            test -f ".doing-2-site/$f"
          done
          test -f .doing-2-site/_redirects
          test -f .doing-2-site/doing-world-tree-current.json
          test -f .doing-2-site/doing-formal-application-bridge.js
          test -f .doing-2-site/doing-global-entry.js
          test -f .doing-2-site/doing-member-return-direct.js
          for f in doing-2.html market-center.html market-public.html market-session.html project-center.html booking-2-center.html guide-center.html workspace.html member.html member-panel.html smart-application.html register.html admin.html onsite.html platform.html operations-center.html photo.html consignment.html about.html booking-center.html; do
            test ! -e ".doing-2-site/$f"
          done
          for d in admin onsite platform operations photo consignment about member; do test ! -e ".doing-2-site/$d"; done
          ! grep -R -q '2bl-v7' .doing-2-site
          test ! -d legacy-pages

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-validate
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Build site
        run: |
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-v19.mjs
      - name: Ensure Cloudflare Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${CF_PAGES_PROJECT}")"
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_PAGES_PROJECT}\",\"production_branch\":\"main\"}" "${base}" > project-create.json
          elif [ "$status" != "200" ]; then
            cat project.json; exit 1
          fi
      - name: Deploy DOING 2.0 site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .doing-2-site --project-name doing-2 --branch main --commit-dirty=true
      - name: Ensure doing.2b-love.com is attached
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PAGES_PROJECT}/domains"
          code="$(curl -sS -o domain.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_CUSTOM_DOMAIN}\"}" "$url")"
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then exit 0; fi
          if jq -e '.errors[]? | select(.code==8000018)' domain.json >/dev/null 2>&1; then echo "Custom domain already attached; continuing."; exit 0; fi
          cat domain.json
          exit 1
      - name: Verify deployment completed
        run: echo "DOING Pages deployed for $GITHUB_SHA"
