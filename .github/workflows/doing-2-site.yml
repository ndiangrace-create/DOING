name: DOING Kawaii Home

on:
  pull_request:
    branches: [main]
    paths:
      - 'home-current.html'
      - 'member-current.html'
      - 'apply-current.html'
      - 'workspace-current.html'
      - 'market-current.html'
      - 'market-session-current.html'
      - 'project-current.html'
      - 'booking-current.html'
      - 'register.html'
      - 'doing-kawaii-current.css'
      - 'doing-market-current.css'
      - 'doing-market-entry-current.js'
      - 'doing-market-public-2bl.js'
      - 'doing-member-workspace-fix.js'
      - 'doing-system.css'
      - 'doing-home-refresh.css'
      - 'doing-home-refresh.js'
      - 'doing-design-tokens.css'
      - 'doing-pastel-pages.css'
      - 'doing-attribution.js'
      - 'doing-home-v4.css'
      - 'doing-home-current.js'
      - 'doing-logo.png'
      - 'doing-logo-current.webp'
      - '.assets/doing-logo-new/**'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/e2e-home-kawaii.mjs'
      - 'scripts/e2e-apply-login-current.mjs'
      - 'scripts/e2e-market-current.mjs'
      - '.github/workflows/doing-2-site.yml'
  push:
    branches: [main]
    paths:
      - 'home-current.html'
      - 'member-current.html'
      - 'apply-current.html'
      - 'workspace-current.html'
      - 'market-current.html'
      - 'market-session-current.html'
      - 'project-current.html'
      - 'booking-current.html'
      - 'register.html'
      - 'doing-kawaii-current.css'
      - 'doing-market-current.css'
      - 'doing-market-entry-current.js'
      - 'doing-market-public-2bl.js'
      - 'doing-member-workspace-fix.js'
      - 'doing-system.css'
      - 'doing-home-refresh.css'
      - 'doing-home-refresh.js'
      - 'doing-design-tokens.css'
      - 'doing-pastel-pages.css'
      - 'doing-attribution.js'
      - 'doing-home-v4.css'
      - 'doing-home-current.js'
      - 'doing-logo.png'
      - 'doing-logo-current.webp'
      - '.assets/doing-logo-new/**'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/e2e-home-kawaii.mjs'
      - 'scripts/e2e-apply-login-current.mjs'
      - 'scripts/e2e-market-current.mjs'
      - '.github/workflows/doing-2-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doing-kawaii-home
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: doing-2
  CF_CUSTOM_DOMAIN: doing.2b-love.com

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse source scripts
        run: |
          node --check doing-home-current.js
          node --check doing-market-entry-current.js
          node --check doing-market-public-2bl.js
          node --check doing-member-workspace-fix.js
          node --check doing-home-refresh.js
          node --check scripts/build-doing-2-site.mjs
          node --check scripts/e2e-home-kawaii.mjs
          node --check scripts/e2e-apply-login-current.mjs
          node --check scripts/e2e-market-current.mjs
      - name: Build CURRENT DOING site
        run: node scripts/build-doing-2-site.mjs
      - name: Validate route and SSOT boundaries
        shell: bash
        run: |
          set -euo pipefail
          files=(index.html market/index.html market/public/index.html market/session/index.html project/index.html booking/index.html guide/index.html workspace/index.html me/index.html apply/index.html register/index.html world-tree/index.html)
          for f in "${files[@]}"; do test -s ".doing-2-site/$f"; done
          for f in guide/index.html world-tree/index.html; do grep -q 'data-doing-ui-state="rebuild-shell"' ".doing-2-site/$f"; done
          for f in market/index.html market/public/index.html market/session/index.html register/index.html; do ! grep -q 'data-doing-ui-state="rebuild-shell"' ".doing-2-site/$f"; done
          for f in market/index.html market/session/index.html project/index.html booking/index.html workspace/index.html me/index.html apply/index.html; do grep -q 'doing-kawaii-current.css' ".doing-2-site/$f"; done
          grep -q 'doing-market-current.css' .doing-2-site/market/index.html
          grep -q 'doing-market-current.css' .doing-2-site/market/public/index.html
          grep -q 'doing-market-current.css' .doing-2-site/market/session/index.html
          grep -q '<base href="/">' .doing-2-site/market/public/index.html
          grep -q '<base href="/">' .doing-2-site/register/index.html
          grep -q 'getSessionsAdmin' .doing-2-site/market/index.html
          grep -q 'getTodos' .doing-2-site/market/index.html
          grep -q 'getMembers' .doing-2-site/market/index.html
          grep -q 'doing-market-entry-current.js' .doing-2-site/market/index.html
          grep -q 'frontBootstrap' .doing-2-site/market/public/index.html
          grep -q 'publicDiscovery' .doing-2-site/market/public/index.html
          grep -q 'doingMarketGlobalBootstrap' .doing-2-site/market/public/index.html
          grep -q 'openRegistration' .doing-2-site/market/public/index.html
          grep -q 'market-2bl-front' .doing-2-site/market/public/index.html
          grep -q 'doing-market-public-2bl.js' .doing-2-site/market/public/index.html
          grep -q 'bottom-nav' .doing-2-site/market/public/index.html
          ! grep -q 'registerUrl(' .doing-2-site/market/public/index.html
          ! grep -q 'href="/register/' .doing-2-site/market/public/index.html
          grep -q 'adminSeatBoard' .doing-2-site/market/session/index.html
          grep -q 'sendNotify' .doing-2-site/market/session/index.html
          grep -q 'confirmRefund' .doing-2-site/market/session/index.html
          grep -q 'data-system="market"' .doing-2-site/apply/index.html
          grep -q 'data-system="project"' .doing-2-site/apply/index.html
          grep -q 'data-system="booking"' .doing-2-site/apply/index.html
          grep -q 'createOrganizerApplicationDraft' .doing-2-site/apply/index.html
          grep -q 'auth/line/start' .doing-2-site/apply/index.html
          grep -q 'doing-home-v4.css' .doing-2-site/index.html
          grep -q 'doing-logo-current.webp' .doing-2-site/index.html
          for f in doing-kawaii-current.css doing-market-current.css doing-market-entry-current.js doing-market-public-2bl.js doing-member-workspace-fix.js doing-system.css doing-home-refresh.css doing-home-refresh.js doing-design-tokens.css doing-pastel-pages.css doing-attribution.js doing-home-v4.css doing-home-current.js doing-logo.png doing-logo-current.webp; do test -s ".doing-2-site/$f"; done
          grep -q '斜槓人生小幫手' .doing-2-site/index.html
          grep -q '/apply/?system=market' .doing-2-site/index.html
          grep -q '/apply/?system=project' .doing-2-site/index.html
          grep -q '/apply/?system=booking' .doing-2-site/index.html
          ! grep -q 'doingSearch' .doing-2-site/index.html
          ! grep -q 'jelly-search' .doing-2-site/index.html
          ! grep -R -q '2bl-v7' .doing-2-site
          ! grep -R -q 'supabase.co' .doing-2-site --include='*.html'
          grep -q 'auth/line/start' .doing-2-site/me/index.html
          grep -q 'getPlatformMemberProfile' .doing-2-site/me/index.html
          grep -q 'createMemberWorkspaceAdminSession' .doing-2-site/me/index.html
          grep -q 'doing-member-workspace-fix.js' .doing-2-site/me/index.html
          grep -q 'getTenantModuleProfile' .doing-2-site/workspace/index.html
          grep -q '市集活動系統' .doing-2-site/workspace/index.html
          grep -q '室內設計系統' .doing-2-site/workspace/index.html
          grep -q '美類預約系統' .doing-2-site/workspace/index.html
      - name: Install real-browser E2E
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real-browser application + login + Market E2E
        shell: bash
        run: |
          python3 -m http.server 4173 --directory .doing-2-site >/tmp/doing-home-e2e.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          E2E_BASE=http://127.0.0.1:4173 node scripts/e2e-home-kawaii.mjs
          E2E_BASE=http://127.0.0.1:4173 node scripts/e2e-apply-login-current.mjs
          E2E_BASE=http://127.0.0.1:4173 node scripts/e2e-market-current.mjs
      - name: Diff quality
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}...HEAD

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-validate
    runs-on: ubuntu-latest
    environment: doing-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Build CURRENT DOING site
        run: node scripts/build-doing-2-site.mjs
      - name: Ensure Cloudflare Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${CF_PAGES_PROJECT}")"
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_PAGES_PROJECT}\",\"production_branch\":\"main\"}" "${base}" > project-create.json
          elif [ "$status" != "200" ]; then
            cat project.json
            exit 1
          fi
      - name: Deploy DOING CURRENT site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .doing-2-site --project-name doing-2 --branch main --commit-dirty=true
      - name: Ensure doing.2b-love.com is attached
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PAGES_PROJECT}/domains"
          code="$(curl -sS -o domain.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${CF_CUSTOM_DOMAIN}\"}" "$url")"
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then exit 0; fi
          if jq -e '.errors[]? | select(.code==8000018)' domain.json >/dev/null 2>&1; then exit 0; fi
          cat domain.json
          exit 1
      - name: Verify deployment completed
        run: echo "DOING CURRENT site deployed for $GITHUB_SHA"
