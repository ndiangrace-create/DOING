name: Release Home LINE Atomic Patch
on:
  push:
    branches: [release/home-line-ready-20260825]
    paths:
      - 'worker.js'
      - 'worker.txt'
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/release-home-line-atomic.yml'
      - 'home-current.html'
      - 'doing-home-v4.css'
      - 'doing-logo-current.webp'
      - 'scripts/e2e-home-kawaii.mjs'
      - 'scripts/validate-market-member-oauth-primary-return.mjs'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[home-line-atomic-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/home-line-ready-20260825
          fetch-depth: 0
      - name: Apply exact allowed patch only
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['worker.js','worker.txt']){
            let s=fs.readFileSync(file,'utf8');
            const needle="initial_amr_display:'lineqr',";
            const count=s.split(needle).length-1;
            if(count!==1)throw new Error(`${file}: expected one forced QR token, got ${count}`);
            s=s.replace(needle,'');
            fs.writeFileSync(file,s);
          }
          if(fs.readFileSync('worker.js','utf8')!==fs.readFileSync('worker.txt','utf8'))throw new Error('worker.js/worker.txt drift');
          let b=fs.readFileSync('scripts/build-doing-2-site.mjs','utf8');
          const assetOld="for(const asset of ['doing-kawaii-current.css','doing-home-v4.css','doing-home-current.js']){";
          const assetNew="for(const asset of ['doing-kawaii-current.css','doing-home-v4.css','doing-home-current.js','doing-logo-current.webp']){";
          if((b.split(assetOld).length-1)!==1)throw new Error('build asset anchor mismatch');
          b=b.replace(assetOld,assetNew);
          const checkOld="  if(!html.includes('doing-kawaii-current.css'))throw new Error(`kawaii visual missing: ${route}`);";
          const checkNew="  if(route==='/'&&!html.includes('doing-home-v4.css'))throw new Error(`homepage visual missing: ${route}`);\n  if(route!=='/'&&!html.includes('doing-kawaii-current.css'))throw new Error(`kawaii visual missing: ${route}`);";
          if((b.split(checkOld).length-1)!==1)throw new Error('build visual anchor mismatch');
          b=b.replace(checkOld,checkNew);
          fs.writeFileSync('scripts/build-doing-2-site.mjs',b);
          NODE
          rm .github/workflows/release-home-line-atomic.yml
          git diff --check
          node --check scripts/build-doing-2-site.mjs
          node --check scripts/e2e-home-kawaii.mjs
          node --check scripts/validate-market-member-oauth-primary-return.mjs
          cmp worker.js worker.txt
      - name: Commit atomic patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js worker.txt scripts/build-doing-2-site.mjs .github/workflows/release-home-line-atomic.yml
          git commit -m 'Finalize homepage and LINE SSO [home-line-atomic-patched]'
          git push origin HEAD:release/home-line-ready-20260825
