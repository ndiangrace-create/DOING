name: Restore original DOING Canva navigation

on:
  push:
    paths:
      - '.github/workflows/fix-doing-original-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace custom nav styling with original Canva button crops
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Replace the generated pill-frame styling only. Keep HTML handlers/IDs unchanged.
          pat=r'\.doing-global-fixed-nav\{[^}]*\}\n\.doing-global-fixed-nav\.hidden\{[^}]*\}\.g-pill\{[^}]*\}\.g-pill\.purple\{[^}]*\}\.g-pill\.green\{[^}]*\}\.g-pill\.yellow\{[^}]*\}\.g-pill\.pink\{[^}]*\}\.g-pill\.blue\{[^}]*\}'
          repl='''.doing-global-fixed-nav{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;align-items:center;justify-content:center;padding:0;background:transparent!important;backdrop-filter:none!important;box-shadow:none!important;white-space:nowrap;max-width:calc(100vw - 18px)}
.doing-global-fixed-nav.hidden{display:none!important}
.g-pill{flex:0 0 auto;width:170px;height:56px;min-height:56px;padding:0!important;border:0!important;border-radius:999px!important;color:transparent!important;text-indent:-9999px;overflow:hidden;background-image:url('DOING-home.webp')!important;background-repeat:no-repeat!important;background-size:1366px 2304px!important;box-shadow:none!important;text-decoration:none;display:block;cursor:pointer}
.g-pill:nth-child(1){background-position:-445px -31px!important}
.g-pill:nth-child(2){background-position:-625px -31px!important}
.g-pill:nth-child(3){background-position:-804px -31px!important}
.g-pill:nth-child(4){background-position:-983px -31px!important}
.g-pill:nth-child(5){background-position:-1163px -31px!important}
.g-pill.purple,.g-pill.green,.g-pill.yellow,.g-pill.pink,.g-pill.blue{background-color:transparent!important}'''
          ns,n=re.subn(pat,repl,s,count=1)
          if n!=1:
              raise SystemExit(f'nav style block match count={n}')
          s=ns

          # Mobile: keep original button artwork at readable size and allow horizontal scrolling.
          old='@media(max-width:760px){.doing-global-fixed-nav{left:8px;right:8px;transform:none;top:7px;overflow-x:auto;justify-content:flex-start;border-radius:18px;padding:6px;scrollbar-width:none}.doing-global-fixed-nav::-webkit-scrollbar{display:none}.g-pill{font-size:16px!important;padding:8px 13px;min-height:44px;flex:0 0 auto}'
          new='@media(max-width:760px){.doing-global-fixed-nav{left:8px;right:8px;transform:none;top:7px;overflow-x:auto;justify-content:flex-start;max-width:none;padding:0 0 4px;background:transparent!important;scrollbar-width:none}.doing-global-fixed-nav::-webkit-scrollbar{display:none}.g-pill{width:170px;height:56px;min-height:56px;flex:0 0 170px;padding:0!important}'
          if old not in s:
              raise SystemExit('mobile nav marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "background-image:url('DOING-home.webp')" index.html
          grep -q 'g-pill:nth-child(5)' index.html
          ! grep -q 'background:#e4cff4' index.html
      - name: Commit
        run: |
          git config user.name 'DOING Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: use original Canva artwork for fixed navigation'
          git push
