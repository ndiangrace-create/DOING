name: Fix DOING homepage artwork

on:
  push:
    paths:
      - '.github/workflows/fix-doing-home-webp.yml'

permissions:
  contents: write

jobs:
  fix-home-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace SVG reference with WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'DOING-home.svg'
          new = 'DOING-home.webp'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 {old} reference, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Verify replacement
        run: |
          grep -q 'DOING-home.webp' index.html
          ! grep -q 'DOING-home.svg' index.html
      - name: Commit change
        run: |
          git config user.name 'DOING Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load DOING homepage webp artwork'
          git push
