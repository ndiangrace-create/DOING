name: DOING Market Handoff Package TEMP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build handoff directory
        shell: bash
        run: |
          set -euo pipefail
          root="DOING_MARKET_HANDOFF_READY_20260825"
          mkdir -p "$root/W" "$root/G/scripts" "$root/S" "$root/2BL_REFERENCE" "$root/驗證結果"
          cp worker.txt "$root/W/worker.txt"
          cp apply-current.html "$root/G/apply-current.html"
          cp scripts/e2e-apply-login-current.mjs "$root/G/scripts/e2e-apply-login-current.mjs"
          cp DOING_OPERATION_PATH_TREE_CURRENT.md "$root/G/DOING_OPERATION_PATH_TREE_CURRENT.md"
          cp DOING_UI_ROUTE_SSOT_CURRENT.json "$root/G/DOING_UI_ROUTE_SSOT_CURRENT.json"
          cp DOING_MARKET_ROUTE_NAVIGATION_CONTRACT_CURRENT.md "$root/G/DOING_MARKET_ROUTE_NAVIGATION_CONTRACT_CURRENT.md"
          cp DOING_MARKET_2BL_INTERACTION_REFERENCE_CURRENT.md "$root/G/DOING_MARKET_2BL_INTERACTION_REFERENCE_CURRENT.md"
          cp DOING_MARKET_HANDOFF_CURRENT.md "$root/HANDOFF_CURRENT.md"
          cp DOING_MARKET_交接語法_CURRENT.txt "$root/交接語法.txt"
          cp DOING_MARKET_CHANGELOG_CURRENT.md "$root/CHANGELOG.md"
          cp DOING_MARKET_2BL_INTERACTION_REFERENCE_CURRENT.md "$root/2BL_REFERENCE/DOING_MARKET_2BL_INTERACTION_REFERENCE_CURRENT.md"
          cat > "$root/S/S_NO_CHANGE.txt" <<'EOF'
          S：無變更。
          本輪沒有 Supabase schema、資料表、欄位、trigger、RLS 或正式營運資料變更。
          系統帳號／網址代號目前保存於既有 application JSON；不新增第二套 tenant ID 或資料來源。
          EOF
          cat > "$root/驗證結果/CI_CURRENT.md" <<'EOF'
          # CI / E2E 驗證結果
          - PR：#182（Draft，未合併）
          - DOING Kawaii Home：PASS
          - DOING Market Auth Role Separation：PASS
          - Chromium：390×844、1440×1000 PASS
          - 系統帳號欄位／網址預覽／保留字／application tenantSlug & routeContract：PASS
          - Worker change：0
          - DB schema/business data change：0
          - 2BL change：0
          - Production deploy：0；deploy job skipped
          EOF
          python3 - <<'PY'
          import hashlib, pathlib, json
          root=pathlib.Path('DOING_MARKET_HANDOFF_READY_20260825')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes()
              rows.append({'file':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'MANIFEST_SHA256.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload exact checkout package
        uses: actions/upload-artifact@v4
        with:
          name: DOING_MARKET_HANDOFF_READY_20260825
          path: DOING_MARKET_HANDOFF_READY_20260825
          if-no-files-found: error
          retention-days: 7
