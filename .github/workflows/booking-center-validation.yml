name: Booking Route Preservation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/booking-center-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-booking-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build clean slate route shells
        run: node scripts/build-doing-2-site.mjs
      - name: Validate booking URL is preserved without old operation UI
        shell: bash
        run: |
          set -euo pipefail
          test -s .doing-2-site/booking/index.html
          grep -q 'data-doing-ui-state="rebuild-shell"' .doing-2-site/booking/index.html
          ! grep -Ei '<script|<form|<button|tobeloved-api|supabase\.co|localStorage|sessionStorage|2bl-v7' .doing-2-site/booking/index.html
          test ! -e .doing-2-site/booking-2-center.html
          test ! -e .doing-2-site/booking-center.html
      - name: Diff quality
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
