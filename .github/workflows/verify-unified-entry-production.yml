name: Verify Unified Entry Production
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-unified-entry-production.yml'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Show failed main Pages job
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: 15dad25b52ae8b57c809ac3cacf59f893f577455
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&event=push&per_page=20"
          runs="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          run_id="$(jq -r '[.workflow_runs[]|select(.name=="DOING 2.0 Site")][0].id // empty' <<<"$runs")"
          echo "site_run_id=$run_id"
          test -n "$run_id"
          jobs="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          jq -r '.jobs[] | "JOB\t"+.name+"\t"+(.conclusion//""), (.steps[]? | "STEP\t"+.name+"\t"+(.conclusion//""))' <<<"$jobs"
          failed_job="$(jq -r '[.jobs[]|select(.conclusion=="failure")][0].id // empty' <<<"$jobs")"
          test -n "$failed_job"
          echo "failed_job_id=$failed_job"
