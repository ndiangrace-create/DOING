name: Verify Unified Entry Production
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-unified-entry-production.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check main deployment runs and live pages
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: 15dad25b52ae8b57c809ac3cacf59f893f577455
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&event=push&per_page=20"
          runs="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          jq -r '.workflow_runs[] | [.name,.status,.conclusion,.run_number] | @tsv' <<<"$runs"
          site="$(jq -r '[.workflow_runs[]|select(.name=="DOING 2.0 Site")][0].conclusion // empty' <<<"$runs")"
          safe="$(jq -r '[.workflow_runs[]|select(.name=="DOING Safe Production")][0].conclusion // empty' <<<"$runs")"
          echo "main_site=$site main_safe=$safe"
          base='https://doing.2b-love.com'; core='https://tobeloved-api.ndiangrace.workers.dev'
          booking="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 20 "$base/booking/?verify=deploy")"
          if grep -q 'getOperationUnitsAdmin' <<<"$booking"; then echo 'booking=full'; else echo 'booking=old'; fi
          grep -o '<title>[^<]*' <<<"$booking" | head -1 || true
          home_js="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/doing-2-home-v11.js?verify=deploy")"
          member_js="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/doing-member-return-direct.js?verify=deploy")"
          global_js="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/doing-global-entry.js?verify=deploy")"
          apply_js="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/doing-smart-activation-v5.js?verify=deploy")"
          grep -q '申請 DOING' <<<"$home_js"; grep -q 'd2HomeLogin' <<<"$home_js"; grep -q '重新使用 LINE 登入' <<<"$member_js"; grep -q 'createMemberWorkspaceAdminSession' <<<"$global_js"; grep -q 'LINE 驗證並開通' <<<"$apply_js"
          for path in / /apply/ /me/ /workspace/ /booking/ /market/public/; do code="$(curl -sS -o /dev/null -w '%{http_code}' "$base$path")"; echo "$path=$code"; test "$code" = 200; done
          core_code="$(curl -sS -o /tmp/core.txt -w '%{http_code}' "$core/?action=publicDiscovery")"; echo "core=$core_code"; test "$core_code" = 200
          test "$site" = success
          test "$safe" = success
          grep -q 'getOperationUnitsAdmin' <<<"$booking"
          echo 'production unified entry PASS'
