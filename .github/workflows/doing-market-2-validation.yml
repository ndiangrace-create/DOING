name: DOING Market Route Preservation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-doing-2-site.mjs'
      - '.github/workflows/doing-market-2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-market-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build clean slate route shells
        run: node scripts/build-doing-2-site.mjs
      - name: Validate Market URLs are preserved without old operation UI
        shell: bash
        run: |
          set -euo pipefail
          for f in market/index.html market/public/index.html market/session/index.html; do
            test -s ".doing-2-site/$f"
            grep -q 'data-doing-ui-state="rebuild-shell"' ".doing-2-site/$f"
            ! grep -Ei '<script|<form|<button|tobeloved-api|supabase\.co|localStorage|sessionStorage|2bl-v7' ".doing-2-site/$f"
          done
          test ! -e .doing-2-site/market-center.html
          test ! -e .doing-2-site/market-public.html
          test ! -e .doing-2-site/market-session.html
      - name: Diff quality
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
