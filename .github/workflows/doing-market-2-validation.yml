name: DOING Market 2.0 Validation
on:
  pull_request:
    paths:
      - 'doing-2.html'
      - 'doing-2-shell.css'
      - 'doing-2-shell.js'
      - 'market-public.html'
      - 'market-center.html'
      - 'market-session.html'
      - 'project-center.html'
      - 'booking-2-center.html'
      - 'guide-center.html'
      - 'DOING_2.0_WORLD_TREE_V1_BASELINE_20260822.md'
      - 'DOING_2.0_WORLD_TREE_V2_PRODUCT_SPLIT_20260822.md'
      - 'DOING_2.0_WORLD_TREE_V3_MARKET_EXECUTION_20260822.md'
      - 'DOING_2.0_WORLD_TREE_V4_MARKET_OPERATIONS_20260822.md'
      - 'DOING_2.0_WORLD_TREE_V5_MARKET_PUBLIC_20260822.md'
      - 'DOING_2.0_WORLD_TREE_V7_2BL_UX_SHELL_20260822.md'
      - 'DOING_2.0_PRODUCT_ROADMAP_FIXED_20260822.md'
      - 'DOING_2.0_CHANGELOG.md'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/validate-doing-market-2.mjs'
      - 'scripts/validate-doing-2-product-pages.mjs'
      - 'scripts/validate-doing-2-shell.mjs'
      - '.github/workflows/doing-market-2-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate DOING Market 2.0 world tree and UX shell
        run: node scripts/validate-doing-market-2.mjs
      - name: Validate DOING 2.0 independent product pages
        run: node scripts/validate-doing-2-product-pages.mjs
      - name: Validate elder-friendly 2BL UX shell
        run: node scripts/validate-doing-2-shell.mjs
      - name: Build DOING 2.0 site
        run: node scripts/build-doing-2-site.mjs
      - name: Diff quality
        run: git diff --check HEAD^ HEAD || true
