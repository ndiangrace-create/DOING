name: DOING Market Entry Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'market-current.html'
      - 'market-session-current.html'
      - 'doing-market-current.css'
      - 'doing-market-entry-current.js'
      - 'doing-market-public-2bl.js'
      - 'doing-market-topic-filter.js'
      - 'doing-market-complete-session.js'
      - 'doing-member-workspace-fix.js'
      - 'doing-kawaii-current.css'
      - 'doing-home-refresh.js'
      - 'register.html'
      - 'scripts/build-doing-2-site.mjs'
      - 'scripts/postprocess-market-complete-session.mjs'
      - 'scripts/e2e-market-current.mjs'
      - 'scripts/e2e-market-complete-session.mjs'
      - 'scripts/e2e-market-topic-filter.mjs'
      - '.github/workflows/doing-market-2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-market-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse CURRENT Market tests
        run: |
          node --check doing-market-entry-current.js
          node --check doing-market-public-2bl.js
          node --check doing-market-topic-filter.js
          node --check doing-market-complete-session.js
          node --check doing-member-workspace-fix.js
          node --check scripts/build-doing-2-site.mjs
          node --check scripts/postprocess-market-complete-session.mjs
          node --check scripts/e2e-market-current.mjs
          node --check scripts/e2e-market-complete-session.mjs
          node --check scripts/e2e-market-topic-filter.mjs
      - name: Build CURRENT site
        run: |
          node scripts/build-doing-2-site.mjs
          node scripts/postprocess-market-complete-session.mjs
      - name: Validate two-entry Market and preserved SSOT boundaries
        shell: bash
        run: |
          set -euo pipefail
          for f in market/index.html market/public/index.html market/session/index.html register/index.html; do
            test -s ".doing-2-site/$f"
            ! grep -q 'data-doing-ui-state="rebuild-shell"' ".doing-2-site/$f"
            ! grep -q '2bl-v7' ".doing-2-site/$f"
            ! grep -q 'supabase.co' ".doing-2-site/$f"
          done
          grep -q 'getSessionsAdmin' .doing-2-site/market/index.html
          grep -q 'getTodos' .doing-2-site/market/index.html
          grep -q 'getMembers' .doing-2-site/market/index.html
          grep -q 'financeOverview' .doing-2-site/market/index.html
          grep -q 'doing-market-entry-current.js' .doing-2-site/market/index.html
          grep -q 'doing-market-complete-session.js' .doing-2-site/market/index.html
          grep -q 'doing-market-complete-session.js' .doing-2-site/market/session/index.html
          grep -q 'createEvent' .doing-2-site/doing-market-complete-session.js
          grep -q 'createSession' .doing-2-site/doing-market-complete-session.js
          grep -q 'updateEvent' .doing-2-site/doing-market-complete-session.js
          grep -q 'updateSession' .doing-2-site/doing-market-complete-session.js
          grep -q 'agreementContent' .doing-2-site/doing-market-complete-session.js
          grep -q 'customFields' .doing-2-site/doing-market-complete-session.js
          grep -q 'addons' .doing-2-site/doing-market-complete-session.js
          grep -q 'equip' .doing-2-site/doing-market-complete-session.js
          grep -q 'auth/line/start' .doing-2-site/doing-market-entry-current.js
          grep -q 'createMemberWorkspaceAdminSession' .doing-2-site/doing-market-entry-current.js
          grep -q '不需要重新申請' .doing-2-site/doing-market-entry-current.js
          grep -q 'frontBootstrap' .doing-2-site/market/public/index.html
          grep -q 'publicDiscovery' .doing-2-site/doing-market-public-2bl.js
          grep -q 'doingMarketGlobalBootstrap' .doing-2-site/doing-market-public-2bl.js
          grep -q 'doing-market-topic-filter.js' .doing-2-site/market/public/index.html
          grep -q 'market-topic-chips' .doing-2-site/doing-market-topic-filter.js
          grep -q 'sortSessions' .doing-2-site/doing-market-topic-filter.js
          grep -q 'openRegistration' .doing-2-site/market/public/index.html
          grep -q 'market-2bl-front' .doing-2-site/market/public/index.html
          grep -q 'doing-market-public-2bl.js' .doing-2-site/market/public/index.html
          grep -q 'bottom-nav' .doing-2-site/market/public/index.html
          ! grep -q 'registerUrl(' .doing-2-site/market/public/index.html
          ! grep -q 'href="/register/' .doing-2-site/market/public/index.html
          grep -q 'getSessionRegistrations' .doing-2-site/market/session/index.html
          grep -q 'updateRegStatus' .doing-2-site/market/session/index.html
          grep -q 'confirmPayment' .doing-2-site/market/session/index.html
          grep -q 'adminSeatBoard' .doing-2-site/market/session/index.html
          grep -q 'sendNotify' .doing-2-site/market/session/index.html
          grep -q 'checkin' .doing-2-site/market/session/index.html
          grep -q 'confirmRefund' .doing-2-site/market/session/index.html
          grep -q '<base href="/">' .doing-2-site/register/index.html
          grep -q 'member_token' .doing-2-site/register/index.html
          test -s .doing-2-site/doing-home-refresh.js
          test -s .doing-2-site/doing-market-public-2bl.js
          test -s .doing-2-site/doing-market-topic-filter.js
          test -s .doing-2-site/doing-market-entry-current.js
          test -s .doing-2-site/doing-market-complete-session.js
          test ! -e .doing-2-site/market-center.html
          test ! -e .doing-2-site/market-public.html
          test ! -e .doing-2-site/market-session.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real-browser Market desktop + mobile click-through
        shell: bash
        run: |
          python3 -m http.server 4173 --directory .doing-2-site >/tmp/doing-market-e2e.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/market/ >/dev/null && break; sleep 1; done
          E2E_BASE=http://127.0.0.1:4173 node scripts/e2e-market-current.mjs
          E2E_BASE=http://127.0.0.1:4173 node scripts/e2e-market-complete-session.mjs
          E2E_BASE=http://127.0.0.1:4173 node scripts/e2e-market-topic-filter.mjs
      - name: Diff quality
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
