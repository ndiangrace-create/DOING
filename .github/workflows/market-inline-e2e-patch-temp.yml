name: TEMP Market Inline E2E Patch
on:
  push:
    branches: [fix/market-complete-session-flow-20260826]
    paths:
      - '.github/workflows/market-inline-e2e-patch-temp.yml'
      - 'scripts/patch-e2e-inline-final.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-complete-session-flow-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/patch-e2e-inline-final.mjs
      - run: node --check scripts/e2e-market-current.mjs
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doing-closed-loop-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/e2e-market-current.mjs
          git commit -m 'Validate inline Market registration without navigation'
          git push origin HEAD:fix/market-complete-session-flow-20260826
