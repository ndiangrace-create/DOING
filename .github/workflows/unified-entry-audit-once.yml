name: DOING Unified Entry Audit Once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory user pages and auth entry points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HTML FILES ==='
          find . -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sort
          echo '=== LINE START CALLS ==='
          grep -R -n --include='*.js' --include='*.html' '/auth/line/start' . --exclude-dir=.git || true
          echo '=== MEMBER TOKEN LOGOUT / CLEAR ==='
          grep -R -n --include='*.js' --include='*.html' -E "removeItem\(['\"]doing_member_token|logout|登出" . --exclude-dir=.git || true
          echo '=== LEGACY PAGE REFERENCES ==='
          grep -R -n --include='*.js' --include='*.html' -E '(member|admin|onsite|platform|operations-center|photo|consignment|about)\.html' . --exclude-dir=.git || true
          echo '=== BUILD ROUTES ==='
          grep -n -E 'const routes=|legacyToShort=|retiredPublicRoutes=|forbiddenShortDirs=' scripts/build-doing-2-site.mjs
