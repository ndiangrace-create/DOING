<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>DOING｜智慧申請 UAT v10</title><style>:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:10}.topin{max-width:980px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center}.top img{width:40px;height:40px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:16px 14px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero h1{font-size:clamp(28px,5vw,42px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:99px}.progress i.on{background:var(--main)}.card{padding:18px}.head h2{margin:0;font-size:24px}.head p{margin:6px 0 0;color:var(--muted);line-height:1.65}.group{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.group:first-of-type{border-top:0;padding-top:0}.group h3{margin:0 0 8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer}.choice:has(input:checked){background:#f1f8f9;border-color:#9bc5cc}.choice input{width:22px;height:22px;accent-color:var(--main);flex:0 0 auto}.choice b{display:block}.choice small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.unit{margin-top:10px;padding:10px 12px;background:var(--sky);border-radius:12px;line-height:1.6}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.good{background:#315e5a;color:#fff}.summary{display:grid;gap:12px}.box{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.box.sky{background:var(--sky)}.box.mint{background:var(--mint)}.box h3{margin:0 0 8px}.box p{margin:0;line-height:1.75}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.tool b{display:block;margin-bottom:5px}.tool span{color:var(--muted);line-height:1.5;font-size:14px}.muted{color:var(--muted);font-size:13px}.warn{background:#fff8e8;border-radius:12px;padding:11px 12px;line-height:1.6}@media(max-width:700px){.choices,.tools{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v10</b><span class="badge">流程分岔版｜不建立租戶</span></div></header><main class="shell"><section class="hero"><small>不再問「這些事情有沒有」</small><h1>改問：你的工作通常怎麼跑？</h1><p>基礎能力直接跟著工作與角色帶入，只補問那些真的會讓流程不同的地方。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main><script>'use strict';const state={step:0,works:new Set(),roles:{},branches:{},pains:new Set()};const $=id=>document.getElementById(id);const work=[['beauty','美容／美甲／按摩／SPA','我提供需要排時間的服務'],['market','市集','我可能主辦，也可能去擺攤'],['consign','寄賣／通路','可能經營通路，也可能是自己的商品外寄'],['course','課程／手作／教學','我自己開課或帶體驗'],['event','活動／講座／展演','我自己辦活動'],['guide','導覽／戶外體驗','我帶團或帶梯次'],['project','設計／接案／工程','我替客戶完成一個案件'],['commerce','團購／商品販售','我管理商品與訂單']];const roles={beauty:[['provider','我自己提供服務']],market:[['organizer','我是主辦'],['participant','我是攤商／參與者'],['both','兩種都有']],consign:[['operator','我經營寄賣／通路'],['seller','我的商品去別人的通路寄賣'],['both','兩種都有']],course:[['organizer','我自己開課']],event:[['organizer','我自己辦活動']],guide:[['guide','我是帶團／導覽的人']],project:[['provider','我是接案／工程執行方']],commerce:[['seller','我是販售方']]};const units={beauty:{provider:'一筆預約／一次服務'},market:{organizer:'一場市集',participant:'一次出攤紀錄',both:'一場市集＋一次出攤紀錄'},consign:{operator:'一批進駐品牌／商品',seller:'一段自己的寄賣合作',both:'通路營運＋自己的寄賣合作'},course:{organizer:'一梯課程'},event:{organizer:'一場活動'},guide:{guide:'一梯導覽／體驗'},project:{provider:'一個客戶案件'},commerce:{seller:'一批商品／訂單'}};const branchDefs={beauty:[['confirm','預約要先由我確認後才成立'],['deposit','成立前要先付訂金'],['duration','不同服務需要不同時間'],['staff','多位服務人員各自有行程'],['group','同一時段可能多人一起開始']],market_organizer:[['review','攤商報名後要先審核'],['seat','需要安排攤位位置'],['deposit','除了攤費還要收押金／保證金'],['multiday_checkin','多日活動要分日報到'],['waitlist','額滿後需要候補']],market_participant:[['daily_sales','我要每天登記業績'],['expense','我要記該場成本／支出'],['multiday_sales','多日活動要分日算業績'],['settlement','我需要知道單場最後淨收入']],consign_operator:[['multi_brand','同時管理多個進駐品牌'],['stock_return','需要記上架、售出、退回'],['split','不同品牌有抽成／分潤'],['settle','需要分別做品牌結算']],consign_seller:[['multi_channel','同時有多個寄賣通路'],['sales_return','需要記自己的售出／退回'],['split','通路會抽成'],['settle','需要記應收、實收與結算']],course:[['review','報名後要先確認／審核'],['capacity','每梯有人數上限'],['materials','需要管理材料或加購'],['multislot','同一天有多個梯次'],['checkin','上課要報到']],event:[['review','報名後要先審核'],['seat','需要座位／位置安排'],['ticket','需要票券或核銷'],['waitlist','額滿後需要候補'],['multiday','活動跨多日，要分日管理']],guide:[['private','也接受私人客製預約'],['condition','會受天氣／潮汐／場地影響'],['minpeople','要達最低人數才成行'],['backup','需要備用日期／改期'],['resource','車輛／設備／導覽員不能撞期']],project:[['approval','每個階段都要客戶確認'],['milestone','會分階段請款'],['handoff','不同人員會接續處理'],['acceptance','最後有驗收／簽認'],['change','中途常有變更追加']],commerce:[['pickup','有取貨／出貨流程'],['preorder','有預購／開團截止日'],['stock','需要庫存管理'],['split','有分潤／代收結算'],['multi_channel','同時從多個通路接單']]};const pains=[['time','時間安排'],['money','收款／對帳'],['people','客人／參加者資料'],['notify','提醒／通知'],['onsite','現場流程'],['stock','商品／庫存'],['profit','想知道真正賺多少'],['team','團隊協作']];function prog(){ $('progress').innerHTML=[0,1,2,3,4].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('')}function cards(items,checked,type='checkbox',name='x'){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="${type}" name="${name}" value="${k}" ${checked(k)?'checked':''}><span><b>${t}</b>${d?`<small>${d}</small>`:''}</span></label>`).join('')+'</div>'}function nav(label='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<span></span>'}<button class="btn primary" id="next">${label}</button></div>`}function unitText(w){return units[w]?.[state.roles[w]]||''}function branchItems(w){const r=state.roles[w];if(w==='market'){let a=[];if(r==='organizer'||r==='both')a=a.concat(branchDefs.market_organizer);if(r==='participant'||r==='both')a=a.concat(branchDefs.market_participant);return [...new Map(a.map(x=>[x[0],x])).values()]}if(w==='consign'){let a=[];if(r==='operator'||r==='both')a=a.concat(branchDefs.consign_operator);if(r==='seller'||r==='both')a=a.concat(branchDefs.consign_seller);return [...new Map(a.map(x=>[x[0],x])).values()]}return branchDefs[w]||[]}function selectedBranches(){const s=new Set();Object.values(state.branches).forEach(set=>set.forEach(x=>s.add(x)));return s}function baseTools(){const out=new Map();const add=(t,d)=>out.set(t,[t,d]);add('工作總日曆','把不同工作的日期、時段與重要節點集中在一起');add('通知提醒','重要時間、異動與待辦集中提醒');add('收款與對帳','集中整理收款、訂金、退款與對帳');add('照片與檔案','把相關照片、附件與文件集中保存');state.works.forEach(w=>{const r=state.roles[w];if(w==='beauty'){add('預約與顧客紀錄','管理空檔、預約、服務紀錄與回訪')}if(w==='market'&&(r==='organizer'||r==='both')){add('市集招募與名單','建立場次、收報名、管理攤商與通知')}if(w==='market'&&(r==='participant'||r==='both')){add('出攤紀錄','記錄自己的場次、業績、成本與歷史比較')}if(w==='consign'&&(r==='operator'||r==='both')){add('寄賣通路管理','管理進駐品牌、商品、銷售與結算')}if(w==='consign'&&(r==='seller'||r==='both')){add('我的寄賣合作','記錄自己的通路合作、銷售、抽成與實收')}if(w==='course'){add('課程梯次與學員','建立梯次、名額、報名與學員紀錄')}if(w==='event'){add('活動報名與名單','管理場次、報名、參加者與現場名單')}if(w==='guide'){add('導覽梯次','管理日期、名額、集合與參加者')}if(w==='project'){add('案件進度','管理案件階段、檔案、款項與結案')}if(w==='commerce'){add('商品與訂單','管理商品、訂單、收款與履約')}});return [...out.values()]}function extraTools(){const B=selectedBranches(),out=new Map();const add=(t,d)=>out.set(t,[t,d]);if(B.has('review'))add('審核／確認','送出後先審核或確認，再正式成立');if(B.has('seat'))add('位置安排','管理攤位、座位或現場位置');if(B.has('deposit'))add('訂金／押金','處理成立前訂金或活動保證金');if(B.has('multiday_checkin')||B.has('checkin')||B.has('ticket'))add('報到／核銷','分日報到、票券或現場核銷');if(B.has('waitlist'))add('候補管理','額滿後依序候補與通知');if(B.has('daily_sales')||B.has('multiday_sales'))add('每日業績','分日登記營業額並自動累計');if(B.has('expense')||B.has('settlement'))add('損益與結算','整理成本、支出、淨收入與結算');if(B.has('stock_return')||B.has('sales_return')||B.has('stock'))add('庫存／售出／退回','追蹤商品數量與異動');if(B.has('split'))add('抽成／分潤','管理抽成、分潤與應收實收');if(B.has('multi_brand')||B.has('multi_channel'))add('多品牌／多通路','分開管理不同品牌或合作通路');if(B.has('capacity')||B.has('multislot')||B.has('group'))add('名額與多人時段','管理梯次、名額與同時段多人');if(B.has('materials'))add('材料／加購','管理課程材料與加購項目');if(B.has('condition')||B.has('minpeople')||B.has('backup'))add('成行與改期','依天氣、人數與場地管理成行、改期與取消');if(B.has('private'))add('私人客製預約','除了公開梯次，也能接私人預約');if(B.has('resource')||B.has('staff'))add('人員／資源排程','避免人員、車輛、設備或房間撞期');if(B.has('approval')||B.has('acceptance'))add('確認／驗收／簽認','記錄客戶確認、驗收與簽認');if(B.has('milestone'))add('階段請款','依案件節點分階段請款');if(B.has('handoff'))add('團隊交接','記錄不同人員的分工與接續');if(B.has('change'))add('變更追加','追蹤案件中途的變更與追加');if(B.has('pickup'))add('取貨／出貨','管理訂單後續取貨或出貨');if(B.has('preorder'))add('預購／開團','管理截止日、預購與成團');if(B.has('duration'))add('服務時長','不同服務自動占用不同時間');return [...out.values()]}function render(){prog();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><h2>你現在同時在做哪些工作？</h2><p>可以多選。這一頁只辨識工作組合。</p></div>${cards(work,k=>state.works.has(k))}${nav()}`;document.querySelectorAll('#stage input').forEach(i=>i.onchange=()=>i.checked?state.works.add(i.value):state.works.delete(i.value));}if(state.step===1){let html='<div class="head"><h2>每一種工作裡，你分別是什麼角色？</h2><p>角色不同，真正要管理的東西也不同。</p></div>';state.works.forEach(w=>{const label=work.find(x=>x[0]===w)?.[1]||w;html+=`<div class="group"><h3>${label}</h3>${cards(roles[w]||[],k=>state.roles[w]===k,'radio','role_'+w)}${state.roles[w]?`<div class="unit">你真正要管理的是：<b>${unitText(w)}</b></div>`:''}</div>`});s.innerHTML=html+nav();state.works.forEach(w=>document.querySelectorAll(`input[name="role_${w}"]`).forEach(i=>i.onchange=()=>{state.roles[w]=i.value;if(!state.branches[w])state.branches[w]=new Set();render()}));}if(state.step===2){let html='<div class="head"><h2>你的工作通常怎麼跑？</h2><p>基礎能力已經直接幫你帶入。這裡只問會讓流程真的不同的地方，所以不需要「為了完整」全部勾。</p></div>';state.works.forEach(w=>{const items=branchItems(w);if(!items.length)return;const label=work.find(x=>x[0]===w)?.[1]||w;if(!state.branches[w])state.branches[w]=new Set();html+=`<div class="group"><h3>${label}｜${unitText(w)}</h3>${cards(items,k=>state.branches[w].has(k))}</div>`});html+='<div class="warn">沒勾不代表少給基本功能；只有真的會讓流程不同的情況才需要勾。</div>';s.innerHTML=html+nav('看優先順序 →');let idx=0;state.works.forEach(w=>{const items=branchItems(w);const inputs=[...document.querySelectorAll('#stage input')].slice(idx,idx+items.length);inputs.forEach(i=>i.onchange=()=>i.checked?state.branches[w].add(i.value):state.branches[w].delete(i.value));idx+=items.length});}if(state.step===3){s.innerHTML=`<div class="head"><h2>哪些事情現在最想先改善？</h2><p>這一頁只決定 DOING 先把什麼放前面，不會影響你實際會得到哪些工具。全部都困擾也可以全選。</p></div>${cards(pains,k=>state.pains.has(k))}${nav('看我的規劃 →')}`;document.querySelectorAll('#stage input').forEach(i=>i.onchange=()=>i.checked?state.pains.add(i.value):state.pains.delete(i.value));}if(state.step===4){const base=baseTools(),extra=extraTools();const jobs=[...state.works].map(w=>{const label=work.find(x=>x[0]===w)?.[1]||w;return `${label}：${unitText(w)}`}).join('；');const painText=pains.filter(x=>state.pains.has(x[0])).map(x=>x[1]).join('、')||'目前沒有特別指定';s.innerHTML=`<div class="summary"><div class="box sky"><h3>DOING 怎麼理解你</h3><p>你同時有這些工作：${jobs}。系統會把它們放在同一個工作空間，但每一種工作仍保留自己的管理方式。</p></div><div class="box"><h3>你一定會先有的幫手</h3><div class="tools">${base.map(([t,d])=>`<div class="tool"><b>${t}</b><span>${d}</span></div>`).join('')}</div></div>${extra.length?`<div class="box mint"><h3>依你的流程，再加上這些工具</h3><div class="tools">${extra.map(([t,d])=>`<div class="tool"><b>${t}</b><span>${d}</span></div>`).join('')}</div></div>`:''}<div class="box"><h3>你希望優先改善</h3><p>${painText}</p><div class="muted">這只影響首頁與設定順序，不會刪掉其他需要的工具。</div></div><div class="box"><h3>這樣符合你的工作嗎？</h3><div class="actions"><button class="btn good" id="confirm">✓ 對，就是這樣</button><button class="btn alt" id="revise">← 有些地方不對</button></div></div></div>`;$('confirm').onclick=()=>{$('stage').innerHTML='<div class="box mint"><h3>UAT 確認完成</h3><p>這裡只模擬「確認建立」，不會真的建立租戶或送正式申請。</p></div>'};$('revise').onclick=()=>{state.step=0;render()};}if(state.step<4){$('next').onclick=()=>{if(state.step===0&&!state.works.size)return alert('請至少選一種工作');if(state.step===1){for(const w of state.works)if(!state.roles[w])return alert('請先確認每一種工作的角色');}state.step++;render()};if($('back'))$('back').onclick=()=>{state.step--;render()};}}render();</script></body></html>
