<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOING 2.0｜世界樹</title>
<style>
:root{--bg:#fbfaf7;--paper:#fff;--ink:#252a31;--muted:#737c85;--line:#dbe4e8;--done:#dff0e5;--done-b:#78aa8c;--progress:#f7efc9;--progress-b:#c5a84c;--verify:#e8eef8;--verify-b:#879fc7;--todo:#eef0f2;--todo-b:#9ca5ad;--blocked:#f6dfdf;--blocked-b:#c88a8a;--trunk:#eaf4f8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.top{position:fixed;inset:0 0 auto;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}.topin{width:min(1680px,calc(100% - 24px));min-height:62px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-weight:900}.meta{font-size:12px;color:var(--muted)}.legend{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:4px 7px;background:#fff;border:1px solid var(--line);border-radius:999px}.dot{width:8px;height:8px;border-radius:50%}.done{background:var(--done-b)}.progress{background:var(--progress-b)}.verify{background:var(--verify-b)}.todo{background:var(--todo-b)}.blocked{background:var(--blocked-b)}.shell{padding:80px 10px 30px}.headline{width:min(1640px,100%);margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.headline h1{margin:0;font-size:32px}.headline p{margin:4px 0 0;color:var(--muted);font-size:13px}.current{max-width:680px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#f6fafc;font-size:12px}.section{width:min(1680px,100%);margin:18px auto 0}.section-title{font-size:19px;font-weight:900;margin:0 0 8px}.viewport{overflow:auto;padding:10px 2px 20px}.overall{position:relative;width:1660px;min-width:1660px;margin:auto;padding:24px 8px}.overall-grid{display:grid;grid-template-columns:680px 220px 680px;gap:40px;align-items:start;position:relative;z-index:2}.side{display:grid;gap:18px}.branch-group{position:relative}.branch{border:1px solid var(--line);border-left:5px solid var(--verify-b);border-radius:13px;background:#fff;padding:11px 12px;min-height:64px;box-shadow:0 8px 20px rgba(42,65,78,.06)}.branch[data-status=done]{border-left-color:var(--done-b)}.branch[data-status=progress]{border-left-color:var(--progress-b)}.branch[data-status=verify]{border-left-color:var(--verify-b)}.branch[data-status=todo]{border-left-color:var(--todo-b)}.branch[data-status=blocked]{border-left-color:var(--blocked-b)}.branch-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.branch strong{font-size:16px}.branch small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.4}.pill{font-size:10px;font-weight:900;border-radius:999px;padding:3px 6px;white-space:nowrap}.pill.done{background:var(--done);color:#3f6e54}.pill.progress{background:var(--progress);color:#7b651f}.pill.verify{background:var(--verify);color:#536b93}.pill.todo{background:var(--todo);color:#67717a}.pill.blocked{background:var(--blocked);color:#915353}.branch-children{margin:7px 0 0 14px;padding-left:12px;border-left:1px solid #cdd9de;display:grid;gap:6px}.child-node{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 9px}.child-node:before{content:"";position:absolute;left:-13px;top:17px;width:12px;border-top:1px solid #cdd9de}.child-node[data-status=done]{border-left:3px solid var(--done-b)}.child-node[data-status=progress]{border-left:3px solid var(--progress-b)}.child-node[data-status=verify]{border-left:3px solid var(--verify-b)}.child-node[data-status=todo]{border-left:3px solid var(--todo-b)}.child-node[data-status=blocked]{border-left:3px solid var(--blocked-b)}.child-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.child-head b{font-size:12px}.child-node small{display:block;color:var(--muted);font-size:10px;line-height:1.35;margin-top:2px}.branch-children .branch-children{margin-left:8px;padding-left:10px}.trunk{position:sticky;top:92px;background:var(--trunk);border:2px solid #b7d2df;border-radius:26px;padding:24px 14px;text-align:center;box-shadow:0 14px 34px rgba(65,92,106,.11)}.trunk strong{font-size:24px}.trunk span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.overall-svg,.path-svg{position:absolute;inset:0;pointer-events:none;z-index:1}.overall-svg path,.path-svg path{fill:none;stroke:#c9d6dc;stroke-width:2}.market-map{position:relative;width:max-content;min-width:1740px;margin:auto;padding:26px 16px 60px}.market-center{position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:3;background:var(--trunk);border:2px solid #b7d2df;border-radius:22px;padding:14px 24px;text-align:center;font-weight:900}.lanes{padding-top:100px;display:grid;gap:42px}.lane{display:grid;grid-template-columns:190px repeat(var(--cols),190px);gap:24px;align-items:start;position:relative;z-index:2;width:max-content}.lane.loop{grid-template-columns:190px repeat(var(--cols),220px)}.lane-root{border:2px solid #b7d2df;border-radius:16px;background:#f3f8fa;padding:14px 12px;text-align:center;font-weight:900;align-self:start}.path-stack{min-width:0;display:flex;flex-direction:column;gap:8px;align-self:start}.path-node{border:1px solid var(--line);border-top:5px solid var(--verify-b);background:#fff;border-radius:13px;padding:10px;min-height:92px;box-shadow:0 7px 18px rgba(42,65,78,.05)}.path-node[data-status=done]{border-top-color:var(--done-b)}.path-node[data-status=progress]{border-top-color:var(--progress-b)}.path-node[data-status=verify]{border-top-color:var(--verify-b)}.path-node[data-status=todo]{border-top-color:var(--todo-b)}.path-node[data-status=blocked]{border-top-color:var(--blocked-b)}.path-node strong{display:block;font-size:13px}.path-node small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:5px}.node-state{margin-top:7px}.deep-branch{position:relative;margin:0 0 0 14px;padding:4px 0 0 14px;border-left:1px solid #c9d6dc;display:grid;gap:6px}.deep-node{position:relative;border:1px solid var(--line);border-left:3px solid var(--verify-b);border-radius:10px;background:#fff;padding:7px 8px;box-shadow:0 4px 12px rgba(42,65,78,.04)}.deep-node:before{content:"";position:absolute;left:-15px;top:17px;width:14px;border-top:1px solid #c9d6dc}.deep-node[data-status=done]{border-left-color:var(--done-b)}.deep-node[data-status=progress]{border-left-color:var(--progress-b)}.deep-node[data-status=verify]{border-left-color:var(--verify-b)}.deep-node[data-status=todo]{border-left-color:var(--todo-b)}.deep-node[data-status=blocked]{border-left-color:var(--blocked-b)}.deep-node strong{display:block;font-size:10px;line-height:1.35}.deep-node small{display:block;color:var(--muted);font-size:9px;line-height:1.35;margin-top:3px}.deep-state{margin-top:4px}.deep-state .pill{font-size:8px;padding:2px 5px}.recent{width:min(1640px,100%);margin:16px auto}.recent-list{display:flex;gap:8px;overflow:auto}.log{flex:0 0 300px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px}.log time{font-size:10px;color:var(--muted)}.log b{display:block;font-size:12px;margin:3px 0}.log span{font-size:11px;color:var(--muted)}.hint{text-align:center;color:var(--muted);font-size:11px}@media(max-width:760px){.meta{display:none}.legend span{font-size:9px;padding:3px 5px}.shell{padding-top:72px}.headline{display:block}.current{margin-top:8px}.overall{min-width:1320px;width:1320px}.overall-grid{grid-template-columns:520px 180px 520px;gap:30px}.market-map{min-width:1600px}.lane{grid-template-columns:160px repeat(var(--cols),170px);gap:18px}.lane.loop{grid-template-columns:160px repeat(var(--cols),200px)}.deep-node strong{font-size:9px}.deep-node small{font-size:8px}.deep-branch{margin-left:10px;padding-left:10px}.hint:after{content:'｜手機可左右滑動查看完整心智圖'}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div><div class="brand">DOING 2.0 世界樹</div><div class="meta" id="meta">載入中…</div></div><div class="legend"><span><i class="dot done"></i>已完成</span><span><i class="dot progress"></i>進行中</span><span><i class="dot verify"></i>待驗證</span><span><i class="dot todo"></i>尚未做</span><span><i class="dot blocked"></i>阻擋</span></div></div></header>
<main class="shell">
<div class="headline"><div><h1>DOING 2.0 世界樹</h1><p>全系統主幹、產品、共用能力、角色與 Market 操作路徑一次展開。</p></div><div class="current" id="current">讀取中…</div></div>
<section class="section"><h2 class="section-title">全系統心智圖</h2><div class="viewport"><div class="overall" id="overall"><svg class="overall-svg" id="overallSvg"></svg><div class="overall-grid"><div class="side" id="left"></div><div class="trunk" id="trunk"><strong>DOING 2.0</strong><span id="version">—</span></div><div class="side" id="right"></div></div></div></div><div class="hint">主分支下會直接展開所有已記錄子節點；狀態只反映既有驗證，不因心智圖整理而自動升級。</div></section>
<section class="section"><h2 class="section-title">Market｜2BL 操作路徑</h2><div class="viewport"><div class="market-map" id="marketMap"><svg class="path-svg" id="pathSvg"></svg><div class="market-center" id="marketCenter">Market</div><div class="lanes" id="lanes"></div></div></div><div class="hint">前台七步主線、後台九步操作骨架與系統閉環完整展開；每個主節點下面繼續顯示實際操作分支</div></section>
<section class="recent"><h2 class="section-title">最近更新</h2><div class="recent-list" id="recent"></div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const labels={done:'已完成',progress:'進行中',verify:'待驗證',todo:'尚未做',blocked:'阻擋'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function pill(s){return `<span class="pill ${esc(s)}">${labels[s]||esc(s)}</span>`}
function children(nodes,depth=1){if(!Array.isArray(nodes)||!nodes.length)return '';return `<div class="branch-children" data-depth="${depth}">${nodes.map(n=>`<div><div class="child-node" data-status="${esc(n.status)}"><div class="child-head"><b>${esc(n.title)}</b>${pill(n.status)}</div><small>${esc(n.summary||'')}</small></div>${children(n.children,depth+1)}</div>`).join('')}</div>`}
function branch(b){return `<div class="branch-group"><div class="branch" data-status="${esc(b.status)}"><div class="branch-row"><strong>${esc(b.title)}</strong>${pill(b.status)}</div><small>${esc(b.summary||'')}</small></div>${children(b.children)}</div>`}
function deep(nodes){if(!Array.isArray(nodes)||!nodes.length)return '';return `<div class="deep-branch">${nodes.map(n=>`<div class="deep-node" data-status="${esc(n.status)}"><strong>${esc(n.title)}</strong><small>${esc(n.summary||'')}</small><div class="deep-state">${pill(n.status)}</div>${deep(n.children)}</div>`).join('')}</div>`}
function node(n){return `<div class="path-stack"><div class="path-node" data-node="${esc(n.id)}" data-status="${esc(n.status)}"><strong>${esc(n.title)}</strong><small>${esc(n.summary||'')}</small><div class="node-state">${pill(n.status)}</div></div>${deep(n.children)}</div>`}
function render(data){
 $('meta').textContent=`${data.version}｜更新 ${data.updatedAt}`;$('version').textContent=`世界樹 ${data.version}`;$('current').innerHTML=`<b>${esc(data.current?.title||'')}</b><br>${esc(data.current?.summary||'')}`;
 const left=data.branches.filter(x=>x.side==='left'),right=data.branches.filter(x=>x.side!=='left');$('left').innerHTML=left.map(branch).join('');$('right').innerHTML=right.map(branch).join('');
 const market=data.branches.find(x=>x.id==='market');const lanes=[['前台攤商路徑','market-front-path'],['後台主辦路徑','market-admin-path'],['系統閉環','market-close-loop']];
 $('lanes').innerHTML=market?lanes.map(([title,id])=>{const root=market.children.find(x=>x.id===id);if(!root)return '';const main=(root.children||[]).filter(n=>n.id!=='admin-support');return `<div class="lane ${id==='market-close-loop'?'loop':''}" style="--cols:${main.length}" data-lane="${id}"><div class="lane-root" data-root="${id}">${title}<div class="node-state">${pill(root.status)}</div></div>${main.map(node).join('')}</div>`}).join(''):'';
 $('recent').innerHTML=(data.changes||[]).map(x=>`<div class="log"><time>${esc(x.time)}</time><b>${esc(x.title)}</b><span>${esc(x.summary||'')}</span></div>`).join('');requestAnimationFrame(draw);setTimeout(draw,100)
}
function bezier(a,b,box){const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),rr=box.getBoundingClientRect();const x1=ar.right-rr.left,y1=ar.top-rr.top+ar.height/2,x2=br.left-rr.left,y2=br.top-rr.top+br.height/2,m=(x1+x2)/2;return `M ${x1} ${y1} C ${m} ${y1}, ${m} ${y2}, ${x2} ${y2}`}
function draw(){drawOverall();drawMarket()}
function drawOverall(){const box=$('overall'),svg=$('overallSvg'),tr=$('trunk');if(!box||!svg||!tr)return;const rr=box.getBoundingClientRect(),trr=tr.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.scrollWidth} ${box.scrollHeight}`);svg.setAttribute('width',box.scrollWidth);svg.setAttribute('height',box.scrollHeight);let paths='';document.querySelectorAll('.branch').forEach(el=>{const r=el.getBoundingClientRect(),side=el.closest('.side'),isLeft=side&&side.id==='left';const x1=(isLeft?trr.left:trr.right)-rr.left,y1=trr.top-rr.top+trr.height/2,x2=(isLeft?r.right:r.left)-rr.left,y2=r.top-rr.top+r.height/2,m=(x1+x2)/2;paths+=`<path d="M ${x1} ${y1} C ${m} ${y1},${m} ${y2},${x2} ${y2}"/>`});svg.innerHTML=paths}
function drawMarket(){const box=$('marketMap'),svg=$('pathSvg'),center=$('marketCenter');if(!box||!svg||!center)return;svg.setAttribute('viewBox',`0 0 ${box.scrollWidth} ${box.scrollHeight}`);svg.setAttribute('width',box.scrollWidth);svg.setAttribute('height',box.scrollHeight);let paths='';document.querySelectorAll('.lane').forEach(lane=>{const root=lane.querySelector('.lane-root'),nodes=[...lane.querySelectorAll(':scope > .path-stack > .path-node')];const cr=center.getBoundingClientRect(),rr=box.getBoundingClientRect(),rtr=root.getBoundingClientRect();const cx=cr.left-rr.left+cr.width/2,cy=cr.bottom-rr.top,rx=rtr.left-rr.left+rtr.width/2,ry=rtr.top-rr.top,midY=(cy+ry)/2;paths+=`<path d="M ${cx} ${cy} C ${cx} ${midY},${rx} ${midY},${rx} ${ry}"/>`;let prev=root;for(const n of nodes){paths+=`<path d="${bezier(prev,n,box)}"/>`;prev=n}});svg.innerHTML=paths}
window.addEventListener('resize',()=>requestAnimationFrame(draw));
fetch('/doing-world-tree-current.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()}).then(render).catch(()=>{$('current').textContent='世界樹讀取失敗，請重新整理。'});
})();
</script>
</body>
</html>
