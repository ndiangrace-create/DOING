<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfaf7"><title>DOING 2.0｜世界樹進度</title><style>:root{--wt-bg:#fbfaf7;--wt-card:#fff;--wt-ink:#252a31;--wt-muted:#707985;--wt-line:#dfe7eb;--wt-blue:#e6f2f8;--wt-mint:#e7f3eb;--wt-yellow:#f8f1d8;--wt-lilac:#f0eaf8;--wt-red:#f9ecec;--wt-shadow:0 10px 28px rgba(52,70,82,.08)}*{box-sizing:border-box}body{margin:0;background:var(--wt-bg);color:var(--wt-ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wt-top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--wt-line);backdrop-filter:blur(12px)}.wt-top-in{width:min(1260px,calc(100% - 28px));min-height:66px;margin:auto;display:flex;align-items:center;gap:12px}.wt-brand{font-weight:900}.wt-sub{color:var(--wt-muted);font-size:13px}.wt-actions{margin-left:auto;display:flex;gap:8px}.wt-actions a{min-height:40px;padding:8px 12px;border:1px solid var(--wt-line);border-radius:10px;background:#fff;color:var(--wt-ink);text-decoration:none;font-weight:750;display:inline-flex;align-items:center}.wt-shell{width:min(1260px,calc(100% - 28px));margin:0 auto;padding:88px 0 36px}.wt-hero{padding:22px 24px;border:1px solid var(--wt-line);border-radius:18px;background:var(--wt-blue)}.wt-hero h1{margin:0 0 6px;font-size:clamp(28px,4vw,40px)}.wt-hero p{margin:0;color:var(--wt-muted)}.wt-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.wt-chip{padding:5px 9px;border:1px solid rgba(66,86,98,.12);border-radius:999px;background:#fff;font-size:12px;font-weight:800}.wt-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.wt-stat{padding:15px;border:1px solid var(--wt-line);border-radius:14px;background:#fff}.wt-stat b{display:block;font-size:25px}.wt-stat span{color:var(--wt-muted);font-size:13px}.wt-section{margin-top:22px}.wt-section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}.wt-section h2{margin:0;font-size:23px}.wt-note{color:var(--wt-muted);font-size:13px}.wt-current{padding:16px;border:1px solid #d9e8de;border-radius:14px;background:var(--wt-mint);margin-bottom:14px}.wt-current b{display:block;margin-bottom:4px}.wt-tree{display:grid;gap:10px}.wt-node{border:1px solid var(--wt-line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:var(--wt-shadow)}.wt-node summary{list-style:none;cursor:pointer;padding:15px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.wt-node summary::-webkit-details-marker{display:none}.wt-title{font-weight:850}.wt-desc{display:block;color:var(--wt-muted);font-size:13px;margin-top:3px}.wt-status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}.wt-status.done{background:var(--wt-mint);color:#3f6f58}.wt-status.progress{background:var(--wt-yellow);color:#806827}.wt-status.verify{background:var(--wt-lilac);color:#695587}.wt-status.blocked{background:var(--wt-red);color:#9a5656}.wt-children{padding:0 16px 16px 34px;display:grid;gap:8px}.wt-child{position:relative;padding:11px 12px;border:1px solid var(--wt-line);border-radius:12px;background:#fbfcfc}.wt-child:before{content:"";position:absolute;left:-20px;top:20px;width:14px;border-top:1px solid #cbd7dc}.wt-child-row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.wt-child b{font-size:15px}.wt-child p{margin:3px 0 0;color:var(--wt-muted);font-size:13px;line-height:1.55}.wt-timeline{display:grid;gap:8px}.wt-log{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--wt-line);border-radius:12px;background:#fff}.wt-time{font-size:12px;color:var(--wt-muted)}.wt-empty{padding:20px;border:1px dashed var(--wt-line);border-radius:12px;text-align:center;color:var(--wt-muted);background:#fff}.wt-error{padding:14px;border:1px solid #edcccc;border-radius:12px;background:#fff6f6;color:#9a5656}.wt-foot{margin-top:20px;color:var(--wt-muted);font-size:12px;text-align:center}@media(max-width:760px){.wt-top-in{width:calc(100% - 16px);min-height:58px}.wt-sub{display:none}.wt-actions a{font-size:13px;padding:7px 9px}.wt-shell{width:calc(100% - 16px);padding-top:76px}.wt-summary{grid-template-columns:repeat(2,1fr)}.wt-node summary{grid-template-columns:1fr}.wt-status{justify-self:start}.wt-children{padding-left:20px}.wt-child:before{display:none}.wt-log{grid-template-columns:1fr}.wt-section-head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="wt-top"><div class="wt-top-in"><div><div class="wt-brand">DOING 2.0 世界樹</div><div class="wt-sub">只同步實際更新進度，不混入未執行事項</div></div><div class="wt-actions"><a href="/workspace/">我的 DOING</a><a href="/market/">Market</a></div></div></header><main class="wt-shell"><section class="wt-hero"><h1>開發進度世界樹</h1><p>直接看目前做到哪、正在做什麼、哪些還要驗證。</p><div class="wt-meta"><span class="wt-chip" id="wtVersion">讀取中…</span><span class="wt-chip" id="wtUpdated">—</span></div></section><section class="wt-summary" id="wtSummary"></section><section class="wt-section"><div class="wt-section-head"><h2>現在正在做</h2><div class="wt-note">只顯示目前這一批真正動到的內容</div></div><div class="wt-current" id="wtCurrent">載入中…</div></section><section class="wt-section"><div class="wt-section-head"><h2>世界樹</h2><div class="wt-note">展開各分支查看細項</div></div><div class="wt-tree" id="wtTree"><div class="wt-empty">正在載入世界樹…</div></div></section><section class="wt-section"><div class="wt-section-head"><h2>最近更新</h2><div class="wt-note">每次實際變更只追加這裡</div></div><div class="wt-timeline" id="wtTimeline"></div></section><div class="wt-foot">DOING 2.0｜世界樹進度頁</div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const label={done:'已完成',progress:'進行中',verify:'待驗證',blocked:'阻擋'};function count(items){const out={done:0,progress:0,verify:0,blocked:0};for(const b of items||[]){out[b.status]=(out[b.status]||0)+1;for(const c of b.children||[])out[c.status]=(out[c.status]||0)+1}return out}function render(data){$('wtVersion').textContent='世界樹 '+(data.version||'—');$('wtUpdated').textContent='更新 '+(data.updatedAt||'—');const c=count(data.branches);$('wtSummary').innerHTML=[['已完成',c.done],['進行中',c.progress],['待驗證',c.verify],['阻擋',c.blocked]].map(([n,v])=>`<div class="wt-stat"><b>${v}</b><span>${n}</span></div>`).join('');$('wtCurrent').innerHTML=`<b>${esc(data.current?.title||'目前沒有進行中的更新')}</b><span>${esc(data.current?.summary||'')}</span>`;$('wtTree').innerHTML=(data.branches||[]).map((b,i)=>`<details class="wt-node" ${i===0?'open':''}><summary><div><span class="wt-title">${esc(b.title)}</span><span class="wt-desc">${esc(b.summary||'')}</span></div><span class="wt-status ${esc(b.status)}">${label[b.status]||esc(b.status)}</span></summary><div class="wt-children">${(b.children||[]).map(ch=>`<div class="wt-child"><div class="wt-child-row"><div><b>${esc(ch.title)}</b><p>${esc(ch.summary||'')}</p></div><span class="wt-status ${esc(ch.status)}">${label[ch.status]||esc(ch.status)}</span></div></div>`).join('')||'<div class="wt-empty">目前沒有細項</div>'}</div></details>`).join('')||'<div class="wt-empty">目前沒有世界樹資料</div>';$('wtTimeline').innerHTML=(data.changes||[]).map(x=>`<div class="wt-log"><div class="wt-time">${esc(x.time||'')}</div><div><b>${esc(x.title)}</b><div class="wt-note">${esc(x.summary||'')}</div></div></div>`).join('')||'<div class="wt-empty">目前沒有更新紀錄</div>'}fetch('/doing-world-tree-current.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('讀取失敗');return r.json()}).then(render).catch(()=>{$('wtTree').innerHTML='<div class="wt-error">世界樹暫時讀取失敗，請重新整理頁面。</div>';});})();</script></body></html>
