<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfaf7"><title>DOING 2.0｜世界樹</title><style>:root{--bg:#fbfaf7;--paper:#fff;--ink:#252a31;--muted:#727b85;--line:#dfe7eb;--done:#dff0e5;--done-b:#7aae8e;--progress:#f7efc9;--progress-b:#c4a94d;--verify:#e8eef8;--verify-b:#8aa3cb;--todo:#eef0f2;--todo-b:#9aa3ab;--blocked:#f6dfdf;--blocked-b:#c88989;--trunk:#eef6fa;--shadow:0 10px 28px rgba(52,70,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}body{min-height:100dvh}.top{position:fixed;inset:0 0 auto;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{width:min(1500px,calc(100% - 28px));min-height:64px;margin:auto;display:flex;align-items:center;gap:14px}.brand{font-weight:900}.meta{font-size:12px;color:var(--muted)}.legend{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:5px 7px;border-radius:999px;border:1px solid var(--line);background:#fff}.dot{width:9px;height:9px;border-radius:50%}.dot.done{background:var(--done-b)}.dot.progress{background:var(--progress-b)}.dot.verify{background:var(--verify-b)}.dot.todo{background:var(--todo-b)}.dot.blocked{background:var(--blocked-b)}.shell{width:min(1600px,100%);margin:auto;padding:84px 14px 30px}.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 auto 14px;width:min(1500px,100%)}.headline h1{margin:0;font-size:clamp(27px,3vw,38px)}.headline p{margin:4px 0 0;color:var(--muted);font-size:14px}.current{font-size:13px;color:#4a5d66;background:#f5fafc;border:1px solid var(--line);padding:9px 12px;border-radius:12px;max-width:680px}.map-viewport{overflow:auto;padding:12px 8px 22px;scrollbar-color:#c9d5db transparent}.map{position:relative;min-width:1380px;width:1580px;margin:auto;padding:28px 10px 38px}.tree-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 230px 1fr;gap:48px;align-items:center}.side{display:grid;gap:16px}.branch{position:relative;border:1px solid var(--line);border-left:5px solid var(--verify-b);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);padding:12px 13px 11px;min-height:76px;cursor:pointer;transition:.15s ease}.branch.status-done{border-left-color:var(--done-b)}.branch.status-progress{border-left-color:var(--progress-b)}.branch.status-verify{border-left-color:var(--verify-b)}.branch.status-todo{border-left-color:var(--todo-b)}.branch.status-blocked{border-left-color:var(--blocked-b)}.branch:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(52,70,82,.1)}.branch-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.branch-title{font-weight:900;font-size:17px}.status{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px;white-space:nowrap}.status.done{background:var(--done);color:#3f6e54}.status.progress{background:var(--progress);color:#80681f}.status.verify{background:var(--verify);color:#536c96}.status.todo{background:var(--todo);color:#66717a}.status.blocked{background:var(--blocked);color:#925252}.branch p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.children{margin-top:9px;padding-left:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.child{position:relative;border:1px solid var(--line);border-radius:10px;background:#fbfcfc;padding:7px 8px;font-size:12px;min-width:0}.child b{display:block;font-size:12px;padding-right:12px}.child small{display:block;color:var(--muted);line-height:1.35;margin-top:2px}.child .mini{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%}.mini.done{background:var(--done-b)}.mini.progress{background:var(--progress-b)}.mini.verify{background:var(--verify-b)}.mini.todo{background:var(--todo-b)}.mini.blocked{background:var(--blocked-b)}.substeps{margin-top:7px;padding-left:10px;border-left:1px solid var(--line);display:grid;gap:5px}.substep{display:grid;grid-template-columns:8px minmax(0,1fr);gap:6px;align-items:start;font-size:11px}.substep i{width:7px;height:7px;border-radius:50%;margin-top:5px}.substep b{font-size:11px;padding:0}.substep span{display:block;color:var(--muted);line-height:1.35}.trunk{position:relative;z-index:4;align-self:center;border:2px solid #b7d2df;background:var(--trunk);border-radius:28px;padding:28px 18px;text-align:center;box-shadow:0 18px 44px rgba(68,97,111,.12)}.trunk:before{content:"";position:absolute;left:50%;top:-30px;bottom:-30px;width:4px;transform:translateX(-50%);background:#c5dbe5;border-radius:4px;z-index:-1}.trunk strong{display:block;font-size:26px}.trunk span{display:block;margin-top:6px;font-size:12px;color:var(--muted)}.connectors{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}.connectors path{fill:none;stroke:#c7d5dc;stroke-width:2}.connectors path.done{stroke:#9fc4ad}.connectors path.progress{stroke:#d2b85d}.connectors path.verify{stroke:#a7b9d5}.connectors path.todo{stroke:#b9c0c6}.connectors path.blocked{stroke:#d5a2a2}.detail{width:min(1500px,100%);margin:6px auto 0;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;display:none}.detail.show{display:block}.detail-head{display:flex;align-items:center;gap:10px;justify-content:space-between}.detail h2{font-size:18px;margin:0}.detail p{color:var(--muted);font-size:13px}.detail-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.detail-item{border:1px solid var(--line);border-radius:10px;padding:9px}.detail-item b{display:block;font-size:13px;margin-top:5px}.detail-item small{display:block;color:var(--muted);margin-top:3px;line-height:1.45}.detail-substeps{margin-top:8px;display:grid;gap:6px}.detail-substep{border-left:3px solid var(--line);padding-left:8px}.detail-substep b{font-size:12px;margin:0}.detail-substep small{font-size:11px}.recent{width:min(1500px,100%);margin:14px auto 0}.recent h2{font-size:18px;margin:0 0 8px}.recent-list{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.log{flex:0 0 320px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px}.log time{font-size:11px;color:var(--muted)}.log b{display:block;font-size:13px;margin:3px 0}.log span{font-size:12px;color:var(--muted);line-height:1.45}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}@media(max-width:760px){.topin{width:calc(100% - 16px);min-height:58px}.meta{display:none}.legend{gap:3px}.legend span{padding:4px 5px;font-size:9px}.shell{padding:74px 8px 24px}.headline{align-items:flex-start;flex-direction:column}.current{max-width:none;width:100%}.map-viewport{margin:0 -8px;padding-left:8px}.map{min-width:1240px;width:1380px}.tree-grid{grid-template-columns:470px 190px 470px;gap:44px}.branch-title{font-size:16px}.children{grid-template-columns:1fr 1fr}.trunk strong{font-size:23px}.detail-list{grid-template-columns:1fr}.hint:after{content:"｜可左右滑動查看整棵樹"}}</style></head><body><header class="top"><div class="topin"><div><div class="brand">DOING 2.0 世界樹</div><div class="meta" id="meta">載入中…</div></div><div class="legend"><span><i class="dot done"></i>已完成</span><span><i class="dot progress"></i>進行中</span><span><i class="dot verify"></i>已定案／待驗證</span><span><i class="dot todo"></i>尚未做</span><span><i class="dot blocked"></i>阻擋</span></div></div></header><main class="shell"><section class="headline"><div><h1>DOING 2.0 世界樹</h1><p>中央主幹看全貌；Market 已接上 2BL 前台、後台與系統閉環完整操作路徑。</p></div><div class="current" id="current">正在讀取目前進度…</div></section><div class="map-viewport"><div class="map" id="map"><svg class="connectors" id="connectors" aria-hidden="true"></svg><div class="tree-grid"><div class="side left" id="left"></div><div class="trunk" id="trunk"><strong>DOING 2.0</strong><span>工作系統主幹</span><span id="version">—</span></div><div class="side right" id="right"></div></div></div></div><div class="hint">點任何主分支查看完整細項</div><section class="detail" id="detail"><div class="detail-head"><h2 id="detailTitle"></h2><span class="status" id="detailStatus"></span></div><p id="detailSummary"></p><div class="detail-list" id="detailList"></div></section><section class="recent"><h2>最近更新</h2><div class="recent-list" id="recent"></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const label={done:'已完成',progress:'進行中',verify:'已定案／待驗證',todo:'尚未做',blocked:'阻擋'};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let DATA=null;function substepsHtml(items){return (items&&items.length)?`<div class="substeps">${items.map(s=>`<div class="substep"><i class="mini ${esc(s.status)}"></i><div><b>${esc(s.title)}</b><span>${esc(s.summary||'')}</span></div></div>`).join('')}</div>`:''}function branchHtml(b){return `<section class="branch status-${esc(b.status)}" data-id="${esc(b.id)}" tabindex="0" role="button" aria-label="${esc(b.title)}"><div class="branch-head"><div class="branch-title">${esc(b.title)}</div><span class="status ${esc(b.status)}">${label[b.status]||esc(b.status)}</span></div><p>${esc(b.summary||'')}</p><div class="children">${(b.children||[]).map(c=>`<div class="child"><i class="mini ${esc(c.status)}"></i><b>${esc(c.title)}</b><small>${esc(c.summary||'')}</small>${substepsHtml(c.children)}</div>`).join('')}</div></section>`}function render(data){DATA=data;$('meta').textContent=`${data.version||'—'}｜更新 ${data.updatedAt||'—'}`;$('version').textContent=`世界樹 ${data.version||'—'}`;$('current').innerHTML=`<b>${esc(data.current?.title||'目前無進行中項目')}</b><br>${esc(data.current?.summary||'')}`;const left=(data.branches||[]).filter(x=>x.side==='left');const right=(data.branches||[]).filter(x=>x.side!=='left');$('left').innerHTML=left.map(branchHtml).join('');$('right').innerHTML=right.map(branchHtml).join('');$('recent').innerHTML=(data.changes||[]).map(x=>`<div class="log"><time>${esc(x.time)}</time><b>${esc(x.title)}</b><span>${esc(x.summary||'')}</span></div>`).join('');document.querySelectorAll('.branch').forEach(el=>{const open=()=>showDetail(el.dataset.id);el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});requestAnimationFrame(draw);setTimeout(draw,120)}function detailSubsteps(items){return (items&&items.length)?`<div class="detail-substeps">${items.map(s=>`<div class="detail-substep"><span class="status ${esc(s.status)}">${label[s.status]||esc(s.status)}</span><b>${esc(s.title)}</b><small>${esc(s.summary||'')}</small></div>`).join('')}</div>`:''}function showDetail(id){const b=DATA?.branches?.find(x=>x.id===id);if(!b)return;$('detailTitle').textContent=b.title;$('detailSummary').textContent=b.summary||'';$('detailStatus').className=`status ${b.status}`;$('detailStatus').textContent=label[b.status]||b.status;$('detailList').innerHTML=(b.children||[]).map(c=>`<div class="detail-item"><span class="status ${esc(c.status)}">${label[c.status]||esc(c.status)}</span><b>${esc(c.title)}</b><small>${esc(c.summary||'')}</small>${detailSubsteps(c.children)}</div>`).join('');$('detail').classList.add('show');$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}function draw(){const svg=$('connectors'),map=$('map'),trunk=$('trunk');if(!svg||!map||!trunk)return;const mr=map.getBoundingClientRect(),tr=trunk.getBoundingClientRect();svg.setAttribute('width',map.scrollWidth);svg.setAttribute('height',map.scrollHeight);svg.setAttribute('viewBox',`0 0 ${map.scrollWidth} ${map.scrollHeight}`);const sxL=tr.left-mr.left,sxR=tr.right-mr.left,sy=tr.top-mr.top+tr.height/2;let d='';document.querySelectorAll('.branch').forEach(el=>{const r=el.getBoundingClientRect(),isLeft=el.closest('.left'),ex=(isLeft?r.right:r.left)-mr.left,ey=r.top-mr.top+r.height/2,sx=isLeft?sxL:sxR,mid=(sx+ex)/2,st=(DATA?.branches?.find(x=>x.id===el.dataset.id)?.status)||'verify';d+=`<path class="${st}" d="M ${sx} ${sy} C ${mid} ${sy}, ${mid} ${ey}, ${ex} ${ey}"/>`});svg.innerHTML=d}window.addEventListener('resize',()=>requestAnimationFrame(draw));fetch('/doing-world-tree-current.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(render).catch(()=>{$('current').textContent='世界樹讀取失敗，請重新整理。'});})();</script></body></html>
