<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>DOING｜智慧申請 UAT v11</title><style>:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--deep:#315e5a;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:10}.topin{max-width:980px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center}.top img{width:40px;height:40px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:16px 14px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero h1{font-size:clamp(28px,5vw,42px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:99px}.progress i.on{background:var(--main)}.card{padding:18px}.head h2{margin:0;font-size:24px}.head p{margin:6px 0 0;color:var(--muted);line-height:1.65}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer}.choice:has(input:checked){background:#f1f8f9;border-color:#9bc5cc}.choice input{width:22px;height:22px;accent-color:var(--main);flex:0 0 auto}.choice b{display:block}.choice small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.group{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.group:first-of-type{border-top:0;padding-top:0}.unit{margin-top:10px;padding:10px 12px;background:var(--sky);border-radius:12px}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.good{background:var(--deep);color:#fff}.summary{display:grid;gap:14px}.heroResult{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.resultMain,.resultSide,.box{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.resultMain{background:var(--sky)}.resultSide{background:var(--mint)}.workmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.workitem{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.workitem b{display:block;margin-bottom:4px}.workitem small{color:var(--muted);line-height:1.5}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tool{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.tool strong{display:block;font-size:16px;margin-bottom:5px}.tool span{color:var(--muted);font-size:14px;line-height:1.5}.steps{display:grid;gap:8px}.step{display:flex;gap:10px;align-items:flex-start}.num{width:28px;height:28px;border-radius:8px;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.muted{color:var(--muted)}@media(max-width:760px){.choices,.workmap,.tools,.heroResult{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v11</b><span class="badge">最終候選｜工具啟用入口</span></div></header><main class="shell"><section class="hero"><small>這不是系統設定表</small><h1>先告訴我，你同時在做哪些工作或副業。</h1><p>DOING 只需要知道你的工作組合與角色，就能先替你開對工具。真正的時段、費用、流程細節，進入系統後再設定。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main><script>'use strict';const state={step:0,works:new Set(),roles:{}};const $=id=>document.getElementById(id);const work=[['beauty','美容／美甲／按摩／SPA','提供需要排時間的服務'],['market','市集','主辦市集、擺攤，或兩者都有'],['event','活動／講座／展演','主辦活動或場次'],['course','課程／手作／教學','開課、帶體驗或教學'],['guide','導覽／戶外體驗','帶團、帶梯次或體驗'],['project','設計／接案／工程','替客戶執行案件'],['commerce','商品販售／團購','管理商品與訂單'],['consign','寄賣／通路','經營寄賣通路，或商品外寄'],['rental','空間／設備出租','管理可預約的空間或設備'],['other','其他工作／副業','目前沒有完全對應的類型']];const roles={beauty:[['provider','我提供服務']],market:[['organizer','我是主辦'],['participant','我是攤商／參與者'],['both','兩種都有']],event:[['organizer','我自己主辦']],course:[['organizer','我自己開課／帶體驗']],guide:[['guide','我是帶團／帶梯次的人']],project:[['provider','我是接案／執行方']],commerce:[['seller','我是販售方']],consign:[['operator','我經營寄賣／通路'],['seller','我的商品去別人的通路寄賣'],['both','兩種都有']],rental:[['operator','我管理出租空間／設備']],other:[['custom','我有其他工作型態']]} ;const units={beauty:{provider:'一筆預約／一次服務'},market:{organizer:'一場市集',participant:'一次出攤紀錄',both:'一場市集＋一次出攤紀錄'},event:{organizer:'一場活動'},course:{organizer:'一梯課程／體驗'},guide:{guide:'一梯導覽／體驗'},project:{provider:'一個客戶案件'},commerce:{seller:'商品與訂單'},consign:{operator:'寄賣品牌與商品',seller:'一段自己的寄賣合作',both:'寄賣通路＋自己的寄賣合作'},rental:{operator:'一個可預約資源／時段'},other:{custom:'一種自訂工作'}};const toolMap={beauty:[['預約與空檔','管理可預約時間、服務與顧客紀錄']],market_organizer:[['市集管理','建立場次、報名、名單、收款、通知']],market_participant:[['出攤紀錄','記錄場次、每日業績、成本與總計']],event:[['活動管理','建立活動、報名、參加者與現場名單']],course:[['課程管理','管理梯次、學員、名額與收款']],guide:[['導覽梯次','管理日期、名額、參加者與通知']],project:[['案件管理','管理進度、檔案、款項與結案']],commerce:[['商品與訂單','管理商品、訂單、收款與履約']],consign_operator:[['寄賣通路管理','管理進駐品牌、商品、銷售與結算']],consign_seller:[['我的寄賣合作','記錄通路合作、銷售、抽成與實收']],rental:[['資源預約','管理空間／設備時段與使用紀錄']],other:[['自訂工作入口','先建立工作入口，後續再補設定']]} ;const common=[['工作總日曆','把不同工作的日期與待辦集中在一起'],['收款與對帳','集中整理各工作的收款與實收'],['通知提醒','重要日期與狀態集中提醒'],['照片／檔案','各工作的附件集中保存']];function cards(items,checked,type='checkbox',name='x'){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="${type}" name="${name}" value="${k}" ${checked(k)?'checked':''}><span><b>${t}</b>${d?`<small>${d}</small>`:''}</span></label>`).join('')+'</div>'}function nav(label='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<span></span>'}<button class="btn primary" id="next">${label}</button></div>`}function prog(){ $('progress').innerHTML=[0,1,2].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('')}function unitText(w){return units[w]?.[state.roles[w]]||''}function selectedTools(){const out=new Map(common.map(x=>[x[0],x]));const add=(arr)=>arr?.forEach(x=>out.set(x[0],x));state.works.forEach(w=>{const r=state.roles[w];if(w==='market'){if(r==='organizer'||r==='both')add(toolMap.market_organizer);if(r==='participant'||r==='both')add(toolMap.market_participant)}else if(w==='consign'){if(r==='operator'||r==='both')add(toolMap.consign_operator);if(r==='seller'||r==='both')add(toolMap.consign_seller)}else add(toolMap[w])});return [...out.values()]}function render(){prog();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><h2>你目前同時在做哪些工作或副業？</h2><p>可以複選。這一頁只辨識工作組合，不是在叫你挑功能。</p></div>${cards(work,k=>state.works.has(k))}${nav()}`;document.querySelectorAll('#stage input').forEach(i=>i.onchange=()=>i.checked?state.works.add(i.value):state.works.delete(i.value));}if(state.step===1){let html='<div class="head"><h2>每份工作裡，你扮演的是哪一種角色？</h2><p>只問會影響工具入口的角色差異，不問系統細節。</p></div>';state.works.forEach(w=>{const label=work.find(x=>x[0]===w)?.[1]||w;html+=`<div class="group"><h3>${label}</h3>${cards(roles[w]||[],k=>state.roles[w]===k,'radio','role_'+w)}${state.roles[w]?`<div class="unit">DOING 會先理解為：<b>${unitText(w)}</b></div>`:''}</div>`});s.innerHTML=html+nav('看看會啟用什麼 →');document.querySelectorAll('#stage input').forEach(i=>i.onchange=()=>{const w=i.name.replace('role_','');state.roles[w]=i.value;render()});}if(state.step===2){const workRows=[...state.works].map(w=>{const label=work.find(x=>x[0]===w)?.[1]||w;return `<div class="workitem"><b>${label}</b><small>${unitText(w)}</small></div>`}).join('');const tools=selectedTools();s.innerHTML=`<div class="summary"><div class="heroResult"><div class="resultMain"><small>DOING 對你的理解</small><h2 style="margin:6px 0 8px">你是「多工作整合型」使用者</h2><p style="margin:0;line-height:1.7">你不是只做一件事，所以 DOING 會把不同工作放進同一個工作空間，而不是要求你開很多套系統。</p></div><div class="resultSide"><b>這次問卷只負責一件事</b><p style="margin:6px 0 0;line-height:1.65">先把工具開對。真正的時間、價格、人員、流程規則，進系統後再設定。</p></div></div><div class="box"><h3>你目前要管理的工作</h3><div class="workmap">${workRows}</div></div><div class="box"><h3>DOING 會先替你啟用這些工具</h3><div class="tools">${tools.map(([t,d])=>`<div class="tool"><strong>${t}</strong><span>${d}</span></div>`).join('')}</div></div><div class="box"><h3>接下來怎麼開始</h3><div class="steps"><div class="step"><span class="num">1</span><div><b>先建立工作空間</b><div class="muted">把你剛選的工作入口放進去。</div></div></div><div class="step"><span class="num">2</span><div><b>進各工作設定細節</b><div class="muted">設定時間、費用、人員、審核、押金、排位等真正營運規則。</div></div></div><div class="step"><span class="num">3</span><div><b>開始使用</b><div class="muted">所有工作回到同一個日曆、收款、通知與紀錄系統。</div></div></div></div></div><div class="box" style="background:var(--mint)"><h3>這樣有理解對嗎？</h3><p class="muted">UAT 不會建立正式租戶或送出正式申請。</p><div class="actions"><button class="btn alt" id="back">← 回去調整</button><button class="btn good" id="ok">對，這樣就對了</button></div></div></div>`;document.getElementById('ok').onclick=()=>alert('UAT 確認完成；正式流程尚未建立。');}if(state.step<2){document.getElementById('next').onclick=()=>{if(state.step===0&&state.works.size===0)return alert('請至少選一種工作或副業');if(state.step===1&&[...state.works].some(w=>!state.roles[w]))return alert('請替每一種工作選一個角色');state.step++;render()};}const back=document.getElementById('back');if(back)back.onclick=()=>{state.step--;render()}}render();</script></body></html>
