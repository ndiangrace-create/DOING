<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>DOING｜智慧申請 UAT v8</title><style>:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:10}.topin{max-width:960px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center}.top img{width:40px;height:40px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;font-size:12px;font-weight:900}.shell{max-width:960px;margin:auto;padding:16px 14px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero h1{font-size:clamp(28px,5vw,42px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:99px}.progress i.on{background:var(--main)}.card{padding:18px}.head h2{margin:0;font-size:24px}.head p{margin:6px 0 0;color:var(--muted);line-height:1.6}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer}.choice:has(input:checked){background:#f1f8f9;border-color:#9bc5cc}.choice input{width:22px;height:22px;accent-color:var(--main)}.choice b{display:block}.choice small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.good{background:#315e5a;color:#fff}.summary{display:grid;gap:12px}.box{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.box.sky{background:var(--sky)}.box.mint{background:var(--mint)}.box h3{margin:0 0 8px}.box p{margin:0;line-height:1.75}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.tool b{display:block;margin-bottom:5px}.tool span{color:var(--muted);line-height:1.5;font-size:14px}.muted{color:var(--muted);font-size:13px}@media(max-width:700px){.choices,.tools{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v8</b><span class="badge">管理單位版｜不建立租戶</span></div></header><main class="shell"><section class="hero"><small>這次不先問功能</small><h1>先告訴我，你真正要管理的是什麼。</h1><p>同樣是市集、寄賣或課程，不同角色要管理的東西完全不同。DOING 先辨認你的角色與管理單位，再替你準備合適的工具。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main><script>'use strict';const state={step:0,work:'',role:'',unit:'',facts:new Set(),pains:new Set()};const $=id=>document.getElementById(id);const work=[['beauty','美容／美甲／按摩／SPA','我提供需要排時間的服務'],['market','市集','我可能主辦，也可能去擺攤'],['consign','寄賣／通路','可能是我經營通路，也可能是我的商品去別人那裡賣'],['course','課程／手作／教學','我自己開課或帶體驗'],['event','活動／講座／展演','我自己辦活動'],['guide','導覽／戶外體驗','我帶團或帶梯次'],['project','設計／接案／工程','我替客戶完成一個長期案件'],['commerce','團購／商品販售','我管理自己的商品與訂單']];const roles={beauty:[['provider','我自己提供服務','我要管理客人的一次服務']],market:[['organizer','我是主辦','我要管理一場市集'],['participant','我是攤商／參與者','我只管理自己的出攤與業績'],['both','兩種都有','主辦與出攤都要管理']],consign:[['operator','我經營寄賣／通路','我要管理進駐品牌、商品與結算'],['seller','我的商品去別人的通路寄賣','我只管理自己的寄賣合作、業績與結算'],['both','兩種都有','經營通路，也有自己的商品外寄']],course:[['organizer','我自己開課','我要管理每一梯課程與學員']],event:[['organizer','我自己辦活動','我要管理每一場活動']],guide:[['guide','我是帶團／導覽的人','我要管理每一梯次或每一場導覽']],project:[['provider','我是接案／工程執行方','我要管理一個客戶案件']],commerce:[['seller','我是販售方','我要管理商品、訂單與收款']]};const units={beauty:'一筆預約／一次服務',market:{organizer:'一場市集',participant:'一次出攤紀錄',both:'一場市集＋一次出攤紀錄'},consign:{operator:'一批進駐品牌／商品',seller:'一段寄賣合作',both:'通路營運＋自己的寄賣合作'},course:'一梯課程',event:'一場活動',guide:'一梯導覽／體驗',project:'一個客戶案件',commerce:'一批商品／訂單'};const factsBy={beauty:[['booking','客人會先預約時間'],['duration','不同服務時間長度不同'],['staff','可能指定不同服務人員'],['deposit','可能收訂金'],['repeat','同一位客人會持續回來']],market_organizer:[['review','攤商要先審核'],['seat','需要安排攤位位置'],['payment','要收攤費／押金'],['checkin','現場要報到／核銷'],['notice','需要行前通知']],market_participant:[['daily_sales','我要每天登記營業額'],['expense','我要記該場成本／支出'],['multiday','有多日活動，要分日紀錄'],['summary','我要自動算單場總業績／淨收入']],consign_operator:[['stock','要管理上架、庫存、售出、退回'],['split','要算抽成／分潤'],['brands','會有多個進駐品牌'],['settle','要替不同品牌結算']],consign_seller:[['channel','我要記合作通路與上架期間'],['sales','我要記自己的銷售／退回'],['split','我要知道被抽多少'],['settle','我要記實收與結算']],course:[['capacity','每梯有名額'],['registration','要收報名'],['payment','要收款'],['materials','可能要準備材料／商品'],['checkin','上課要報到']],event:[['registration','要收報名'],['review','可能需要審核'],['payment','要收款／票券'],['seat','可能有座位／位置'],['checkin','現場要報到']],guide:[['capacity','每梯有名額'],['registration','要收報名'],['condition','會受天氣／潮汐／場地影響'],['minpeople','可能要達最低人數才成行'],['reschedule','可能需要改期／取消通知']],project:[['stage','案件會分階段'],['files','要管理照片／檔案'],['approval','需要客戶確認'],['milestone','可能分階段請款'],['acceptance','會有驗收／結案']],commerce:[['orders','要管理訂單'],['stock','要管理庫存'],['payment','要收款／對帳'],['pickup','要管理取貨／出貨']]};const pains=[['time','時間安排最煩'],['money','收款／對帳最煩'],['people','客人／參加者資料最煩'],['notify','提醒／通知最煩'],['onsite','現場流程最煩'],['stock','商品／庫存最煩'],['profit','想知道真正賺多少'],['team','團隊協作最煩']];function prog(){ $('progress').innerHTML=[0,1,2,3,4].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('')}function choices(items,setName,single=false){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="${single?'radio':'checkbox'}" name="${setName}" value="${k}" ${single?(state[setName]===k?'checked':''):(state[setName].has(k)?'checked':'')}><span><b>${t}</b><small>${d||''}</small></span></label>`).join('')+'</div>'}function bind(setName,single=false){document.querySelectorAll('#stage input').forEach(i=>i.onchange=()=>{if(single)state[setName]=i.value;else i.checked?state[setName].add(i.value):state[setName].delete(i.value);})}function nav(label='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<span></span>'}<button class="btn primary" id="next">${label}</button></div>`}function facts(){if(state.work==='market'){let arr=[];if(state.role==='organizer'||state.role==='both')arr=arr.concat(factsBy.market_organizer);if(state.role==='participant'||state.role==='both')arr=arr.concat(factsBy.market_participant);return [...new Map(arr.map(x=>[x[0],x])).values()]}if(state.work==='consign'){let arr=[];if(state.role==='operator'||state.role==='both')arr=arr.concat(factsBy.consign_operator);if(state.role==='seller'||state.role==='both')arr=arr.concat(factsBy.consign_seller);return [...new Map(arr.map(x=>[x[0],x])).values()]}return factsBy[state.work]||[]}function toolPlan(){const F=state.facts,W=state.work,R=state.role,out=[];const add=(t,d)=>out.push([t,d]);add('工作總日曆','把這份工作的日期、時段與重要節點集中在一起');if(F.has('booking'))add('預約與空檔','讓客人看可預約時間並完成預約');if(F.has('review'))add('申請與審核','收資料後先審核，再進下一步');if(F.has('seat'))add('位置安排','管理攤位、座位或現場位置');if(F.has('daily_sales'))add('每日業績','每天登記營業額並自動累計');if(F.has('expense')||F.has('summary'))add('出攤損益','記錄成本、支出、總業績與淨收入');if(F.has('stock')||F.has('sales'))add('商品／庫存／寄賣','記上架、庫存、售出與退回');if(F.has('split')||F.has('settle'))add('抽成與結算','記錄抽成、應收、實收與結算');if(F.has('registration')||F.has('capacity'))add('報名與名額','管理梯次、名額與參加者');if(F.has('condition')||F.has('minpeople')||F.has('reschedule'))add('成行與改期','管理天氣、成行條件、改期與取消通知');if(F.has('stage')||F.has('approval')||F.has('acceptance'))add('專案進度','管理階段、確認、驗收與結案');if(F.has('files'))add('照片與檔案','把案件附件與照片放在同一份工作裡');if(F.has('payment')||F.has('deposit')||F.has('milestone'))add('收款與對帳','集中管理訂金、付款、請款與對帳');if(F.has('checkin'))add('報到／核銷','現場快速確認人員或票券');if(F.has('repeat'))add('顧客紀錄與回訪','保留歷史服務、偏好與回訪紀錄');return [...new Map(out.map(x=>[x[0],x])).values()]}function unitText(){const u=units[state.work];return typeof u==='string'?u:(u&&u[state.role])||''}function render(){prog();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><h2>你想管理哪一種工作？</h2><p>先選一種來測，這裡只是找入口，不直接決定你會拿到什麼工具。</p></div>${choices(work,'work',true)}${nav()}`;bind('work',true)}if(state.step===1){const r=roles[state.work]||[];s.innerHTML=`<div class="head"><h2>你在這件工作裡是什麼角色？</h2><p>同一種工作，主辦方和參與者要管理的東西可能完全不同。</p></div>${choices(r,'role',true)}${nav()}`;bind('role',true)}if(state.step===2){const f=facts();s.innerHTML=`<div class="head"><h2>你真正要管理的是：${unitText()}</h2><p>下面不是問「你想不想要功能」，而是問這些事情有沒有真的發生在你的工作裡。</p></div>${choices(f,'facts',false)}${nav('再做一次安全補漏 →')}`;bind('facts',false)}if(state.step===3){const extra=[['staff','會有多人一起處理／排班'],['resource','會用到房間、設備或場地，不能撞時間'],['esign','會需要對方確認或電子簽名'],['qr','會需要掃碼報到／核銷'],['product','會一起賣商品／票券'],['finance','想看這份工作的收入、支出與損益']];s.innerHTML=`<div class="head"><h2>最後補漏：你的工作還有這些情況嗎？</h2><p>只有勾選「真的有發生」的。這一頁是避免少配工具，不是痛點問卷。</p></div>${choices(extra,'facts',false)}<div class="head" style="margin-top:20px"><h2>哪些事情你希望 DOING 優先幫你整理？</h2><p>這裡可以多選，甚至全選也沒關係；只影響優先順序，不會決定你有沒有某個工具。</p></div>${choices(pains,'pains',false)}${nav('看 DOING 的理解 →')}`;bind('facts',false);document.querySelectorAll('input[name="pains"]').forEach(i=>i.onchange=()=>{i.checked?state.pains.add(i.value):state.pains.delete(i.value)})}if(state.step===4){const wt=work.find(x=>x[0]===state.work)?.[1]||'';const rt=(roles[state.work]||[]).find(x=>x[0]===state.role)?.[1]||'';const tools=toolPlan();s.innerHTML=`<div class="summary"><div class="box sky"><h3>我先確認有沒有真的懂你</h3><p>你做的是 <b>${wt}</b>，在這件工作裡你是 <b>${rt}</b>。你真正要管理的核心是 <b>${unitText()}</b>。</p></div><div class="box mint"><h3>DOING 會幫你準備</h3><div class="tools">${tools.map(([t,d])=>`<div class="tool"><b>${t}</b><span>${d}</span></div>`).join('')}</div></div><div class="box"><h3>你的痛點只決定優先順序</h3><p>${state.pains.size?pains.filter(x=>state.pains.has(x[0])).map(x=>x[1]).join('、'):'你沒有特別指定，DOING 就依工作流程安排。'}</p><p class="muted">這些選項不會額外開啟或關閉工具。</p></div><div class="box"><h3>這樣的理解和規劃符合你嗎？</h3><div class="actions"><button class="btn good" id="yes">對，就是這樣</button><button class="btn alt" id="fix">有些地方不對</button></div></div></div>`;$('yes').onclick=()=>alert('UAT：確認完成。正式申請尚未建立。');$('fix').onclick=()=>{state.step=0;render()}}if(state.step<4){$('next').onclick=()=>{if(state.step===0&&!state.work)return alert('請先選一種工作');if(state.step===1&&!state.role)return alert('請先選角色');state.step++;render()};if($('back'))$('back').onclick=()=>{state.step--;render()}}}render();</script></body></html>
