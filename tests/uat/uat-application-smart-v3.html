<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING｜智慧申請 UAT v3</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--warn:#fff8e8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:1000px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:1000px;margin:auto;padding:16px 14px 72px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{color:var(--main);font-weight:900}.hero h1{font-size:clamp(27px,5vw,43px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:76px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice span span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-height:82px;resize:vertical}.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--sky);color:#4d6269;line-height:1.6}.presetbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.preset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.preset:hover{background:var(--mint)}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}.btn:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;color:var(--muted)}.result{display:grid;gap:14px}.resultbox{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.resultbox h3{margin:0 0 10px}.analysis{white-space:pre-wrap;line-height:1.8;font-size:16px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:10px;background:var(--mint);font-weight:850}.chip.work{background:var(--sky)}.summary{display:grid;gap:8px}.summary div{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fafcfc}.status{font-size:13px;color:var(--muted);margin-top:8px}.warning{background:var(--warn);padding:11px 12px;border-radius:12px;line-height:1.55}@media(max-width:700px){.choices{grid-template-columns:1fr}.actions .btn{flex:1}.actions .btn.ghost{flex:0 0 100%}.hero,.card{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v3</b><span class="badge">能力積木版｜不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>工作入口 × 能力積木 × 共用工具</small><h1>你不需要把自己塞進一個產業。</h1><p>先勾你真的在做的工作，再補問只有你才需要的工作方式。相同資訊只問一次，最後才由 DOING 智慧分析整理成適合你的工作平台。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev';
const state={step:0,works:new Set(),capabilities:new Set(),priorities:new Set(),other:'',aiReply:'',aiSource:'',aiError:''};
const workTypes=[
 ['beauty_service','美容美髮／美甲／按摩／SPA','需要安排服務時間的個人服務',['booking']],
 ['teaching','教學／課程／手作體驗','自己開課、帶團體或做體驗',['course']],
 ['event_host','活動／講座／展演主辦','自己發起並管理參加者',['event']],
 ['market_host','市集主辦／招商','自己招募並管理攤商或品牌',['market']],
 ['market_vendor','攤商／餐車／參加別人的市集','你是參加者，不是該市集主辦',['participant']],
 ['consignment','寄賣／百貨／通路合作','商品放在合作通路販售並定期結算',['commerce']],
 ['commerce','團購／代購／商品販售','需要整理商品、訂單、數量或取貨',['commerce']],
 ['project_service','設計／顧問／網站／婚禮接案','接到需求後持續一段時間完成',['project']],
 ['construction','室內設計／裝修／工程','有多階段、驗收或工班協作',['project']],
 ['guide_outdoor','導覽／戶外體驗／帶團','有日期、集合、名額，可能受外部條件影響',['course','event']],
 ['rental','場地／教室／設備出租','同一資源同一時間不能重複使用',['booking']],
 ['home_service','到府清潔／維修／照護／美容','到客戶指定地點提供服務',['booking']],
 ['other','其他工作','找不到適合的再補充',['other']]
];
const capabilityCatalog=[
 ['one_to_one','一對一預約服務','客人從可用時段中選時間',['booking']],
 ['different_duration','不同服務時間長度不一樣','例如 60／90／120 分鐘',['booking']],
 ['group_slot','同一時段多人一起開始','例如手作課、團體課、導覽團',['course','event']],
 ['capacity','日期或時段有名額上限','滿額後停止接受',['course','event','market','booking']],
 ['organizer_review','送出資料後要先審核','例如攤商、合作單位、資格審核',['market','event']],
 ['organizer_place','你要替參加單位安排位置','例如攤位、展區、座位',['market','event']],
 ['project_stages','一個案子分多個階段完成','例如丈量→設計→施工→驗收',['project']],
 ['project_handoff','同一案子由不同人分工接手','例如設計師→工班→驗收',['project']],
 ['resource_lock','人員／房間／設備不能撞時段','同一資源不能同時被兩份工作占用',['booking','course']],
 ['repeat_customer','同一位客人會持續回來','需要保留服務紀錄與偏好',['booking']],
 ['consignment_stock','寄賣要記錄上架、庫存、售出與退回','不同通路各自有數量與期間',['commerce']],
 ['channel_settlement','寄賣／通路需要抽成或結算','記錄抽成比例、應收與結算日',['commerce']],
 ['external_condition','工作會受天氣、潮汐、海況、場地或交通影響','條件不適合時可能待確認、改期或取消',['event','course']],
 ['min_group','需要達到最低人數才成行','未達門檻時可能延期或取消',['event','course']],
 ['orders','需要管理商品、訂單、數量或取貨','適合團購、代購、商品販售',['commerce','participant']]
];
const priorities=[
 ['calendar','把不同工作的行程放在一起'],['payment','收款、付款確認與對帳'],['booking','不要再靠訊息來回喬時間'],['registration','報名、名單與通知整合'],['seating','位置／攤位／座位安排'],['finance','知道每份工作賺多少、花多少'],['files','照片、檔案、圖面與附件集中'],['team','團隊分工、排班與權限'],['customer','顧客紀錄、偏好與回訪'],['checkin','報到／核銷更快'],['inventory','商品、寄賣、庫存與結算'],['conditions','天氣／潮汐／外部條件變動時快速處理'],['other','其他困擾']
];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tags(){const out=new Set();for(const [k,,,ts] of workTypes)if(state.works.has(k))ts.forEach(x=>out.add(x));return out}
function relevantCapabilities(){const t=tags();return capabilityCatalog.filter(x=>x[3].some(k=>t.has(k)))}
function cards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b><span>${d}</span></span></label>`).join('')+'</div>'}
function bind(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>{x.checked?set.add(x.value):set.delete(x.value)})}
function progress(){$('progress').innerHTML=[0,1,2,3].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('')}
function backNext(nextLabel='下一步 →'){return `<div class="actions"><button class="btn ${state.step?'alt':'ghost'}" id="back">${state.step?'← 上一步':'重新開始'}</button><span class="hint">可複選；沒有符合的就略過。</span><button class="btn primary" id="next">${nextLabel}</button></div>`}
function preset(name){state.works.clear();state.capabilities.clear();state.priorities.clear();state.other='';if(name==='A'){['beauty_service','market_host','consignment'].forEach(x=>state.works.add(x));['one_to_one','different_duration','organizer_review','organizer_place','consignment_stock','channel_settlement'].forEach(x=>state.capabilities.add(x));['calendar','payment','booking','seating','inventory','customer'].forEach(x=>state.priorities.add(x));state.other='美甲接客，同時自己辦市集，也有百貨寄賣。';}if(name==='B'){['guide_outdoor'].forEach(x=>state.works.add(x));['group_slot','capacity','external_condition','min_group'].forEach(x=>state.capabilities.add(x));['calendar','registration','conditions','payment','checkin'].forEach(x=>state.priorities.add(x));state.other='導覽工作會受到天氣、潮汐與海況影響。';}if(name==='C'){['construction','teaching'].forEach(x=>state.works.add(x));['project_stages','project_handoff','group_slot','capacity'].forEach(x=>state.capabilities.add(x));['calendar','payment','files','team','registration'].forEach(x=>state.priorities.add(x));state.other='室內設計接案，同時也會開手作課。';}state.step=0;render()}
function workModules(){const t=tags(),out=[];if(t.has('booking'))out.push('預約');if(t.has('course'))out.push('課程');if(t.has('event'))out.push('活動');if(t.has('market'))out.push('市集');if(t.has('project'))out.push('專案');return [...new Set(out)]}
function capabilityLabels(){return capabilityCatalog.filter(x=>state.capabilities.has(x[0])).map(x=>x[1])}
function tools(){const out=new Set(),P=state.priorities,C=state.capabilities;if(P.has('calendar'))out.add('工作日曆／日曆同步');if(P.has('payment'))out.add('收款／訂金／對帳');if(P.has('registration'))out.add('報名／名單／通知');if(P.has('seating')||C.has('organizer_place'))out.add('位置安排');if(P.has('finance'))out.add('進階財務');if(P.has('files')||C.has('project_stages'))out.add('照片／檔案');if(P.has('team')||C.has('project_handoff'))out.add('團隊／排班／權限');if(P.has('customer')||C.has('repeat_customer'))out.add('顧客管理／回訪');if(P.has('checkin'))out.add('QR 報到／核銷');if(P.has('inventory')||C.has('consignment_stock'))out.add('商品／庫存／寄賣');if(C.has('channel_settlement'))out.add('寄賣抽成／通路結算');if(P.has('conditions')||C.has('external_condition'))out.add('成行條件／改期通知');if(C.has('organizer_review'))out.add('審核／候補');if(C.has('capacity'))out.add('名額管理');if(P.has('booking')||C.has('one_to_one'))out.add('預約時段');return [...out]}
function aiPayload(){const t=tags();const useCases=[];if(t.has('market'))useCases.push('market');if(t.has('course'))useCases.push('workshop');if(t.has('booking'))useCases.push('service_booking');if(t.has('event'))useCases.push('event');if(!useCases.length)useCases.push('general');const pain=[];if(state.priorities.has('payment'))pain.push('payment');if(state.priorities.has('calendar')||state.priorities.has('booking'))pain.push('schedule');if(state.priorities.has('seating'))pain.push('seating');if(state.priorities.has('finance'))pain.push('finance');if(state.priorities.has('files'))pain.push('scattered');if(state.priorities.has('team'))pain.push('staff_mix');if(state.priorities.has('checkin'))pain.push('checkin');if(state.priorities.has('registration'))pain.push('status');if(!pain.length)pain.push('other');const workSituations=[];if(state.priorities.has('team')||state.capabilities.has('project_handoff'))workSituations.push('team');if(state.capabilities.has('one_to_one'))workSituations.push('appointment');if(state.works.size>1)workSituations.push('one_brand_many_jobs');const work=workTypes.filter(x=>state.works.has(x[0])).map(x=>x[1]).join('、');const caps=capabilityLabels().join('、');const pri=priorities.filter(x=>state.priorities.has(x[0])).map(x=>x[1]).join('、');return {action:'analyzeDoingApplication',topic:'summary',useCases,painPoints:pain,workSituations,openAnswers:{industry:work,work:`工作：${work}。工作方式：${caps}。補充：${state.other}`,pain:`最想改善：${pri}。請先理解此人可同時有多重工作角色；不要把「參加別人的市集」誤判成市集主辦。寄賣／通路合作是商品與結算能力，不是新的大工作模組。天氣、潮汐、海況、場地等屬外部成行條件。`}}}
async function analyze(){state.aiError='';state.aiReply='';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(aiPayload())});const j=await r.json();if(!r.ok||j.ok===false||!j.reply)throw new Error(j.error||'智慧分析暫時無法完成');state.aiReply=j.reply;state.aiSource=j.source||'ai'}catch(e){state.aiError=String(e.message||e);state.aiReply=`系統目前理解你同時有 ${workModules().join('、')||'多種'} 工作入口，並需要 ${capabilityLabels().slice(0,4).join('、')||'依實際情境補充能力'}。最優先要整合的是 ${tools().slice(0,5).join('、')||'日常工作流程'}。`;state.aiSource='rules-fallback'}}
function render(){progress();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><div><h2>① 你現在有哪些工作？</h2><p>這裡只辨識「工作入口」，不在這一層追問細節。</p></div><span class="count">${state.works.size} 項</span></div><div class="presetbar"><button class="preset" data-p="A">測試：美甲＋市集＋寄賣</button><button class="preset" data-p="B">測試：導覽＋天氣潮汐</button><button class="preset" data-p="C">測試：室內設計＋手作</button></div>${cards(workTypes,state.works)}<div class="field"><label>其他補充（選填）</label><textarea id="other" placeholder="例如：平常有正職，假日擺攤，也會接設計案。">${esc(state.other)}</textarea></div>${backNext()}`;bind(state.works);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>preset(b.dataset.p));$('other').oninput=e=>state.other=e.target.value;}else if(state.step===1){const items=relevantCapabilities();s.innerHTML=`<div class="head"><div><h2>② 你的工作實際怎麼跑？</h2><p>只顯示和你剛剛工作相關的「能力積木」。相同資訊不會再問第二次。</p></div><span class="count">${items.length} 題</span></div>${cards(items,state.capabilities)}<div class="note">寄賣、通路結算、天氣／潮汐成行條件都屬於能力積木，不會因此多開一個新的大工作模組。</div>${backNext()}`;bind(state.capabilities);}else if(state.step===2){s.innerHTML=`<div class="head"><div><h2>③ 你最想先改善什麼？</h2><p>這一步只決定哪些共用工具要優先，不再重問工作方式。</p></div><span class="count">${state.priorities.size} 項</span></div>${cards(priorities.map(x=>[x[0],x[1],'']),state.priorities)}${backNext('開始智慧分析 →')}`;bind(state.priorities);}else{s.innerHTML=`<div class="head"><div><h2>④ DOING 怎麼理解你</h2><p>先理解多重工作身分，再把工作入口、能力積木與共用工具組起來。</p></div></div><div class="result"><div class="resultbox"><h3>智慧理解</h3><div class="analysis">${esc(state.aiReply||'分析中…')}</div><div class="status">分析來源：${esc(state.aiSource||'準備中')}</div>${state.aiError?`<div class="warning">AI 暫時失敗，已退回規則分析：${esc(state.aiError)}</div>`:''}</div><div class="resultbox"><h3>工作入口</h3><div class="chips">${workModules().map(x=>`<span class="chip work">${x}</span>`).join('')||'<span class="status">沒有足夠資料</span>'}</div></div><div class="resultbox"><h3>下插能力積木</h3><div class="chips">${capabilityLabels().map(x=>`<span class="chip">${x}</span>`).join('')||'<span class="status">尚未選擇</span>'}</div></div><div class="resultbox"><h3>建議接上的共用工具</h3><div class="chips">${tools().map(x=>`<span class="chip">${x}</span>`).join('')||'<span class="status">尚未選擇</span>'}</div></div><div class="note">AI 只負責理解與建議；正式可用模組仍需系統規則與平台核准。這個 UAT 不建立租戶、不寫正式申請。</div></div>${backNext('重新分析')}`}
 if($('back'))$('back').onclick=()=>{if(state.step===0){state.works.clear();state.capabilities.clear();state.priorities.clear();state.other='';}else state.step--;render()};if($('next'))$('next').onclick=async()=>{if(state.step<2){state.step++;render();return}if(state.step===2){state.step=3;render();await analyze();render();return}await analyze();render()}}
render();
</script>
</body>
</html>
