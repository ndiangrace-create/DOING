<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING｜智慧申請分析 UAT</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6a7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:16px 14px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{font-weight:900;color:var(--main)}.hero h1{font-size:clamp(28px,5vw,44px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.field textarea,.field input{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px}.field textarea{min-height:108px;resize:vertical}.example{font-size:13px;color:var(--muted);line-height:1.55}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:78px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice span span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}.btn:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;color:var(--muted)}.result{display:grid;gap:14px}.resultbox{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.resultbox h3{margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 10px;border-radius:10px;background:var(--mint);font-weight:850}.chip.work{background:var(--sky)}.analysis{white-space:pre-wrap;line-height:1.75;font-size:17px}.summary{display:grid;gap:8px}.summary div{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#f9fbfb}.notice{padding:12px 14px;border-radius:13px;background:#f3f8f7;color:#4f6269;line-height:1.6}.status{font-size:13px;color:var(--muted);margin-top:8px}.motive-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.motive{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;cursor:pointer;font-weight:800}.motive.on{background:var(--mint);border-color:#b8d8d3}@media(max-width:680px){.choices{grid-template-columns:1fr}.actions .btn{flex:1}.actions .btn.ghost{flex:0 0 100%}.hero,.card{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請分析</b><span class="badge">UAT｜不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>先讓 DOING 理解你，再談功能</small><h1>你可以同時做很多種工作。</h1><p>自由描述、工作類型與情境會一起交給 DOING 智慧分析。最後的功能只是建議，正式開通仍由平台核准。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev';
const state={step:0,workText:'',painText:'',motives:new Set(),types:new Set(),situations:new Set(),admin:new Set(),otherType:'',aiReply:'',aiSource:'',aiError:''};
const motives=[['scattered','我的工作很多，資料常常散在不同地方'],['schedule','我不想一直用訊息來回喬時間'],['payment','報名、付款、通知常常分開處理'],['finance','我常常要追誰付錢了、誰還沒付'],['calendar','我想把不同工作的行程整理在一起'],['people','我需要管理很多客人／參加者'],['team','我跟其他人一起工作，需要分工'],['files','照片、檔案、進度常常找不到'],['repeat','我常常重複整理名單或資料'],['many_jobs','我同時做很多不同類型的工作']];
const workTypes=[['beauty','美甲／美睫／美容預約','我自己接客，會安排服務時間'],['hairspa','美髮／按摩／SPA','一對一或固定時段服務'],['photo','攝影／造型／個人服務','例如攝影、彩妝、造型、顧問'],['fortune','算命／塔羅／諮詢','需要預約時段的一對一服務'],['tutor','家教／一對一教學','固定或彈性安排學生時間'],['class','我自己開課／教學','例如美甲課、語言課、技能課'],['workshop','手作／體驗課程','例如香氛、陶藝、烘焙、DIY'],['group','團體課／團體活動','例如瑜珈、健身、導覽、團體體驗'],['event_host','我自己辦活動／講座／展演','我是主辦，不只是去參加'],['market_host','我自己舉辦市集／招募攤商','我要管理其他品牌或攤商'],['market_vendor','我是攤商，會參加別人的市集','我是參加者，不是市集主辦'],['foodtruck','餐車／攤位出攤','平常會到不同場地營業'],['groupbuy','團購／代購','會整理訂單、收款、出貨或取貨'],['retail','商品販售','實體或線上販售商品'],['design_job','設計／網站／品牌接案','例如品牌設計、平面設計、網站製作，接到需求後持續一段時間完成'],['construction','室內設計／裝修／工程','例如丈量→設計→施工→驗收'],['wedding','婚禮／活動企劃','例如提案→確認→籌備→現場執行'],['guide','導覽／帶團／戶外體驗','有日期、名額與集合安排'],['rental','場地／教室／攝影棚出租','同一時間不能重複出租'],['pet','寵物美容／照護','需要預約、顧客與服務紀錄'],['home','到府服務','例如清潔、照護、維修、到府美容'],['other','其他工作','沒有符合的話可以自己補充']];
const situations=[['pick_time','客人或參加者需要自己挑日期或時間','例如從你開放的空檔中選一個時段'],['different_time','不同服務需要的時間長短不一樣','例如基礎保養 60 分鐘、完整服務 120 分鐘'],['group_same_time','同一時間可能會有一整組人一起開始','例如 12 人手作課、瑜珈課、20 人導覽團'],['capacity','每個日期或時段都有上限','滿額後就不能再收人'],['review','對方送出資料後，我要先看過才能決定是否接受','例如攤商審核、課程資格、合作申請'],['place','我自己主辦活動時，需要安排不同人或單位的位置','例如市集攤位、展區、座位；只是參加別人的活動不用勾'],['resource','有些人員、房間或設備同一時間不能重複使用','例如同一位美甲師不能同時接兩位客人；同一間教室不能同時開兩堂課'],['stages','我接的案子通常會分好幾個階段完成','例如裝修：丈量→設計→施工→驗收；婚禮：提案→確認→籌備→執行'],['handoff','同一件案子會由不同的人分工接著做','例如設計師確認需求→工班施工→現場驗收'],['repeat_customer','同一位客人可能一直回來找我','希望知道他以前做過什麼、偏好或注意事項']];
const adminNeeds=[['money','我要確認誰已付款、誰還沒付款','常常需要對帳或追款'],['deposit','有些工作要先收訂金或階段款','先收一部分，之後再補餘額'],['refund','有些款項之後需要退回','例如退款、押金或保證金'],['change','常遇到改期、取消或臨時沒出現','希望每次異動都有紀錄'],['remind','我常常需要在事情發生前提醒對方','例如時間、地點、付款、行前通知'],['extra_info','不同工作會需要問不同資料','希望能自己增加問題'],['files','工作過程要留下照片、檔案或附件','之後還要找得到'],['sign','有些事情開始前需要確認條款、同意或簽名','不能只靠口頭'],['checkin','現場需要快速知道誰到了、誰還沒到','例如報到'],['redeem','有些票券或資格用過一次就不能再用','需要核銷紀錄'],['finance','我想知道每一份工作最後賺多少、花多少','不是只看收到多少錢'],['invoice','有些客人會需要發票資料','例如統編、抬頭、載具'],['staff','會有多位工作人員一起使用','每個人不一定能看全部內容'],['schedule','需要安排工作人員哪天上班、休息或請假','人員時間會影響接單'],['calendar','我想把工作時間放進 Google／Apple 日曆','避免重複手動新增'],['followup','我會做熟客回訪、生日提醒或再次邀請','希望可以累積顧客關係'],['addons','主要工作之外，還可能有商品或其他加購','希望跟同一筆工作一起處理']];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function progress(){ $('progress').innerHTML=[0,1,2,3,4].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('') }
function cards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b><span>${d}</span></span></label>`).join('')+'</div>'}
function bindSet(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>{x.checked?set.add(x.value):set.delete(x.value);render()})}
function nav(label='下一步 →'){const back=state.step>0?'<button class="btn alt" id="back">← 上一步</button>':'<button class="btn ghost" id="reset">重新開始</button>';return `<div class="actions">${back}<span class="hint">可複選，不限數量。</span><button class="btn primary" id="next">${label}</button></div>`}
function labels(items,set){return items.filter(x=>set.has(x[0])).map(x=>x[1])}
function useCases(){const T=state.types,out=[];if(T.has('market_host'))out.push('market');if(T.has('event_host'))out.push('event');if(T.has('class')||T.has('workshop')||T.has('group'))out.push('workshop');if(T.has('beauty'))out.push('beauty');if(['hairspa','photo','fortune','tutor','pet','home'].some(x=>T.has(x)))out.push('service_booking');if(T.has('rental'))out.push('resource_booking');if(T.has('guide'))out.push('guide');if(!out.length)out.push('general');return [...new Set(out)].slice(0,12)}
function painPoints(){const A=state.admin,M=state.motives,S=state.situations,out=[];if(A.has('money')||A.has('deposit')||A.has('refund')||M.has('payment')||M.has('finance'))out.push('payment');if(A.has('finance'))out.push('finance');if(A.has('calendar')||A.has('schedule')||M.has('schedule')||M.has('calendar'))out.push('schedule');if(S.has('resource'))out.push('collision');if(A.has('change'))out.push('reschedule');if(A.has('addons'))out.push('extras');if(S.has('place'))out.push('seating');if(A.has('remind'))out.push('notification');if(A.has('checkin'))out.push('checkin');if(A.has('staff')||A.has('schedule')||M.has('team'))out.push('staff_mix');if(A.has('files')||A.has('extra_info')||M.has('scattered'))out.push('scattered');if(M.has('repeat'))out.push('repeat_data');if(S.has('review'))out.push('status');if(!out.length)out.push('other');return [...new Set(out)].slice(0,12)}
function workSituations(){const T=state.types,A=state.admin,S=state.situations,M=state.motives,out=[];if(T.has('beauty')||['hairspa','photo','fortune','tutor','pet','home'].some(x=>T.has(x))||S.has('pick_time'))out.push('appointment');if(A.has('staff')||A.has('schedule')||S.has('handoff')||M.has('team'))out.push('team');if(A.has('deposit'))out.push('deposit');if(S.has('repeat_customer')||A.has('followup'))out.push('shared_customers');if(T.size>1||M.has('many_jobs'))out.push('one_brand_many_jobs');if(T.has('market_host')&&T.has('market_vendor'))out.push('multi_brand');return [...new Set(out)].slice(0,12)}
function recommend(){const T=state.types,S=state.situations,A=state.admin,work=[],tools=[];if(T.has('beauty')||['hairspa','photo','fortune','tutor','pet','home'].some(x=>T.has(x))||S.has('pick_time'))work.push('預約');if(T.has('class')||T.has('workshop')||T.has('group'))work.push('課程');if(T.has('event_host'))work.push('活動');if(T.has('market_host'))work.push('市集');if(['design_job','construction','wedding'].some(x=>T.has(x))||S.has('stages')||S.has('handoff'))work.push('專案');if(S.has('review'))tools.push('審核／候補');if(S.has('capacity'))tools.push('名額管理');if(S.has('place'))tools.push('位置安排');if(S.has('resource'))tools.push('人員／資源管理');if(S.has('repeat_customer')||A.has('followup'))tools.push('顧客管理');if(A.has('money'))tools.push('收款／付款確認');if(A.has('deposit'))tools.push('收款／訂金');if(A.has('refund'))tools.push('退款／押金');if(A.has('change'))tools.push('異動紀錄');if(A.has('remind'))tools.push('通知提醒');if(A.has('extra_info'))tools.push('自訂問卷');if(A.has('files'))tools.push('照片／檔案');if(A.has('sign'))tools.push('電子簽名／條款');if(A.has('checkin'))tools.push('QR 報到');if(A.has('redeem'))tools.push('QR 核銷／票券');if(A.has('finance'))tools.push('進階財務');if(A.has('invoice'))tools.push('發票資料');if(A.has('staff'))tools.push('團隊／權限');if(A.has('schedule'))tools.push('團隊／排班');if(A.has('calendar'))tools.push('Google／Apple 日曆同步');if(A.has('addons'))tools.push('商品／加購');return{work:[...new Set(work)],tools:[...new Set(tools)]}}
function aiPayload(){const typeText=labels(workTypes,state.types).join('、'),situationText=labels(situations,state.situations).join('、'),adminText=labels(adminNeeds,state.admin).join('、'),motiveText=motives.filter(x=>state.motives.has(x[0])).map(x=>x[1]).join('、');return{action:'analyzeDoingApplication',topic:'summary',useCases:useCases(),painPoints:painPoints(),workSituations:workSituations(),openAnswers:{industry:(typeText+(state.otherType?'；其他：'+state.otherType:'')).slice(0,500),work:(state.workText+'\n已選工作類型：'+typeText+'\n實際工作情境：'+situationText).slice(0,500),pain:(state.painText+'\n希望改善：'+motiveText+'\n行政卡點：'+adminText).slice(0,500)}}}
async function runAI(){state.aiError='';state.aiReply='';renderResult(true);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(aiPayload())});const j=await r.json().catch(()=>({}));const d=j.data??j.result??j;if(!r.ok||d.ok===false||!d.reply)throw new Error(d.error||'智慧分析暫時無法使用');state.aiReply=String(d.reply||'');state.aiSource=String(d.source||'');}catch(e){state.aiError=e.message||'智慧分析暫時無法使用';}renderResult(false)}
function resultFallback(){const r=recommend(),roles=[];if(state.types.has('market_host'))roles.push('你有「自己主辦市集」的管理角色');if(state.types.has('market_vendor'))roles.push('你也有「參加別人市集」的參與者角色，這不等於市集管理權');if(state.types.has('beauty'))roles.push('你有一對一預約型服務');if(['design_job','construction','wedding'].some(x=>state.types.has(x)))roles.push('你也有需要持續追蹤的接案／專案工作');return (roles.length?roles.join('；')+'。':'')+(state.painText?'你最在意的是：'+state.painText:'系統會綜合你的工作與行政卡點整理建議。')}
function renderResult(loading=false){progress();const r=recommend(),analysis=loading?'正在讀取你的完整填答，整理工作角色與核心問題…':(state.aiReply||resultFallback());$('stage').innerHTML=`<div class="head"><div><h2>DOING 怎麼理解你</h2><p>這段會綜合自由描述與所有勾選，不只看單一關鍵字。</p></div></div><div class="result"><div class="resultbox"><h3>智慧分析</h3><div class="analysis">${esc(analysis)}</div><div class="status">${state.aiError?esc('目前使用規則備援：'+state.aiError):(state.aiReply?'已完成智慧分析':'')}</div></div><div class="resultbox"><h3>建議先開的工作模組</h3><div class="chips">${(r.work.length?r.work:['目前先不判定']).map(x=>'<span class="chip work">'+esc(x)+'</span>').join('')}</div></div><div class="resultbox"><h3>依你明確勾選需求，建議的工具</h3><div class="chips">${(r.tools.length?r.tools:['目前沒有必要先加工具']).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}</div></div><div class="notice">這仍然是 UAT 建議，不會建立租戶、不會開權限。正式版本仍需平台核准。</div></div><div class="actions"><button class="btn alt" id="back">← 修改填答</button><button class="btn primary" id="reanalyze" ${loading?'disabled':''}>${loading?'分析中…':'重新智慧分析'}</button></div>`;$('back').onclick=()=>{state.step=3;render()};$('reanalyze').onclick=runAI}
function render(){progress();if(state.step===0){$('stage').innerHTML=`<div class="head"><div><h2>先說說你現在的工作</h2><p>不會寫也沒關係，可以先勾下面常見困擾，再補一句自己的情況。</p></div></div><div class="field"><label>你現在主要在做哪些工作？（可簡單寫）</label><textarea id="workText" placeholder="例如：我是美甲師，也會開課；假日會擺攤，偶爾接設計案。">${esc(state.workText)}</textarea></div><div class="field"><label>你最希望 DOING 幫你改善什麼？（可以不寫）</label><textarea id="painText" placeholder="例如：收款、預約、對帳、排位置、每天行程不要再手動整理。">${esc(state.painText)}</textarea></div><div class="field"><label>也可以直接勾你現在最常遇到的困擾</label><div class="motive-grid">${motives.map(([k,t])=>`<button type="button" class="motive ${state.motives.has(k)?'on':''}" data-motive="${k}">${t}</button>`).join('')}</div></div>${nav()}`;$('workText').oninput=e=>state.workText=e.target.value;$('painText').oninput=e=>state.painText=e.target.value;document.querySelectorAll('[data-motive]').forEach(b=>b.onclick=()=>{state.motives.has(b.dataset.motive)?state.motives.delete(b.dataset.motive):state.motives.add(b.dataset.motive);render()})}else if(state.step===1){$('stage').innerHTML=`<div class="head"><div><h2>你希望整合哪些工作類型？</h2><p>這裡可以同時選很多種。自己主辦與只是去參加別人的活動會分開判斷。</p></div><div class="count">已選 ${state.types.size}</div></div>${cards(workTypes,state.types)}<div class="field"><label>其他工作類型</label><input id="otherType" value="${esc(state.otherType)}" placeholder="例如團購直播、自由接案、社群經營"></div>${nav()}`;bindSet(state.types);$('otherType').oninput=e=>state.otherType=e.target.value}else if(state.step===2){$('stage').innerHTML=`<div class="head"><div><h2>工作真正跑起來時，哪些情況會發生？</h2><p>只選實際會發生的，不用替系統猜功能。</p></div><div class="count">已選 ${state.situations.size}</div></div>${cards(situations,state.situations)}${nav()}`;bindSet(state.situations)}else if(state.step===3){$('stage').innerHTML=`<div class="head"><div><h2>哪些行政事情最耗時間？</h2><p>這一區會影響工具建議，也會一起交給智慧分析。</p></div><div class="count">已選 ${state.admin.size}</div></div>${cards(adminNeeds,state.admin)}${nav('開始智慧分析')}`;bindSet(state.admin)}
const back=$('back'),next=$('next'),reset=$('reset');if(back)back.onclick=()=>{state.step--;render()};if(reset)reset.onclick=()=>{state.step=0;state.workText='';state.painText='';state.motives.clear();state.types.clear();state.situations.clear();state.admin.clear();state.otherType='';render()};if(next)next.onclick=()=>{if(state.step<3){state.step++;render()}else{state.step=4;runAI()}}}
render();
</script>
</body>
</html>
