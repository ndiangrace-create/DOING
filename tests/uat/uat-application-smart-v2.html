<title>DOING｜智慧申請 UAT v2</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--warn:#fff8e8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:1000px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:1000px;margin:auto;padding:16px 14px 72px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{color:var(--main);font-weight:900}.hero h1{font-size:clamp(27px,5vw,43px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.sectiontitle{font-weight:900;margin:18px 0 8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:76px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice span span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}.field textarea{min-height:86px;resize:vertical}.example{font-size:13px;color:var(--muted);line-height:1.55}.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--sky);color:#4d6269;line-height:1.6}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}.btn:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;color:var(--muted)}.result{display:grid;gap:14px}.resultbox{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.resultbox h3{margin:0 0 10px}.analysis{white-space:pre-wrap;line-height:1.8;font-size:16px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:10px;background:var(--mint);font-weight:850}.chip.work{background:var(--sky)}.summary{display:grid;gap:8px}.summary div{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fafcfc}.status{font-size:13px;color:var(--muted);margin-top:8px}.feedback{display:flex;gap:8px;flex-wrap:wrap}.fb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.fb.on{background:var(--mint);border-color:#a9cbc5}.warning{background:var(--warn);padding:11px 12px;border-radius:12px;line-height:1.55}@media(max-width:700px){.choices{grid-template-columns:1fr}.actions .btn{flex:1}.actions .btn.ghost{flex:0 0 100%}.hero,.card{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v2</b><span class="badge">不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>先認出自己，再讓 DOING 理解你</small><h1>不用寫作文，也不用先懂系統功能。</h1><p>先勾「你做哪些工作」與「最想改善什麼」，後面的題目會依你的選擇縮小，只問真的可能跟你有關的情境。最後才由智慧分析整理你的工作樣貌。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev';
const state={step:0,types:new Set(),motives:new Set(),situations:new Set(),admin:new Set(),otherWork:'',otherPain:'',aiReply:'',aiSource:'',aiError:'',feedback:''};
const workTypes=[
 ['beauty','美甲／美睫／美容','自己接客、安排服務時間','booking'],['hairspa','美髮／按摩／SPA','一對一或固定時段服務','booking'],['photo','攝影／彩妝／造型／顧問','需要約時間提供個人服務','booking'],['fortune','算命／塔羅／諮詢','一對一預約型服務','booking'],['tutor','家教／一對一教學','安排學生上課時間','booking'],['class','我自己開課／教學','例如美甲課、語言課、技能課','course'],['workshop','手作／體驗課程','例如香氛、陶藝、烘焙、DIY','course'],['group','團體課／導覽／帶團','同一時段多人一起參加','course'],['event_host','我自己辦活動／講座／展演','我是主辦，不只是去參加','event'],['market_host','我自己舉辦市集／招募攤商','我要管理其他品牌或攤商','market'],['market_vendor','我是攤商，會參加別人的市集','我是參加者，不是主辦','participant'],['foodtruck','餐車／攤位出攤','會到不同場地營業','participant'],['groupbuy','團購／代購','整理訂單、收款、出貨或取貨','commerce'],['retail','商品販售','實體或線上賣商品','commerce'],['design_job','設計／網站／品牌接案','例如平面、品牌、網站製作','project'],['construction','室內設計／裝修／工程','例如丈量→設計→施工→驗收','project'],['wedding','婚禮／活動企劃接案','例如提案→確認→籌備→執行','project'],['rental','場地／教室／攝影棚出租','同一時段不能重複出租','booking'],['pet','寵物美容／照護','需要預約與服務紀錄','booking'],['home','到府清潔／照護／維修／美容','到客戶指定地點服務','booking'],['other','其他工作','找不到適合的就勾這個','other']
];
const motives=[
 ['many_jobs','我同時做很多種工作，想整理在一起','scattered'],['schedule','我不想一直用訊息來回喬時間','schedule'],['calendar','我的工作行程散在很多地方','schedule'],['payment','我要一直追付款、對帳','payment'],['registration','報名、名單、通知常常分開處理','status'],['people','客人／參加者很多，資料不好整理','repeat_data'],['seating','我常常要排位置、座位或攤位','seating'],['team','我跟其他人一起工作，需要分工','staff_mix'],['files','照片、檔案、進度常常找不到','scattered'],['repeat','我常常重複填資料、整理名單','repeat_data'],['checkin','現場報到或核銷很花時間','checkin'],['finance','我想知道每份工作到底賺多少、花多少','finance'],['explore','我沒有特定問題，想先看看 DOING 能怎麼幫我','other']
];
const scenarioCatalog=[
 ['pick_time','對方需要自己挑日期或時間','例如從你開放的空檔選一個時段',['booking','course','event']],
 ['different_time','不同服務需要的時間長短不一樣','例如基礎保養 60 分、完整服務 120 分',['booking']],
 ['group_same_time','同一時間會有一整組人一起開始','例如 12 人手作課、瑜珈課、20 人導覽團',['course','event']],
 ['capacity','每個日期或時段都有名額上限','滿額後就不能再收人',['course','event','market','booking']],
 ['review','對方送出資料後，我要先看過才能決定是否接受','例如攤商審核、合作申請、資格審核',['market','event','course']],
 ['place','我自己主辦時，需要安排不同人或單位的位置','例如市集攤位、展區、座位；只是參加別人的活動不用勾',['market','event']],
 ['resource','有些人員、房間或設備同一時間不能重複使用','例如同一位美甲師不能同時接兩位；同一間教室不能同時開兩堂',['booking','course']],
 ['stages','我接的案子會分成幾個階段完成','例如裝修：丈量→設計→施工→驗收',['project']],
 ['handoff','同一件案子會由不同的人分工接著做','例如設計師→工班→現場驗收',['project']],
 ['repeat_customer','同一位客人會一直回來找我','希望保留過去服務、偏好或注意事項',['booking']],
 ['orders','我需要整理商品、訂單、數量或取貨','例如團購、代購或商品加購',['commerce','participant']]
];
const adminCatalog=[
 ['money','確認誰已付款、誰還沒付款','常常需要對帳或追款','payment'],['deposit','先收訂金或階段款','之後再補餘額','payment'],['refund','有些款項之後要退回','退款、押金或保證金','payment'],['change','常遇到改期、取消或臨時沒出現','希望每次異動都有紀錄','booking'],['remind','事情發生前要提醒對方','時間、地點、付款、行前通知','all'],['extra_info','不同工作要問不同資料','希望自己增加問題','all'],['files','工作過程要留照片、檔案或附件','之後還要找得到','all'],['sign','開始前要確認條款、同意或簽名','不能只靠口頭','project'],['checkin','現場要快速知道誰到了','報到或入場','event'],['redeem','票券或資格用過一次不能再用','需要核銷紀錄','event'],['finance','想知道每份工作最後賺多少、花多少','不只看收到多少錢','all'],['invoice','有些客人需要發票資料','統編、抬頭、載具','all'],['staff','會有多位工作人員一起用','每個人不一定看全部內容','team'],['schedule','需要排工作人員上班、休息或請假','人員時間會影響接單','team'],['calendar','想把工作時間放進 Google／Apple 日曆','避免重複手動新增','all'],['followup','會做熟客回訪、生日提醒或再次邀請','希望累積顧客關係','booking'],['addons','主要工作之外還有商品或其他加購','希望跟同一筆工作一起處理','commerce']
];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function progress(){ $('progress').innerHTML=[0,1,2,3,4].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('') }
function choiceCards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b><span>${d}</span></span></label>`).join('')+'</div>'}
function bindSet(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>{x.checked?set.add(x.value):set.delete(x.value);render()})}
function selectedGroups(){const groups=new Set();for(const [k,,,g] of workTypes)if(state.types.has(k))groups.add(g);return groups}
function relevantScenarios(){const g=selectedGroups();return scenarioCatalog.filter(x=>x[3].some(v=>g.has(v)))}
function relevantAdmin(){const g=selectedGroups();const hasTeam=state.motives.has('team');return adminCatalog.filter(x=>x[3]==='all'||x[3]==='payment'&&state.motives.has('payment')||x[3]==='booking'&&g.has('booking')||x[3]==='project'&&g.has('project')||x[3]==='event'&&(g.has('event')||g.has('market')||g.has('course'))||x[3]==='team'&&hasTeam||x[3]==='commerce'&&(g.has('commerce')||g.has('participant')))}
function nav(nextText='下一步 →'){const back=state.step?'<button class="btn alt" id="back">← 上一步</button>':'<button class="btn ghost" id="reset">重新開始</button>';return `<div class="actions">${back}<span class="hint">可複選，不限數量。</span><button class="btn primary" id="next">${nextText}</button></div>`}
function ruleRecommend(){const W=[],T=[];const g=selectedGroups(),S=state.situations,A=state.admin,M=state.motives;
 if(g.has('booking')||S.has('pick_time'))W.push('預約');if(g.has('course'))W.push('課程');if(g.has('event'))W.push('活動');if(g.has('market'))W.push('市集');if(g.has('project'))W.push('專案');
 if(M.has('calendar')||A.has('calendar'))T.push('工作日曆／日曆同步');if(M.has('payment')||A.has('money')||A.has('deposit'))T.push('收款／訂金');if(A.has('refund'))T.push('退款／押金');if(M.has('seating')||S.has('place'))T.push('位置安排');if(S.has('review'))T.push('審核／候補');if(S.has('capacity'))T.push('名額管理');if(S.has('resource')||A.has('schedule'))T.push('人員／排班／資源');if(S.has('repeat_customer')||A.has('followup'))T.push('顧客管理／回訪');if(A.has('remind'))T.push('通知提醒');if(A.has('files'))T.push('照片／檔案');if(A.has('sign'))T.push('電子簽名／條款');if(A.has('checkin'))T.push('QR 報到');if(A.has('redeem'))T.push('QR 核銷／票券');if(M.has('finance')||A.has('finance'))T.push('進階財務');if(A.has('invoice'))T.push('發票資料');if(A.has('extra_info'))T.push('自訂問卷');if(A.has('addons')||S.has('orders'))T.push('商品／加購');if(A.has('staff'))T.push('團隊／權限');
 return {work:[...new Set(W)],tools:[...new Set(T)]}}
function labels(catalog,set){return catalog.filter(x=>set.has(x[0])).map(x=>x[1])}
function aiPayload(){const groups=selectedGroups();const useCases=[];if(groups.has('market'))useCases.push('market');if(groups.has('event'))useCases.push('event');if(groups.has('course'))useCases.push('workshop');if(groups.has('booking'))useCases.push(state.types.has('beauty')?'beauty':'service_booking');if(state.types.has('rental'))useCases.push('resource_booking');if(state.types.has('group'))useCases.push('guide');if(groups.has('project')||groups.has('commerce')||groups.has('participant')||groups.has('other'))useCases.push('general');if(!useCases.length)useCases.push('general');
 const pain=[];for(const [k,,,p] of motives)if(state.motives.has(k)&&['scattered','status','payment','schedule','seating','staff_mix','checkin','finance','repeat_data','other'].includes(p))pain.push(p);for(const k of state.admin){if(['money','deposit','refund'].includes(k))pain.push('payment');if(k==='change')pain.push('reschedule');if(k==='remind')pain.push('notification');if(k==='checkin')pain.push('checkin');if(k==='finance')pain.push('finance');if(k==='addons')pain.push('extras');if(k==='staff'||k==='schedule')pain.push('staff_mix')}if(!pain.length)pain.push('other');
 const workSituations=[];if(groups.has('booking'))workSituations.push('appointment');if(state.admin.has('deposit'))workSituations.push('deposit');if(state.admin.has('staff')||state.admin.has('schedule'))workSituations.push('team');if(state.situations.has('repeat_customer'))workSituations.push('shared_customers');if(groups.has('market'))workSituations.push('multi_brand');if(state.types.size>1)workSituations.push('one_brand_many_jobs');
 const workText=[...labels(workTypes,state.types),state.otherWork].filter(Boolean).join('；');const scenarioText=labels(scenarioCatalog,state.situations).join('；');const painText=[...labels(motives,state.motives),...labels(adminCatalog,state.admin),state.otherPain].filter(Boolean).join('；');
 return {action:'analyzeDoingApplication',topic:'summary',useCases:[...new Set(useCases)].slice(0,12),painPoints:[...new Set(pain)].slice(0,12),workSituations:[...new Set(workSituations)].slice(0,12),openAnswers:{industry:workText,work:scenarioText,pain:painText}}}
async function runAI(){state.aiReply='';state.aiError='';render();try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(aiPayload())});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||'智慧分析暫時無法使用');const x=d.data??d.result??d;state.aiReply=String(x.reply||'').trim();state.aiSource=String(x.source||'');if(!state.aiReply)throw Error('智慧分析沒有回傳內容')}catch(e){state.aiError=String(e.message||e);state.aiReply=fallbackUnderstanding()}render()}
function fallbackUnderstanding(){const r=ruleRecommend(),work=labels(workTypes,state.types);return `我目前理解你同時有這些工作身分：${work.join('、')||'尚未選擇'}。\n你最想改善的是：${labels(motives,state.motives).join('、')||'尚未選擇'}。\n依目前填答，建議先把 ${r.work.join('、')||'日常工作'} 放進同一個工作平台，再依需要接上 ${r.tools.slice(0,5).join('、')||'共用工具'}。`}
function render(){progress();const st=$('stage');if(state.step===0){st.innerHTML=`<div class="head"><div><h2>你現在有哪些工作，想一起整理？</h2><p>不是要你選一個職業。你同時做很多種工作，就全部勾起來。</p></div><div class="count">已選 ${state.types.size}</div></div>${choiceCards(workTypes,state.types)}<div class="field"><label>找不到你的工作？補充一下就好（選填）</label><input id="otherWork" value="${esc(state.otherWork)}" placeholder="例如：平日上班，假日做寵物攝影，也偶爾接團購"></div>${nav()}`;bindSet(state.types);$('otherWork').oninput=e=>state.otherWork=e.target.value}else if(state.step===1){st.innerHTML=`<div class="head"><div><h2>你最希望 DOING 先幫你改善什麼？</h2><p>不用寫動機作文。先勾最有感的麻煩，沒有完全符合再補充。</p></div><div class="count">已選 ${state.motives.size}</div></div>${choiceCards(motives,state.motives)}<div class="field"><label>還有其他困擾嗎？（選填）</label><input id="otherPain" value="${esc(state.otherPain)}" placeholder="例如：我最煩的是每天要在三個地方重複登記同一件事"></div>${nav()}`;bindSet(state.motives);$('otherPain').oninput=e=>state.otherPain=e.target.value}else if(state.step===2){const items=relevantScenarios();st.innerHTML=`<div class="head"><div><h2>下面哪些情況真的會發生在你的工作裡？</h2><p>這一頁已依你前面選的工作縮小範圍，不會把所有產業題目都丟給你。</p></div><div class="count">${items.length} 個相關情境</div></div>${choiceCards(items,state.situations)}<div class="note">如果某一題看了還要猜「它到底在問什麼」，那就是題目需要再改，不是你理解力有問題。</div>${nav()}`;bindSet(state.situations)}else if(state.step===3){const items=relevantAdmin();st.innerHTML=`<div class="head"><div><h2>日常工作裡，哪些事情最需要系統幫忙？</h2><p>這裡只補足操作需求。沒有遇到的不用勾。</p></div><div class="count">${items.length} 個相關項目</div></div>${choiceCards(items,state.admin)}${nav('開始智慧分析')}`;bindSet(state.admin)}else{const r=ruleRecommend();const waiting=!state.aiReply&&!state.aiError;st.innerHTML=`<div class="result"><div class="resultbox"><h3>DOING 怎麼理解你</h3><div class="analysis">${esc(state.aiReply||'正在整理你的工作身分、角色與最想解決的問題…')}</div><div class="status">${state.aiSource?'分析來源：智慧分析＋規則兜底':state.aiError?'智慧分析暫時失敗，已改用規則備援。':'正在分析'}</div></div><div class="resultbox"><h3>建議的工作入口</h3><div class="chips">${r.work.length?r.work.map(x=>`<span class="chip work">${esc(x)}</span>`).join(''):'<span class="hint">目前沒有足夠資訊判斷工作入口</span>'}</div></div><div class="resultbox"><h3>建議接上的工具</h3><div class="chips">${r.tools.length?r.tools.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="hint">目前沒有額外工具建議</span>'}</div></div><div class="resultbox"><h3>這個分析像你嗎？</h3><div class="feedback"><button class="fb ${state.feedback==='yes'?'on':''}" data-fb="yes">很接近</button><button class="fb ${state.feedback==='some'?'on':''}" data-fb="some">有一部分不對</button><button class="fb ${state.feedback==='no'?'on':''}" data-fb="no">差很多</button></div><div class="status">UAT 目前不會把這個回饋寫進正式申請資料。</div></div><div class="warning">這裡的 AI 只負責「理解與建議」。正式能使用哪些模組，仍要依系統規則與平台核准，不會由 AI 自己開權限。</div><div class="actions"><button class="btn alt" id="back">← 回去修改</button><button class="btn primary" id="again" ${waiting?'disabled':''}>重新分析</button></div></div>`;document.querySelectorAll('[data-fb]').forEach(b=>b.onclick=()=>{state.feedback=b.dataset.fb;render()});if($('again'))$('again').onclick=runAI}
 if($('next'))$('next').onclick=async()=>{if(state.step===0&&!state.types.size&&!state.otherWork.trim())return alert('至少選一種工作，或補充你的工作。');if(state.step===1&&!state.motives.size&&!state.otherPain.trim())return alert('至少選一項想改善的事情，或補充困擾。');state.step++;render();if(state.step===4)await runAI()};if($('back'))$('back').onclick=()=>{state.step=Math.max(0,state.step-1);render()};if($('reset'))$('reset').onclick=()=>location.reload()}
render();
</script>
</body>
</html>
