<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DOING｜智慧申請 UAT v7</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--soft:#f9fbfb;--warn:#fff8e8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:16px 14px 72px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{color:var(--main);font-weight:900}.hero h1{font-size:clamp(27px,5vw,42px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head h2{margin:0;font-size:24px}.head p{margin:6px 0 0;color:var(--muted);line-height:1.65}.section{margin-top:18px}.section h3{font-size:17px;margin:0 0 10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:70px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice small{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--sky);line-height:1.6;color:#4d6269}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.good{background:#315e5a;color:#fff}.btn.ghost{background:transparent;color:var(--muted)}.resultHero{padding:18px;border-radius:16px;background:var(--sky)}.resultHero h2{margin:0 0 8px;font-size:26px}.resultHero p{margin:0;line-height:1.75}.bars{display:grid;gap:10px;margin-top:14px}.barrow{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center}.track{height:12px;background:#e8efee;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--main);border-radius:999px}.helpers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.helper{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.helper h3{margin:0 0 6px;font-size:19px}.helper p{margin:0;color:var(--muted);line-height:1.6}.helper.primary{background:var(--mint);border-color:#cfe5dc}.more{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.more summary{cursor:pointer;padding:13px 14px;font-weight:900}.more .inside{padding:0 14px 14px;line-height:1.75;color:#53656c}.confirm{padding:16px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}.warning{background:var(--warn);padding:11px 12px;border-radius:12px;line-height:1.55}.done{padding:18px;border-radius:16px;background:var(--mint);line-height:1.75}@media(max-width:700px){.choices,.helpers{grid-template-columns:1fr}.barrow{grid-template-columns:92px 1fr 36px}.actions .btn{flex:1}.hero,.card{border-radius:15px}}
</style>
</head>
<body><header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v7</b><span class="badge">定案候選｜不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>不是問你想要哪些功能，而是理解你的工作</small><h1>告訴我你平常怎麼工作。</h1><p>基本工具本來就會準備好；我們只確認那些真的會影響你工作方式的差異，避免漏掉你需要的東西。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const state={step:0,works:new Set(),facts:new Set(),safety:new Set(),pains:new Set()};
const workChoices=[['beauty','美容美髮／美甲／按摩／SPA','需要安排服務時間的個人服務'],['course','自己開課／手作／教學','有時段、名額或多人一起參加'],['event','自己辦活動／講座／展演','我是主辦，不只是去參加'],['market','自己辦市集／招募攤商','會管理品牌、報名或現場位置'],['vendor','擺攤／餐車／參加別人的市集','我是參加者，不是主辦'],['consign','百貨寄賣／通路合作','商品放在其他場域販售，之後結算'],['commerce','團購／代購／商品販售','會整理商品、訂單、數量或取貨'],['project','設計／網站／婚禮／接案','一份工作會持續一段時間完成'],['construction','室內設計／裝修／工程','會有設計、施工、驗收等階段'],['guide','導覽／帶團／戶外體驗','日期、集合、名額，可能受外部條件影響'],['rental','場地／教室／設備出租','同一時間不能重複使用'],['home','到府／照護／維修服務','到客戶指定地點提供服務']];
const factBank={beauty:[['selfbook','客人需要自己看空檔、選時間預約'],['duration','不同服務需要不同時間長度'],['staff','客人可能指定不同服務人員'],['repeat','同一位客人會持續回來，需要保留紀錄']],course:[['group','同一時段會有多人一起參加'],['capacity','每個日期／時段有名額上限'],['waitlist','額滿後可能需要候補'],['materials','會有教材、材料或加購品']],event:[['capacity','活動有名額上限'],['review','送出資料後可能需要先審核'],['ticket','可能需要票券或核銷'],['checkin','現場需要快速報到']],market:[['review','攤商報名後需要審核'],['seat','需要安排攤位／位置'],['deposit','可能收訂金、押金或分階段款項'],['checkin','現場需要報到或核銷']],vendor:[['calendar','需要記錄每次出攤行程'],['sales','想記錄每場實際營業額']],consign:[['stock','需要記錄上架、售出、退回與庫存'],['split','需要抽成、分潤或通路結算'],['multichannel','可能同時有多個寄賣點／通路']],commerce:[['orders','需要管理商品、訂單、數量、取貨／出貨'],['stock','需要庫存紀錄'],['split','可能有團購主、合作方或分潤']],project:[['stages','一份案子會分幾個階段完成'],['approval','過程中需要客戶確認或驗收'],['installment','可能分階段收款'],['files','同一案子會累積很多照片、檔案或附件']],construction:[['stages','案子會分丈量、設計、施工、驗收等階段'],['handoff','同一案子會由不同人員接續處理'],['approval','需要客戶／工班確認或驗收'],['installment','可能分階段請款或付款']],guide:[['capacity','每梯次有名額上限'],['condition','會受天氣、潮汐、海況、場地或交通影響'],['minpeople','需要達到最低人數才成行'],['checkin','集合或現場需要報到']],rental:[['resource','人員、房間或設備不能撞時段'],['selfbook','客人需要自己選可用時段'],['deposit','可能需要押金或訂金']],home:[['selfbook','客人需要預約到府時間'],['staff','可能要分派不同服務人員'],['route','需要記錄服務地點與行程']]};
const safetyChoices=[['esign','工作中會需要客戶／參加者電子簽名或同意書'],['team','會有多人一起操作，需要不同權限或排班'],['resource','會管理房間、設備或其他不能撞期的資源'],['ticket','會販售票券、套票、兌換券或服務券'],['checkin','會需要 QR 報到／核銷'],['waitlist','會遇到額滿候補'],['installment','會有訂金、尾款或分階段收付款'],['approval','會有審核、確認、簽認或驗收'],['condition','會因天氣、場地、交通等條件決定改期／取消'],['split','會有抽成、分潤或合作結算']];
const painChoices=[['time','時間、行程或預約常常很亂'],['money','付款、訂金、對帳很分散'],['notify','常常要手動提醒或通知'],['people','客人／參加者資料不好整理'],['position','排位、座位或攤位很花時間'],['stock','商品、庫存、寄賣數量不好追'],['settle','抽成、分潤或通路結算不好對'],['condition','臨時改期、取消或成行條件很麻煩'],['project','專案進度、階段、驗收不好追'],['team','團隊分工、排班或權限很亂'],['files','照片、檔案、附件常常找不到'],['profit','不知道每份工作真正賺多少'],['checkin','現場報到／核銷很花時間']];
const baseTools=[['工作總日曆','不同工作的行程、截止日、預約與場次放在一起看'],['收款／訂金／對帳','把付款狀態、訂金、尾款和對帳集中整理'],['顧客／參加者資料','不用每次重新整理同一個人的資料'],['通知提醒','重要時間、改期、付款與行前資訊集中處理'],['照片／檔案','工作相關附件、照片與紀錄放在同一處'],['基本財務','知道每份工作收入、支出與實際結果'],['團隊／權限','需要合作時再分配不同人可以做什麼'],['商品／票券','需要時可管理商品、票券與兌換內容'],['QR 報到／核銷','需要現場作業時直接使用'],['Google／Apple 日曆','把 DOING 行程同步到個人日曆']];
const $=id=>document.getElementById(id); const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderProgress(){ $('progress').innerHTML=[0,1,2,3,4].map((_,i)=>`<i class="${i<=state.step?'on':''}"></i>`).join('') }
function cards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b>${d?`<small>${d}</small>`:''}</span></label>`).join('')+'</div>'}
function bind(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>x.checked?set.add(x.value):set.delete(x.value))}
function nav(next='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<span></span>'}<button class="btn primary" id="next">${next}</button></div>`}
function dynamicFacts(){const map=new Map();state.works.forEach(w=>(factBank[w]||[]).forEach(x=>map.set(x[0],x)));return [...map.values()]}
function factLabel(k){for(const arr of Object.values(factBank))for(const x of arr)if(x[0]===k)return x[1];const s=safetyChoices.find(x=>x[0]===k);return s?s[1]:k}
function inferredSpecials(){return new Set([...state.facts,...state.safety])}
function workSummary(){const names=workChoices.filter(x=>state.works.has(x[0])).map(x=>x[1]);return names.length?names.join('、'):'你的工作'}
function typeName(){const W=state.works;const types=[];if(W.has('beauty')||W.has('home')||W.has('rental'))types.push('服務型');if(W.has('event')||W.has('market'))types.push('主辦型');if(W.has('course')||W.has('guide'))types.push('教學／帶領型');if(W.has('vendor')||W.has('consign')||W.has('commerce'))types.push('販售／通路型');if(W.has('project')||W.has('construction'))types.push('專案型');return types.length>2?'多角色整合型':(types.join('＋')||'彈性工作型')}
function toolPlan(){const S=inferredSpecials(),out=[...baseTools.map(x=>({name:x[0],desc:x[1],base:true}))];const add=(name,desc,keys)=>{if(keys.some(k=>S.has(k)))out.push({name,desc,base:false})};add('預約與空檔','讓客人看可用時間、自己選時段，也能處理不同服務長度。',['selfbook','duration','staff','resource']);add('名額／候補','管理每個日期或時段可收多少人，額滿後可候補。',['capacity','waitlist','group']);add('審核／簽認','需要先審核、確認、簽名或驗收時可以留下正式紀錄。',['review','approval','esign']);add('位置安排','需要安排攤位、座位或位置時，集中處理與查看。',['seat']);add('寄賣／庫存','記錄上架、售出、退回、剩餘數量與不同通路。',['stock','multichannel','orders','materials']);add('抽成／分潤結算','處理寄賣、團購或合作方抽成與應收應付。',['split']);add('成行與改期','管理最低成行人數、天氣／場地條件、改期與取消通知。',['condition','minpeople']);add('專案進度／驗收','把階段、交接、確認、驗收與相關檔案放在同一個案子裡。',['stages','handoff','approval']);add('分階段收付款','處理訂金、尾款、押金或依階段請款。',['deposit','installment']);add('現場報到／核銷','現場可快速報到、核銷票券或服務內容。',['checkin','ticket']);add('商品／訂單','管理商品、訂單、數量、取貨／出貨與服務券。',['orders','ticket','sales']);return out}
function painScore(){const base={time:20,money:20,notify:20,people:20,position:10,stock:10,settle:10,condition:10,project:10,team:15,files:15,profit:15,checkin:10};state.pains.forEach(k=>base[k]=Math.min(100,(base[k]||10)+65));const S=inferredSpecials();if(S.has('selfbook')||S.has('resource')||S.has('duration'))base.time+=25;if(S.has('seat'))base.position+=50;if(S.has('stock')||S.has('orders'))base.stock+=50;if(S.has('split'))base.settle+=55;if(S.has('condition')||S.has('minpeople'))base.condition+=55;if(S.has('stages')||S.has('approval'))base.project+=55;if(S.has('checkin')||S.has('ticket'))base.checkin+=45;if(S.has('team')||S.has('staff')||S.has('handoff'))base.team+=35;return base}
function helpers(){const plan=toolPlan();const painToTools={time:['工作總日曆','預約與空檔'],money:['收款／訂金／對帳','分階段收付款'],notify:['通知提醒','成行與改期'],people:['顧客／參加者資料'],position:['位置安排'],stock:['寄賣／庫存','商品／訂單'],settle:['抽成／分潤結算'],condition:['成行與改期'],project:['專案進度／驗收'],team:['團隊／權限'],files:['照片／檔案'],profit:['基本財務'],checkin:['現場報到／核銷']};const priority=[];state.pains.forEach(p=>(painToTools[p]||[]).forEach(n=>{if(!priority.includes(n))priority.push(n)}));const ordered=[...priority.map(n=>plan.find(x=>x.name===n)).filter(Boolean),...plan.filter(x=>!priority.includes(x.name))];return ordered.slice(0,5)}
function bars(){const s=painScore();const rows=[['時間安排',s.time],['收款對帳',s.money],['顧客／參加者',s.people],['現場管理',Math.max(s.position,s.checkin)],['商品／寄賣',Math.max(s.stock,s.settle)],['專案／協作',Math.max(s.project,s.team)]];return rows.map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="track"><div class="fill" style="width:${Math.min(100,v)}%"></div></div><b>${Math.min(100,v)}</b></div>`).join('')}
function render(){renderProgress();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><h2>你平常在做哪些工作？</h2><p>可以多選。這只是幫我縮小範圍，不代表你只能用這些。</p></div><div class="section">${cards(workChoices,state.works)}</div>${nav()}`;bind(state.works)}
if(state.step===1){const f=dynamicFacts();s.innerHTML=`<div class="head"><h2>這些事情真的有發生在你的工作裡嗎？</h2><p>只勾「實際會發生」的，不是問你想不想要功能。</p></div><div class="section">${cards(f,state.facts)}</div><div class="note">這一步決定哪些特殊工作方式需要被準備；基本日曆、收款、通知、資料、檔案與財務不需要另外勾。</div>${nav()}`;bind(state.facts)}
if(state.step===2){s.innerHTML=`<div class="head"><h2>最後做一次跨工作補漏</h2><p>下面只放「如果漏掉，可能會少給你需要能力」的情況。跟你無關就不要勾。</p></div><div class="section">${cards(safetyChoices,state.safety)}</div><div class="note">這一頁不是痛點題，是安全補漏。前面有選過的事情，這裡就算不勾也不會消失。</div>${nav()}`;bind(state.safety)}
if(state.step===3){s.innerHTML=`<div class="head"><h2>哪些事情現在特別想優先改善？</h2><p><b>這一頁不會決定你有沒有某個工具。</b>它只決定 DOING 之後先把哪些事情放到你最前面。可以不選，也可以多選。</p></div><div class="section">${cards(painChoices,state.pains)}</div>${nav('看 DOING 怎麼理解我 →')}`;bind(state.pains)}
if(state.step===4){const H=helpers(),all=toolPlan(),special=[...inferredSpecials()].map(factLabel);s.innerHTML=`<div class="resultHero"><h2>你比較像「${esc(typeName())}」</h2><p>我理解你目前同時在做：${esc(workSummary())}。你的工作不是只需要單一功能，而是要把不同工作集中在同一個地方，同時保留各自真正不同的工作方式。</p></div><div class="section"><h3>你的工作重心</h3><div class="bars">${bars()}</div></div><div class="section"><h3>DOING 會先把這些幫手準備在前面</h3><div class="helpers">${H.map((x,i)=>`<div class="helper ${i<3?'primary':''}"><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p></div>`).join('')}</div></div><details class="more"><summary>看完整規劃</summary><div class="inside"><b>基本會準備：</b><br>${baseTools.map(x=>esc(x[0])).join('、')}<br><br><b>依你的工作方式另外需要：</b><br>${special.length?special.map(esc).join('、'):'目前沒有額外特殊條件'}<br><br><b>完整工具：</b><br>${all.map(x=>esc(x.name)).join('、')}</div></details><div class="section confirm"><h3>這樣有真的理解你的工作嗎？</h3><p>確認後，正式流程才會依這份理解建立你的工作空間。這個 UAT 目前只模擬確認，不會真的建立。</p><div class="actions"><button class="btn good" id="yes">對，就是這樣</button><button class="btn alt" id="supplement">我還想補充</button><button class="btn alt" id="wrong">有些地方不對</button></div></div><div class="warning">UAT v7：不建立租戶、不送正式申請、不修改計費或正式資料。</div>`;}
if(state.step<4){$('next').onclick=()=>{if(state.step===0&&!state.works.size)return alert('請至少選一種目前正在做的工作');state.step++;render()}}if($('back'))$('back').onclick=()=>{state.step--;render()};if($('yes'))$('yes').onclick=()=>{$('stage').innerHTML='<div class="done"><b>確認完成。</b><br>這是 UAT 模擬，正式資料沒有建立。這份理解會作為下一階段正式申請流程的候選定案。</div>'};if($('supplement'))$('supplement').onclick=()=>{state.step=2;render()};if($('wrong'))$('wrong').onclick=()=>{state.step=0;render()}}
render();
</script></body></html>
