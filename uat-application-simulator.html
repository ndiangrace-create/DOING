<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING｜申請流程 UAT 模擬 v2</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#66747d;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;padding:6px 9px;border-radius:9px;background:var(--mint);color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:18px 14px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{color:var(--main);font-weight:900}.hero h1{font-size:clamp(28px,5vw,44px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{margin:14px 0 18px;display:flex;gap:6px}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:78px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice span span{display:block;margin-top:3px;color:var(--muted);font-size:13px;line-height:1.45}.other{margin-top:14px}.other input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}.hint{font-size:13px;color:var(--muted)}.result{display:grid;gap:14px}.resultbox{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.resultbox h3{margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 10px;border-radius:10px;background:var(--mint);font-weight:850}.selected-list{display:grid;gap:8px}.selected-item{padding:10px 12px;border-radius:11px;background:#f8fbfb;border:1px solid var(--line)}.notice{padding:12px 14px;border-radius:13px;background:#f3f8f7;color:#4f6269;line-height:1.6}@media(max-width:680px){.choices{grid-template-columns:1fr}.shell{padding-top:12px}.hero,.card{border-radius:15px}.actions .btn{flex:1}.actions .btn.ghost{flex:0 0 100%}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>申請流程互動模擬</b><span class="badge">UAT v2｜不會送出資料</span></div></header>
<main class="shell">
<section class="hero"><small>先說你平常怎麼工作</small><h1>你的工作通常是怎麼進行的？</h1><p>不用先懂 DOING 有哪些功能，也不用先選自己屬於哪一種產業。只要把「真的會發生在你工作裡」的情況勾起來，數量不限。</p></section>
<div class="progress" id="progress"></div>
<section class="card" id="stage"></section>
</main>
<script>
'use strict';
const groups=[
 {title:'一份工作通常怎麼開始？',desc:'先從你和客人、參加者或合作對象怎麼開始一件事情來想。',items:[
  ['one_by_one','通常是一位客人來找我，我再安排一個時間服務他','例如美容、攝影、諮詢、家教、到府服務'],
  ['public_date','我會先公布一個日期或時段，再讓很多人決定要不要參加','例如體驗、分享、聚會、工作坊'],
  ['recruit_units','我會公開招募不同品牌、店家、團隊或單位一起參與','參加者不是單純買一張票，而是各自有自己的資料'],
  ['client_job','通常是客戶先提出一個需求，我接下來會持續一段時間把事情做完','不是一次到場就結束，過程中會一直往前推進'],
  ['repeat_clients','同一位客人可能會一直回來找我','我需要記得他以前做過什麼、偏好或注意事項'],
  ['mixed_work','我的工作型態很多變，不同月份可能會做完全不同的事情','例如平常接客、偶爾開班、偶爾又做大型合作']
 ]},
 {title:'事情開始後，通常怎麼進行？',desc:'這裡不是問你要什麼功能，而是問一件工作真正跑起來時會發生什麼。',items:[
  ['choose_time','對方需要從我提供的空檔裡挑一個時間','不是每次都由我私訊來回喬時間'],
  ['different_length','不同工作內容，實際占用的時間會不一樣','有些很快，有些會需要比較久'],
  ['same_time_group','同一個時間可能同時服務或接待很多人','大家一起開始，不是一個接一個'],
  ['limited_capacity','我需要控制同一個日期或時段最多能接受多少人','滿了之後就不能再收'],
  ['screen_before_accept','對方送出資料後，我不一定會立刻答應','我通常需要先看資料，再決定接受、候補或婉拒'],
  ['many_units_same_day','同一天會有很多彼此獨立的參與單位到場','每個單位都有自己的名稱、聯絡人或需求'],
  ['assign_place','我需要替不同人或不同單位安排現場位置','位置可能還會調動'],
  ['use_resources','工作進行時會占用特定的人員、房間、設備或材料','同一份資源不能同時被重複使用'],
  ['multiple_stages','同一件工作會分很多階段完成','前面完成後，後面還有下一個節點'],
  ['client_confirm','過程中需要客戶或合作方確認內容才能繼續','例如確認圖面、驗收、簽名或同意'],
  ['team_handoff','一件工作會由不同的人輪流接手','每個人負責不同部分，不是所有事情都由同一人完成']
 ]},
 {title:'你最常被哪些行政事情卡住？',desc:'只勾真的會增加你工作量的事情。',items:[
  ['collect_money','我要確認誰已經付款、誰還沒付款','常常需要對帳或追付款'],
  ['take_deposit','有些工作會先收一部分金額，完成後再處理剩餘款項','例如訂金或階段款'],
  ['returnable_money','有些錢完成條件後要退回給對方','例如保證金或押金'],
  ['cancel_change','對方可能改時間、取消或臨時沒出現','我希望這些異動都有紀錄'],
  ['remind_people','我常常需要在事情發生前提醒對方','例如時間、地點、付款、需要攜帶的東西'],
  ['collect_extra_info','每次工作都可能需要多問一些資料','不同工作要問的內容不太一樣'],
  ['documents','我會需要留下照片、檔案、作品或附件','之後還要能找得到'],
  ['agreement_sign','有些事情開始前需要對方確認條款、同意內容或簽名','不能只靠口頭說過'],
  ['check_arrival','現場人多時，我需要快速知道誰已經到了、誰還沒到','最好不用一直翻名單'],
  ['redeem_once','有些資格、票券或服務使用後就不能再用第二次','需要留下已使用紀錄'],
  ['income_expense','我需要知道這份工作最後到底賺多少、花多少','不只是收到多少錢而已'],
  ['invoice_data','有些客人或合作方會需要提供開票資料','例如統編、抬頭或載具']
 ]},
 {title:'你平常怎麼管理人和後續關係？',desc:'最後想想工作做完之後，還有哪些事情會繼續累積。',items:[
  ['customer_history','我想保留每位客人的歷史紀錄','之後再看到他時，不需要從零開始'],
  ['customer_notes','有些客人需要留下偏好、習慣或注意事項','這些內容只給內部工作人員看'],
  ['customer_followup','我會做回訪、生日提醒、熟客優惠或再次邀請','希望不要每次人工翻舊資料'],
  ['sell_extra','主要工作之外，我還可能讓對方加購商品或其他服務','同一筆工作一起結帳比較方便'],
  ['many_staff','會有多位工作人員一起使用系統','每個人不一定能看到全部資料'],
  ['staff_schedule','我需要安排誰哪天上班、休息或臨時請假','人員時間會直接影響能不能接工作'],
  ['personal_calendar','我希望工作時間可以放進自己平常用的手機或電腦行事曆','不用重複手動新增'],
  ['multiple_languages','我的客人或參加者不一定都使用中文','有時需要不同語言內容'],
  ['other_tools','我已經有自己習慣的社群、金流或其他工具','我不想全部換掉，只想補上目前容易斷掉的流程']
 ]}
];
const state={step:0,selected:new Set(),other:''};
const recommendationMap={
 one_by_one:['預約','工作日曆'],choose_time:['預約','工作日曆'],different_length:['預約'],same_time_group:['課程／多人時段'],limited_capacity:['名額管理'],screen_before_accept:['審核／候補'],public_date:['活動／課程'],recruit_units:['市集／單位招募'],many_units_same_day:['市集／單位管理'],assign_place:['位置安排'],client_job:['專案工作'],multiple_stages:['專案工作'],client_confirm:['電子簽名／確認'],team_handoff:['團隊協作'],use_resources:['人員／資源管理'],repeat_clients:['顧客管理'],customer_history:['顧客管理'],customer_notes:['顧客管理'],customer_followup:['優惠券／回訪'],collect_money:['收款／付款確認'],take_deposit:['收款／訂金'],returnable_money:['押金／退款'],cancel_change:['異動紀錄'],remind_people:['通知提醒'],collect_extra_info:['自訂問卷'],documents:['照片／檔案'],agreement_sign:['電子簽名／條款'],check_arrival:['QR 報到'],redeem_once:['QR 核銷／票券'],income_expense:['進階財務'],invoice_data:['發票資料'],sell_extra:['商品／加購'],many_staff:['團隊／權限'],staff_schedule:['團隊／排班'],personal_calendar:['Google／Apple 日曆同步'],multiple_languages:['多語言'],mixed_work:['工作日曆'],other_tools:['共用工作紀錄']
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function progress(){ $('progress').innerHTML=[0,1,2,3,4].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('') }
function countIn(group){return group.items.filter(([k])=>state.selected.has(k)).length}
function selectedDetails(){const out=[];for(const g of groups)for(const [k,t] of g.items)if(state.selected.has(k))out.push(t);return out}
function recommendations(){const out=[];for(const k of state.selected)for(const x of recommendationMap[k]||[])if(!out.includes(x))out.push(x);return out}
function render(){progress();if(state.step<groups.length){const g=groups[state.step];$('stage').innerHTML=`<div class="head"><div><h2>${g.title}</h2><p>${g.desc}</p></div><div class="count">已選 ${countIn(g)} 項</div></div><div class="choices">${g.items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${state.selected.has(k)?'checked':''}><span><b>${t}</b><span>${d}</span></span></label>`).join('')}</div>${state.step===groups.length-1?`<div class="other"><input id="other" placeholder="還有哪種工作情況沒寫到？可以自己補充" value="${esc(state.other)}"></div>`:''}<div class="actions"><button class="btn ${state.step?'alt':'ghost'}" id="back">${state.step?'← 上一步':'重新開始'}</button><span class="hint">不限勾選數量，不需要每一區都選。</span><button class="btn primary" id="next">${state.step===groups.length-1?'看系統建議':'下一區 →'}</button></div>`;
 document.querySelectorAll('.choice input').forEach(x=>x.onchange=()=>{x.checked?state.selected.add(x.value):state.selected.delete(x.value);render()});
 $('back').onclick=()=>{if(state.step===0){state.selected.clear();state.other='';render()}else{state.step--;render()}};
 $('next').onclick=()=>{if($('other'))state.other=$('other').value.trim();state.step++;render()};
 if($('other'))$('other').oninput=e=>state.other=e.target.value;
 return}
 const rec=recommendations(),details=selectedDetails();$('stage').innerHTML=`<div class="result"><div class="head"><div><h2>這是依你的工作方式整理出的建議</h2><p>現在才顯示系統建議，不是在前面先讓你挑功能。</p></div><div class="count">共選 ${state.selected.size} 項</div></div><div class="resultbox"><h3>建議優先使用</h3><div class="chips">${rec.length?rec.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="hint">目前資訊還不夠，可能需要再補充工作情況。</span>'}</div></div><div class="resultbox"><h3>你剛剛描述的工作情況</h3><div class="selected-list">${details.map(x=>`<div class="selected-item">${esc(x)}</div>`).join('')}${state.other?`<div class="selected-item">其他：${esc(state.other)}</div>`:''}</div></div><div class="notice">這只是 UAT 模擬結果，不會送出申請、不會建立工作空間，也不會寫入正式資料庫。</div><div class="actions"><button class="btn alt" id="back">← 回去修改</button><button class="btn primary" id="restart">重新測一次</button></div></div>`;$('back').onclick=()=>{state.step=groups.length-1;render()};$('restart').onclick=()=>{state.step=0;state.selected.clear();state.other='';render()}}
render();
</script>
</body>
</html>
