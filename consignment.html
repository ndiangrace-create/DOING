<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DOING｜寄賣申請</title><link rel="stylesheet" href="doing-system.css?v=20260817-system5"><link rel="stylesheet" href="doing-design-tokens.css"><link rel="stylesheet" href="doing-pastel-pages.css"><style>
*{box-sizing:border-box;min-width:0}body{margin:0;background:linear-gradient(160deg,#effaff,#fff8ed);color:#30303c;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow-wrap:anywhere;word-break:break-word}.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:24px 0 64px}.hero,.card{border:1px solid #dfe4ea;border-radius:22px;background:rgba(255,255,255,.94);padding:22px;margin-bottom:14px;overflow:hidden}.hero h1{margin:0 0 8px}.hero p,.muted{color:#747485}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-weight:800;font-size:13px}input,textarea,select{width:100%;max-width:100%;padding:11px;border:1px solid #cfd6dd;border-radius:11px;font:inherit}textarea{min-height:90px}.wide{grid-column:1/-1}.btn{border:1px solid #cbd5dc;border-radius:12px;background:#a9e1f4;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;color:inherit;display:inline-flex;justify-content:center;text-align:center;white-space:normal}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.hidden{display:none!important}.period,.record{display:block;width:100%;text-align:left;border:1px solid #e1e6ea;border-radius:14px;padding:13px;margin:8px 0;background:#fff;overflow:hidden}.ok{background:#eefbea;padding:12px;border-radius:12px}.chip{display:inline-flex;border-radius:999px;background:#e9f5f8;padding:4px 9px;font-size:12px;font-weight:900}@media(max-width:620px){.shell{width:calc(100% - 16px);padding-top:10px}.hero,.card{padding:15px;border-radius:17px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.btn{width:100%}}
</style></head><body class="doing-app doing-consignment"><main class="shell"><a class="btn" href="member-panel.html#activities">← 回我的報名</a><section class="hero"><h1>寄賣申請</h1><p>申請、商品、條碼與庫存都會保存在同一個正式營運空間，不會存在瀏覽器。</p></section><section class="card" id="login"><h2>請先登入</h2><p class="muted">使用你的 DOING 會員身分申請寄賣。</p><button class="btn" id="lineLogin">使用 LINE 登入</button></section><section class="card hidden" id="app"><h2 id="periodTitle">選擇寄賣檔期</h2><div id="periods"></div><form id="form" class="hidden"><div class="grid"><label>品牌名稱<input name="brandName" required></label><label class="wide">申請說明<textarea name="note" placeholder="商品類型、數量或需要主辦知道的事"></textarea></label></div><div class="actions"><button class="btn" type="submit">送出寄賣申請</button></div></form><div id="done" class="ok hidden"></div></section><section class="card hidden" id="records"><h2>我的寄賣紀錄</h2><p class="muted">審核通過後可在這裡建立商品、售價、條碼與期初庫存。</p><div id="myApps"></div><form id="productForm" class="hidden"><input type="hidden" name="applicationId"><div class="grid"><label>商品名稱<input name="name" required></label><label>貨號 SKU<input name="sku" required></label><label>條碼<input name="barcode"></label><label>售價<input name="unitPrice" type="number" min="0" required></label><label>期初庫存<input name="stock" type="number" min="0" required></label></div><div class="actions"><button class="btn" type="submit">儲存正式商品</button></div></form><div id="products"></div></section></main><script>
const API='https://tobeloved-api.ndiangrace.workers.dev',q=new URL(location.href).searchParams,T=(q.get('tenant')||'').trim().toLowerCase(),wanted=q.get('period')||'',KEY='doing_member_token',token=q.get('member_token')||localStorage.getItem(KEY)||'',S={periods:[],selected:wanted,applications:[],products:[]};const $=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),status=v=>({pending:'待審核',approved:'已通過',rejected:'未通過',settled:'已結算'}[v]||v||'—');if(q.get('member_token')){localStorage.setItem(KEY,q.get('member_token'));history.replaceState(null,'',location.pathname+'?tenant='+encodeURIComponent(T)+(wanted?'&period='+encodeURIComponent(wanted):''))}
async function get(action){const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('tenant',T);if(token)u.searchParams.set('member_token',token);const r=await fetch(u),d=await r.json();if(d.error)throw Error(d.error);return d.data??d.result??d}async function post(action,b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tenant:T,member_token:token,...b})}),d=await r.json();if(d.error)throw Error(d.error);return d.data??d.result??d}
function selectPeriod(id){S.selected=id;document.querySelectorAll('.period').forEach(x=>x.style.outline=x.dataset.id===id?'3px solid #8dd5ef':'none');$('form').classList.remove('hidden')}
function renderMine(){if(!S.applications.length){$('records').classList.add('hidden');return}$('records').classList.remove('hidden');$('myApps').innerHTML=S.applications.map(a=>`<div class="record"><b>${safe(a.brand_name||a.applicant_email)}</b> <span class="chip">${safe(status(a.status))}</span><br><small>${new Date(a.created_at).toLocaleString()}</small>${a.status==='approved'?`<div class="actions"><button class="btn" onclick="openProduct('${safe(a.id)}')">新增商品</button></div>`:''}</div>`).join('');$('products').innerHTML=S.products.map(p=>`<div class="record"><b>${safe(p.name)}</b><br><small>${safe(p.sku)}｜售價 NT$ ${Number(p.unit_price||0).toLocaleString()}｜目前庫存 ${safe(p.current_stock)}</small></div>`).join('')}
function openProduct(id){$('productForm').elements.applicationId.value=id;$('productForm').classList.remove('hidden');$('productForm').scrollIntoView({behavior:'smooth',block:'center'})}
async function loadMine(){const mine=await get('getMyConsignment');S.applications=mine.applications||[];S.products=mine.products||[];renderMine()}
async function init(){if(!T){$('login').innerHTML='<b>申請連結不完整，請向主辦重新取得。</b>';return}if(!token)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{const [periods]=await Promise.all([get('getConsignmentPeriodsPublic'),loadMine()]);S.periods=periods;$('periods').innerHTML=S.periods.map(x=>`<button type="button" class="period" data-id="${safe(x.id)}" onclick="selectPeriod('${safe(x.id)}')"><b>${safe(x.name)}</b><br><small>${new Date(x.starts_at).toLocaleDateString()}～${new Date(x.ends_at).toLocaleDateString()}｜抽成 ${safe(x.commission_percent)}%</small></button>`).join('')||'<p>目前沒有開放中的寄賣檔期。</p>';if(S.periods.some(x=>x.id===S.selected))selectPeriod(S.selected)}catch(e){$('periods').textContent=e.message}}
$('lineLogin').onclick=()=>{const back=new URL(location.href);const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',back.toString());location.href=u};$('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await post('applyConsignment',{periodId:S.selected,brandName:f.get('brandName'),note:f.get('note')});$('form').classList.add('hidden');$('done').textContent='寄賣申請已送出，審核結果會保留在正式紀錄。';$('done').classList.remove('hidden');await loadMine()}catch(err){alert(err.message)}};$('productForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await post('saveConsignmentProduct',Object.fromEntries(f.entries()));e.currentTarget.reset();e.currentTarget.classList.add('hidden');await loadMine();alert('商品、條碼與庫存已寫入正式營運資料')}catch(err){alert(err.message)}};init();
</script></body></html>
