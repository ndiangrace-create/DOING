<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9fb"><title>DOING Market｜活動報名</title>
<link rel="stylesheet" href="/doing-kawaii-current.css?v=20260825-1"><link rel="stylesheet" href="/doing-market-current.css?v=20260825-1">
</head>
<body class="market-current">
<div class="mk-bg" aria-hidden="true"></div>
<header class="mk-top"><div class="mk-top-in"><a class="mk-brand" href="/market/public/" id="homeLink"><img id="tenantLogo" src="/doing-logo.png" alt="DOING"><span class="mk-brand-text"><b id="tenantName">DOING Market</b><small>活動報名</small></span></a><div class="mk-actions"><button id="memberBtn" class="mk-btn secondary small">我的報名</button><button id="supportBtn" class="mk-btn yellow small">客服</button></div></div></header>
<main class="mk-shell">
  <section class="mk-public-hero"><span class="mk-kicker">OPEN MARKET</span><h1>找一場想參加的活動</h1><p id="tenantIntro">近期開放中的活動會依日期排列，點卡片直接看內容與報名。</p></section>
  <section id="tenantCover" class="mk-panel hidden" style="padding:0;overflow:hidden;margin-bottom:16px"></section>
  <div class="mk-search"><input id="q" class="mk-input" type="search" placeholder="搜尋活動、主辦或地點"><button id="searchBtn" class="mk-btn">搜尋</button></div>
  <div class="mk-cats" aria-label="活動分類"><button class="mk-cat active" data-type="all">全部</button><button class="mk-cat" data-type="market">市集</button><button class="mk-cat" data-type="event">活動</button><button class="mk-cat" data-type="experience">體驗／DIY</button></div>
  <section class="mk-panel" style="margin-top:18px"><div class="mk-section-head"><div><h2>目前開放活動</h2><p id="summary">載入中…</p></div><button id="reload" class="mk-btn secondary small">重新整理</button></div><div id="list" class="mk-event-grid"><div class="mk-loading">正在載入活動…</div></div></section>
</main>
<nav class="mk-public-bottom"><a class="green" href="/">DOING 首頁</a><button class="purple" id="bottomMember">我的報名</button><button class="yellow" id="bottomSupport">線上客服</button></nav>

<dialog id="eventDialog" class="mk-dialog"><div class="mk-dialog-card"><div class="mk-dialog-head"><h2>活動內容</h2><button class="mk-btn secondary small" data-close="eventDialog">關閉</button></div><div id="eventPanel"></div></div></dialog>
<dialog id="memberDialog" class="mk-dialog"><div class="mk-dialog-card"><div class="mk-dialog-head"><h2>我的 DOING／我的報名</h2><button class="mk-btn secondary small" data-close="memberDialog">關閉</button></div><div id="memberLoginBox"><p class="mk-drawer-note">用 LINE 登入後，可查看會員資料與所有 DOING 報名紀錄。</p><button id="memberLoginBtn" class="mk-btn" style="margin-top:12px">使用 LINE 登入</button><div id="memberLoginMessage" class="mk-message"></div></div><div id="memberArea" class="hidden"><form id="memberForm" class="mk-member-form"><div><label>姓名</label><input class="mk-input" name="name" required></div><div><label>聯絡手機</label><input class="mk-input" name="phone" inputmode="tel" required></div><div><label>Email</label><input class="mk-input" name="email" type="email" required></div><div><label>所在縣市</label><input class="mk-input" name="city"></div><div class="full"><button class="mk-btn" type="submit">儲存會員資料</button><span id="memberMessage" class="mk-message"></span></div></form><div class="mk-section-head" style="margin-top:22px"><div><h3>我的報名</h3><p>跨活動紀錄都在這裡。</p></div><button id="refreshMemberRegs" class="mk-btn secondary small">重新整理</button></div><div id="memberRegs" class="mk-list"></div></div></div></dialog>
<dialog id="supportDialog" class="mk-dialog"><div class="mk-dialog-card"><div class="mk-dialog-head"><h2>線上客服</h2><button class="mk-btn secondary small" data-close="supportDialog">關閉</button></div><div class="mk-work-grid"><article class="mk-card"><h3>報名問題</h3><p>修改資料、狀態、取消或付款。</p></article><article class="mk-card"><h3>活動資訊</h3><p>日期、地點、設備與行前資訊。</p></article><article class="mk-card"><h3>帳號問題</h3><p>LINE 登入與我的 DOING。</p></article></div><button id="openSupportChat" class="mk-btn" style="margin-top:14px">開啟 DOING 客服</button></div></dialog>

<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=String(P.get('tenant')||'').trim().toLowerCase(),INITIAL_Q=P.get('q')||'',TOKEN_KEY='doing_member_token',S={rows:[],type:'all',memberToken:'',profile:null,regs:[]};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(action,params={},post=false){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);let opt={cache:'no-store'};if(post){opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tenant:T,...params})}}else Object.entries(params).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v)));const r=await fetch(u,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error){const e=Error(d.error||'操作失敗');e.status=r.status;throw e}return d.data??d.result??d}
function blob(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}
function kind(x){const s=blob(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}
function firstDate(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return Infinity;const d=a[0],raw=typeof d==='object'?(d.date||d.label||''):String(d||''),t=Date.parse(raw);return Number.isFinite(t)?t:Infinity}
function dateText(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}
function openUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId||T)u.searchParams.set('tenant',x.tenantId||T);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}
function thumb(x){return x.cover?`<img src="${esc(x.cover)}" alt="">`:'<div class="mk-event-placeholder">DOING</div>'}
function filtered(){const q=$('q').value.trim().toLowerCase();let rows=[...S.rows].sort((a,b)=>firstDate(a)-firstDate(b));if(S.type!=='all')rows=rows.filter(x=>kind(x)===S.type);if(q)rows=rows.filter(x=>blob(x).includes(q));return rows}
function render(){const rows=filtered();$('summary').textContent=`${rows.length} 個目前開放內容`;$('list').innerHTML=rows.length?rows.map((x,i)=>`<a class="mk-panel mk-event-card" data-index="${i}" href="${openUrl(x)}"><div class="mk-event-cover">${thumb(x)}</div><div class="mk-event-body"><div class="mk-tags"><span class="mk-tag ${kind(x)==='market'?'ok':kind(x)==='experience'?'warn':'info'}">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span></div><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="mk-btn small" style="margin-top:auto">查看活動</span></div></a>`).join(''):'<div class="mk-empty">目前沒有符合的活動。</div>';document.querySelectorAll('.mk-event-card[data-index]').forEach(a=>a.onclick=e=>{e.preventDefault();openEvent(rows[Number(a.dataset.index)])})}
function openEvent(x){if(!x)return;$('eventPanel').innerHTML=`<div class="mk-modal-event-cover">${thumb(x)}</div><div style="padding-top:14px"><div class="mk-tags"><span class="mk-tag info">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span>${x.status?`<span class="mk-tag ok">${esc(x.status)}</span>`:''}</div><h2 style="margin:10px 0 6px">${esc(x.sessionName||x.eventTitle||'活動')}</h2><p class="mk-reg-sub">${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p>${x.description?`<p style="line-height:1.75;font-weight:750;color:#686170">${esc(x.description)}</p>`:''}<div class="mk-work-grid" style="margin-top:14px"><article class="mk-card"><h4>日期</h4><p>${esc(dateText(x))}</p></article><article class="mk-card"><h4>地點</h4><p>${esc(x.venue||'待公告')}</p></article><article class="mk-card"><h4>主辦</h4><p>${esc(x.tenantName||$('tenantName').textContent||'DOING Market')}</p></article></div><div class="mk-card-actions"><a class="mk-btn" href="${openUrl(x)}">立即報名</a><button class="mk-btn secondary" data-close="eventDialog">繼續看活動</button></div></div>`;wireClose();$('eventDialog').showModal()}
async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML=`<div class="mk-empty mk-error">${esc(e.message)}</div>`}}
async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg){$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面" style="display:block;width:100%;max-height:320px;object-fit:cover">`;$('tenantCover').classList.remove('hidden')}if(c.infoText)$('tenantIntro').textContent=c.infoText;if(c.brandName)$('tenantName').textContent=c.brandName}catch(_){}}
function stored(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(_){return''}}function saveToken(v){try{if(v)localStorage.setItem(TOKEN_KEY,v)}catch(_){}}
function memberLogin(){const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','market_member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}
function explicitInvalid(e){return e?.status===401||e?.status===403||/token.*(invalid|expired)|登入.*(失效|過期)|無效.*token/i.test(String(e?.message||''))}
async function loadMember(){S.memberToken=stored();$('memberLoginMessage').textContent='';if(!S.memberToken){$('memberLoginBox').classList.remove('hidden');$('memberArea').classList.add('hidden');return}try{const d=await api('getPlatformMemberProfile',{member_token:S.memberToken});S.profile=d.profile||{};$('memberLoginBox').classList.add('hidden');$('memberArea').classList.remove('hidden');const f=$('memberForm');for(const k of ['name','phone','email','city'])if(f.elements[k])f.elements[k].value=S.profile[k]||'';await loadRegs()}catch(e){if(explicitInvalid(e)){try{localStorage.removeItem(TOKEN_KEY)}catch(_){}S.memberToken='';$('memberLoginBox').classList.remove('hidden');$('memberArea').classList.add('hidden');$('memberLoginMessage').textContent='登入已過期，請重新使用 LINE 登入。'}else{$('memberLoginBox').classList.remove('hidden');$('memberArea').classList.add('hidden');$('memberLoginMessage').textContent='會員資料暫時載入失敗，登入仍保留；請稍後重試。'}}}
async function loadRegs(){if(!S.memberToken)return;try{const d=await api('getMyRegsGlobal',{member_token:S.memberToken});S.regs=Array.isArray(d)?d:(d.rows||d.registrations||[]);$('memberRegs').innerHTML=S.regs.length?S.regs.map(r=>`<article class="mk-reg-card"><div><div class="mk-reg-title">${esc(r.sessionName||r.eventTitle||r.brand||'我的報名')}</div><div class="mk-reg-sub">${esc(r.date||r.sessionDate||r.activityDate||'日期待確認')}</div></div><span class="mk-tag info">${esc(r.paymentStatus||r.reviewStatus||r.status||'已報名')}</span></article>`).join(''):'<div class="mk-empty">目前沒有報名紀錄。</div>'}catch(e){$('memberRegs').innerHTML=`<div class="mk-empty mk-error">${esc(e.message)}</div>`}}
async function saveMember(e){e.preventDefault();if(!S.memberToken)return memberLogin();const f=e.currentTarget,fd=new FormData(f),b=f.querySelector('[type=submit]');b.disabled=true;$('memberMessage').textContent='';try{await api('savePlatformMemberProfile',{member_token:S.memberToken,name:fd.get('name'),phone:fd.get('phone'),email:fd.get('email'),city:fd.get('city')},true);$('memberMessage').textContent='會員資料已儲存';await loadMember()}catch(err){$('memberMessage').textContent=err.message}finally{b.disabled=false}}
async function openMember(){if(!$('memberDialog').open)$('memberDialog').showModal();await loadMember()}function openSupport(){if(!$('supportDialog').open)$('supportDialog').showModal()}function wireClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const d=$(b.dataset.close);if(d?.open)d.close()})}
const incoming=P.get('member_token')||'';if(incoming){saveToken(incoming);const clean=new URL(location.href);clean.searchParams.delete('member_token');history.replaceState({},'',clean.toString())}if(INITIAL_Q)$('q').value=INITIAL_Q;
$('memberBtn').onclick=$('bottomMember').onclick=openMember;$('supportBtn').onclick=$('bottomSupport').onclick=openSupport;$('memberLoginBtn').onclick=memberLogin;$('memberForm').onsubmit=saveMember;$('refreshMemberRegs').onclick=loadRegs;$('openSupportChat').onclick=()=>{const u=new URL('/',location.origin);u.searchParams.set('support','open');location.href=u.toString()};$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});wireClose();Promise.allSettled([loadBrand(),load()]);
</script>
</body>
</html>
