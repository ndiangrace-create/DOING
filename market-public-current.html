<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜活動報名</title><link rel="stylesheet" href="/doing-kawaii-current.css?v=20260825-1"><link rel="stylesheet" href="/doing-market-current.css?v=20260825-1"></head><body class="mk-body">
<header class="mk-top"><div class="mk-top-in"><a class="mk-brand" id="homeLink" href="/market/public/"><img id="tenantLogo" src="/doing-logo.png" alt="DOING"><span><b id="tenantName">DOING Market</b><small>活動報名</small></span></a><div class="mk-actions"><button id="memberTop" class="mk-btn secondary small">我的紀錄</button><button id="supportTop" class="mk-btn secondary small desktop-only">客服</button></div></div></header>
<main class="mk-shell"><section class="mk-public-hero"><div id="tenantCover" class="mk-cover">DOING Market</div><div class="mk-hero-copy"><span class="mk-kicker">市集・活動・體驗</span><h1 style="margin:8px 0 5px">找想參加的活動</h1><p id="tenantIntro">從活動資訊、報名、付款到我的紀錄，都在同一條路徑完成。</p></div></section><div class="mk-toolbar"><input id="q" type="search" placeholder="搜尋活動、地點"><select id="type"><option value="all">全部</option><option value="market">市集</option><option value="event">活動</option><option value="experience">體驗／DIY</option></select><button id="reload" class="mk-btn secondary">重新整理</button></div><div class="mk-title"><div><h2>近期活動</h2><p id="summary">讀取中…</p></div></div><section id="events" class="mk-events"><div class="mk-empty">正在讀取活動…</div></section></main>
<nav class="mk-bottom" aria-label="前台主選單"><button id="navApply" class="active">報名</button><button id="navRecords">我的紀錄</button><button id="navSupport">客服</button></nav>
<dialog id="eventDialog" class="mk-dialog"><div class="mk-dialog-card"><div class="mk-dialog-head"><div><h2 id="eventTitle">活動</h2><p id="eventMeta"></p></div><button class="mk-btn secondary small" data-close="eventDialog">關閉</button></div><div id="eventBody"></div></div></dialog>
<dialog id="memberDialog" class="mk-dialog"><div class="mk-dialog-card"><div class="mk-dialog-head"><div><h2>會員／我的紀錄</h2><p>LINE 登入後留在原本市集前台，不會進主辦後台。</p></div><button class="mk-btn secondary small" data-close="memberDialog">關閉</button></div><div id="loginBox" class="mk-card"><p>登入後可查看會員資料、報名、付款、排位與現場狀態。</p><button id="loginBtn" class="mk-btn">使用 LINE 登入</button></div><div id="memberArea" class="mk-hidden"><article class="mk-card"><div class="mk-form-grid"><div class="mk-field"><label>姓名</label><input id="mName"></div><div class="mk-field"><label>手機</label><input id="mPhone"></div><div class="mk-field"><label>Email</label><input id="mEmail" type="email"></div><div class="mk-field"><label>所在縣市</label><input id="mCity"></div></div><div class="mk-actions" style="margin-top:10px"><button id="saveMember" class="mk-btn">儲存會員資料</button></div></article><div class="mk-title" style="margin-top:14px"><div><h2>我的報名</h2><p>重新整理後仍以正式資料為準。</p></div><button id="refreshRegs" class="mk-btn secondary small">重新整理</button></div><div id="memberRegs" class="mk-list"></div></div></div></dialog>
<dialog id="supportDialog" class="mk-dialog"><div class="mk-dialog-card"><div class="mk-dialog-head"><div><h2>客服</h2><p>報名、付款、排位、現場與帳號問題都可從這裡進入。</p></div><button class="mk-btn secondary small" data-close="supportDialog">關閉</button></div><div class="mk-grid"><article class="mk-card"><h3>報名／付款</h3><p>修改資料、補件、付款回報、取消與退款。</p></article><article class="mk-card"><h3>活動／現場</h3><p>日期、地點、設備、排位、行前與報到。</p></article><article class="mk-card"><h3>帳號</h3><p>LINE 登入、會員資料與我的紀錄。</p></article></div><div class="mk-actions" style="margin-top:12px"><button id="openSupport" class="mk-btn">開啟 DOING 客服</button></div></div></dialog><div id="toast" class="mk-toast"></div>
<script>'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',Q=new URL(location.href).searchParams,T=String(Q.get('tenant')||'').trim().toLowerCase(),TOKEN_KEY='doing_member_token',S={rows:[],token:'',profile:null,regs:[]};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg){const b=$('toast');b.textContent=msg;b.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>b.classList.remove('show'),2200)}
async function api(action,params={},post=false){const base={action,...params};if(T)base.tenant=T;if(post){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(base)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'操作失敗');return d.data??d.result??d}const u=new URL(API);Object.entries(base).forEach(([k,v])=>{if(v!==''&&v!=null)u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v))});const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}
function blob(x){return[x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}function kind(x){const s=blob(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|diy|workshop|工作坊/.test(s))return'experience';return'event'}function dateText(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return x.date||x.sessionDate||'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?`${d.start}–${d.end}`:''].filter(Boolean).join(' '):String(d)}function thumb(x){const url=x.cover||x.coverUrl||x.image||'';return url?`<img src="${esc(url)}" alt="">`:'DOING'}
function registerUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId||T)u.searchParams.set('tenant',x.tenantId||T);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}
function filtered(){const q=$('q').value.trim().toLowerCase(),t=$('type').value;return S.rows.filter(x=>(t==='all'||kind(x)===t)&&(!q||blob(x).includes(q))).sort((a,b)=>(Date.parse(dateText(a))||0)-(Date.parse(dateText(b))||0))}
function render(){const rows=filtered();$('summary').textContent=`${rows.length} 個目前內容`;$('events').innerHTML=rows.length?rows.map((x,i)=>`<a class="mk-event" href="${registerUrl(x)}" data-event="${i}"><div class="mk-cover">${thumb(x)}</div><div class="mk-event-body"><span class="mk-kicker">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p></div></a>`).join(''):'<div class="mk-empty">目前沒有符合的活動。</div>';document.querySelectorAll('[data-event]').forEach(a=>a.onclick=e=>{e.preventDefault();openEvent(rows[Number(a.dataset.event)])})}
function openEvent(x){$('eventTitle').textContent=x.sessionName||x.eventTitle||'活動';$('eventMeta').textContent=[dateText(x),x.venue].filter(Boolean).join('｜');$('eventBody').innerHTML=`<div class="mk-cover">${thumb(x)}</div><div class="mk-card" style="margin-top:10px"><div class="mk-tags"><span class="mk-tag">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span>${x.status?`<span class="mk-tag">${esc(x.status)}</span>`:''}</div><p>${esc(x.description||'')}</p><div class="mk-actions"><a class="mk-btn" href="${registerUrl(x)}">立即報名</a><button class="mk-btn secondary" data-close="eventDialog">繼續看活動</button></div></div>`;wireClose();$('eventDialog').showModal()}
async function loadEvents(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d)?d:(d.items||d.rows||[]);render()}catch(e){$('events').innerHTML=`<div class="mk-empty">${esc(e.message)}</div>`;$('summary').textContent='載入失敗'}}
async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.brandName)$('tenantName').textContent=c.brandName;if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg)$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面">`;if(c.infoText)$('tenantIntro').textContent=c.infoText}catch(_){}}
function stored(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(_){return''}}function saveToken(v){try{if(v)localStorage.setItem(TOKEN_KEY,v)}catch(_){}}
function login(){const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','market_member');const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}
async function loadMember(){S.token=stored();if(!S.token){$('loginBox').classList.remove('mk-hidden');$('memberArea').classList.add('mk-hidden');return}try{const d=await api('getPlatformMemberProfile',{member_token:S.token});S.profile=d.profile||d||{};$('loginBox').classList.add('mk-hidden');$('memberArea').classList.remove('mk-hidden');$('mName').value=S.profile.name||'';$('mPhone').value=S.profile.phone||'';$('mEmail').value=S.profile.email||'';$('mCity').value=S.profile.city||'';await loadRegs()}catch(e){try{localStorage.removeItem(TOKEN_KEY)}catch(_){}S.token='';$('loginBox').classList.remove('mk-hidden');$('memberArea').classList.add('mk-hidden');toast(e.message)}}
async function loadRegs(){if(!S.token)return;try{const d=await api('getMyRegsGlobal',{member_token:S.token});S.regs=Array.isArray(d)?d:(d.rows||d.registrations||[]);$('memberRegs').innerHTML=S.regs.length?S.regs.map(r=>{const review=r.reviewStatus||r.review_status||r.status||'已報名',pay=r.paymentStatus||r.payment_status||'未繳費',seat=r.stallNumber||r.stall_number||r.seatCode||'',check=r.checkinStatus||r.checkin_status||'未報到';return `<article class="mk-row"><div class="mk-row-main"><div class="mk-row-title">${esc(r.sessionName||r.eventTitle||r.brand||r.brand_name||'我的報名')}</div><div class="mk-row-sub">${esc(r.date||r.sessionDate||r.activityDate||'日期待確認')}</div><div class="mk-tags"><span class="mk-tag">審核：${esc(review)}</span><span class="mk-tag">付款：${esc(pay)}</span>${seat?`<span class="mk-tag">位置：${esc(seat)}</span>`:''}<span class="mk-tag">${esc(check)}</span></div></div></article>`}).join(''):'<div class="mk-empty">目前沒有報名紀錄。</div>'}catch(e){$('memberRegs').innerHTML=`<div class="mk-empty">${esc(e.message)}</div>`}}
async function saveMember(){const b=$('saveMember');b.disabled=true;try{await api('savePlatformMemberProfile',{member_token:S.token,name:$('mName').value.trim(),phone:$('mPhone').value.trim(),email:$('mEmail').value.trim(),city:$('mCity').value.trim()},true);toast('會員資料已儲存');await loadMember()}catch(e){toast(e.message)}finally{b.disabled=false}}
async function openRecords(){if(!$('memberDialog').open)$('memberDialog').showModal();await loadMember();$('navApply').classList.remove('active');$('navRecords').classList.add('active')}
function openSupport(){if(!$('supportDialog').open)$('supportDialog').showModal();$('navApply').classList.remove('active');$('navSupport').classList.add('active')}
function wireClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close)?.close();$('navRecords').classList.remove('active');$('navSupport').classList.remove('active');$('navApply').classList.add('active')})}
const incoming=Q.get('member_token')||'';if(incoming){saveToken(incoming);const clean=new URL(location.href);clean.searchParams.delete('member_token');clean.searchParams.delete('doing_login_flow');history.replaceState({},'',clean.toString())}if(Q.get('q'))$('q').value=Q.get('q');$('q').oninput=render;$('type').onchange=render;$('reload').onclick=loadEvents;$('memberTop').onclick=openRecords;$('navRecords').onclick=openRecords;$('loginBtn').onclick=login;$('saveMember').onclick=saveMember;$('refreshRegs').onclick=loadRegs;$('supportTop').onclick=openSupport;$('navSupport').onclick=openSupport;$('navApply').onclick=()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close());$('navRecords').classList.remove('active');$('navSupport').classList.remove('active');$('navApply').classList.add('active');scrollTo({top:0,behavior:'smooth'})};$('openSupport').onclick=()=>{const u=new URL('/',location.origin);u.searchParams.set('support','open');location.href=u.toString()};wireClose();Promise.allSettled([loadBrand(),loadEvents()]);
</script></body></html>
