<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜活動報名</title><link rel="stylesheet" href="/doing-market-v18.css?v=20260823-2bl-parity"><link rel="stylesheet" href="/doing-market-v20-front.css?v=20260823-interaction"></head><body class="mk-public"><header class="public-top"><div class="public-top-in"><a class="public-brand" href="/market/public/" id="homeLink"><img id="tenantLogo" src="/doing-logo.png" alt="LOGO"><span><b id="tenantName">DOING Market</b><small>活動報名</small></span></a><div class="public-actions"><button id="supportTop" class="btn yellow desktop-only" type="button">客服</button><button id="myRegs" class="btn purple" type="button">會員</button></div></div></header><main class="public-shell"><section id="tenantCover" class="hero-cover"><span class="cover-placeholder">主辦封面圖</span></section><section class="hero-copy"><h1>找今天想參加的活動</h1><p id="tenantIntro">近期活動依日期由近到遠排列。</p></section><div class="search-row"><input id="q" type="search" placeholder="搜尋活動、主辦、地點"><button id="searchBtn" class="btn secondary" type="button">搜尋</button></div><section class="category-section"><div class="section-head"><div><h2>活動分類</h2><div class="muted">選一個類型快速查看</div></div></div><div class="cat-grid"><button class="cat-card active" data-type="all" type="button"><div class="cat-icon">✦</div>全部</button><button class="cat-card" data-type="market" type="button"><div class="cat-icon">⌂</div>市集</button><button class="cat-card" data-type="event" type="button"><div class="cat-icon">★</div>活動</button><button class="cat-card" data-type="experience" type="button"><div class="cat-icon">✂</div>體驗／DIY</button></div></section><section><div class="section-head"><div><h2>近期活動</h2><div id="summary" class="muted">載入中…</div></div><button id="reload" class="btn secondary" type="button">重新整理</button></div><div id="eventsScroll" class="events-scroll"></div></section><section><div class="section-head"><div><h2>全部活動</h2><div class="muted">點活動直接查看內容，不另外跳頁</div></div></div><div id="list" class="event-list"><div class="muted">正在載入活動…</div></div></section></main><nav class="bottom-nav"><button id="navHome" type="button">首頁</button><button id="navMember" type="button">會員</button><button id="navSupport" type="button">客服</button></nav><dialog id="eventDialog" class="work-dialog"><div class="panel-card"><button class="panel-close" data-close="eventDialog" type="button">關閉</button><div id="eventPanel"></div></div></dialog><dialog id="memberDialog" class="work-dialog"><div class="panel-card member-card"><button class="panel-close" data-close="memberDialog" type="button">關閉</button><div class="panel-title"><h2>會員／我的報名</h2><p>資料與紀錄留在同一個區域處理。</p></div><div id="memberLoginBox" class="member-login-box"><p>使用 DOING LINE 登入後，可直接查看會員資料與我的報名。</p><button id="memberLoginBtn" class="btn primary" type="button">使用 LINE 登入</button></div><div id="memberArea" class="hidden"><form id="memberForm" class="member-form"><label>姓名<input name="name" required></label><label>聯絡手機<input name="phone" required inputmode="tel"></label><label>Email<input name="email" type="email" required></label><label>所在縣市<input name="city"></label><div class="form-actions"><button class="btn primary" type="submit">儲存會員資料</button></div><div id="memberMessage" class="muted"></div></form><div class="member-record-head"><h3>我的報名</h3><button id="refreshMemberRegs" class="btn secondary" type="button">重新整理</button></div><div id="memberRegs" class="member-reg-list"></div></div></div></dialog><dialog id="supportDialog" class="work-dialog"><div class="panel-card"><button class="panel-close" data-close="supportDialog" type="button">關閉</button><div class="panel-title"><h2>線上客服</h2><p>先看常用問題，需要協助時直接開啟 DOING 客服。</p></div><div class="support-grid"><article><b>報名問題</b><p>報名狀態、修改資料、取消或付款問題。</p></article><article><b>活動資訊</b><p>日期、地點、設備、現場與行前資訊。</p></article><article><b>帳號問題</b><p>LINE 登入、會員資料與我的報名。</p></article></div><button id="openSupportChat" class="btn primary" type="button">開啟客服對話</button></div></dialog><script>'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),INITIAL_Q=P.get('q')||'',TOKEN_KEY='doing_member_token',S={rows:[],type:'all',memberToken:'',profile:null,regs:[]};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action,params={},post=false){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);let opt={cache:'no-store'};if(post){opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tenant:T,...params})}}else Object.entries(params).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v)));const r=await fetch(u,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'操作失敗');return d.data??d.result??d}function blob(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}function kind(x){const s=blob(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}function firstDate(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return Number.POSITIVE_INFINITY;const d=a[0],raw=typeof d==='object'?(d.date||d.label||''):String(d||''),t=Date.parse(raw);return Number.isFinite(t)?t:Number.POSITIVE_INFINITY}function dateText(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}function openUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId||T)u.searchParams.set('tenant',x.tenantId||T);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}function filtered(){const q=$('q').value.trim().toLowerCase();let rows=[...S.rows].sort((a,b)=>firstDate(a)-firstDate(b));if(S.type!=='all')rows=rows.filter(x=>kind(x)===S.type);if(q)rows=rows.filter(x=>blob(x).includes(q));return rows}function thumb(x){return x.cover?`<img src="${esc(x.cover)}" alt="">`:'<div class="thumb-empty">DOING</div>'}function render(){const rows=filtered();$('summary').textContent=`${rows.length} 個目前開放內容`;$('eventsScroll').innerHTML=rows.slice(0,8).map((x,i)=>`<button class="event-card-h event-open" data-index="${i}" type="button"><div class="ec-thumb">${thumb(x)}</div><div class="ec-body"><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}</p></div></button>`).join('')||'<div class="muted">目前沒有符合的活動。</div>';$('list').innerHTML=rows.map((x,i)=>`<button class="event-card event-open" data-index="${i}" type="button"><div class="event-cover">${thumb(x)}</div><div class="event-info"><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="status-tag">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span></div></button>`).join('')||'<div class="muted">目前沒有符合的活動。</div>';document.querySelectorAll('.event-open').forEach(b=>b.onclick=()=>openEvent(rows[Number(b.dataset.index)]))}function openEvent(x){if(!x)return;const tags=[kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動',x.status||x.registrationStatus||'開放資訊'].filter(Boolean);$('eventPanel').innerHTML=`<div class="event-panel-cover">${thumb(x)}</div><div class="event-panel-body"><div class="panel-title"><h2>${esc(x.sessionName||x.eventTitle||'活動')}</h2><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p></div><div class="panel-tags">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>${x.description?`<p class="event-description">${esc(x.description)}</p>`:''}<div class="panel-facts"><div><b>日期</b><span>${esc(dateText(x))}</span></div><div><b>地點</b><span>${esc(x.venue||'待公告')}</span></div><div><b>主辦</b><span>${esc(x.tenantName||$('tenantName').textContent||'DOING Market')}</span></div></div><div class="panel-actions"><a class="btn primary" href="${openUrl(x)}">立即報名</a><button class="btn secondary" type="button" data-close="eventDialog">繼續看活動</button></div></div>`;wireClose();$('eventDialog').showModal()}async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg)$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面">`;if(c.infoText)$('tenantIntro').textContent=c.infoText;if(c.brandName)$('tenantName').textContent=c.brandName}catch(_){}}function loginReturn(){const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','market_member');return ret}function memberLogin(){const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',loginReturn().toString());location.href=u.toString()}function getStoredToken(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(_){return''}}function setStoredToken(v){try{if(v)localStorage.setItem(TOKEN_KEY,v)}catch(_){}}async function loadMember(){S.memberToken=getStoredToken();if(!S.memberToken){$('memberLoginBox').classList.remove('hidden');$('memberArea').classList.add('hidden');return}try{const d=await api('getPlatformMemberProfile',{member_token:S.memberToken});S.profile=d.profile||{};$('memberLoginBox').classList.add('hidden');$('memberArea').classList.remove('hidden');const f=$('memberForm');for(const k of ['name','phone','email','city'])if(f.elements[k])f.elements[k].value=S.profile[k]||'';await loadRegs()}catch(e){try{localStorage.removeItem(TOKEN_KEY)}catch(_){}S.memberToken='';$('memberLoginBox').classList.remove('hidden');$('memberArea').classList.add('hidden');$('memberLoginBox').insertAdjacentHTML('beforeend',`<p class="member-error">${esc(e.message)}</p>`)}}async function loadRegs(){if(!S.memberToken)return;const d=await api('getMyRegsGlobal',{member_token:S.memberToken});S.regs=Array.isArray(d)?d:(d.rows||d.registrations||[]);$('memberRegs').innerHTML=S.regs.length?S.regs.map(r=>`<article class="member-reg-card"><div><b>${esc(r.sessionName||r.eventTitle||r.brand||'我的報名')}</b><p>${esc(r.date||r.sessionDate||r.activityDate||'日期待確認')}</p></div><div class="reg-status">${esc(r.paymentStatus||r.reviewStatus||r.status||'已報名')}</div></article>`).join(''):'<div class="empty-state">目前沒有報名紀錄。</div>'}async function saveMember(e){e.preventDefault();if(!S.memberToken)return memberLogin();const f=e.currentTarget,fd=new FormData(f),msg=$('memberMessage'),btn=f.querySelector('[type=submit]');btn.disabled=true;msg.textContent='';try{await api('savePlatformMemberProfile',{member_token:S.memberToken,name:fd.get('name'),phone:fd.get('phone'),email:fd.get('email'),city:fd.get('city')},true);msg.textContent='會員資料已儲存';await loadMember()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}}async function openMember(){if(!$('memberDialog').open)$('memberDialog').showModal();await loadMember()}function openSupport(){if(!$('supportDialog').open)$('supportDialog').showModal()}function supportChat(){const u=new URL('/',location.origin);u.searchParams.set('support','open');location.href=u.toString()}function wireClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const d=$(b.dataset.close);if(d?.open)d.close()})}const incoming=P.get('member_token')||'';if(incoming){setStoredToken(incoming);const clean=new URL(location.href);clean.searchParams.delete('member_token');history.replaceState({},'',clean.toString())}if(INITIAL_Q)$('q').value=INITIAL_Q;$('myRegs').onclick=openMember;$('navMember').onclick=openMember;$('memberLoginBtn').onclick=memberLogin;$('memberForm').onsubmit=saveMember;$('refreshMemberRegs').onclick=loadRegs;$('supportTop').onclick=openSupport;$('navSupport').onclick=openSupport;$('openSupportChat').onclick=supportChat;$('navHome').onclick=()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close());scrollTo({top:0,behavior:'smooth'})};$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});wireClose();Promise.allSettled([loadBrand(),load()]);</script></body></html>
