<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING Market｜找今天想參加的活動</title><link rel="stylesheet" href="doing-system.css?v=20260817-system5">
<style>
:root{--ink:#2f3340;--muted:#6f7180;--line:#dfe5ef;--bg:#fbfaf7;--paper:#fffefa;--sky:#9ecdf7;--lav:#d9ccff;--mint:#dff3c8;--butter:#ffe8a8;--rose:#f0b8cf;--shadow:0 4px 14px rgba(70,74,105,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,a,input{font:inherit}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:100;background:#fffefa;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:9px;box-shadow:0 3px 12px rgba(70,74,105,.06)}.top img{width:42px;height:42px;border-radius:8px;object-fit:cover}.top b{font-size:17px}.right{margin-left:auto;display:flex;gap:6px}.btn{min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 11px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.primary{background:var(--lav);border-color:#cdbcf7;color:#4f4281}.shell{max-width:1480px;margin:auto;padding:12px 16px 90px}.dm17-cover{width:100%;aspect-ratio:16/4;min-height:150px;max-height:300px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center;margin-bottom:10px;color:var(--muted);font-weight:850}.dm17-cover img{width:100%;height:100%;object-fit:cover}.hero{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}.eyebrow{font-size:13px;font-weight:950;color:#7860c4;margin-bottom:4px}.hero h1{margin:0;font-size:clamp(27px,3vw,38px);line-height:1.12}.hero p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.search{display:grid;grid-template-columns:1fr auto;gap:7px;margin:10px 0}.search input{min-height:46px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;font-size:15px}.search .btn{background:var(--rose);border-color:#e4a7c4;color:#5c3150}.filters{display:flex;gap:6px;overflow:auto;padding:0 0 7px}.chip{white-space:nowrap;min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 9px;font-size:13px;font-weight:850}.chip.on{background:var(--sky);border-color:#83bce9;color:#274f74}.head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:10px 0 7px}.head h2{margin:0;font-size:21px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}.cover{aspect-ratio:1/1;background:#f4f7f8;display:grid;place-items:center;font-size:34px;font-weight:950;color:#57838b}.cover img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover}.body{padding:8px;display:flex;flex:1;flex-direction:column;gap:4px}.body h3{margin:0;font-size:15px;line-height:1.3}.body p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.meta{display:flex;gap:4px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:7px;background:#eaf5ff;padding:3px 6px;font-size:10px;font-weight:800}.cta{display:block;margin-top:auto;padding:7px;text-align:center;border:1px solid #cdbcf7;border-radius:8px;background:var(--lav);color:#4f4281;font-size:12px;font-weight:900}.empty{padding:20px;border:1px dashed var(--line);background:#fff;border-radius:10px;text-align:center;color:var(--muted)}.dm17-mobile-nav{display:none}
@media(min-width:1440px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:1179px) and (min-width:769px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:768px){.shell{padding:10px 8px 88px}.dm17-cover{aspect-ratio:16/6;min-height:110px;border-radius:10px}.right .desktop-only{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.body h3{font-size:14px}.dm17-mobile-nav{position:fixed;left:7px;right:7px;bottom:calc(7px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fffefa;box-shadow:0 10px 24px rgba(70,74,105,.16)}.dm17-mobile-nav button{min-height:46px;border:1px solid transparent;border-radius:8px;font-weight:950;font-size:13px}.dm17-mobile-nav button:nth-child(1){background:var(--mint);color:#52722d}.dm17-mobile-nav button:nth-child(2){background:var(--lav);color:#56448a}.dm17-mobile-nav button:nth-child(3){background:var(--butter);color:#7e6124}}
</style>
</head>
<body>
<header class="top"><a id="homeLink" href="/market/public/"><img id="tenantLogo" src="doing-logo.png" alt="主辦 LOGO"></a><b>DOING Market</b><div class="right"><button id="supportTop" class="btn desktop-only">線上客服</button><button id="myRegs" class="btn primary">我的報名</button></div></header>
<main class="shell">
<section id="tenantCover" class="dm17-cover"><span>主辦封面圖</span></section>
<section class="hero"><div class="eyebrow">先做就對了 ✦</div><h1>找今天想參加的活動</h1><p id="tenantIntro">找最近的市集、活動與體驗，點進去就能直接報名。</p></section>
<div class="search"><input id="q" type="search" placeholder="搜尋活動、主辦、地點"><button id="searchBtn" class="btn">搜尋</button></div>
<div class="filters"><button class="chip on" data-type="all">全部</button><button class="chip" data-type="market">市集</button><button class="chip" data-type="event">活動</button><button class="chip" data-type="experience">體驗／DIY</button></div>
<div class="head"><div><h2>近期開放</h2><div id="summary" class="muted">載入中…</div></div><button id="reload" class="btn">重新整理</button></div>
<div id="list" class="grid"><div class="empty">正在載入活動…</div></div>
</main>
<nav class="dm17-mobile-nav"><button id="mobileJoin" type="button">報名活動</button><button id="mobileRecords" type="button">我的紀錄</button><button id="mobileSupport" type="button">線上客服</button></nav>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),S={rows:[],type:'all'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(action){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}
function text(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}
function type(x){const s=text(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}
function firstDate(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return Number.POSITIVE_INFINITY;const d=a[0],raw=typeof d==='object'?(d.date||d.label||''):String(d||''),t=Date.parse(raw);return Number.isFinite(t)?t:Number.POSITIVE_INFINITY}
function dateText(x){const a=Array.isArray(x.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}
function openUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId)u.searchParams.set('tenant',x.tenantId);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}
function render(){const q=$('q').value.trim().toLowerCase();let rows=[...S.rows].sort((a,b)=>firstDate(a)-firstDate(b));if(S.type!=='all')rows=rows.filter(x=>type(x)===S.type);if(q)rows=rows.filter(x=>text(x).includes(q));$('summary').textContent=`${rows.length} 個目前開放內容`;$('list').innerHTML=rows.length?rows.map(x=>`<a class="card" href="${openUrl(x)}"><div class="cover">${x.cover?`<img src="${esc(x.cover)}" alt="">`:type(x)==='market'?'市':type(x)==='experience'?'體':'活'}</div><div class="body"><div class="meta"><span class="tag">${type(x)==='market'?'市集':type(x)==='experience'?'體驗／DIY':'活動'}</span></div><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="cta">立即報名</span></div></a>`).join(''):'<div class="empty">目前沒有符合的活動。</div>'}
async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg)$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面">`;if(c.infoText)$('tenantIntro').textContent=c.infoText}catch(_){}}
function startMy(){let token='';try{token=localStorage.getItem('doing_member_token')||''}catch(_){}if(token){const u=new URL('/me/',location.origin);u.searchParams.set('member_token',token);u.hash='activities';location.href=u.toString();return}const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','registrations');const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}
function support(){const hit=document.querySelector('#supportBtn,[data-support],.support-fab,.customer-service-btn');if(hit){hit.click();return}location.href='/?support=open'}
const incoming=P.get('member_token')||'';if(incoming){try{localStorage.setItem('doing_member_token',incoming)}catch(_){}const u=new URL('/me/',location.origin);u.searchParams.set('member_token',incoming);u.hash='activities';location.replace(u.toString())}
$('myRegs').onclick=startMy;$('mobileRecords').onclick=startMy;$('supportTop').onclick=support;$('mobileSupport').onclick=support;$('mobileJoin').onclick=()=>$('q').focus();$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));render()});
Promise.allSettled([loadBrand(),load()]);
</script>
</body></html>
