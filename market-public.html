<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING Market｜找市集、活動與體驗</title><link rel="stylesheet" href="doing-system.css?v=20260817-system5">
<style>
:root{--ink:#2f3947;--muted:#66717f;--line:#d8e6e8;--bg:#f7fbfb;--brand:#4f8f9d;--sky:#eef8fc;--mint:#edf8f2;--shadow:0 10px 28px rgba(49,73,82,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,a,input{font:inherit}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:9px}.top img{width:42px;height:42px}.top b{font-size:18px}.right{margin-left:auto;display:flex;gap:7px}.btn{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 12px;text-decoration:none;font-weight:850;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.shell{max-width:1180px;margin:auto;padding:14px}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero-copy{padding:24px}.hero h1{margin:0 0 8px;font-size:clamp(31px,5vw,48px);line-height:1.12}.hero p{margin:0;color:var(--muted);line-height:1.7}.hero-art{min-height:230px;background:linear-gradient(135deg,var(--mint),var(--sky));display:grid;place-items:center}.hero-art div{border:1px solid var(--line);background:#fff;border-radius:15px;padding:18px;box-shadow:var(--shadow);font-weight:900;line-height:2}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.search input{min-height:48px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 13px;font-size:16px}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.chip{white-space:nowrap;min-height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 11px;font-weight:850}.chip.on{background:#30404b;color:#fff}.head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:14px 0 9px}.head h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);color:inherit;text-decoration:none}.cover{height:145px;background:linear-gradient(135deg,var(--mint),var(--sky));display:grid;place-items:center;font-size:36px;font-weight:950;color:#57838b}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:13px;display:flex;flex:1;flex-direction:column}.body h3{margin:4px 0 6px;font-size:20px}.body p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid var(--line);border-radius:8px;background:#f8fbfb;padding:4px 7px;font-size:12px;font-weight:800}.cta{margin-top:auto;padding-top:12px;font-weight:900;color:#376f7b}.empty{padding:26px;border:1px dashed var(--line);background:#fff;border-radius:14px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.shell{padding:9px}.hero{grid-template-columns:1fr}.hero-art{min-height:130px}.hero-copy{padding:18px}.grid{grid-template-columns:1fr}.search{grid-template-columns:1fr}.search .btn{width:100%}.right .home{display:none}}
</style>
</head>
<body>
<header class="top"><a href="market-public.html"><img src="doing-logo.png" alt="DOING"></a><b>DOING Market</b><div class="right"><a class="btn home" href="index.html">DOING 首頁</a><button id="myRegs" class="btn primary">我的報名</button></div></header>
<main class="shell">
<section class="hero"><div class="hero-copy"><h1>找市集、活動與體驗</h1><p>市集、手作、花藝、DIY、工作坊與一般活動，都可以在這裡找到。點進活動後沿用 DOING 正式報名、付款與「我的報名」流程。</p></div><div class="hero-art"><div>找活動<br>→ 報名<br>→ 付款<br>→ 行前通知</div></div></section>
<div class="search"><input id="q" type="search" placeholder="搜尋活動名稱、主辦、地點"><button id="searchBtn" class="btn primary">搜尋</button></div>
<div class="filters"><button class="chip on" data-type="all">全部</button><button class="chip" data-type="market">市集</button><button class="chip" data-type="event">活動</button><button class="chip" data-type="experience">體驗／DIY</button></div>
<div class="head"><div><h2>近期開放</h2><div id="summary" class="muted">載入中…</div></div><button id="reload" class="btn">重新整理</button></div>
<div id="list" class="grid"><div class="empty">正在讀取 DOING 正式公開活動…</div></div>
</main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',S={rows:[],type:'all'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(action){const u=new URL(API);u.searchParams.set('action',action);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'活動載入失敗');return d.data??d.result??d}
function text(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}
function type(x){const s=text(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}
function dateText(x){const a=Array.isArray(x.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}
function openUrl(x){const u=new URL('index.html',location.href);if(x.tenantId)u.searchParams.set('tenant',x.tenantId);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}
function render(){const q=$('q').value.trim().toLowerCase();let rows=S.rows;if(S.type!=='all')rows=rows.filter(x=>type(x)===S.type);if(q)rows=rows.filter(x=>text(x).includes(q));$('summary').textContent=`${rows.length} 個目前開放內容`;$('list').innerHTML=rows.length?rows.map((x,i)=>`<a class="card" href="${openUrl(x)}"><div class="cover">${x.cover?`<img src="${esc(x.cover)}" alt="">`:type(x)==='market'?'市':type(x)==='experience'?'體':'活'}</div><div class="body"><div class="meta"><span class="tag">${type(x)==='market'?'市集':type(x)==='experience'?'體驗／DIY':'活動'}</span>${x.tenantName?`<span class="tag">${esc(x.tenantName)}</span>`:''}</div><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="cta">查看活動 →</span></div></a>`).join(''):'<div class="empty">沒有符合的活動。</div>'}
async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function startMy(){let token='';try{token=localStorage.getItem('doing_member_token')||''}catch(_){}if(token){const u=new URL('member-panel.html',location.href);u.searchParams.set('member_token',token);u.hash='activities';location.href=u.toString();return}const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','registrations');const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}
const incoming=new URL(location.href).searchParams.get('member_token')||'';if(incoming){try{localStorage.setItem('doing_member_token',incoming)}catch(_){}const u=new URL('member-panel.html',location.href);u.searchParams.set('member_token',incoming);u.hash='activities';location.replace(u.toString())}
$('myRegs').onclick=startMy;$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));render()});load();
</script>
</body></html>
