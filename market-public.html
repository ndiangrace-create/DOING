<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜找今天想參加的活動</title><link rel="stylesheet" href="doing-market-v18.css?v=20260823-v18"></head><body><header class="mk-top"><div class="mk-top-in"><a class="mk-brand" id="homeLink" href="/market/public/"><img id="tenantLogo" src="doing-logo.png" alt="主辦 LOGO"><span class="mk-brand-text"><b id="tenantName">DOING Market</b><small>活動探索</small></span></a><div class="mk-top-actions"><button id="supportTop" class="mk-btn mk-hide-mobile">線上客服</button><button id="myRegs" class="mk-btn primary">我的報名</button></div></div></header><main class="mk-shell"><section id="tenantCover" class="mk-tenant-cover"><span>主辦封面圖</span></section><section class="mk-hero"><div class="mk-eyebrow">先做就對了 ✦</div><h1>找今天想參加的活動</h1><p id="tenantIntro">找最近的市集、活動與體驗，點進去就能直接報名。</p></section><div class="mk-search"><input id="q" type="search" placeholder="搜尋活動、主辦、地點"><button id="searchBtn" class="mk-btn rose">搜尋</button></div><div class="mk-chips"><button class="mk-chip on" data-type="all">全部</button><button class="mk-chip" data-type="market">市集</button><button class="mk-chip" data-type="event">活動</button><button class="mk-chip" data-type="experience">體驗／DIY</button></div><div class="mk-section-head"><div><h2>近期開放</h2><div id="summary" class="mk-muted">載入中…</div></div><button id="reload" class="mk-btn">重新整理</button></div><div id="list" class="mk-grid"><div class="mk-empty">正在載入活動…</div></div></main><nav class="mk-mobile-nav"><button id="mobileJoin" type="button">報名活動</button><button id="mobileRecords" type="button">我的紀錄</button><button id="mobileSupport" type="button">線上客服</button></nav><script>'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),INITIAL_Q=P.get('q')||'',S={rows:[],type:'all'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}function blob(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}function kind(x){const s=blob(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}function firstDate(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return Number.POSITIVE_INFINITY;const d=a[0],raw=typeof d==='object'?(d.date||d.label||''):String(d||''),t=Date.parse(raw);return Number.isFinite(t)?t:Number.POSITIVE_INFINITY}function dateText(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}function regUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId||T)u.searchParams.set('tenant',x.tenantId||T);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}function render(){const q=$('q').value.trim().toLowerCase();let rows=[...S.rows].sort((a,b)=>firstDate(a)-firstDate(b));if(S.type!=='all')rows=rows.filter(x=>kind(x)===S.type);if(q)rows=rows.filter(x=>blob(x).includes(q));$('summary').textContent=`${rows.length} 個目前開放內容`;$('list').innerHTML=rows.length?rows.map(x=>`<a class="mk-card mk-event-card" href="${regUrl(x)}"><div class="mk-event-cover">${x.cover?`<img src="${esc(x.cover)}" alt="">`:kind(x)==='market'?'市':kind(x)==='experience'?'體':'活'}</div><div class="mk-card-body"><div class="mk-tags"><span class="mk-tag">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span></div><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="mk-cta">立即報名</span></div></a>`).join(''):'<div class="mk-empty">目前沒有符合的活動。</div>'}async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML='<div class="mk-empty">'+esc(e.message)+'</div>'}}async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg)$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面">`;if(c.infoText)$('tenantIntro').textContent=c.infoText;if(c.brandName)$('tenantName').textContent=c.brandName}catch(_){}}function goRecords(){let mt='';try{mt=localStorage.getItem('doing_member_token')||''}catch(_){}if(mt){const u=new URL('/me/',location.origin);u.searchParams.set('member_token',mt);u.searchParams.set('tab','activities');location.href=u.toString();return}const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','registrations');const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}function support(){const u=new URL('/',location.origin);u.searchParams.set('support','open');location.href=u.toString()}const incoming=P.get('member_token')||'';if(incoming){try{localStorage.setItem('doing_member_token',incoming)}catch(_){}const u=new URL('/me/',location.origin);u.searchParams.set('member_token',incoming);u.searchParams.set('tab','activities');location.replace(u.toString())}if(INITIAL_Q)$('q').value=INITIAL_Q;$('myRegs').onclick=goRecords;$('mobileRecords').onclick=goRecords;$('supportTop').onclick=support;$('mobileSupport').onclick=support;$('mobileJoin').onclick=()=>{window.scrollTo({top:document.querySelector('.mk-search').offsetTop-70,behavior:'smooth'});$('q').focus()};$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));render()});Promise.allSettled([loadBrand(),load()]);</script></body></html>
