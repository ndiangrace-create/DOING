<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜活動報名</title><link rel="stylesheet" href="/doing-market-v18.css?v=20260823-layout-auth"></head><body class="mk-public"><header class="public-top"><div class="public-top-in"><a class="public-brand" href="/market/public/" id="homeLink"><img id="tenantLogo" src="/doing-logo.png" alt="LOGO"><span><b id="tenantName">DOING Market</b><small>活動報名</small></span></a><div class="public-actions"><button id="supportTop" class="btn yellow desktop-only">客服</button><button id="myRegs" class="btn purple">會員</button></div></div></header><main class="public-shell"><section id="tenantCover" class="hero-cover"><span style="display:grid;place-items:center;height:100%;color:#666">主辦封面圖</span></section><section class="hero-copy"><h1>找今天想參加的活動</h1><p id="tenantIntro">近期活動依日期由近到遠排列。</p></section><div class="search-row"><input id="q" type="search" placeholder="搜尋活動、主辦、地點"><button id="searchBtn" class="btn secondary">搜尋</button></div><section><div class="section-head"><div><h2>活動分類</h2><div class="muted">選一個類型快速查看</div></div></div><div class="cat-grid"><button class="cat-card active" data-type="all"><div class="cat-icon">✦</div>全部</button><button class="cat-card" data-type="market"><div class="cat-icon">⌂</div>市集</button><button class="cat-card" data-type="event"><div class="cat-icon">★</div>活動</button><button class="cat-card" data-type="experience"><div class="cat-icon">✂</div>體驗／DIY</button></div></section><section><div class="section-head"><div><h2>近期活動</h2><div id="summary" class="muted">載入中…</div></div><button id="reload" class="btn secondary">重新整理</button></div><div id="eventsScroll" class="events-scroll"></div></section><section><div class="section-head"><div><h2>全部活動</h2><div class="muted">點活動即可查看並報名</div></div></div><div id="list" class="event-list"><div class="muted">正在載入活動…</div></div></section></main><nav class="bottom-nav"><button id="navHome" type="button">首頁</button><button id="navMember" type="button">會員</button><button id="navSupport" type="button">客服</button></nav><script>'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),INITIAL_Q=P.get('q')||'',S={rows:[],type:'all'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}function blob(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}function kind(x){const s=blob(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}function firstDate(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return Number.POSITIVE_INFINITY;const d=a[0],raw=typeof d==='object'?(d.date||d.label||''):String(d||''),t=Date.parse(raw);return Number.isFinite(t)?t:Number.POSITIVE_INFINITY}function dateText(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}function openUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId||T)u.searchParams.set('tenant',x.tenantId||T);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}function filtered(){const q=$('q').value.trim().toLowerCase();let rows=[...S.rows].sort((a,b)=>firstDate(a)-firstDate(b));if(S.type!=='all')rows=rows.filter(x=>kind(x)===S.type);if(q)rows=rows.filter(x=>blob(x).includes(q));return rows}function thumb(x){return x.cover?`<img src="${esc(x.cover)}" alt="">`:'<div style="height:100%;display:grid;place-items:center;font-weight:900">DOING</div>'}function render(){const rows=filtered();$('summary').textContent=`${rows.length} 個目前開放內容`;$('eventsScroll').innerHTML=rows.slice(0,8).map(x=>`<a class="event-card-h" href="${openUrl(x)}"><div class="ec-thumb">${thumb(x)}</div><div class="ec-body"><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}</p></div></a>`).join('')||'<div class="muted">目前沒有符合的活動。</div>';$('list').innerHTML=rows.map(x=>`<a class="event-card" href="${openUrl(x)}"><div class="event-cover">${thumb(x)}</div><div class="event-info"><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="status-tag">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span></div></a>`).join('')||'<div class="muted">目前沒有符合的活動。</div>'}async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg)$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面">`;if(c.infoText)$('tenantIntro').textContent=c.infoText;if(c.brandName)$('tenantName').textContent=c.brandName}catch(_){}}function member(){let mt='';try{mt=localStorage.getItem('doing_member_token')||''}catch(_){}if(mt){const u=new URL('/me/',location.origin);u.searchParams.set('member_token',mt);u.searchParams.set('tab','activities');location.href=u.toString();return}const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','registrations');const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}function support(){const u=new URL('/',location.origin);u.searchParams.set('support','open');location.href=u.toString()}const incoming=P.get('member_token')||'';if(incoming){try{localStorage.setItem('doing_member_token',incoming)}catch(_){}const u=new URL('/me/',location.origin);u.searchParams.set('member_token',incoming);u.searchParams.set('tab','activities');location.replace(u.toString())}if(INITIAL_Q)$('q').value=INITIAL_Q;$('myRegs').onclick=member;$('navMember').onclick=member;$('supportTop').onclick=support;$('navSupport').onclick=support;$('navHome').onclick=()=>location.href='/market/public/'+location.search;$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});Promise.allSettled([loadBrand(),load()]);</script></body></html>
