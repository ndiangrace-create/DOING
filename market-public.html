<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜活動報名</title><link rel="stylesheet" href="/doing-market-v18.css?v=20260823-2bl-parity"><style id="market-public-2bl-framework-v20">:root{--c1:#DDEAD1;--c2:#FAEEC7;--c3:#D9E5EE;--c4:#FAE1DD;--c5:#DCD7ED;--ink:#111;--muted:#666;--line:#e8e8e4;--r:12px;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body.mk-public{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;padding-bottom:72px}button,input{font:inherit}.mk-public .public-top{position:sticky;top:0;z-index:70;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.mk-public .public-top-in{width:min(1160px,100%);min-height:60px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:10px}.mk-public .public-brand{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:inherit}.mk-public .public-brand img{width:40px;height:40px;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#fff}.mk-public .public-brand b{display:block;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mk-public .public-brand small{display:block;font-size:12px;color:var(--muted)}.mk-public .public-actions{margin-left:auto;display:flex;gap:7px}.mk-public .btn{min-height:40px;padding:8px 13px;border:0;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}.mk-public .btn.secondary{background:var(--c3);color:#1a4a6a}.mk-public .btn.yellow{background:var(--c2);color:#6a5500}.mk-public .btn.purple{background:var(--c5);color:#493e67}.mk-public .public-shell{width:min(1160px,100%);margin:auto;padding:10px 14px 28px}.mk-public .tenant-cover{display:none;width:100%;height:150px;overflow:hidden;border:1px solid var(--line);border-radius:12px;margin:2px 0 8px;background:#f7f7f4}.mk-public .tenant-cover.has-image{display:block}.mk-public .tenant-cover img{width:100%;height:100%;object-fit:cover}.mk-public .intro-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:3px 0 7px}.mk-public .intro-row h1{margin:0;font-size:21px;line-height:1.25}.mk-public .intro-row p{margin:2px 0 0;font-size:14px;color:var(--muted)}.mk-public .search-row{width:min(760px,100%);display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:7px;margin:7px 0 9px}.mk-public .search-row input{height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;background:#fff}.mk-public .search-row .btn{height:44px;width:84px;padding:8px}.mk-public .section{margin-top:8px}.mk-public .section-hd{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:6px 0}.mk-public .section-title{font-size:18px;font-weight:900}.mk-public .section-sub{font-size:12px;color:var(--muted)}.mk-public .cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 10px}.mk-public .cat-card{height:94px;border-radius:12px;padding:12px 14px;border:2px solid transparent;background:#fff;text-align:center;font-size:16px;font-weight:900;cursor:pointer}.mk-public .cat-card:nth-child(1){border-color:var(--c1);background:#f6fbf0}.mk-public .cat-card:nth-child(2){border-color:var(--c2);background:#fdf8ed}.mk-public .cat-card:nth-child(3){border-color:var(--c3);background:#f0f7fc}.mk-public .cat-card:nth-child(4){border-color:var(--c5);background:#f7f4fc}.mk-public .cat-card.active{box-shadow:0 0 0 2px #111 inset}.mk-public .cat-icon{font-size:25px;line-height:1;margin-bottom:5px}.mk-public .events-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 0 6px;scroll-snap-type:x proximity;scrollbar-width:none}.mk-public .events-scroll::-webkit-scrollbar{display:none}.mk-public .event-card-h{flex:0 0 188px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;scroll-snap-align:start}.mk-public .event-card-h .ec-thumb{aspect-ratio:1/1;background:#f4f4f0;overflow:hidden}.mk-public .event-card-h .ec-thumb img{width:100%;height:100%;object-fit:cover}.mk-public .event-card-h .ec-body{padding:9px}.mk-public .event-card-h h3{font-size:15px;line-height:1.35;margin:0 0 4px;font-weight:900}.mk-public .event-card-h p{font-size:13px;margin:0;color:var(--muted)}.mk-public .event-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mk-public .event-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit}.mk-public .event-cover{aspect-ratio:1/1;background:#f4f4f0;overflow:hidden}.mk-public .event-cover img{width:100%;height:100%;object-fit:cover}.mk-public .event-info{padding:10px}.mk-public .event-info h3{font-size:16px;margin:0 0 5px;font-weight:900;line-height:1.35}.mk-public .event-info p{font-size:14px;margin:0;color:var(--muted)}.mk-public .status-tag{display:inline-flex;margin-top:7px;padding:4px 8px;border-radius:8px;background:var(--c1);font-size:13px;font-weight:800}.mk-public .muted{color:var(--muted)}.mk-public .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:80;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px 10px calc(7px + var(--safe));background:#fff;border-top:1px solid var(--line)}.mk-public .bottom-nav button{min-height:48px;border:0;border-radius:10px;font-size:16px;font-weight:900}.mk-public .bottom-nav button:nth-child(1){background:var(--c1)}.mk-public .bottom-nav button:nth-child(2){background:var(--c5)}.mk-public .bottom-nav button:nth-child(3){background:var(--c2)}@media(max-width:899px){.mk-public .public-shell{padding:8px 12px 90px}.mk-public .public-top-in{min-height:58px;padding:7px 12px}.mk-public .public-brand img{width:38px;height:38px}.mk-public .public-actions .desktop-only{display:none}.mk-public .tenant-cover{height:120px;margin-top:4px}.mk-public .intro-row h1{font-size:19px}.mk-public .intro-row p{font-size:13px}.mk-public .search-row{grid-template-columns:1fr;margin:7px 0}.mk-public .search-row .btn{display:none}.mk-public .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mk-public .cat-card{height:84px;padding:10px;font-size:15px}.mk-public .cat-icon{font-size:23px}.mk-public .event-card-h{flex-basis:154px}.mk-public .event-list{display:flex;flex-direction:column;gap:8px}.mk-public .event-card{display:block}.mk-public .event-card .event-link-inner{display:flex;gap:10px;padding:10px}.mk-public .event-cover{width:76px;height:76px;flex:0 0 76px;border-radius:10px}.mk-public .event-info{padding:0;flex:1;min-width:0}.mk-public .event-info h3{font-size:16px}.mk-public .event-info p{font-size:13px}.mk-public .status-tag{font-size:12px}}@media(min-width:900px){body.mk-public{padding-bottom:0}.mk-public .bottom-nav{display:none}}@media(min-width:900px) and (max-width:1120px){.mk-public .event-list{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body class="mk-public"><header class="public-top"><div class="public-top-in"><a class="public-brand" href="/market/public/" id="homeLink"><img id="tenantLogo" src="/doing-logo.png" alt="LOGO"><span><b id="tenantName">DOING Market</b><small>活動報名</small></span></a><div class="public-actions"><button id="supportTop" class="btn yellow desktop-only">客服</button><button id="myRegs" class="btn purple">會員</button></div></div></header><main class="public-shell"><section id="tenantCover" class="tenant-cover"></section><section class="intro-row"><div><h1>找今天想參加的活動</h1><p id="tenantIntro">近期活動依日期由近到遠排列。</p></div></section><div class="search-row"><input id="q" type="search" placeholder="搜尋活動、主辦、地點"><button id="searchBtn" class="btn secondary">搜尋</button></div><section class="section"><div class="section-hd"><div><div class="section-title">活動分類</div><div class="section-sub">選一個類型快速查看</div></div></div><div class="cat-grid"><button class="cat-card active" data-type="all"><div class="cat-icon">✦</div>全部</button><button class="cat-card" data-type="market"><div class="cat-icon">⌂</div>市集</button><button class="cat-card" data-type="event"><div class="cat-icon">★</div>活動</button><button class="cat-card" data-type="experience"><div class="cat-icon">✂</div>體驗／DIY</button></div></section><section class="section"><div class="section-hd"><div><div class="section-title">近期活動</div><div id="summary" class="section-sub">載入中…</div></div><button id="reload" class="btn secondary">重新整理</button></div><div id="eventsScroll" class="events-scroll"></div></section><section class="section"><div class="section-hd"><div><div class="section-title">全部活動</div><div class="section-sub">點活動即可查看並報名</div></div></div><div id="list" class="event-list"><div class="muted">正在載入活動…</div></div></section></main><nav class="bottom-nav"><button id="navHome" type="button">首頁</button><button id="navMember" type="button">會員</button><button id="navSupport" type="button">客服</button></nav><script>'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),INITIAL_Q=P.get('q')||'',S={rows:[],type:'all'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}function blob(x){return [x.sessionName,x.eventTitle,x.tenantName,x.venue,x.description,x.type,x.unitType].filter(Boolean).join(' ').toLowerCase()}function kind(x){const s=blob(x);if(/市集|攤|market|vendor|stall/.test(s))return'market';if(/體驗|手作|花藝|diy|workshop|工作坊/.test(s))return'experience';return'event'}function firstDate(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return Number.POSITIVE_INFINITY;const raw=a.map(d=>typeof d==='object'?(d.date||d.label||''):String(d||'')).map(v=>Date.parse(v)).filter(Number.isFinite).sort((a,b)=>a-b)[0];return Number.isFinite(raw)?raw:Number.POSITIVE_INFINITY}function dateText(x){const a=Array.isArray(x?.dates)?x.dates:[];if(!a.length)return'日期待公告';const d=a[0];return typeof d==='object'?[d.label||d.date,d.start&&d.end?d.start+'–'+d.end:''].filter(Boolean).join(' '):String(d)}function openUrl(x){const u=new URL('/register/',location.origin);if(x.tenantId||T)u.searchParams.set('tenant',x.tenantId||T);if(x.sessionId||x.id)u.searchParams.set('session',x.sessionId||x.id);return u.toString()}function filtered(){const q=$('q').value.trim().toLowerCase();let rows=[...S.rows].sort((a,b)=>firstDate(a)-firstDate(b));if(S.type!=='all')rows=rows.filter(x=>kind(x)===S.type);if(q)rows=rows.filter(x=>blob(x).includes(q));return rows}function thumb(x){return x.cover?`<img src="${esc(x.cover)}" alt="">`:'<div style="height:100%;display:grid;place-items:center;font-weight:900;background:#f4f4f0">DOING</div>'}function render(){const rows=filtered();$('summary').textContent=`${rows.length} 個目前開放內容`;$('eventsScroll').innerHTML=rows.slice(0,8).map(x=>`<a class="event-card-h" href="${openUrl(x)}"><div class="ec-thumb">${thumb(x)}</div><div class="ec-body"><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p></div></a>`).join('')||'<div class="muted">目前沒有符合的活動。</div>';$('list').innerHTML=rows.map(x=>`<a class="event-card" href="${openUrl(x)}"><div class="event-link-inner"><div class="event-cover">${thumb(x)}</div><div class="event-info"><h3>${esc(x.sessionName||x.eventTitle||'活動')}</h3><p>${esc(dateText(x))}${x.venue?'｜'+esc(x.venue):''}</p><span class="status-tag">${kind(x)==='market'?'市集':kind(x)==='experience'?'體驗／DIY':'活動'}</span></div></div></a>`).join('')||'<div class="muted">目前沒有符合的活動。</div>'}async function load(){try{const d=await api('publicDiscovery');S.rows=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);render()}catch(e){$('summary').textContent='載入失敗';$('list').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');if(c.logoUrl)$('tenantLogo').src=c.logoUrl;if(c.heroImg){$('tenantCover').classList.add('has-image');$('tenantCover').innerHTML=`<img src="${esc(c.heroImg)}" alt="主辦封面">`}if(c.infoText)$('tenantIntro').textContent=c.infoText;if(c.brandName)$('tenantName').textContent=c.brandName}catch(_){}}function member(){let mt='';try{mt=localStorage.getItem('doing_member_token')||''}catch(_){}if(mt){const u=new URL('/me/',location.origin);u.searchParams.set('member_token',mt);u.searchParams.set('tab','activities');location.href=u.toString();return}const ret=new URL(location.href);ret.searchParams.set('doing_login_flow','registrations');const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',ret.toString());location.href=u.toString()}function support(){const u=new URL('/',location.origin);u.searchParams.set('support','open');location.href=u.toString()}const incoming=P.get('member_token')||'';if(incoming){try{localStorage.setItem('doing_member_token',incoming)}catch(_){}const u=new URL('/me/',location.origin);u.searchParams.set('member_token',incoming);u.searchParams.set('tab','activities');location.replace(u.toString())}if(INITIAL_Q)$('q').value=INITIAL_Q;$('myRegs').onclick=member;$('navMember').onclick=member;$('supportTop').onclick=support;$('navSupport').onclick=support;$('navHome').onclick=()=>location.href='/market/public/'+location.search;$('searchBtn').onclick=render;$('q').oninput=render;$('reload').onclick=load;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});Promise.allSettled([loadBrand(),load()]);</script></body></html>
