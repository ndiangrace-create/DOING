<script src="doing-global-entry.js?v=20260817a"></script><script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',TOKEN_KEY='doing_member_token';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state={token:'',profile:null,linkedProviders:[],roles:[],platformAccess:null,applications:[],workspaces:[],activities:[],operationalTasks:{registrations:[],salesReports:[],serviceVisits:[]},brands:[],brandRequests:[],brandResolution:null};
async function apiGet(action,p={}){const u=new URL(API);u.searchParams.set('action',action);Object.entries(p).forEach(([k,v])=>v!==undefined&&v!==null&&u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):v));const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'讀取失敗');return d.data??d.result??d}
async function apiPost(action,b={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'儲存失敗');return d.data??d.result??d}
async function openWorkspaceAdmin(tenantId,calendar=false){const id=String(tenantId||'').trim().toLowerCase();if(!id||!state.token)return;const buttons=[...document.querySelectorAll('[data-workspace-admin="'+CSS.escape(id)+'"],[data-workspace-calendar="'+CSS.escape(id)+'"]')];buttons.forEach(x=>x.disabled=true);try{const d=await apiPost('createMemberWorkspaceAdminSession',{member_token:state.token,tenantId:id});const u=new URL('admin.html',location.href);u.searchParams.set('tenant',d.tenantId);u.searchParams.set('from','member');u.searchParams.set('admin_token',d.adminToken);if(calendar)u.hash='calendar';location.href=u.toString()}catch(e){alert(e.message||'無法進入這個營運空間');buttons.forEach(x=>x.disabled=false)}}
async function openWorkspaceOperations(tenantId){const id=String(tenantId||'').trim().toLowerCase();if(!id||!state.token)return;try{const d=await apiPost('createMemberWorkspaceAdminSession',{member_token:state.token,tenantId:id}),u=new URL('operations-center.html',location.href);u.searchParams.set('tenant',d.tenantId);u.searchParams.set('admin_token',d.adminToken);location.href=u.toString()}catch(e){alert(e.message||'無法進入完整營運中心')}}
function wireWorkspaceButtons(){document.querySelectorAll('[data-workspace-admin]').forEach(x=>x.onclick=()=>openWorkspaceAdmin(x.dataset.workspaceAdmin,false));document.querySelectorAll('[data-workspace-calendar]').forEach(x=>x.onclick=()=>openWorkspaceAdmin(x.dataset.workspaceCalendar,true));document.querySelectorAll('[data-workspace-operations]').forEach(x=>x.onclick=()=>openWorkspaceOperations(x.dataset.workspaceOperations))}
function cleanReturn(){const u=new URL(location.href);['member_token','member_status','member_login_error','login_error','member_linked'].forEach(k=>u.searchParams.delete(k));history.replaceState({},'',u.pathname+u.search+u.hash)}
function inviteToken(){return new URL(location.href).searchParams.get('staff_invite')||''}
function registrationInviteToken(){return new URL(location.href).searchParams.get('registration_invite')||''}
function memberReturnUrl(){const u=new URL('member.html',location.href),invite=inviteToken(),regInvite=registrationInviteToken();if(invite)u.searchParams.set('staff_invite',invite);if(regInvite)u.searchParams.set('registration_invite',regInvite);u.hash=regInvite?'activities':(location.hash||'account');return u.toString()}
function clearInvite(key='staff_invite'){const u=new URL(location.href);u.searchParams.delete(key);history.replaceState({},'',u.pathname+u.search+(u.hash||'#account'))}
function login(){const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',memberReturnUrl());location.href=u}
async function acceptManagementInvite(){const invite=inviteToken();if(!invite)return null;return apiPost('acceptStaffInvite',{member_token:state.token,invite_token:invite})}
async function acceptRegistrationInvite(){const invite=registrationInviteToken();if(!invite)return null;return apiPost('acceptRegistrationMemberInvite',{member_token:state.token,invite_token:invite})}

function wireGo(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>goPage(x.dataset.go))}
function render(){const p=state.profile||{};$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('topName').textContent=p.name||'我的 DOING';$('topRole').textContent=identityText();$('hello').textContent=(p.name||'會員')+'，你好';$('identityLine').textContent=identityText();renderOverview();renderBrands();renderBrandRequests();renderOperations();fillForm();wireGo();const page=(location.hash||'#home').slice(1);goPage(['home','activities','brands','operations','account'].includes(page)?page:'home')}
async function loadProfile(){const d=await apiGet('getPlatformMemberProfile',{member_token:state.token});state.profile=d.profile||null;state.brands=Array.isArray(d.brands)?d.brands:[];state.linkedProviders=Array.isArray(d.linkedProviders)?d.linkedProviders:[];state.roles=Array.isArray(d.roles)?d.roles:[];state.platformAccess=d.platformAccess||null;state.applications=Array.isArray(d.applications)?d.applications:[];state.workspaces=Array.isArray(d.workspaces)?d.workspaces:[];if(!d.complete){location.href='index.html?openMemberProfile=1';return}render()}
async function init(){const u=new URL(location.href),incoming=u.searchParams.get('member_token'),err=u.searchParams.get('member_login_error')||u.searchParams.get('login_error'),linked=u.searchParams.get('member_linked'),invite=inviteToken(),regInvite=registrationInviteToken();state.token=incoming||localStorage.getItem(TOKEN_KEY)||'';if(incoming)localStorage.setItem(TOKEN_KEY,incoming);if(incoming||err)cleanReturn();if(invite||regInvite){$('lineLogin').textContent=regInvite?'使用 LINE 登入並加入活動':'使用 LINE 登入並接受管理邀請';$('loginView').insertAdjacentHTML('beforeend',regInvite?'<p style="color:var(--muted)">請由實際出攤者使用自己的 LINE 登入。</p>':'<p style="color:var(--muted)">請由受邀者本人使用 LINE 登入。</p>')}if(err){$('loginView').insertAdjacentHTML('beforeend','<p style="color:var(--danger)">'+(err==='identity_resolution_required'?'登入未完成，請聯絡 DOING 客服。':err==='line_email_permission_required'?'LINE 登入尚未完成，請稍後再試。':'登入未完成，請重新使用 LINE 登入')+'</p>')}if(!state.token)return;let inviteResult=null,inviteError='';if(invite){try{inviteResult=await acceptManagementInvite();clearInvite('staff_invite')}catch(e){inviteError=e.message||'管理邀請接受失敗';clearInvite('staff_invite')}}if(regInvite){try{inviteResult=await acceptRegistrationInvite();clearInvite('registration_invite')}catch(e){inviteError=e.message||'出攤邀請接受失敗';clearInvite('registration_invite')}}let last;for(let i=0;i<(incoming?3:1);i++){try{if(i)await new Promise(r=>setTimeout(r,500*i));await loadProfile();await Promise.all([loadActivities(),loadBrandRequests()]);if(regInvite)switchPage('activities');if(linked==='google')$('formMessage').textContent='Google 已同步到同一個 DOING 帳號';else if(inviteResult)alert(inviteResult.message||'邀請已接受');else if(inviteError)alert(inviteError);return}catch(e){last=e}}localStorage.removeItem(TOKEN_KEY);state.token='';$('loginView').insertAdjacentHTML('beforeend','<p style="color:var(--danger)">'+esc(last?.message||'登入已失效')+'</p>')}
$('lineLogin').onclick=login;$('logout').onclick=()=>{localStorage.removeItem(TOKEN_KEY);location.href='index.html'};$('accountSync').onclick=linkAccount;$('refreshActivities').onclick=loadActivities;$('profileForm').onsubmit=saveProfile;$('brandForm').onsubmit=saveBrand;$('newBrand').onclick=()=>openBrandForm();$('cancelBrand').onclick=()=>{$('brandForm').classList.add('hidden');state.brandResolution=null};document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>goPage(x.dataset.page));wireGo();init();
</script>
</body>
