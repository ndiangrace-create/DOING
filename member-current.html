<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>我的 DOING</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/doing-kawaii-current.css?v=20260825-3">
</head>
<body class="doing-kawaii min-h-screen text-slate-800">
<div class="watercolor-surface" aria-hidden="true"></div>
<header class="relative z-20 mx-auto flex w-full max-w-5xl items-center justify-between gap-3 px-4 pt-5 sm:px-6">
  <a href="/" class="inline-flex items-center gap-2"><img class="h-11 w-auto" src="/doing-logo.png?v=20260825-6" alt="DOING"><span class="hidden text-sm font-black text-[#7369a7] sm:inline">回首頁</span></a>
  <button id="logout" class="mini-jelly mini-jelly-lilac hidden" type="button">登出</button>
</header>
<main class="relative z-10 mx-auto w-full max-w-5xl px-4 pb-20 pt-8 sm:px-6">
  <section id="loginView" class="soft-panel mx-auto max-w-2xl p-7 text-center sm:p-10">
    <span class="kawaii-kicker">MY DOING</span>
    <h1 class="mt-3 text-3xl font-black text-[#6658bc]">登入你的 DOING</h1>
    <p class="mx-auto mt-3 max-w-xl font-bold leading-7 text-slate-600">使用申請 DOING 時綁定的 LINE 帳號。若 LINE 已有登入狀態會直接確認並回到 DOING；沒有登入狀態時，由 LINE 顯示可用的登入方式。</p>
    <button id="lineLogin" class="jelly-cta jelly-cta-lilac mt-6 min-w-48" type="button">使用 LINE 登入</button>
    <p id="loginMessage" class="mt-4 min-h-6 text-sm font-bold text-slate-500" aria-live="polite"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="soft-panel p-6 sm:p-8">
      <span class="kawaii-kicker">MY DOING</span>
      <div class="mt-3 flex flex-wrap items-end justify-between gap-4">
        <div><h1 id="hello" class="text-3xl font-black text-[#6658bc]">你好</h1><p id="identityLine" class="mt-1 font-bold text-slate-600">正在讀取你的工作空間</p></div>
        <a class="mini-jelly mini-jelly-blue" href="/apply/">申請新的營運</a>
      </div>
    </div>

    <section class="mt-7" aria-labelledby="workspaceTitle">
      <div class="mb-4 flex items-center justify-between gap-3"><h2 id="workspaceTitle" class="text-2xl font-black text-slate-800">我的工作空間</h2><button id="refresh" class="filter-chip" type="button">重新整理</button></div>
      <div id="workspaceList" class="grid gap-4 md:grid-cols-2"></div>
      <div id="emptyWorkspace" class="soft-panel hidden p-7 text-center"><h3 class="text-xl font-black">目前還沒有可進入的工作空間</h3><p class="mt-2 font-bold text-slate-600">如果你已送出營運申請，可以先查看申請進度，或重新整理一次。</p><a class="jelly-cta jelly-cta-blue mt-5" href="/apply/">前往申請</a></div>
    </section>
  </section>
</main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev';
const TOKEN_KEY='doing_member_token';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
let token='',authChecking=false,freshLogin=false;
function cleanReturn(){const u=new URL(location.href);['member_token','member_status','member_login_error','login_error'].forEach(k=>u.searchParams.delete(k));history.replaceState({},'',u.pathname+u.search+u.hash)}
function memberReturnUrl(){const u=new URL('/me/',location.origin);u.hash='operations';return u.toString()}
function setAuthChecking(active,message=''){authChecking=!!active;const btn=$('lineLogin');if(btn){btn.disabled=authChecking;btn.classList.toggle('hidden',authChecking);btn.textContent='使用 LINE 登入'}$('loginMessage').textContent=message||''}
function login(){if(authChecking)return;if(token){setAuthChecking(true,'正在確認你已登入的 DOING 帳號…');load().then(()=>{authChecking=false}).catch(handleLoadError);return}authChecking=true;const btn=$('lineLogin');if(btn){btn.disabled=true;btn.textContent='正在前往 LINE…'}$('loginMessage').textContent='正在前往 LINE 確認登入…';const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',memberReturnUrl());location.assign(u.toString())}
async function apiGet(action,params={}){const u=new URL(API);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,String(v))});const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error){const e=Error(d.error||'載入失敗');e.status=r.status;throw e}return d.data??d.result??d}
async function apiPost(action,body={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'操作失敗');return d.data??d.result??d}
function workspaceName(w){return w.tenantName||w.tenant_name||w.name||w.unitName||w.unit_name||w.tenantId||w.tenant_id||'DOING 工作空間'}
function workspaceId(w){return String(w.tenantId||w.tenant_id||w.id||'').trim().toLowerCase()}
function inferSystem(applications,tenantId){const rows=(Array.isArray(applications)?applications:[]).filter(a=>String(a.tenantId||a.tenant_id||'').toLowerCase()===String(tenantId||'').toLowerCase()&&String(a.status||'').toLowerCase()==='approved');for(const a of rows){const use=(Array.isArray(a.useCases)?a.useCases:[]).map(x=>String(x).toLowerCase()),industry=(Array.isArray(a.industryCategories)?a.industryCategories:[]).map(x=>String(x).toLowerCase());if(use.some(x=>['beauty','service_booking'].includes(x)))return'booking';if(use.includes('market'))return'market';if(industry.includes('professional_service')||use.length===1&&use[0]==='general')return'project'}return''}
function systemRoute(system){return system==='market'?'/market/':system==='project'?'/project/':system==='booking'?'/booking/':'/workspace/'}
function renderWorkspace(w){const id=workspaceId(w);const status=String(w.status||w.tenantStatus||w.tenant_status||'active');const role=String(w.role||w.staffRole||w.staff_role||'營運成員');return `<article class="system-card p-5" data-workspace="${esc(id)}"><span class="category-tag bg-[#e9e4ff] text-[#6658bc]">${esc(role)}</span><h3 class="mt-3 text-xl font-black">${esc(workspaceName(w))}</h3><p class="mt-1 text-sm font-bold text-slate-500">狀態：${esc(status)}</p><button class="card-action mt-5" type="button" data-open-workspace="${esc(id)}">進入工作空間</button></article>`}
async function openWorkspace(id,btn,targetSystem=''){if(!id||!token)return;if(btn){btn.disabled=true;btn.textContent='正在進入…'}try{const d=await apiPost('createMemberWorkspaceAdminSession',{member_token:token,tenantId:id});const data=d.data??d.result??d;const adminToken=data.adminToken||data.admin_token||'';const tenant=data.tenantId||data.tenant_id||id;if(!adminToken)throw Error('無法建立工作空間登入');const u=new URL(systemRoute(targetSystem),location.origin);u.searchParams.set('tenant',tenant);u.searchParams.set('admin_token',adminToken);location.href=u.toString()}catch(e){if(btn){btn.disabled=false;btn.textContent='進入工作空間'}else{$('identityLine').textContent='已登入，但暫時無法開啟系統首頁。你可以從下方工作空間再試一次。'}if(btn)alert(e.message||'無法進入工作空間')}}
async function load(){const d=await apiGet('getPlatformMemberProfile',{member_token:token});const profile=d.profile||d.member||{};const workspaces=Array.isArray(d.workspaces)?d.workspaces:[];const applications=Array.isArray(d.applications)?d.applications:[];$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logout').classList.remove('hidden');$('hello').textContent=(profile.name||profile.displayName||'你好')+'，歡迎回來';$('identityLine').textContent=workspaces.length?`你目前有 ${workspaces.length} 個可進入的工作空間`:'目前沒有可進入的工作空間';$('workspaceList').innerHTML=workspaces.map(renderWorkspace).join('');$('workspaceList').classList.toggle('hidden',workspaces.length===0);$('emptyWorkspace').classList.toggle('hidden',workspaces.length!==0);document.querySelectorAll('[data-open-workspace]').forEach(btn=>btn.onclick=()=>openWorkspace(btn.dataset.openWorkspace,btn));$('loginMessage').textContent='';if(freshLogin&&workspaces.length===1){freshLogin=false;const id=workspaceId(workspaces[0]),target=inferSystem(applications,id);if(target){$('identityLine').textContent='登入成功，正在開啟你的系統…';await openWorkspace(id,null,target)}}}
function isAuthExpired(e){const m=String(e&&e.message||'');return Number(e&&e.status)===401||/登入已失效|請重新登入|token.*(失效|過期|invalid|expired)/i.test(m)}
function handleLoadError(e){if(isAuthExpired(e)){localStorage.removeItem(TOKEN_KEY);token='';setAuthChecking(false,'登入已失效，請重新使用 LINE 登入。');return}authChecking=false;setAuthChecking(false,'LINE 登入已保留，但工作空間暫時載入失敗。請按「重新確認」，不需要再登入 LINE。');const btn=$('lineLogin');if(btn)btn.textContent='重新確認'}
async function init(){const u=new URL(location.href),incoming=u.searchParams.get('member_token')||'',err=u.searchParams.get('member_login_error')||u.searchParams.get('login_error')||'';freshLogin=!!incoming;token=incoming||localStorage.getItem(TOKEN_KEY)||'';if(incoming)localStorage.setItem(TOKEN_KEY,incoming);if(incoming||err)cleanReturn();if(err){const messages={identity_resolution_required:'登入身份需要人工確認，請聯絡 DOING 客服。',line_login_required:'LINE 需要重新確認登入，請在 LINE 頁面完成驗證。',line_cancelled:'你已取消 LINE 登入。',line_login_failed:'LINE 登入沒有完成，請再試一次。'};$('loginMessage').textContent=messages[err]||'LINE 登入未完成，請重新登入。'}if(!token)return;setAuthChecking(true,'正在確認你已登入的 DOING 帳號…');try{await load();authChecking=false}catch(e){handleLoadError(e)}}
$('lineLogin').onclick=login;$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('logout').onclick=()=>{localStorage.removeItem(TOKEN_KEY);token='';location.replace('/')};init();
</script>
</body>
</html>
