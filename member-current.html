<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>我的 DOING</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/doing-kawaii-current.css?v=20260825-3">
</head>
<body class="doing-kawaii min-h-screen text-slate-800">
<div class="watercolor-surface" aria-hidden="true"></div>
<header class="relative z-20 mx-auto flex w-full max-w-5xl items-center justify-between gap-3 px-4 pt-5 sm:px-6">
  <a href="/" class="inline-flex items-center gap-2"><img class="h-11 w-auto" src="/doing-logo.png?v=20260825-6" alt="DOING"><span class="hidden text-sm font-black text-[#7369a7] sm:inline">回首頁</span></a>
  <button id="logout" class="mini-jelly mini-jelly-lilac hidden" type="button">登出</button>
</header>
<main class="relative z-10 mx-auto w-full max-w-5xl px-4 pb-20 pt-8 sm:px-6">
  <section id="loginView" class="soft-panel mx-auto max-w-2xl p-7 text-center sm:p-10">
    <span class="kawaii-kicker">MY DOING</span>
    <h1 class="mt-3 text-3xl font-black text-[#6658bc]">登入你的 DOING</h1>
    <p class="mx-auto mt-3 max-w-xl font-bold leading-7 text-slate-600">使用申請 DOING 時綁定的 LINE 帳號。登入後會依正式資料帶出你已開通的系統。</p>
    <button id="lineLogin" class="jelly-cta jelly-cta-lilac mt-6 min-w-48" type="button">使用 LINE 登入</button>
    <p id="loginMessage" class="mt-4 min-h-6 text-sm font-bold text-slate-500" aria-live="polite"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="soft-panel p-6 sm:p-8">
      <span class="kawaii-kicker">MY DOING</span>
      <div class="mt-3 flex flex-wrap items-end justify-between gap-4">
        <div><h1 id="hello" class="text-3xl font-black text-[#6658bc]">你好</h1><p id="identityLine" class="mt-1 font-bold text-slate-600">正在讀取你的系統</p></div>
        <a class="mini-jelly mini-jelly-blue" href="/apply/">申請新的系統</a>
      </div>
    </div>

    <section class="mt-7" aria-labelledby="systemTitle">
      <div class="mb-4 flex items-center justify-between gap-3"><h2 id="systemTitle" class="text-2xl font-black text-slate-800">我的系統</h2><button id="refresh" class="filter-chip" type="button">重新整理</button></div>
      <div id="workspaceList" class="grid gap-4"></div>
      <div id="emptyWorkspace" class="soft-panel hidden p-7 text-center"><h3 class="text-xl font-black">目前還沒有已開通的系統</h3><p class="mt-2 font-bold text-slate-600">申請完成後，這裡只會出現真正已開通的系統。</p><a class="jelly-cta jelly-cta-blue mt-5" href="/apply/">前往申請</a></div>
    </section>
  </section>
</main>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev';
const TOKEN_KEY='doing_member_token';
const SYSTEMS={
  market:{name:'市集活動系統',icon:'🎪',route:'/market/',tag:'市集活動',tagClass:'bg-[#dff4ff] text-[#477e9e]'},
  project:{name:'室內設計進度系統',icon:'🏠',route:'/project/',tag:'室內設計進度',tagClass:'bg-[#fff0d9] text-[#9a7441]'},
  booking:{name:'美類預約系統',icon:'💅',route:'/booking/',tag:'美類預約',tagClass:'bg-[#effbcf] text-[#67812b]'}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let token='',authChecking=false,freshLogin=false;
function cleanReturn(){const u=new URL(location.href);['member_token','member_status','member_login_error','login_error'].forEach(k=>u.searchParams.delete(k));history.replaceState({},'',u.pathname+u.search+u.hash)}
function memberReturnUrl(){const u=new URL('/me/',location.origin);u.hash='operations';return u.toString()}
function setAuthChecking(active,message=''){authChecking=!!active;const btn=$('lineLogin');if(btn){btn.disabled=authChecking;btn.classList.toggle('hidden',authChecking);btn.textContent='使用 LINE 登入'}$('loginMessage').textContent=message||''}
function login(){if(authChecking)return;if(token){setAuthChecking(true,'正在確認你已登入的 DOING 帳號…');load().then(()=>{authChecking=false}).catch(handleLoadError);return}authChecking=true;const btn=$('lineLogin');if(btn){btn.disabled=true;btn.textContent='正在前往 LINE…'}$('loginMessage').textContent='正在前往 LINE 確認登入…';const u=new URL(API+'/auth/line/start');u.searchParams.set('mode','member');u.searchParams.set('return_url',memberReturnUrl());location.assign(u.toString())}
async function apiGet(action,params={}){const u=new URL(API);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,String(v))});const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error){const e=Error(d.error||'載入失敗');e.status=r.status;throw e}return d.data??d.result??d}
async function apiPost(action,body={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error){const e=Error(d.error||'操作失敗');e.status=r.status;throw e}return d.data??d.result??d}
function workspaceName(w){return w.tenantName||w.tenant_name||w.name||w.unitName||w.unit_name||w.tenantId||w.tenant_id||'DOING 工作空間'}
function workspaceId(w){return String(w.tenantId||w.tenant_id||w.id||'').trim().toLowerCase()}
function jwtEmail(v){try{const s=String(v||'').split('.')[1];if(!s)return'';const raw=s.replace(/-/g,'+').replace(/_/g,'/');return String(JSON.parse(decodeURIComponent(escape(atob(raw+'='.repeat((4-raw.length%4)%4))))).email||'')}catch(_){return''}}
function enabledKeys(profile){const wm=profile?.approvedFlags?.workModules;if(!wm||typeof wm!=='object'||Array.isArray(wm))return[];return ['market','project','booking'].filter(k=>wm[k]===true)}
function systemUrl(key,tenant,adminToken){const u=new URL(SYSTEMS[key].route,location.origin);u.searchParams.set('tenant',tenant);u.searchParams.set('admin_token',adminToken);return u.toString()}
async function resolveWorkspace(w){const id=workspaceId(w);if(!id)return null;const sess=await apiPost('createMemberWorkspaceAdminSession',{member_token:token,tenantId:id});const adminToken=sess.adminToken||sess.admin_token||'';const tenant=String(sess.tenantId||sess.tenant_id||id).trim().toLowerCase();if(!adminToken)throw Error('無法建立工作空間登入');const email=jwtEmail(adminToken);if(!email)throw Error('工作空間登入資料不完整');const profile=await apiGet('getTenantModuleProfile',{tenant,token:adminToken,email});return{tenant,adminToken,name:workspaceName(w),role:String(w.role||w.staffRole||w.staff_role||'營運成員'),systems:enabledKeys(profile)}}
function renderResolved(r){if(!r||!r.systems.length)return'';const buttons=r.systems.map(key=>{const s=SYSTEMS[key];return `<a class="system-card block p-5" href="${esc(systemUrl(key,r.tenant,r.adminToken))}" data-system-entry="${key}"><div class="flex items-center gap-4"><div class="system-visual !h-16 !w-16 text-3xl ${key==='market'?'bg-[#dff4ff]':key==='project'?'bg-[#fff0d9]':'bg-[#effbcf]'}">${s.icon}</div><div><span class="category-tag ${s.tagClass}">${s.tag}</span><h4 class="mt-2 text-xl font-black">${s.name}</h4><p class="mt-1 text-sm font-bold text-slate-500">進入操作系統</p></div></div></a>`}).join('');return `<article class="soft-panel p-5 sm:p-6" data-tenant="${esc(r.tenant)}"><div class="mb-4 flex flex-wrap items-center justify-between gap-2"><div><span class="category-tag bg-[#e9e4ff] text-[#6658bc]">${esc(r.role)}</span><h3 class="mt-2 text-xl font-black">${esc(r.name)}</h3></div><span class="text-sm font-bold text-slate-500">已開通 ${r.systems.length} 套</span></div><div class="grid gap-3 sm:grid-cols-2">${buttons}</div></article>`}
async function load(){const d=await apiGet('getPlatformMemberProfile',{member_token:token});const profile=d.profile||d.member||{};const workspaces=Array.isArray(d.workspaces)?d.workspaces:[];$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logout').classList.remove('hidden');$('hello').textContent=(profile.name||profile.displayName||'你好')+'，歡迎回來';$('identityLine').textContent='正在讀取你已開通的系統…';const settled=await Promise.allSettled(workspaces.map(resolveWorkspace));const resolved=settled.filter(x=>x.status==='fulfilled'&&x.value).map(x=>x.value);const failed=settled.filter(x=>x.status==='rejected').length;const entries=resolved.flatMap(r=>r.systems.map(system=>({system,tenant:r.tenant,adminToken:r.adminToken})));$('workspaceList').innerHTML=resolved.map(renderResolved).filter(Boolean).join('');$('workspaceList').classList.toggle('hidden',entries.length===0);$('emptyWorkspace').classList.toggle('hidden',entries.length!==0);$('identityLine').textContent=entries.length?`已依正式資料帶出 ${entries.length} 個可使用系統。${failed?' 部分工作空間暫時讀取失敗。':''}`:(failed?'工作空間暫時讀取失敗，請重新整理。':'目前沒有已開通的系統。');$('loginMessage').textContent='';if(freshLogin&&entries.length===1){freshLogin=false;const e=entries[0];$('identityLine').textContent='登入成功，正在開啟你的系統…';location.replace(systemUrl(e.system,e.tenant,e.adminToken));return}}
function isAuthExpired(e){const m=String(e&&e.message||'');return Number(e&&e.status)===401||/登入已失效|請重新登入|token.*(失效|過期|invalid|expired)/i.test(m)}
function handleLoadError(e){if(isAuthExpired(e)){localStorage.removeItem(TOKEN_KEY);token='';setAuthChecking(false,'登入已失效，請重新使用 LINE 登入。');return}authChecking=false;setAuthChecking(false,'LINE 登入已保留，但系統資料暫時載入失敗。請按「重新確認」，不需要再登入 LINE。');const btn=$('lineLogin');if(btn)btn.textContent='重新確認'}
async function init(){const u=new URL(location.href),incoming=u.searchParams.get('member_token')||'',err=u.searchParams.get('member_login_error')||u.searchParams.get('login_error')||'';freshLogin=!!incoming;token=incoming||localStorage.getItem(TOKEN_KEY)||'';if(incoming)localStorage.setItem(TOKEN_KEY,incoming);if(incoming||err)cleanReturn();if(err){const messages={identity_resolution_required:'登入身份需要人工確認，請聯絡 DOING 客服。',line_login_required:'LINE 需要重新確認登入，請在 LINE 頁面完成驗證。',line_cancelled:'你已取消 LINE 登入。',line_login_failed:'LINE 登入沒有完成，請再試一次。'};$('loginMessage').textContent=messages[err]||'LINE 登入未完成，請重新登入。'}if(!token)return;setAuthChecking(true,'正在確認你已登入的 DOING 帳號…');try{await load();authChecking=false}catch(e){handleLoadError(e)}}
$('lineLogin').onclick=login;$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('logout').onclick=()=>{localStorage.removeItem(TOKEN_KEY);token='';location.replace('/')};init();
</script>
</body>
</html>
