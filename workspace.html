<!doctype html>
<html lang="zh-Hant">
<head>

<title>我的 DOING</title>
<link rel="stylesheet" href="doing-system.css?v=20260817-system5">
<style>
:root{--ink:#303947;--muted:#66717f;--line:#dce7e8;--main:#4f8f9d;--soft:#eef5f6;--paper:#fff;--shadow:0 10px 28px rgba(49,73,82,.08)}*{box-sizing:border-box}body{margin:0;background:#f7faf9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,a{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:9px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.right{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:11px;min-height:42px;padding:8px 12px;background:var(--main);color:#fff;text-decoration:none;font-weight:850}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.shell{max-width:1400px;margin:auto;padding:12px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.hero{padding:14px}.hero h1{margin:0}.hero p{margin:4px 0;color:var(--muted)}.bar{display:flex;gap:6px;overflow:auto;margin:10px 0;position:sticky;top:58px;z-index:8;background:#f7faf9;padding:6px 0}.bar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:850}.bar button.on{background:var(--ink);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px}.card{padding:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h2{margin:0}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 5px}.day{min-height:130px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fbfdfd}.day.out{opacity:.45}.day.today{outline:2px solid #78aeb6}.evt{display:block;width:100%;margin-top:4px;border:0;border-radius:7px;padding:5px;background:#edf5f6;text-align:left;font-size:12px}.evt b,.evt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.evt small{color:var(--muted)}.list{display:grid;gap:8px}.listday{border:1px solid var(--line);border-radius:11px;padding:9px}.row{display:grid;grid-template-columns:64px 1fr;gap:7px;padding:6px 0}.side h3{margin:0 0 5px}.links,.mods{display:grid;grid-template-columns:1fr 1fr;gap:6px}.links a,.links button,.mods button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;color:var(--ink);text-decoration:none;text-align:left}.mods small{display:block;color:var(--muted)}.modal{position:fixed;inset:0;background:#0004;display:grid;place-items:center;padding:12px;z-index:60}.dlg{background:#fff;border-radius:15px;padding:15px;width:min(560px,100%)}.drawer{position:fixed;inset:0;z-index:120;background:#0004;display:flex;justify-content:flex-end}.sheet{width:min(760px,100%);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-15px 0 50px #0002}.sheethead{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.sheethead b{margin-right:auto}.sheetnav{display:flex;gap:6px;overflow:auto;padding:8px;border-bottom:1px solid var(--line);background:#f7faf9}.sheetnav button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;font-weight:850}.sheetnav button.on{background:var(--ink);color:#fff}.memberframe{width:100%;flex:1;border:0;background:#fff}@media(max-width:780px){.layout{display:block}.side{margin-top:9px}.week,.grid{display:none}.mobile{display:grid!important}.mods{display:flex;overflow:auto}.mods button{min-width:145px}.right #admin{display:none}}
</style>

<body class="doing-app">
<header class="top"><a href="index.html"><img src="doing-logo.png" alt="DOING"></a><b id="wn">我的 DOING</b><div class="right"><a id="admin" class="btn alt">進階管理</a><button id="my" class="btn alt" type="button">我的</button></div></header>
<main class="shell"><section class="hero"><h1>工作日曆</h1><p>預約、課程、活動、市集、專案都在同一個入口。</p></section><nav class="bar"><button class="on" data-f="all">全部工作</button><button data-f="booking">預約</button><button data-f="course">課程</button><button data-f="event">活動</button><button data-f="market">市集</button><button data-f="project">專案</button><span style="flex:1"></span><button class="on" data-view="month">月</button><button data-view="week">週</button><button data-view="list">清單</button></nav><div class="layout"><section class="card"><div class="head"><div><h2 id="title">本月</h2><small id="sum">載入中</small></div><div><button class="btn alt" id="prev">←</button> <button class="btn alt" id="today">今天</button> <button class="btn alt" id="next">→</button></div></div><div id="month"><div class="week"><b>日</b><b>一</b><b>二</b><b>三</b><b>四</b><b>五</b><b>六</b></div><div class="grid" id="grid"></div><div class="mobile hidden" id="mobile"></div></div><div id="weekv" class="list hidden"></div><div id="listv" class="list hidden"></div><div id="err"></div></section><aside class="side"><section class="card"><h3>5 個工作模組</h3><div class="links"><a data-h="calendar">新增／安排預約</a><a data-h="sessions">建立課程／活動</a><a data-h="sessions">管理市集</a><a data-h="sessions">建立專案工作</a></div></section><section class="card" style="margin-top:9px"><h3>10 個共用模組</h3><div class="mods" id="mods"></div></section><section class="card" style="margin-top:9px"><h3>外部日曆</h3><div class="links"><button id="sub">複製訂閱連結</button><button id="reload">重新整理</button></div></section></aside></div></main>
<div id="drawer" class="drawer hidden" aria-hidden="true"><section class="sheet"><div class="sheethead"><b>我的 DOING</b><button id="drawerClose" class="btn alt">關閉</button></div><nav class="sheetnav"><button data-member="activities">我的報名</button><button data-member="brands">我的品牌</button><button data-member="account">帳號設定</button><button data-member="operations">切換工作空間</button></nav><iframe id="memberFrame" class="memberframe" title="我的 DOING"></iframe></section></div>
<div id="modal" class="modal hidden"><div class="dlg"><h2 id="mt"></h2><p id="ms"></p><div><button class="btn" id="gcal">加入 Google 日曆</button> <button class="btn alt" id="ics">加入 Apple／ICS</button> <button class="btn alt" id="source">開啟原工作</button> <button class="btn alt" id="close">關閉</button></div></div></div>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',p=new URL(location.href).searchParams,T=(p.get('tenant')||'').trim().toLowerCase(),token=p.get('admin_token')||p.get('token')||'',S={date:new Date(),filter:'all',view:'month',rows:[],cals:[],selected:null};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
if(!T||!token)$('err').innerHTML='<p>請從首頁登入 DOING。</p>';
function au(h=''){const u=new URL('admin.html',location.href);u.searchParams.set('tenant',T);u.searchParams.set('admin_token',token);if(h)u.hash=h;return u.toString()}$('admin').href=au();document.querySelectorAll('[data-h]').forEach(a=>a.href=au(a.dataset.h));
async function api(action){const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('tenant',T);u.searchParams.set('token',token);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||'載入失敗');return d.data??d.result??d}
function dk(v){const m=String(v||'').match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:''}function kind(o){const x=[o.unitType,o.unit_type,o.type,o.operatingMode,o.name,o.title].filter(Boolean).join(' ').toLowerCase();if(/project|工程|專案/.test(x))return'project';if(/market|vendor|stall|市集|攤/.test(x))return'market';if(/course|workshop|class|課程|手作/.test(x))return'course';if(/booking|service|appointment|預約|服務/.test(x))return'booking';return'event'}function dates(s){let a=[];for(const v of[s.date,s.date_key,s.start_date]){const d=dk(v);if(d)a.push(d)}for(const z of[s.dates,s.sessionDates,s.dates_json,s.dateRows])if(Array.isArray(z))for(const x of z){const d=dk(typeof x==='object'?(x.date||x.date_key||x.start):x);if(d)a.push(d)}return[...new Set(a)]}function add(x){if(x.date)S.rows.push({...x,id:crypto.randomUUID()})}
async function load(){if(!T||!token)return;try{const[ss,uu,cc]=await Promise.all([api('getSessionsAdmin').catch(()=>[]),api('getOperationUnitsAdmin').catch(()=>[]),api('getBookingCalendarAdmin').catch(()=>({calendars:[],bookings:[]}))]);S.rows=[];for(const s of(Array.isArray(ss)?ss:ss.sessions||[]))for(const d of dates(s))add({date:d,time:s.start||s.start_time||'',kind:kind(s),title:s.name||s.title||'活動',status:s.status||'',src:'sessions'});for(const u of(Array.isArray(uu)?uu:[]))for(const t of(u.timeslots||[]))add({date:dk(t.date||t.date_key),time:t.start||t.start_text||'',end:t.end||t.end_text||'',kind:kind(u),title:u.name||'工作',status:t.status||u.status||'',src:'sessions'});S.cals=cc.calendars||[];for(const b of(cc.bookings||[]))add({date:dk(b.date||b.date_key),time:b.time||b.start||'',end:b.end||'',kind:'booking',title:b.name||b.brandName||'預約',status:b.paymentStatus||b.reviewStatus||b.status||'',src:'calendar'});S.rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));render()}catch(e){$('err').textContent=e.message}}
function rows(){return S.filter==='all'?S.rows:S.rows.filter(x=>x.kind===S.filter)}function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function evt(e){return'<button class="evt" data-id="'+e.id+'"><b>'+esc((e.time?e.time+' ':'')+e.title)+'</b><small>'+esc(({booking:'預約',course:'課程',event:'活動',market:'市集',project:'專案'}[e.kind]||'工作')+(e.status?'｜'+e.status:''))+'</small></button>'}function listing(a){const g={};a.forEach(e=>(g[e.date]??=[]).push(e));return Object.keys(g).sort().map(d=>'<div class="listday"><b>'+d+'</b>'+g[d].map(e=>'<div class="row"><time>'+esc(e.time||'全天')+'</time>'+evt(e)+'</div>').join('')+'</div>').join('')||'<p>這段期間沒有工作</p>'}
function month(){const y=S.date.getFullYear(),m=S.date.getMonth(),start=new Date(y,m,1);start.setDate(1-start.getDay());const end=new Date(y,m+1,0);end.setDate(end.getDate()+(6-end.getDay()));let h='';for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=key(d),a=rows().filter(x=>x.date===k);h+='<div class="day '+(d.getMonth()!==m?'out ':'')+(k===key(new Date())?'today':'')+'"><b>'+d.getDate()+'</b>'+a.slice(0,4).map(evt).join('')+'</div>'}$('grid').innerHTML=h;const a=rows().filter(x=>x.date>=key(new Date(y,m,1))&&x.date<=key(new Date(y,m+1,0)));$('mobile').innerHTML=listing(a);$('title').textContent=y+' 年 '+(m+1)+' 月';$('sum').textContent=a.length+' 筆工作'}
function render(){document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===S.filter));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));$('month').classList.toggle('hidden',S.view!=='month');$('weekv').classList.toggle('hidden',S.view!=='week');$('listv').classList.toggle('hidden',S.view!=='list');if(S.view==='month')month();else{const d=new Date(S.date),a=S.view==='week'?(()=>{const s=new Date(d);s.setDate(d.getDate()-d.getDay());const e=new Date(s);e.setDate(s.getDate()+6);return rows().filter(x=>x.date>=key(s)&&x.date<=key(e))})():rows();$(S.view==='week'?'weekv':'listv').innerHTML=listing(a);$('title').textContent=S.view==='week'?'本週':'全部工作';$('sum').textContent=a.length+' 筆工作'}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(S.rows.find(x=>x.id===b.dataset.id)))}function open(e){S.selected=e;$('mt').textContent=e.title;$('ms').textContent=e.date+' '+(e.time||'全天');$('modal').classList.remove('hidden')}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});$('prev').onclick=()=>{S.date.setMonth(S.date.getMonth()-1);render()};$('next').onclick=()=>{S.date.setMonth(S.date.getMonth()+1);render()};$('today').onclick=()=>{S.date=new Date();render()};$('reload').onclick=load;$('close').onclick=()=>$('modal').classList.add('hidden');$('source').onclick=()=>location.href=au(S.selected?.src==='calendar'?'calendar':'sessions');$('gcal').onclick=()=>{const e=S.selected;if(!e)return;const f=s=>e.date.replace(/-/g,'')+'T'+String(s||'00:00').replace(/:/g,'').padEnd(6,'0'),u=new URL('https://calendar.google.com/calendar/render');u.searchParams.set('action','TEMPLATE');u.searchParams.set('text','DOING｜'+e.title);u.searchParams.set('dates',f(e.time)+'/'+f(e.end||e.time||'23:59'));window.open(u,'_blank','noopener')};$('ics').onclick=()=>{const e=S.selected;if(!e)return;const f=s=>e.date.replace(/-/g,'')+'T'+String(s||'00:00').replace(/:/g,'').padEnd(6,'0'),x=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','UID:'+e.id+'@doing','DTSTART;TZID=Asia/Taipei:'+f(e.time),'DTEND;TZID=Asia/Taipei:'+f(e.end||e.time||'23:59'),'SUMMARY:DOING｜'+e.title.replace(/[;,]/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/calendar'}));a.download='doing-'+e.date+'.ics';a.click()};
const mods=[['商品／票券','儲值、次數券','sessions'],['QR 報到／核銷','現場報到','onsite'],['收款／訂金','付款退款','finance'],['優惠券／回訪','回訪規則','settings'],['通知提醒','提醒訊息','settings'],['團隊／排班','人員班表','calendar'],['進階財務','損益分潤','finance'],['照片／檔案','附件管理','settings'],['電子簽名','簽認紀錄','settings'],['Google／Apple 日曆','同步與加入','calendar']];$('mods').innerHTML=mods.map((m,i)=>'<button data-m="'+i+'"><b>'+m[0]+'</b><small>'+m[1]+'</small></button>').join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>location.href=au(mods[+b.dataset.m][2]));$('sub').onclick=()=>{const c=S.cals[0];if(!c)return alert('目前沒有可訂閱的預約日曆');const u=new URL(API);u.searchParams.set('action','bookingCalendarIcs');u.searchParams.set('tenant',T);u.searchParams.set('calendarId',c.id);u.searchParams.set('token',token);navigator.clipboard?.writeText(u).then(()=>alert('已複製日曆訂閱連結')).catch(()=>prompt('請複製',u))};
function memberUrl(section){const u=new URL('member.html',location.href);u.searchParams.set('embed','1');u.hash=section;return u.toString()}function styleFrame(){try{const d=$('memberFrame').contentDocument,st=d.createElement('style');st.textContent='.top,#loginView,#appView>.hero,.tabs{display:none!important}.shell{width:100%!important;max-width:none!important;padding:10px!important}.panel{max-height:none!important;overflow:visible!important;padding:0!important}.panel.active{display:block!important}body{background:#fff!important}';d.head.appendChild(st)}catch(e){}}function openDrawer(section='activities'){$('drawer').classList.remove('hidden');$('drawer').setAttribute('aria-hidden','false');document.querySelectorAll('[data-member]').forEach(b=>b.classList.toggle('on',b.dataset.member===section));$('memberFrame').src=memberUrl(section)}function closeDrawer(){$('drawer').classList.add('hidden');$('drawer').setAttribute('aria-hidden','true')}$('my').onclick=()=>openDrawer('activities');$('drawerClose').onclick=closeDrawer;$('drawer').onclick=e=>{if(e.target===$('drawer'))closeDrawer()};document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.member));$('memberFrame').onload=()=>{try{const l=$('memberFrame').contentWindow.location;if(/workspace\.html$/i.test(l.pathname)){location.replace(l.href);return}styleFrame()}catch(e){}};
load();
</script>
</body></html>
