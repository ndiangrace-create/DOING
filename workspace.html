'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',p=new URL(location.href).searchParams,T=(p.get('tenant')||'').trim().toLowerCase(),token=p.get('admin_token')||p.get('token')||'',S={date:new Date(),filter:'all',view:'month',rows:[],cals:[],selected:null};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(!T||!token)$('err').innerHTML='<div class="error">請從「我的 DOING」進入已授權的工作空間。</div>';function au(h=''){const u=new URL('admin.html',location.href);u.searchParams.set('tenant',T);u.searchParams.set('admin_token',token);if(h)u.hash=h;return u.toString()}$('admin').href=au();document.querySelectorAll('[data-h]').forEach(a=>a.href=au(a.dataset.h));async function api(action){const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('tenant',T);u.searchParams.set('token',token);const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||'載入失敗');return d.data??d.result??d}function dk(v){const m=String(v||'').match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:''}function kind(o){const x=[o.unitType,o.unit_type,o.type,o.operatingMode,o.name,o.title].filter(Boolean).join(' ').toLowerCase();if(/project|construction|工程|專案/.test(x))return'project';if(/market|vendor|stall|市集|攤/.test(x))return'market';if(/course|workshop|class|課程|手作/.test(x))return'course';if(/booking|service|appointment|預約|服務/.test(x))return'booking';return'event'}function dates(s){let a=[];for(const v of[s.date,s.date_key,s.start_date]){const d=dk(v);if(d)a.push(d)}for(const z of[s.dates,s.sessionDates,s.dates_json,s.dateRows])if(Array.isArray(z))for(const x of z){const d=dk(typeof x==='object'?(x.date||x.date_key||x.start):x);if(d)a.push(d)}return[...new Set(a)]}function add(x){if(x.date)S.rows.push({...x,id:crypto.randomUUID()})}async function load(){if(!T||!token)return;try{const[ss,uu,cc]=await Promise.all([api('getSessionsAdmi
