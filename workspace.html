<link rel="stylesheet" href="doing-system.css?v=20260817-system5">
<style>
:root{--ink:#303947;--muted:#66717f;--line:#dce7e8;--main:#4f8f9d;--soft:#eef5f6;--paper:#fff;--shadow:0 10px 28px rgba(49,73,82,.08)}*{box-sizing:border-box}body{margin:0;background:#f7faf9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,a{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:9px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.right{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:11px;min-height:42px;padding:8px 12px;background:var(--main);color:#fff;text-decoration:none;font-weight:850}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.shell{max-width:1400px;margin:auto;padding:12px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.hero{padding:16px}.hero small{display:block;color:var(--main);font-weight:900;margin-bottom:4px}.hero h1{margin:0;font-size:clamp(28px,5vw,42px)}.hero p{margin:5px 0 0;color:var(--muted)}.bar{display:flex;gap:6px;overflow:auto;margin:10px 0;position:sticky;top:58px;z-index:8;background:#f7faf9;padding:6px 0;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.bar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:850}.bar button.on{background:var(--ink);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px}.card{padding:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h2{margin:0}.head-actions{display:flex;gap:5px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 5px}.day{min-height:130px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fbfdfd}.day.out{opacity:.45}.day.today{outline:2px solid #78aeb6}.evt{display:block;width:100%;margin-top:4px;border:0;border-radius:7px;padding:5px;background:#edf5f6;text-align:left;font-size:12px}.evt b,.evt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.evt small{color:var(--muted)}.list{display:grid;gap:8px}.listday{border:1px solid var(--line);border-radius:11px;padding:9px}.row{display:grid;grid-template-columns:64px 1fr;gap:7px;padding:6px 0}.side{display:grid;gap:9px;align-content:start}.side h3{margin:0 0 5px}.worklinks,.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.worklinks a,.tools a,.tools button{min-height:46px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px;color:var(--ink);text-decoration:none;text-align:left;font-weight:800}.worklinks a small,.tools a small,.tools button small{display:block;color:var(--muted);font-weight:600;margin-top:2px}.empty-tools{color:var(--muted);padding:8px 2px}.modal{position:fixed;inset:0;background:#0004;display:grid;place-items:center;padding:12px;z-index:60}.dlg{background:#fff;border-radius:15px;padding:15px;width:min(560px,100%)}.drawer{position:fixed;inset:0;z-index:120;background:#0004;display:flex;justify-content:flex-end}.sheet{width:min(760px,100%);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-15px 0 50px #0002}.sheethead{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.sheethead b{margin-right:auto}.sheetnav{display:flex;gap:6px;overflow:auto;padding:8px;border-bottom:1px solid var(--line);background:#f7faf9}.sheetnav button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;font-weight:850}.sheetnav button.on{background:var(--ink);color:#fff}.memberframe{width:100%;flex:1;border:0;background:#fff}.guard-note{padding:9px 10px;border-radius:10px;background:#f1f7f7;color:var(--muted);font-size:13px;margin-top:8px}@media(max-width:780px){.layout{display:block}.side{margin-top:9px}.week,.grid{display:none}.mobile{display:grid!important}.worklinks,.tools{display:flex;overflow:auto}.worklinks a,.tools a,.tools button{min-width:155px}.right #admin{display:none}.head{align-items:flex-start}.head-actions .btn{min-width:54px;padding-left:8px;padding-right:8px}}

<body class="doing-app">
<header class="top"><a href="index.html"><img src="doing-logo.png" alt="DOING"></a><b id="wn">我的 DOING</b><div class="right"><a id="admin" class="btn alt">進階管理</a><button id="my" class="btn alt" type="button">我的</button></div></header>
<main class="shell">
  <section class="hero"><small id="tenantLabel">工作平台</small><h1>工作日曆</h1><p>從今天的工作開始，只顯示這個工作空間已核准的工作與工具。</p></section>
  <nav class="bar" id="workFilterBar"><button class="on" data-f="all">全部工作</button><span id="workFilters"></span><span style="flex:1"></span><button class="on" data-view="month">月</button><button data-view="week">週</button><button data-view="list">清單</button></nav>
  <div class="layout">
    <section class="card"><div class="head"><div><h2 id="title">本月</h2><small id="sum">載入中</small></div><div class="head-actions"><button class="btn alt" id="prev">←</button><button class="btn alt" id="today">今天</button><button class="btn alt" id="next">→</button></div></div><div id="month"><div class="week"><b>日</b><b>一</b><b>二</b><b>三</b><b>四</b><b>五</b><b>六</b></div><div class="grid" id="grid"></div><div class="mobile hidden" id="mobile"></div></div><div id="weekv" class="list hidden"></div><div id="listv" class="list hidden"></div><div id="err"></div></section>
    <aside class="side"><section class="card"><h3>我的工作</h3><div class="worklinks" id="workLinks"><div class="empty-tools">正在讀取已核准工作…</div></div></section><section class="card"><h3>我的工具</h3><div class="tools" id="tools"><div class="empty-tools">正在讀取已核准工具…</div></div><div class="guard-note">這裡只會出現問卷申請後由平台核准的功能。</div></section></aside>
  </div>
</main>
<div id="drawer" class="drawer hidden" aria-hidden="true"><section class="sheet"><div class="sheethead"><b>我的 DOING</b><button id="drawerClose" class="btn alt">關閉</button></div><nav class="sheetnav"><button data-member="activities">我的報名</button><button data-member="brands">我的品牌</button><button data-member="account">帳號設定</button><button data-member="operations">切換工作空間</button></nav><iframe id="memberFrame" class="memberframe" title="我的 DOING"></iframe></section></div>
<div id="modal" class="modal hidden"><div class="dlg"><h2 id="mt"></h2><p id="ms"></p><div><button class="btn hidden" id="gcal">加入 Google 日曆</button> <button class="btn alt hidden" id="ics">加入 Apple／ICS</button> <button class="btn alt" id="source">開啟原工作</button> <button class="btn alt" id="close">關閉</button></div></div></div>
<script>
'use strict';
const API='https://tobeloved-api.ndiangrace.workers.dev',p=new URL(location.href).searchParams,T=(p.get('tenant')||'').trim().toLowerCase(),token=p.get('admin_token')||p.get('token')||'',S={date:new Date(),filter:'all',view:'month',rows:[],cals:[],selected:null,approved:{},profile:{},workTypes:[]};
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const WORK_CATALOG={booking:{label:'預約',desc:'預約日曆／排班',hash:'calendar'},course:{label:'課程',desc:'課程與梯次',hash:'sessions'},event:{label:'活動',desc:'活動與場次',hash:'sessions'},market:{label:'市集',desc:'市集與攤位',hash:'sessions'},project:{label:'專案',desc:'專案工作',hash:'sessions'}};
const COMMON_CATALOG=[
 {label:'商品／票券',on:f=>f.addons===true||f.participants===true,hash:'sessions'},
 {label:'QR 報到／核銷',on:f=>f.checkin===true,hash:'onsite'},
 {label:'收款／訂金',on:f=>f.payment===true,hash:'finance'},
 {label:'優惠券／回訪',on:f=>f.coupon===true||f.coupons===true||f.returnVisit===true||f.customerWallet===true,hash:'settings'},
 {label:'通知提醒',on:f=>f.notifications===true,hash:'settings'},
 {label:'團隊／排班',on:f=>f.resource===true,hash:'calendar'},
 {label:'進階財務',on:f=>f.payment===true,hash:'finance'},
 {label:'照片／檔案',on:f=>f.files===true||f.photoFrames===true,hash:'settings'},
 {label:'電子簽名',on:f=>f.agreement===true,hash:'settings'},
 {label:'Google／Apple 日曆',on:f=>f.googleCalendar===true,hash:'calendar',calendar:true}
];
if(!T||!token)$('err').innerHTML='<p>請從首頁登入 DOING。</p>';
function jwtEmail(v){try{const s=String(v||'').split('.')[1];if(!s)return'';const raw=s.replace(/-/g,'+').replace(/_/g,'/');return String(JSON.parse(decodeURIComponent(escape(atob(raw+'='.repeat((4-raw.length%4)%4))))).email||'')}catch(_){return''}}
function au(h=''){const u=new URL('admin.html',location.href);u.searchParams.set('tenant',T);u.searchParams.set('admin_token',token);if(h)u.hash=h;return u.toString()}
$('admin').href=au();
async function api(action,extra={}){const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('tenant',T);u.searchParams.set('token',token);Object.entries(extra).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,String(v))});const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'載入失敗');return d.data??d.result??d}
function workTypesFrom(profile,approved){const out=new Set(),explicit=approved&&typeof approved.workModules==='object'?approved.workModules:null;if(explicit)Object.entries(explicit).forEach(([k,v])=>{if(v===true&&WORK_CATALOG[k])out.add(k)});const signals=[approved?.businessType,profile?.useType,...(Array.isArray(profile?.useCases)?profile.useCases:[])].map(x=>String(x||'').toLowerCase()).filter(Boolean);for(const x of signals){if(/market|vendor|stall|市集|攤/.test(x)){out.add('market');continue}if(/project|construction|engineering|工程|專案/.test(x)){out.add('project');continue}if(/workshop|course|class|training|課程|工作坊/.test(x)){out.add('course');continue}if(/beauty|service_booking|resource_booking|appointment|^booking$|預約|美甲|美容/.test(x)){out.add('booking');continue}if(/event|activity|guide|活動|導覽/.test(x)){out.add('event');continue}}if(!out.size){if(profile?.defaults?.operatingMode==='booking')out.add('booking');else out.add('event')}return [...out]}
function renderWorkspaceAccess(){S.workTypes=workTypesFrom(S.profile,S.approved);$('workFilters').innerHTML=S.workTypes.map(k=>'<button data-f="'+k+'">'+WORK_CATALOG[k].label+'</button>').join('');$('workLinks').innerHTML=S.workTypes.map(k=>'<a href="'+au(WORK_CATALOG[k].hash)+'" data-work="'+k+'"><b>'+WORK_CATALOG[k].label+'</b><small>'+WORK_CATALOG[k].desc+'</small></a>').join('')||'<div class="empty-tools">目前沒有已核准的工作模組。</div>';const tools=COMMON_CATALOG.filter(x=>x.on(S.approved));$('tools').innerHTML=tools.map((x,i)=>x.calendar?'<button type="button" data-calendar-tools="1"><b>'+x.label+'</b><small>同步／訂閱工作日曆</small></button>':'<a href="'+au(x.hash)+'"><b>'+x.label+'</b></a>').join('')||'<div class="empty-tools">目前沒有其他已核准工具。</div>';document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});document.querySelectorAll('[data-calendar-tools]').forEach(b=>b.onclick=copySubscription);$('gcal').classList.toggle('hidden',S.approved.googleCalendar!==true);$('ics').classList.toggle('hidden',S.approved.googleCalendar!==true)}
function dk(v){const m=String(v||'').match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:''}
function kind(o){const x=[o.unitType,o.unit_type,o.type,o.operatingMode,o.name,o.title].filter(Boolean).join(' ').toLowerCase();if(/project|工程|專案/.test(x))return'project';if(/market|vendor|stall|市集|攤/.test(x))return'market';if(/course|workshop|class|課程|手作/.test(x))return'course';if(/booking|service|appointment|預約|服務|美甲|美容/.test(x))return'booking';return'event'}
function dates(s){let a=[];for(const v of[s.date,s.date_key,s.start_date]){const d=dk(v);if(d)a.push(d)}for(const z of[s.dates,s.sessionDates,s.dates_json,s.dateRows])if(Array.isArray(z))for(const x of z){const d=dk(typeof x==='object'?(x.date||x.date_key||x.start):x);if(d)a.push(d)}return[...new Set(a)]}
function add(x){if(x.date&&S.workTypes.includes(x.kind))S.rows.push({...x,id:crypto.randomUUID()})}
async function load(){if(!T||!token)return;try{const email=jwtEmail(token);if(!email)throw Error('登入資料不完整，請重新從首頁進入。');const [moduleProfile,me]=await Promise.all([api('getTenantModuleProfile',{email}),api('adminMe',{email:'_'})]);S.profile=moduleProfile||{};S.approved=(moduleProfile&&moduleProfile.approvedFlags&&typeof moduleProfile.approvedFlags==='object')?moduleProfile.approvedFlags:{};if(!Object.keys(S.approved).length)throw Error('無法讀取已核准功能，為避免誤開功能已停止載入。');$('tenantLabel').textContent=(me?.tenant?.name||me?.tenant_name||T)+'｜工作平台';renderWorkspaceAccess();const[ss,uu,cc]=await Promise.all([api('getSessionsAdmin').catch(()=>[]),api('getOperationUnitsAdmin').catch(()=>[]),S.approved.workshopSlots===true||S.approved.googleCalendar===true?api('getBookingCalendarAdmin').catch(()=>({calendars:[],bookings:[]})):Promise.resolve({calendars:[],bookings:[]})]);S.rows=[];for(const s of(Array.isArray(ss)?ss:ss.sessions||[]))for(const d of dates(s))add({date:d,time:s.start||s.start_time||'',kind:kind(s),title:s.name||s.title||'工作',status:s.status||'',src:'sessions'});for(const u of(Array.isArray(uu)?uu:[]))for(const t of(u.timeslots||[]))add({date:dk(t.date||t.date_key),time:t.start||t.start_text||'',end:t.end||t.end_text||'',kind:kind(u),title:u.name||'工作',status:t.status||u.status||'',src:'sessions'});S.cals=cc.calendars||[];for(const b of(cc.bookings||[]))add({date:dk(b.date||b.date_key),time:b.time||b.start||'',end:b.end||'',kind:'booking',title:b.name||b.brandName||'預約',status:b.paymentStatus||b.reviewStatus||b.status||'',src:'calendar'});S.rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));render()}catch(e){S.approved={};S.workTypes=[];$('workFilters').innerHTML='';$('workLinks').innerHTML='<div class="empty-tools">無法讀取已核准工作。</div>';$('tools').innerHTML='<div class="empty-tools">無法讀取已核准工具。</div>';$('err').innerHTML='<p>'+esc(e.message)+'</p>'}}
function rows(){return S.filter==='all'?S.rows:S.rows.filter(x=>x.kind===S.filter)}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function evt(e){return'<button class="evt" data-id="'+e.id+'"><b>'+esc((e.time?e.time+' ':'')+e.title)+'</b><small>'+esc((WORK_CATALOG[e.kind]?.label||'工作')+(e.status?'｜'+e.status:''))+'</small></button>'}
function listing(a){const g={};a.forEach(e=>(g[e.date]??=[]).push(e));return Object.keys(g).sort().map(d=>'<div class="listday"><b>'+d+'</b>'+g[d].map(e=>'<div class="row"><time>'+esc(e.time||'全天')+'</time>'+evt(e)+'</div>').join('')+'</div>').join('')||'<p>這段期間沒有工作</p>'}
function month(){const y=S.date.getFullYear(),m=S.date.getMonth(),start=new Date(y,m,1);start.setDate(1-start.getDay());const end=new Date(y,m+1,0);end.setDate(end.getDate()+(6-end.getDay()));let h='';for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=key(d),a=rows().filter(x=>x.date===k);h+='<div class="day '+(d.getMonth()!==m?'out ':'')+(k===key(new Date())?'today':'')+'"><b>'+d.getDate()+'</b>'+a.slice(0,4).map(evt).join('')+'</div>'}$('grid').innerHTML=h;const a=rows().filter(x=>x.date>=key(new Date(y,m,1))&&x.date<=key(new Date(y,m+1,0)));$('mobile').innerHTML=listing(a);$('title').textContent=y+' 年 '+(m+1)+' 月';$('sum').textContent=a.length+' 筆工作'}
function render(){document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===S.filter));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));$('month').classList.toggle('hidden',S.view!=='month');$('weekv').classList.toggle('hidden',S.view!=='week');$('listv').classList.toggle('hidden',S.view!=='list');if(S.view==='month')month();else{const d=new Date(S.date),a=S.view==='week'?(()=>{const s=new Date(d);s.setDate(d.getDate()-d.getDay());const e=new Date(s);e.setDate(s.getDate()+6);return rows().filter(x=>x.date>=key(s)&&x.date<=key(e))})():rows();$(S.view==='week'?'weekv':'listv').innerHTML=listing(a);$('title').textContent=S.view==='week'?'本週':'全部工作';$('sum').textContent=a.length+' 筆工作'}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(S.rows.find(x=>x.id===b.dataset.id)))}
function open(e){S.selected=e;$('mt').textContent=e.title;$('ms').textContent=e.date+' '+(e.time||'全天');$('modal').classList.remove('hidden')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});$('workFilterBar').querySelector('[data-f="all"]').onclick=()=>{S.filter='all';render()};$('prev').onclick=()=>{S.date.setMonth(S.date.getMonth()-1);render()};$('next').onclick=()=>{S.date.setMonth(S.date.getMonth()+1);render()};$('today').onclick=()=>{S.date=new Date();render()};$('reload')?.addEventListener('click',load);$('close').onclick=()=>$('modal').classList.add('hidden');$('source').onclick=()=>{if(!S.selected)return;location.href=au(S.selected.kind==='booking'?'calendar':'sessions')};
function googleUrl(e){const start=(e.date+'T'+(e.time||'09:00')+':00').replace(/[-:]/g,''),end=(e.date+'T'+(e.end||e.time||'10:00')+':00').replace(/[-:]/g,'');return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+start+'/'+end+'&details='+encodeURIComponent('DOING 工作')}
$('gcal').onclick=()=>{if(S.selected)window.open(googleUrl(S.selected),'_blank','noopener')};$('ics').onclick=()=>{if(!S.selected)return;const e=S.selected,text='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nDTSTART:'+e.date.replaceAll('-','')+'T'+(e.time||'0900').replace(':','')+'00\r\nSUMMARY:'+e.title.replace(/[\r\n]/g,' ')+'\r\nEND:VEVENT\r\nEND:VCALENDAR';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/calendar'}));a.download='doing.ics';a.click();URL.revokeObjectURL(a.href)};
async function copySubscription(){if(S.approved.googleCalendar!==true)return;try{if(!S.cals.length)throw Error('目前尚未建立預約日曆');const c=S.cals[0],u=new URL(API);u.searchParams.set('action','bookingCalendarIcs');u.searchParams.set('tenant',T);u.searchParams.set('calendarId',c.id);u.searchParams.set('token',token);await navigator.clipboard.writeText(u.toString());alert('已複製日曆訂閱連結')}catch(e){alert(e.message)}}
const drawer=$('drawer'),memberFrame=$('memberFrame');function closeDrawer(){drawer.classList.add('hidden');drawer.setAttribute('aria-hidden','true');memberFrame.removeAttribute('src');document.body.style.overflow=''}function openMember(section='activities'){const u=new URL('member-panel.html',location.href);u.searchParams.set('embed','1');u.hash=section;memberFrame.src=u.toString();drawer.classList.remove('hidden');drawer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.querySelectorAll('[data-member]').forEach(b=>b.classList.toggle('on',b.dataset.member===section))}$('my').onclick=()=>openMember('activities');$('drawerClose').onclick=closeDrawer;drawer.onclick=e=>{if(e.target===drawer)closeDrawer()};document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>openMember(b.dataset.member));
load();
</script>
</body>
</html>
