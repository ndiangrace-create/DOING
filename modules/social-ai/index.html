<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 社群小編</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#24302b;background:#f7f4ed}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#fffdf8;border-bottom:1px solid #ddd8ce;padding:14px 18px;z-index:3;display:flex;justify-content:space-between;align-items:center}.top b{font-size:19px}.wrap{max-width:1100px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button,.btn{border:1px solid #c9c4ba;background:#fff;padding:10px 14px;border-radius:10px;font-weight:700;white-space:nowrap}.tabs button.active,.btn.primary{background:#315b4d;color:#fff;border-color:#315b4d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #ddd8ce;border-radius:14px;padding:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:10px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbc7bf;border-radius:9px;background:#fff;font:inherit}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#6d746f;font-size:14px}.status{display:inline-block;padding:5px 9px;border:1px solid #d5d0c7;border-radius:8px;font-size:13px}.post{border-top:1px solid #ece7de;padding:14px 0}.post:first-child{border-top:0}.hide{display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:82px;border:1px solid #e0dbd1;border-radius:9px;padding:7px;font-size:13px}.day strong{display:block;margin-bottom:5px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}.top{padding:12px}.calendar{grid-template-columns:repeat(2,1fr)}.day{min-height:65px}}
</style></head>
<body>
<header class="top"><b>AI 社群小編</b><span id="saveState" class="status">尚未連線</span></header>
<main class="wrap">
<nav class="tabs" aria-label="功能"><button class="active" data-tab="campaign">建立宣傳</button><button data-tab="posts">貼文審核</button><button data-tab="calendar">排程月曆</button><button data-tab="brand">品牌設定</button><button data-tab="connections">FB / IG</button></nav>
<section id="campaign" class="panel">
<div class="grid"><div class="card"><h2>這次要宣傳什麼？</h2><label>活動／宣傳名稱</label><input id="title" placeholder="例如：9/19–20 美麗島公益展覽"><label>活動資訊</label><textarea id="brief" placeholder="把日期、地點、合作單位、活動亮點貼進來即可"></textarea><label>希望產生幾篇</label><select id="count"><option>5</option><option selected>10</option><option>14</option><option>20</option></select><div class="actions"><button class="btn primary" id="generate">幫我規劃整批宣傳</button></div></div><div class="card"><h2>AI 會幫你做</h2><p>不同角度的貼文，不會只是重複換句話說。</p><p>每篇會同時準備 FB、IG 文案與對應圖片語法。</p><p>你確認後才會進入排程，不會自己亂發。</p><p class="muted">尚未接上 AI 時，可先產出完整工作需求並保存。</p></div></div></section>
<section id="posts" class="panel hide"><div class="card full"><h2>貼文審核</h2><div id="postList"><p class="muted">建立宣傳後，貼文會出現在這裡。</p></div></div></section>
<section id="calendar" class="panel hide"><div class="card full"><h2>排程月曆</h2><div id="calendarGrid" class="calendar"></div></div></section>
<section id="brand" class="panel hide"><div class="grid"><div class="card"><h2>品牌資料</h2><label>品牌名稱</label><input id="brandName" placeholder="例如：兔彼樂共創活動"><label>品牌介紹</label><textarea id="brandDesc"></textarea><button class="btn primary" id="saveBrand">儲存品牌</button></div><div class="card"><h2>品牌語氣與視覺</h2><label>文章語氣</label><textarea id="voice" placeholder="例如：溫暖、自然、不要太官方"></textarea><label>圖片風格</label><textarea id="visual" placeholder="例如：米白、乾淨、不要粉紅、不要漸層"></textarea></div></div></section>
<section id="connections" class="panel hide"><div class="grid"><div class="card"><h2>Facebook</h2><p>連接粉絲專頁後，核准的貼文才能自動發布。</p><button class="btn" disabled>尚待 Meta 授權串接</button></div><div class="card"><h2>Instagram</h2><p>連接專業帳號後，可與 Facebook 一起排程。</p><button class="btn" disabled>尚待 Meta 授權串接</button></div></div></section>
</main>
<script>
const state={posts:[]};const $=s=>document.querySelector(s);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.add('hide'));$('#'+b.dataset.tab).classList.remove('hide')});
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#generate').onclick=()=>{const title=$('#title').value.trim(),brief=$('#brief').value.trim(),n=Number($('#count').value);if(!title||!brief){alert('請先填活動名稱與活動資訊');return}const angles=['正式預告','活動亮點','故事／理念','參與方式','人物／合作單位','親子／朋友邀約','實用資訊','倒數提醒','活動前一天','活動當日','最後機會','幕後故事','感謝與分享','短版快訊','FAQ','交通提醒','特色商品','社群互動','行動號召','活動回顧'];state.posts=angles.slice(0,n).map((a,i)=>({id:i+1,angle:a,status:'草稿',copy:`【${a}】\n${title}\n\n請依以下正式資訊撰寫，不自行增加未提供事實：\n${brief}`,prompt:`為「${title}」製作一張與「${a}」貼文相符的 1:1 社群圖片。依品牌視覺規範，畫面清楚、適合 Facebook 與 Instagram；不得自行加入未提供的活動資訊。`}));renderPosts();document.querySelector('[data-tab="posts"]').click()};
function renderPosts(){const el=$('#postList');el.innerHTML=state.posts.map(p=>`<article class="post"><b>#${p.id} ${esc(p.angle)}</b> <span class="status">${esc(p.status)}</span><label>貼文</label><textarea data-copy="${p.id}">${esc(p.copy)}</textarea><label>圖片生成語法</label><textarea data-prompt="${p.id}">${esc(p.prompt)}</textarea><div class="actions"><button class="btn" onclick="copyPrompt(${p.id})">複製圖片語法</button><button class="btn primary" onclick="approve(${p.id})">核准這篇</button></div></article>`).join('')}
window.copyPrompt=id=>{const t=document.querySelector(`[data-prompt="${id}"]`);navigator.clipboard?.writeText(t.value);alert('圖片語法已複製')};window.approve=id=>{const p=state.posts.find(x=>x.id===id);p.copy=document.querySelector(`[data-copy="${id}"]`).value;p.prompt=document.querySelector(`[data-prompt="${id}"]`).value;p.status='已核准';renderPosts();renderCalendar()};
function renderCalendar(){const g=$('#calendarGrid');g.innerHTML=Array.from({length:14},(_,i)=>`<div class="day"><strong>第 ${i+1} 天</strong>${state.posts.filter(p=>p.status==='已核准'&&((p.id-1)%14)===i).map(p=>esc(p.angle)).join('<br>')||'<span class="muted">尚未排程</span>'}</div>`).join('')};renderCalendar();
$('#saveBrand').onclick=()=>{if(!$('#brandName').value.trim()){alert('請填品牌名稱');return}$('#saveState').textContent='品牌資料待 API 儲存';alert('介面已完成；正式版會寫入 Supabase，不使用瀏覽器當正式資料庫。')};
</script></body></html>
