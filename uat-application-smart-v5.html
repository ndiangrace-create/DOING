<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DOING｜智慧申請 UAT v5</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#26343d;--muted:#6b7880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--warn:#fff8e8;--shadow:0 12px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:16px 14px 72px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{color:var(--main);font-weight:900}.hero h1{font-size:clamp(27px,5vw,43px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:76px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9;box-shadow:inset 0 0 0 1px #cde2e6}.choice input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--main)}.choice b{display:block;line-height:1.4}.choice span span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-height:82px;resize:vertical}.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--sky);color:#4d6269;line-height:1.6}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}.btn.good{background:#315e5a;color:#fff}.summary{display:grid;gap:12px;margin-top:14px}.summarybox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafcfc;line-height:1.75}.summarybox b{display:block;margin-bottom:6px}.plan{display:grid;gap:10px}.planitem{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.planitem b{display:block;margin-bottom:5px}.warning{background:var(--warn);padding:11px 12px;border-radius:12px;line-height:1.55}.done{padding:18px;border-radius:16px;background:var(--mint);line-height:1.75}.muted{color:var(--muted);font-size:13px}@media(max-width:700px){.choices{grid-template-columns:1fr}.actions .btn{flex:1}.hero,.card{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v5</b><span class="badge">白話確認版｜不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>先確認我們有沒有真的懂你</small><h1>不用懂任何系統名稱。</h1><p>你只要告訴 DOING 你在做什麼、哪裡最麻煩。系統會用白話複述給你確認，再告訴你之後可以用它完成哪些事情。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const state={step:0,works:new Set(),pains:new Set(),extraPain:new Set(),otherWork:'',otherPain:'',confirmedPain:false};
const workChoices=[
 ['beauty','美容／美髮／美甲／按摩／SPA','需要安排服務時間的個人服務'],
 ['course','自己開課／手作／團體教學','有日期、時段、名額或多人一起參加'],
 ['event','自己辦活動／講座／展演','我是主辦，不只是去參加'],
 ['market','自己辦市集／招募攤商','我要審核、管理品牌或現場位置'],
 ['vendor','擺攤／餐車／參加別人的市集','我是參加者，不是主辦'],
 ['consign','百貨寄賣／通路合作','商品寄放在別人的場域販售，之後抽成或結算'],
 ['commerce','團購／代購／商品販售','會整理商品、訂單、數量、取貨或出貨'],
 ['project','設計／網站／婚禮／接案','接到需求後持續一段時間完成'],
 ['construction','室內設計／裝修／工程','會有丈量、設計、施工、驗收等階段'],
 ['guide','導覽／帶團／戶外體驗','日期、集合、名額，可能受天氣或場地影響'],
 ['rental','場地／教室／設備出租','同一時段不能重複使用'],
 ['home','到府／照護／維修服務','到客戶指定地點提供服務'],
 ['other','其他工作','找不到適合的再補充']
];
const painChoices=[
 ['schedule','不想一直用訊息來回喬時間'],['calendar','不同工作的行程很分散'],['payment','付款、訂金、對帳常常分開處理'],['registration','報名、名單、通知常常要自己整理'],['customer','客人資料、歷史紀錄、回訪很分散'],['position','排位、座位或攤位安排很麻煩'],['inventory','商品、庫存或寄賣數量不好追'],['settlement','抽成、分潤或通路結算不好對'],['condition','天氣、潮汐、場地等狀況會影響工作'],['projectflow','專案進度、階段、驗收很難集中'],['team','團隊分工、排班、權限容易混亂'],['files','照片、檔案、附件常常找不到'],['finance','不知道每份工作最後到底賺多少'],['checkin','現場報到或核銷很花時間'],['repeat','一直重複整理名單或重複填資料']
];
const extraPainChoices=[
 ['remind','常常忘記提醒客人／參加者'],['change','臨時改期或取消時通知很麻煩'],['status','不知道現在每件事做到哪裡'],['scattered','LINE、Excel、記事本、相簿到處都是資料'],['shared','同一個客人的資料在不同工作裡重複整理'],['stock','上架、售出、退回、剩餘庫存容易對不起來'],['weather','活動碰到天氣、潮汐、場地異動時很難處理'],['people','團隊不知道現在誰負責哪一段工作']
];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function progress(){ $('progress').innerHTML=[0,1,2,3].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('') }
function cards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b>${d?`<span>${d}</span>`:''}</span></label>`).join('')+'</div>'}
function bind(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>{x.checked?set.add(x.value):set.delete(x.value);});}
function labelList(items,set){return items.filter(x=>set.has(x[0])).map(x=>x[1]);}
function workSummary(){const w=state.works,parts=[];if(w.has('beauty'))parts.push('平常會接美容／美髮／美甲／按摩／SPA 類的客人，需要安排服務時間');if(w.has('course'))parts.push('也會自己開課或帶手作／團體教學，需要安排日期、時段和參加人數');if(w.has('event'))parts.push('會自己舉辦活動、講座或展演，需要處理報名與現場安排');if(w.has('market'))parts.push('會自己舉辦市集，需要處理攤商報名、審核、收款和位置安排');if(w.has('vendor'))parts.push('也會以攤商或餐車身分參加別人的活動');if(w.has('consign'))parts.push('另外有百貨寄賣或通路合作，需要記錄商品、庫存和後續結算');if(w.has('commerce'))parts.push('也會做團購、代購或商品販售，需要整理訂單與數量');if(w.has('project'))parts.push('會接設計、網站、婚禮或其他接案，需要一段時間持續完成');if(w.has('construction'))parts.push('也有室內設計、裝修或工程工作，會經過不同階段和驗收');if(w.has('guide'))parts.push('會做導覽、帶團或戶外體驗，可能受到天氣、潮汐或場地影響');if(w.has('rental'))parts.push('也有場地、教室或設備出租，需要避免時段撞期');if(w.has('home'))parts.push('也會提供到府、照護或維修類服務');if(state.otherWork.trim())parts.push(state.otherWork.trim());return parts;}
function painSummary(){return [...labelList(painChoices,state.pains),...labelList(extraPainChoices,state.extraPain),state.otherPain.trim()].filter(Boolean);}
function planItems(){const w=state.works,p=state.pains,e=state.extraPain,out=[];const add=(title,desc)=>out.push({title,desc});if(w.has('beauty'))add('預約與客人管理','客人可以看你開放的時間、自己選時段；你可以設定服務時間長度、休息時段，也能保留客人的歷史紀錄與備註。');if(w.has('course'))add('開課與名額管理','可以開日期與時段、設定名額、收報名、通知上課資訊，也能把材料或加購一起處理。');if(w.has('event'))add('活動報名與現場管理','可以收報名、整理名單、通知參加者，活動當天也能快速報到或核銷。');if(w.has('market'))add('市集招商與排位','可以收攤商報名、審核、確認付款、安排位置、整理現場名單與行前通知。');if(w.has('consign'))add('百貨寄賣與通路結算','可以記錄上架數量、售出、退回、剩餘庫存，也能整理抽成、應收款和結算。');if(w.has('commerce'))add('商品、團購與訂單整理','可以管理商品、訂單、數量、取貨／出貨和收款，不用再分散在不同表格。');if(w.has('project')||w.has('construction'))add('案件進度與階段管理','可以把一個案子拆成幾個階段，記錄進度、照片、檔案、付款與驗收，也能讓不同工作人員接續處理。');if(w.has('guide'))add('導覽與成行條件管理','可以收報名、控名額、記錄集合資訊，遇到天氣、潮汐、海況或場地變化時也能集中做改期與通知。');if(w.has('rental'))add('場地／設備時段管理','可以顯示可用時段、避免重複預約，並把收款和行事曆一起整理。');if(p.has('calendar')||p.has('schedule'))add('全部工作的共同日曆','美甲、課程、市集、接案、導覽等不同工作可以放在同一個工作日曆，不用每天手動到不同地方新增。');if(p.has('payment'))add('收款、訂金與對帳','每份工作都能記錄誰已付款、誰還沒付，訂金、尾款、退款或押金也能集中追蹤。');if(p.has('finance')||p.has('settlement'))add('每份工作的收入與支出','可以看到每一份工作收到多少、花多少、最後剩多少；寄賣或合作抽成也能一起對。');if(p.has('files')||e.has('scattered'))add('照片、檔案與工作紀錄','照片、附件、進度和相關資料可以跟著同一份工作保存，不用再到處找。');if(p.has('team')||e.has('people'))add('團隊分工與排班','可以安排不同人負責什麼、哪天上班或休息，也能控制每個人能看到哪些資料。');if(p.has('checkin'))add('現場報到與核銷','活動或課程現場可以快速確認誰到了、誰已使用票券或資格。');return out;}
function nav(label='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<button class="btn ghost" id="reset">重新開始</button>'}<span class="muted">不用選得很完美，後面還可以修正。</span><button class="btn primary" id="next">${label}</button></div>`}
function render(){progress();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><div><h2>你現在同時在做哪些工作？</h2><p>只勾你真的有在做的，可以很多種。</p></div><span class="count">${state.works.size} 項</span></div>${cards(workChoices,state.works)}<div class="field"><label>還有其他工作嗎？（選填）</label><textarea id="otherWork" placeholder="例如：平日有正職，假日另外做團購"></textarea></div>${nav()}`;bind(state.works);$('otherWork').value=state.otherWork;$('otherWork').oninput=e=>state.otherWork=e.target.value;}
 else if(state.step===1){s.innerHTML=`<div class="head"><div><h2>你現在最想改善哪些麻煩？</h2><p>先講麻煩就好，不用想系統功能。</p></div><span class="count">${state.pains.size} 項</span></div>${cards(painChoices,state.pains)}${nav('讓 DOING 整理看看 →')}`;bind(state.pains);}
 else if(state.step===2){const ws=workSummary(),ps=painSummary();s.innerHTML=`<div class="head"><div><h2>我先確認一下，我有沒有理解對</h2><p>這一步只確認你的工作和痛點，還不談系統功能。</p></div></div><div class="summary"><div class="summarybox"><b>我理解你目前的工作是：</b>${ws.length?ws.map(x=>'• '+esc(x)).join('<br>'):'尚未整理出工作內容'}</div><div class="summarybox"><b>你目前最想改善的是：</b>${ps.length?ps.map(x=>'• '+esc(x)).join('<br>'):'目前還沒有特別指定'}</div></div><div class="note"><b>還有其他讓你覺得很麻煩、希望一起改善的事情嗎？</b></div>${cards(extraPainChoices,state.extraPain)}<div class="field"><label>其他補充（選填）</label><textarea id="otherPain" placeholder="例如：臨時改期時，我還要一個一個通知，很容易漏掉"></textarea></div><div class="actions"><button class="btn alt" id="back">← 有些地方不對，我要修改</button><button class="btn primary" id="next">對，先這樣幫我規劃 →</button></div>`;bind(state.extraPain);$('otherPain').value=state.otherPain;$('otherPain').oninput=e=>state.otherPain=e.target.value;}
 else if(state.step===3){const plans=planItems();s.innerHTML=`<div class="head"><div><h2>依照你剛剛說的，DOING 會幫你準備這些</h2><p>這裡不講系統名稱，只告訴你之後實際可以做什麼。</p></div></div><div class="plan">${plans.map(x=>`<div class="planitem"><b>${esc(x.title)}</b>${esc(x.desc)}</div>`).join('')}</div><div class="warning">如果這些規劃符合你的工作，正式版下一步才會建立申請設定；目前這個 UAT 不會真的建立租戶或寫正式申請。</div><div class="actions"><button class="btn alt" id="back">有些地方理解錯了</button><button class="btn alt" id="add">我還想補充一點</button><button class="btn good" id="confirm">✓ 對，這就是我需要的</button></div>`;$('add').onclick=()=>{state.step=2;render()};$('confirm').onclick=()=>{s.innerHTML=`<div class="done"><b>確認完成。</b><br>正式流程中，這一步之後才會把剛剛確認過的內容轉成申請設定並送平台核准。<br><span class="muted">UAT 目前不建立租戶、不寫正式申請。</span></div><div class="actions"><button class="btn alt" id="again">重新測一次</button></div>`;$('again').onclick=()=>{state.step=0;render()};return;};}
 if(state.step<3){$('next').onclick=()=>{if(state.step===0&&!state.works.size&&!state.otherWork.trim())return alert('請至少選一種工作或補充其他工作');state.step++;render();};}if($('back'))$('back').onclick=()=>{state.step--;render()};if($('reset'))$('reset').onclick=()=>{state.works.clear();state.pains.clear();state.extraPain.clear();state.otherWork='';state.otherPain='';render()};}
render();
</script>
</body>
</html>
