<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜單場工作台</title><link rel="stylesheet" href="doing-market-v18.css?v=20260823-v18"></head><body><header class="mk-top"><div class="mk-top-in"><a class="mk-brand" id="backMarket"><img src="doing-logo.png" alt="DOING"><span class="mk-brand-text"><b>DOING Market</b><small>單場工作台</small></span></a><div class="mk-top-actions"><button id="backBtn" class="mk-btn">回場次</button></div></div></header><main class="mk-shell"><section class="mk-hero"><div class="mk-eyebrow">單場工作台</div><h1 id="sessionTitle">場次載入中…</h1><p id="sessionMeta">日期與地點載入中…</p></section><nav class="mk-tabs"><button class="mk-tab on" data-tab="overview">總覽</button><button class="mk-tab" data-tab="registrations">報名審核</button><button class="mk-tab" data-tab="payments">付款</button><button class="mk-tab" data-tab="seat">排位設備</button><button class="mk-tab" data-tab="notice">通知</button><button class="mk-tab" data-tab="onsite">現場</button><button class="mk-tab" data-tab="closeout">結案</button><button class="mk-tab" data-tab="settings">場次設定</button></nav><section class="mk-panel on" id="overview"><div id="kpis" class="mk-kpis"></div><div class="mk-work-cards"><article class="mk-card mk-work-card"><h3>報名審核</h3><p>待審核、錄取、候補與未錄取都在同一份名單處理。</p><button class="mk-btn blue" data-go="registrations">處理報名</button></article><article class="mk-card mk-work-card"><h3>付款</h3><p>付款回報與確認付款直接在本場完成。</p><button class="mk-btn primary" data-go="payments">處理付款</button></article><article class="mk-card mk-work-card"><h3>現場</h3><p>活動日搜尋品牌或姓名後直接報到。</p><button class="mk-btn mint" data-go="onsite">進入現場</button></article><article class="mk-card mk-work-card"><h3>結案</h3><p>退款、保證金與單場結算集中處理。</p><button class="mk-btn yellow" data-go="closeout">進入結案</button></article></div></section><section class="mk-panel" id="registrations"><div class="mk-toolbar" style="margin:10px 0"><input id="regSearch" placeholder="搜尋品牌、姓名、電話、Email"><select id="regFilter"><option value="all">全部</option><option value="pending">待審核</option><option value="approved">已錄取</option><option value="waitlist">候補</option><option value="rejected">未錄取</option></select><button id="reloadRegs" class="mk-btn">重新整理</button></div><div id="regList" class="mk-list"><div class="mk-empty">名單載入中…</div></div></section><section class="mk-panel" id="payments"><div class="mk-toolbar" style="margin:10px 0"><input id="paySearch" placeholder="搜尋品牌、姓名"><select id="payFilter"><option value="all">全部</option><option value="unpaid">待繳費</option><option value="pending">待確認付款</option><option value="paid">已繳費</option></select></div><div id="payList" class="mk-list"></div></section><section class="mk-panel" id="seat"><div class="mk-work-cards"><article class="mk-card mk-work-card"><h3>排位</h3><p>排位與設備依本場正式資料處理，不跳離這個工作台。</p><button id="seatRefresh" class="mk-btn blue">重新讀取本場資料</button></article><article class="mk-card mk-work-card"><h3>設備</h3><p>已登記設備與加購會跟著報名資料一起顯示。</p><div id="seatInfo" class="mk-muted">讀取中…</div></article></div></section><section class="mk-panel" id="notice"><div class="mk-work-cards"><article class="mk-card mk-work-card"><h3>通知與行前</h3><p>錄取、付款與行前狀態都從本場資料判斷。</p><button id="noticeReload" class="mk-btn blue">重新整理名單</button></article></div></section><section class="mk-panel" id="onsite"><div class="mk-toolbar" style="margin:10px 0"><input id="onsiteSearch" placeholder="搜尋姓名、品牌、電話"><button id="reloadOnsite" class="mk-btn">重新整理</button></div><div id="onsiteList" class="mk-list"></div></section><section class="mk-panel" id="closeout"><div class="mk-kpis"><button class="mk-metric" data-close-filter="refund"><b id="refundPending">0</b><small>待退款</small></button><button class="mk-metric" data-close-filter="refunded"><b id="refundDone">0</b><small>已退款</small></button></div><div id="closeoutList" class="mk-list"></div></section><section class="mk-panel" id="settings"><div class="mk-settings-grid"><article class="mk-card mk-setting-card"><h3>場次基本資料</h3><div class="mk-field"><label>場次名稱</label><input id="setName"><label>地點</label><input id="setVenue"><label>基本費用</label><input id="setFee" type="number" min="0"><label>名額</label><input id="setLimit" type="number" min="0"><label>是否需要審核</label><select id="setReview"><option value="yes">需要審核</option><option value="no">免審核</option></select><button id="saveSession" class="mk-btn primary">儲存場次設定</button></div></article><article class="mk-card mk-setting-card"><h3>場次說明</h3><div class="mk-field"><label>活動說明</label><textarea id="setDesc"></textarea><label>活動日期</label><input id="setDate" type="date"></div></article></div></section></main><script>'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),TOKEN=P.get('admin_token')||P.get('token')||'',SID=P.get('sessionId')||P.get('session_id')||'',S={session:null,rows:[]};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function route(path,extra={}){const u=new URL(path,location.origin);if(T)u.searchParams.set('tenant',T);if(TOKEN)u.searchParams.set('admin_token',TOKEN);Object.entries(extra).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,String(v)));return u.toString()}async function api(action,extra={},post=false){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);if(TOKEN)u.searchParams.set('token',TOKEN);let opt={cache:'no-store'};if(post)opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tenant:T,token:TOKEN,...extra})};else Object.entries(extra).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,String(v)));const r=await fetch(u,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'操作失敗');return d.data??d.result??d}function rid(r){return String(r.id||r.regId||r.registrationId||'')}function review(r){return String(r.reviewStatus||r.status||'待審核')}function pay(r){return String(r.paymentStatus||r.payStatus||'未繳費')}function check(r){return String(r.checkinStatus||r.checkin||'未報到')}function isPaid(v){return /已繳|已付款|paid|confirmed/i.test(v)}function isPendingPay(v){return /待確認|回報/.test(v)}function isPendingReview(v){return /待審|報名成功/.test(v)||v===''}function openTab(id){document.querySelectorAll('.mk-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));document.querySelectorAll('.mk-panel').forEach(p=>p.classList.toggle('on',p.id===id));sessionStorage.setItem('doing-market-session-tab',id);if(id==='seat')renderSeat();if(id==='closeout')renderCloseout()}function applyFocus(){const f=P.get('focus')||'';if(f==='pending'){$('regFilter').value='pending';openTab('registrations')}else if(f==='all'){openTab('registrations')}else if(['unpaid','paid','pending-payment'].includes(f)){$('payFilter').value=f==='pending-payment'?'pending':f;openTab('payments')}}function rowCard(r,mode){const id=rid(r),rv=review(r),pv=pay(r),cv=check(r),brand=r.brand||r.brandName||r.brand_name||r.name||'未填品牌';let actions='';if(mode==='reg'&&isPendingReview(rv))actions=`<button class="mk-btn blue" data-action="approve" data-id="${esc(id)}">錄取</button><button class="mk-btn" data-action="waitlist" data-id="${esc(id)}">候補</button><button class="mk-btn rose" data-action="reject" data-id="${esc(id)}">不錄取</button>`;if(mode==='pay'&&isPendingPay(pv))actions=`<button class="mk-btn primary" data-action="confirmPayment" data-id="${esc(id)}">確認付款</button>`;if(mode==='onsite'&&!/已報到/.test(cv))actions=`<button class="mk-btn mint" data-action="checkin" data-id="${esc(id)}">一鍵報到</button>`;return `<article class="mk-row"><div><b>${esc(brand)}</b><small>${esc(r.name||'')} ${r.phone?'｜'+esc(r.phone):''} ${r.email?'｜'+esc(r.email):''}</small><div class="mk-tags"><span class="mk-tag">審核：${esc(rv)}</span><span class="mk-tag">付款：${esc(pv)}</span><span class="mk-tag">報到：${esc(cv)}</span></div></div><div class="mk-toolbar">${actions}</div></article>`}function filtered(mode){const input=mode==='reg'?'regSearch':mode==='pay'?'paySearch':'onsiteSearch',kw=$(input).value.trim().toLowerCase();let rows=S.rows.filter(r=>!kw||[r.brand,r.brandName,r.name,r.phone,r.mobile,r.email].filter(Boolean).join(' ').toLowerCase().includes(kw));if(mode==='reg'){const f=$('regFilter').value;if(f==='pending')rows=rows.filter(r=>isPendingReview(review(r)));if(f==='approved')rows=rows.filter(r=>/已錄取/.test(review(r)));if(f==='waitlist')rows=rows.filter(r=>/備取|候補/.test(review(r)));if(f==='rejected')rows=rows.filter(r=>/不錄取|未錄取/.test(review(r)))}if(mode==='pay'){const f=$('payFilter').value;if(f==='unpaid')rows=rows.filter(r=>/已錄取/.test(review(r))&&!isPaid(pay(r))&&!isPendingPay(pay(r)));if(f==='pending')rows=rows.filter(r=>isPendingPay(pay(r)));if(f==='paid')rows=rows.filter(r=>isPaid(pay(r)))}return rows}function render(mode){const box=$(mode==='reg'?'regList':mode==='pay'?'payList':'onsiteList'),rows=filtered(mode);box.innerHTML=rows.length?rows.map(r=>rowCard(r,mode)).join(''):'<div class="mk-empty">沒有符合的資料。</div>';box.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>runAction(b.dataset.action,b.dataset.id,b))}function renderKpis(){const rows=S.rows,c=fn=>rows.filter(fn).length;$('kpis').innerHTML=`<button class="mk-metric" data-kpi="all"><b>${rows.length}</b><small>全部報名</small></button><button class="mk-metric" data-kpi="pending"><b>${c(r=>isPendingReview(review(r)))}</b><small>待審核</small></button><button class="mk-metric" data-kpi="unpaid"><b>${c(r=>/已錄取/.test(review(r))&&!isPaid(pay(r))&&!isPendingPay(pay(r)))}</b><small>待繳費</small></button><button class="mk-metric" data-kpi="pending-payment"><b>${c(r=>isPendingPay(pay(r)))}</b><small>待確認付款</small></button><button class="mk-metric" data-kpi="paid"><b>${c(r=>isPaid(pay(r)))}</b><small>已繳費</small></button><button class="mk-metric" data-kpi="onsite"><b>${c(r=>/已報到/.test(check(r)))}</b><small>已報到</small></button>`;document.querySelectorAll('[data-kpi]').forEach(b=>b.onclick=()=>{const k=b.dataset.kpi;if(k==='all'||k==='pending'){$('regFilter').value=k==='pending'?'pending':'all';openTab('registrations');render('reg')}else if(k==='onsite'){openTab('onsite');render('onsite')}else{$('payFilter').value=k==='pending-payment'?'pending':k;openTab('payments');render('pay')}})}async function runAction(action,id,btn){btn.disabled=true;try{if(action==='approve')await api('approveReg',{regId:id,approved:true,sessionId:SID},true);if(action==='reject')await api('approveReg',{regId:id,approved:false,sessionId:SID},true);if(action==='waitlist')await api('approveReg',{regId:id,waitlist:true,sessionId:SID},true);if(action==='confirmPayment')await api('confirmPayment',{regId:id,sessionId:SID},true);if(action==='checkin')await api('checkin',{regId:id,sessionId:SID},true);await loadRows()}catch(e){alert(e.message)}finally{btn.disabled=false}}async function loadRows(){try{const d=await api('getSessionRegistrations',{sessionId:SID});S.rows=Array.isArray(d)?d:(d.rows||d.registrations||[]);renderKpis();render('reg');render('pay');render('onsite');renderSeat();renderCloseout()}catch(e){['regList','payList','onsiteList'].forEach(id=>$(id).innerHTML='<div class="mk-empty">'+esc(e.message)+'</div>')}}async function loadSession(){try{const d=await api('getSessionDashboard',{sessionId:SID});S.session=d.session||d||{};$('sessionTitle').textContent=S.session.name||S.session.sessionName||'單場工作台';const dt=Array.isArray(S.session.dates)&&S.session.dates[0],date=typeof dt==='object'?(dt.date||dt.label||''):dt||'';$('sessionMeta').textContent=[date,S.session.venue].filter(Boolean).join('｜')||'本場資料';$('setName').value=S.session.name||S.session.sessionName||'';$('setVenue').value=S.session.venue||'';$('setFee').value=Number(S.session.fee||0);$('setLimit').value=Number(S.session.limit||0);$('setReview').value=S.session.needReview?'yes':'no';$('setDesc').value=S.session.desc||S.session.description||'';$('setDate').value=date&&/^\d{4}-\d{2}-\d{2}/.test(date)?date.slice(0,10):''}catch(_){}}function renderSeat(){const equip=S.session?.equip||{};const count=Object.keys(equip).length;$('seatInfo').textContent=count?`本場已設定 ${count} 種設備。`:'本場目前沒有設備設定。'}function renderCloseout(){const refund=S.rows.filter(r=>/申請退費|退費中|refund_requested/i.test(String(r.transferStatus||r.transfer_status||''))),done=S.rows.filter(r=>/已退費|已退款|refunded/i.test(String(r.transferStatus||r.paymentStatus||''))||r.refundedAt);$('refundPending').textContent=refund.length;$('refundDone').textContent=done.length;const rows=[...refund,...done.filter(x=>!refund.includes(x))];$('closeoutList').innerHTML=rows.length?rows.map(r=>`<article class="mk-row"><div><b>${esc(r.brand||r.brandName||r.name||'報名')}</b><small>${esc(r.transferStatus||r.paymentStatus||'退款')}</small></div>${refund.includes(r)?`<button class="mk-btn yellow" data-refund="${esc(rid(r))}">檢查退款</button>`:''}</article>`).join(''):'<div class="mk-empty">目前沒有退款待辦。</div>';document.querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>previewRefund(b.dataset.refund,b))}async function previewRefund(id,btn){btn.disabled=true;try{const s=await api('getRefundSuggestion',{regId:id});if(!confirm(`應退 ${Number(s.refundAmount||0).toLocaleString()} 元。確認已完成實際退款？`))return;await api('confirmRefund',{regId:id,refundNote:'DOING Market 單場工作台確認退款'},true);await loadRows()}catch(e){alert(e.message)}finally{btn.disabled=false}}async function saveSession(){const b=$('saveSession');b.disabled=true;try{const body={id:SID,sessionId:SID,name:$('setName').value.trim(),venue:$('setVenue').value.trim(),fee:Number($('setFee').value)||0,limit:Number($('setLimit').value)||0,needReview:$('setReview').value==='yes',desc:$('setDesc').value.trim(),dates:$('setDate').value?[{date:$('setDate').value,label:$('setDate').value}]:(S.session?.dates||[])};await api('updateSession',body,true);await loadSession();alert('場次設定已儲存。')}catch(e){alert(e.message)}finally{b.disabled=false}}document.querySelectorAll('.mk-tab').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openTab(b.dataset.go));$('regSearch').oninput=()=>render('reg');$('regFilter').onchange=()=>render('reg');$('paySearch').oninput=()=>render('pay');$('payFilter').onchange=()=>render('pay');$('onsiteSearch').oninput=()=>render('onsite');$('reloadRegs').onclick=loadRows;$('reloadOnsite').onclick=loadRows;$('seatRefresh').onclick=loadRows;$('noticeReload').onclick=loadRows;$('saveSession').onclick=saveSession;$('backBtn').onclick=()=>{location.href=route('/market/',{tab:'sessions'})};$('backMarket').href=route('/market/',{tab:'sessions'});Promise.allSettled([loadSession(),loadRows()]).then(()=>{const tab=P.get('tab')||sessionStorage.getItem('doing-market-session-tab')||'overview';openTab(['overview','registrations','payments','seat','notice','onsite','closeout','settings'].includes(tab)?tab:'overview');applyFocus()});</script></body></html>
