<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOING｜平台營運管理</title>
<style>
:root{--bg:#FAF9FC;--paper:#fff;--ink:#262A31;--muted:#6F7480;--line:#E6E1EA;--main:#8F7CAE;--main2:#766292;--ok:#2F7D68;--bad:#A94F4F}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(180deg,#FBFAFD,#fff);color:var(--ink);font-size:18px;line-height:1.65}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.head,.wrap{width:100%;padding-left:clamp(16px,3vw,44px);padding-right:clamp(16px,3vw,44px)}.head{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1,h2,h3{margin:0}.head h1{font-size:22px}.muted{color:var(--muted);font-size:16px}.wrap{padding-top:16px;padding-bottom:50px}
button,input,select,textarea{font:inherit;font-size:17px}button{border:0;border-radius:12px;min-height:46px;padding:9px 15px;background:var(--main);color:#fff;font-weight:900;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff;color:var(--bad);border:1px solid #EACCCC}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.field{display:grid;gap:5px;margin:8px 0}.field label{font-weight:850}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 28px rgba(64,51,82,.04);min-width:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:14px}.metric{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}.metric span{display:block;color:var(--muted);font-size:16px}.metric b{display:block;font-size:22px;margin-top:4px}
.review-grid{display:grid;grid-template-columns:minmax(340px,.75fr) minmax(0,1.25fr);gap:14px;margin-bottom:14px}.application-list,.tenant-list{display:grid;gap:7px;max-height:520px;overflow:auto}.application,.tenant{width:100%;text-align:left;background:#FCFBFD;color:var(--ink);border:1px solid var(--line);padding:11px 12px}.application.active,.tenant.active{background:#F1EDF6;border-color:#CFC3DD;box-shadow:inset 3px 0 0 var(--main)}
.application b,.tenant b{display:block}.application span,.tenant span{display:block;color:var(--muted);font-size:16px;margin-top:2px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.info{padding:11px 12px;border-radius:13px;background:#F8F7FA;border:1px solid #ECE8EF}.info span{display:block;color:var(--muted);font-size:16px}.info b{display:block;font-size:18px;margin-top:3px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{padding:12px 14px;border-radius:13px;background:#F7F4FA;border:1px solid #E7E0EE;font-size:16px}
.main-grid{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);gap:14px}
.hidden{display:none!important}.ok{color:var(--ok);font-weight:900}.error{color:var(--bad);font-weight:900}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(max-width:980px){.review-grid,.main-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.application-list,.tenant-list{max-height:300px}}
@media(max-width:600px){body{font-size:17px}.head,.wrap{padding-left:12px;padding-right:12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="head"><div><h1>DOING 平台營運管理</h1><div class="muted">主辦審核・平台收費・創業金・營運總覽</div></div><div><button class="secondary hidden" id="logoutBtn">登出</button></div></div></header>
<div class="wrap">
<section class="card" id="loginCard"><h2>平台管理登入</h2><p class="muted">僅限 DOING 平台管理者。</p><button id="loginBtn">Google 登入</button><div id="loginErr" class="error"></div></section>

<div id="app" class="hidden">
<section class="metrics" id="platformMetrics"></section>

<section class="review-grid">
  <div class="card"><h2>主辦申請審核</h2><p class="muted">Google 驗證完成後的申請會出現在這裡；通過後才建立主辦帳號。</p><div id="applicationList" class="application-list"></div></div>
  <div class="card"><div id="applicationEmpty" class="muted">請選擇一筆申請。</div><div id="applicationDetail" class="hidden">
    <h2 id="applicationBrand">主辦申請</h2>
    <div class="detail-grid" style="margin-top:10px">
      <div class="info"><span>聯絡人</span><b id="applicationName"></b></div>
      <div class="info"><span>Google Email</span><b id="applicationEmail"></b></div>
      <div class="info"><span>電話</span><b id="applicationPhone"></b></div>
      <div class="info"><span>申請時間</span><b id="applicationCreated"></b></div>
    </div>
    <div class="notice" id="applicationUses" style="margin-top:10px"></div>
    <div class="field"><label>未通過時的說明（只有按「不通過」才使用）</label><textarea id="rejectReason" rows="3" placeholder="例如：資料不足，請補充品牌／主辦資訊後重新申請"></textarea></div>
    <div class="actions"><button id="approveBtn">審核通過並建立帳號</button><button class="danger" id="rejectBtn">不通過</button></div>
    <div id="applicationMsg"></div>
  </div></div>
</section>

<section class="main-grid">
 <aside class="card"><h2>主辦帳號</h2><div class="field"><input id="search" placeholder="搜尋主辦／Email"></div><div id="tenantList" class="tenant-list"></div></aside>
 <main class="card"><div id="empty" class="muted">請先選擇左側主辦。</div><div id="detail" class="hidden">
  <h2 id="tenantName">主辦</h2><div class="detail-grid" style="margin-top:10px"><div class="info"><span>主辦登入信箱</span><b id="owner"></b></div><div class="info"><span>目前可用贈送額度</span><b id="credit">—</b></div></div>
  <div class="actions"><button class="secondary" id="enterBtn">進入主辦後台</button><button class="secondary" id="reloadBtn">重新整理</button></div>
  <hr><h3>主辦贈送額度</h3><div class="notice">可折抵 DOING 活動開通費或預約方案；不是現金收入。</div>
  <div class="detail-grid"><div class="field"><label>增加／扣回金額</label><input id="creditAmount" type="number" step="1"></div><div class="field"><label>原因／備註</label><input id="creditNote"></div></div><button id="grantBtn">確認調整額度</button>
  <hr><h3>確認主辦付款並開通</h3><div class="field"><label>這次付款要開通什麼？</label><select id="payMode"><option value="activity">活動場次｜NT$200／場</option><option value="operation_unit">獨立報名項目｜NT$200／項</option><option value="booking">持續預約服務｜NT$888／月</option></select></div>
  <div class="field" id="sessionField"><label>活動場次</label><select id="sessionId"></select></div><div class="field hidden" id="operationUnitField"><label>營運項目</label><select id="operationUnitId"></select></div>
  <div class="field"><label>付款備註</label><input id="payNote"></div><button id="confirmPayBtn">確認已收款並開通</button><div id="msg"></div>
 </div>
 <section style="margin-top:18px"><h3>新主辦創業金</h3><p class="muted">審核通過建立帳號時，自動贈送設定中的創業金。</p><div class="detail-grid"><label class="info"><input type="checkbox" id="startupCreditEnabled" checked> 啟用新主辦創業金</label><div class="field"><label>贈送金額</label><input id="startupCreditAmount" type="number" min="0" step="1" value="1000"></div></div><button onclick="saveStartupCreditPolicy()">儲存創業金設定</button><div id="startupCreditStatus" class="muted"></div></section>
 </main>
</section>
</div>
</div>
<script>
const API='https://tobeloved-api.ndiangrace.workers.dev', $=id=>document.getElementById(id);
let token='',tenants=[],selected=null,sessions=[],operationUnits=[],applications=[],selectedApplication=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(action,p={}){const q=new URLSearchParams({action,token,...p});const r=await fetch(API+'?'+q,{cache:'no-store'});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'讀取失敗');return j}
async function post(action,p={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...p})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'操作失敗');return j}
const rows=v=>Array.isArray(v)?v:(Array.isArray(v?.rows)?v.rows:(Array.isArray(v?.data)?v.data:[]));
function msg(id,text,ok=true){const e=$(id);e.className=ok?'ok':'error';e.textContent=text}
async function init(){const u=new URL(location.href),q=u.searchParams.get('admin_token');if(q){localStorage.setItem('doing_platform_token',q);u.searchParams.delete('admin_token');history.replaceState({},'',u.pathname+u.search+u.hash)}token=localStorage.getItem('doing_platform_token')||'';if(!token)return;$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');try{const me=await get('adminMe');if(String(me.normalized_role||me.role)!=='platform_super_admin')throw Error('此帳號不是平台管理員');await Promise.all([loadDashboard(),loadApplications(),loadTenants(),loadStartupCreditPolicy()])}catch(e){localStorage.removeItem('doing_platform_token');$('app').classList.add('hidden');$('loginCard').classList.remove('hidden');$('loginErr').textContent=e.message}}
async function loadDashboard(){const d=await get('getPlatformDashboard');const data=[['主辦帳號',d.tenantCount],['近 30 日活躍',d.activeTenant30d],['活動場次',d.sessionCount],['營運項目',d.operationUnitCount],['全平台報名／預約',d.registrationCount],['平台收入','NT$ '+Math.round(Number(d.platformRevenue||0)).toLocaleString()],['已發創業金','NT$ '+Math.round(Number(d.startupCreditGranted||0)).toLocaleString()]];$('platformMetrics').innerHTML=data.map(x=>'<div class="metric"><span>'+esc(x[0])+'</span><b>'+esc(x[1]??0)+'</b></div>').join('')}
async function loadApplications(){applications=rows(await get('applyList')).filter(x=>String(x.status)==='pending');renderApplications()}
function renderApplications(){$('applicationList').innerHTML=applications.length?applications.map(a=>'<button class="application '+(selectedApplication?.id===a.id?'active':'')+'" onclick="selectApplication(\''+esc(a.id)+'\')"><b>'+esc(a.brand_name||'未命名主辦')+'</b><span>'+esc(a.contact_email||'')+'｜'+esc(new Date(a.created_at).toLocaleString('zh-TW'))+'</span></button>').join(''):'<div class="muted">目前沒有待審核申請。</div>'}
function selectApplication(id){selectedApplication=applications.find(x=>String(x.id)===String(id));if(!selectedApplication)return;renderApplications();$('applicationEmpty').classList.add('hidden');$('applicationDetail').classList.remove('hidden');const a=selectedApplication,app=typeof a.application_json==='object'?a.application_json:{};$('applicationBrand').textContent=a.brand_name||'主辦申請';$('applicationName').textContent=a.contact_name||'—';$('applicationEmail').textContent=a.contact_email||'—';$('applicationPhone').textContent=a.contact_phone||'—';$('applicationCreated').textContent=new Date(a.created_at).toLocaleString('zh-TW');const mp=app.moduleProfile||{};$('applicationUses').innerHTML='<b>申請時勾選的營運情境</b><br>'+esc((mp.useCases||[]).join('、')||'未填寫');$('rejectReason').value='';$('applicationMsg').textContent=''}
$('approveBtn').onclick=async()=>{if(!selectedApplication)return;if(!confirm('確認審核通過？系統會立即建立主辦帳號並依平台設定發放創業金。'))return;try{const d=await post('approveApply',{apply_id:selectedApplication.id});msg('applicationMsg','已通過並建立主辦帳號：'+(d.tenantId||''));selectedApplication=null;await Promise.all([loadApplications(),loadTenants(),loadDashboard()]);$('applicationDetail').classList.add('hidden');$('applicationEmpty').classList.remove('hidden')}catch(e){msg('applicationMsg',e.message,false)}}
$('rejectBtn').onclick=async()=>{if(!selectedApplication)return;const reason=$('rejectReason').value.trim();if(!confirm('確認本次申請不通過？'))return;try{await post('rejectApply',{apply_id:selectedApplication.id,reason});selectedApplication=null;await loadApplications();$('applicationDetail').classList.add('hidden');$('applicationEmpty').classList.remove('hidden')}catch(e){msg('applicationMsg',e.message,false)}}
async function loadTenants(){tenants=rows(await get('getTenantsAdmin'));renderTenants()}
function renderTenants(){const kw=$('search').value.trim().toLowerCase(),r=tenants.filter(t=>((t.name||'')+(t.owner_email||'')).toLowerCase().includes(kw));$('tenantList').innerHTML=r.length?r.map(t=>'<button class="tenant '+(selected?.id===t.id?'active':'')+'" onclick="selectTenant(\''+esc(t.id)+'\')"><b>'+esc(t.name||t.id)+'</b><span>'+esc(t.owner_email||'尚未建立管理者')+'</span></button>').join(''):'<div class="muted">沒有符合的主辦</div>'}
async function selectTenant(id){selected=tenants.find(x=>String(x.id)===String(id));if(!selected)return;renderTenants();$('empty').classList.add('hidden');$('detail').classList.remove('hidden');$('tenantName').textContent=selected.name||selected.id;$('owner').textContent=selected.owner_email||'—';await Promise.all([loadCredit(),loadSessions(),loadUnits()])}
async function loadCredit(){const d=await get('getPlatformCreditBalance',{target_tenant_id:selected.id});$('credit').textContent='NT$ '+Math.round(Number(d.balance||0)).toLocaleString()}
async function loadSessions(){sessions=rows(await get('platformTenantSessions',{target_tenant_id:selected.id}));$('sessionId').innerHTML=sessions.length?sessions.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name||s.id)+'｜'+esc(s.status||'')+'</option>').join(''):'<option value="">尚無場次</option>'}
async function loadUnits(){operationUnits=rows(await get('platformTenantOperationUnits',{target_tenant_id:selected.id}));$('operationUnitId').innerHTML=operationUnits.length?operationUnits.map(u=>'<option value="'+esc(u.id)+'">'+esc(u.name||u.id)+'｜'+esc(u.status||'')+'</option>').join(''):'<option value="">尚無營運項目</option>'}
$('search').oninput=renderTenants;$('payMode').onchange=()=>{const m=$('payMode').value;$('sessionField').classList.toggle('hidden',m!=='activity');$('operationUnitField').classList.toggle('hidden',m!=='operation_unit')};
$('loginBtn').onclick=()=>location.href=API+'/auth/google/start?tenant=platform';$('logoutBtn').onclick=()=>{localStorage.removeItem('doing_platform_token');location.reload()}
$('reloadBtn').onclick=async()=>{if(selected)await Promise.all([loadCredit(),loadSessions(),loadUnits()])}
$('grantBtn').onclick=async()=>{if(!selected)return;const amount=Number($('creditAmount').value||0);if(!amount)return msg('msg','請輸入非 0 金額',false);try{const d=await post('grantPartnerCredit',{target_tenant_id:selected.id,amount,note:$('creditNote').value.trim()});$('credit').textContent='NT$ '+Math.round(Number(d.balance||0)).toLocaleString();$('creditAmount').value='';$('creditNote').value='';msg('msg','額度調整完成')}catch(e){msg('msg',e.message,false)}}
$('confirmPayBtn').onclick=async()=>{if(!selected)return;const mode=$('payMode').value,sessionId=$('sessionId').value,operationUnitId=$('operationUnitId').value;if(mode==='activity'&&!sessionId)return msg('msg','請選擇活動場次',false);if(mode==='operation_unit'&&!operationUnitId)return msg('msg','請選擇營運項目',false);try{await post('confirmOperatingPayment',{target_tenant_id:selected.id,mode,sessionId,operationUnitId,note:$('payNote').value.trim()});msg('msg','付款確認與開通完成')}catch(e){msg('msg',e.message,false)}}
$('enterBtn').onclick=async()=>{if(!selected)return;try{const d=await post('platformEnterTenant',{target_workspace_id:selected.id});const u=new URL(d.admin_url||'admin.html',location.href);u.searchParams.set('tenant',selected.id);u.searchParams.set('admin_token',d.admin_token);location.href=u.toString()}catch(e){msg('msg',e.message,false)}}
async function loadStartupCreditPolicy(){try{const d=await get('getStartupCreditPolicy');$('startupCreditEnabled').checked=d.enabled!==false;$('startupCreditAmount').value=Number(d.amount||0);$('startupCreditStatus').textContent='目前設定：'+(d.enabled!==false?'新主辦審核通過後贈送 NT$'+Number(d.amount||0).toLocaleString():'停用')}catch(e){}}
async function saveStartupCreditPolicy(){try{const enabled=$('startupCreditEnabled').checked,amount=Math.max(0,Number($('startupCreditAmount').value||0));await post('saveStartupCreditPolicy',{enabled,amount});$('startupCreditStatus').textContent='已儲存'}catch(e){alert(e.message)}}
init();
</script>
</body></html>
