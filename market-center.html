<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING Market｜主辦後台</title><link rel="stylesheet" href="doing-market-v18.css?v=20260823-v18"></head><body><header class="mk-top"><div class="mk-top-in"><a class="mk-brand" id="marketHome" href="/market/"><img id="adminLogo" src="doing-logo.png" alt="LOGO"><span class="mk-brand-text"><b>DOING Market</b><small>主辦後台</small></span></a><div class="mk-top-actions"><a id="publicPreview" class="mk-btn mk-hide-mobile">前台預覽</a><a id="workspace" class="mk-btn">工作日曆</a></div></div></header><main class="mk-shell"><section class="mk-hero"><div class="mk-eyebrow">先做就對了 ✦</div><h1>市集營運中心</h1><p>照熟悉的順序工作：先看場次，再處理待辦、現場、會員與設定。</p></section><nav class="mk-tabs"><button class="mk-tab on" data-tab="sessions">場次</button><button class="mk-tab" data-tab="tasks">待辦</button><button class="mk-tab" data-tab="onsite">現場</button><button class="mk-tab" data-tab="members">會員</button><button class="mk-tab" data-tab="settings">設定</button></nav><section class="mk-panel on" id="sessions"><div class="mk-section-head"><div><h2>場次</h2><div class="mk-muted">最近的活動排前面；數字都可以直接點進對應名單。</div></div><div class="mk-toolbar"><button id="reloadSessions" class="mk-btn">重新整理</button><button id="newSession" class="mk-btn primary">建立新場次</button></div></div><div id="sessionList" class="mk-session-grid"><div class="mk-empty">正在載入場次…</div></div></section><section class="mk-panel" id="tasks"><div class="mk-section-head"><div><h2>待辦</h2><div class="mk-muted">跨場次需要處理的工作。</div></div><button id="reloadTodos" class="mk-btn">重新整理</button></div><div id="todoSummary" class="mk-kpis"></div><div id="todoList" class="mk-list"><div class="mk-empty">待辦尚未載入。</div></div></section><section class="mk-panel" id="onsite"><div class="mk-section-head"><div><h2>現場</h2><div class="mk-muted">選場次 → 搜尋品牌／姓名 → 報到。</div></div></div><div class="mk-work-cards"><article class="mk-card mk-work-card"><h3>選擇場次</h3><select id="onsiteSession" class="mk-btn" style="width:100%"><option value="">請先選場次</option></select><div class="mk-chips" style="margin-top:7px"><button class="mk-chip on" data-scope="today">當日名單</button><button class="mk-chip" data-scope="all">全部名單</button></div></article><article class="mk-card mk-work-card"><h3>搜尋名單</h3><div class="mk-search" style="margin:0"><input id="onsiteSearch" placeholder="品牌、姓名、電話"><button id="onsiteSearchBtn" class="mk-btn blue">搜尋</button></div></article></div><div id="onsiteResults" class="mk-list"><div class="mk-empty">選擇場次後開始搜尋。</div></div></section><section class="mk-panel" id="members"><div class="mk-section-head"><div><h2>會員／品牌</h2><div class="mk-muted">品牌、聯絡人、社群與歷史參與。</div></div><div class="mk-toolbar"><input id="memberSearch" placeholder="搜尋品牌、姓名、手機、Email"><button id="reloadMembers" class="mk-btn">重新整理</button></div></div><div id="memberList" class="mk-list"><div class="mk-empty">會員尚未載入。</div></div></section><section class="mk-panel" id="settings"><div class="mk-section-head"><div><h2>設定</h2><div class="mk-muted">租戶自己管理前台品牌與封面。</div></div></div><div class="mk-settings-grid"><article class="mk-card mk-setting-card"><h3>前台品牌</h3><div class="mk-field"><label>LOGO 圖片網址</label><input id="brandLogo" placeholder="https://..."><label>封面圖片網址</label><input id="brandHero" placeholder="https://..."><label>前台介紹</label><textarea id="brandIntro"></textarea><button id="saveBrand" class="mk-btn primary">儲存前台設定</button></div></article><article class="mk-card mk-setting-card"><h3>常用入口</h3><div class="mk-field"><a id="settingsPublic" class="mk-btn blue">查看前台</a><button id="settingsSessions" class="mk-btn">回場次</button></div></article></div></section></main><dialog id="sessionDialog" style="border:0;padding:0;background:transparent;max-width:min(680px,calc(100vw - 24px));width:100%"><form method="dialog" class="mk-card" style="padding:14px"><div class="mk-section-head"><div><h2>建立新場次</h2><div class="mk-muted">先建立基本資料，其他細節可進單場工作台繼續設定。</div></div><button value="cancel" class="mk-btn">關閉</button></div><div class="mk-settings-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="mk-field"><label>場次名稱</label><input id="newName" required><label>地點</label><input id="newVenue"><label>基本費用</label><input id="newFee" type="number" min="0" value="0"></div><div class="mk-field"><label>活動日期</label><input id="newDate" type="date"><label>名額</label><input id="newLimit" type="number" min="0" value="0"><label>是否需要審核</label><select id="newReview"><option value="yes">需要審核</option><option value="no">免審核</option></select></div></div><div class="mk-card-actions" style="margin-top:10px"><button id="createSession" type="button" class="mk-btn primary">建立場次</button><button value="cancel" class="mk-btn">取消</button></div></form></dialog><script>'use strict';const API='https://tobeloved-api.ndiangrace.workers.dev',P=new URL(location.href).searchParams,T=(P.get('tenant')||'').trim().toLowerCase(),TOKEN=P.get('admin_token')||P.get('token')||'',S={sessions:[],todos:[],members:[],scope:'today'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function route(path,extra={}){const u=new URL(path,location.origin);if(T)u.searchParams.set('tenant',T);if(TOKEN)u.searchParams.set('admin_token',TOKEN);Object.entries(extra).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,String(v)));return u.toString()}async function api(action,extra={},post=false){const u=new URL(API);u.searchParams.set('action',action);if(T)u.searchParams.set('tenant',T);if(TOKEN)u.searchParams.set('token',TOKEN);let opt={cache:'no-store'};if(post)opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tenant:T,token:TOKEN,...extra})};else Object.entries(extra).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,String(v)));const r=await fetch(u,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.error)throw Error(d.error||'操作失敗');return d.data??d.result??d}function sid(x){return String(x?.id||x?.sessionId||x?.session_id||'')}function sname(x){return String(x?.name||x?.title||x?.sessionName||'未命名場次')}function sdate(x){const d=x?.date||x?.start_date||x?.startDate||(Array.isArray(x?.dates)&&x.dates[0]);return typeof d==='object'?String(d.date||d.label||''):String(d||'')}function time(x){const t=Date.parse(sdate(x));return Number.isFinite(t)?t:Number.POSITIVE_INFINITY}function n(x,...ks){for(const k of ks){const v=Number(x?.[k]);if(Number.isFinite(v))return v}return 0}function openSession(id,focus='',tab=''){const extra={sessionId:id};if(focus)extra.focus=focus;if(tab)extra.tab=tab;location.href=route('/market/session/',extra)}function card(s){const id=sid(s);return `<article class="mk-card mk-session-card"><div class="mk-session-head"><div><h3>${esc(sname(s))}</h3><div class="mk-session-meta">${esc(sdate(s)||'日期待設定')} ${s.venue?'｜'+esc(s.venue):''}</div></div><span class="mk-tag">${esc(s.status||'')}</span></div><div class="mk-metrics"><button class="mk-metric" data-open="all" data-id="${esc(id)}"><b>${n(s,'registrationCount','totalRegistrations','total')}</b><small>報名</small></button><button class="mk-metric" data-open="pending" data-id="${esc(id)}"><b>${n(s,'pendingCount','pendingReview','pending')}</b><small>待審核</small></button><button class="mk-metric" data-open="unpaid" data-id="${esc(id)}"><b>${n(s,'unpaidCount','unpaid')}</b><small>待繳費</small></button><button class="mk-metric" data-open="paid" data-id="${esc(id)}"><b>${n(s,'paidCount','paid')}</b><small>已繳費</small></button></div><div class="mk-card-actions"><button class="mk-btn blue" data-work="${esc(id)}">進入工作台</button><button class="mk-btn" data-onsite="${esc(id)}">現場</button></div></article>`}function wireSessionCards(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const f=b.dataset.open;openSession(b.dataset.id,f,f==='pending'||f==='all'?'registrations':'payments')});document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>openSession(b.dataset.work));document.querySelectorAll('[data-onsite]').forEach(b=>b.onclick=()=>{openTab('onsite');$('onsiteSession').value=b.dataset.onsite;loadOnsite()})}async function loadSessions(){if(!T||!TOKEN){$('sessionList').innerHTML='<div class="mk-empty">請先從 DOING 登入後進入 Market。</div>';return}try{const d=await api('getSessionsAdmin');S.sessions=(Array.isArray(d)?d:(d.sessions||d.rows||[])).sort((a,b)=>time(a)-time(b));$('sessionList').innerHTML=S.sessions.length?S.sessions.map(card).join(''):'<div class="mk-empty">目前沒有場次。</div>';$('onsiteSession').innerHTML='<option value="">請先選場次</option>'+S.sessions.map(s=>`<option value="${esc(sid(s))}">${esc(sname(s))}</option>`).join('');wireSessionCards()}catch(e){$('sessionList').innerHTML='<div class="mk-empty">場次載入失敗：'+esc(e.message)+'</div>'}}function todoKind(r){const t=[r.kind,r.type,r.stage,r.status,r.title,r.label].filter(Boolean).join(' ').toLowerCase();if(/付款|繳費|payment|unpaid/.test(t))return'payment';if(/退款|退費|refund/.test(t))return'refund';if(/審核|候補|錄取|review|pending/.test(t))return'review';if(/報到|現場|checkin/.test(t))return'onsite';return'other'}async function loadTodos(){try{const d=await api('getTodos');S.todos=Array.isArray(d)?d:(d.rows||d.items||[]);const g={review:0,payment:0,refund:0,onsite:0,other:0};S.todos.forEach(r=>g[todoKind(r)]++);$('todoSummary').innerHTML=Object.entries(g).map(([k,v])=>`<div class="mk-metric"><b>${v}</b><small>${({review:'審核',payment:'付款',refund:'退款',onsite:'現場',other:'其他'})[k]}</small></div>`).join('');$('todoList').innerHTML=S.todos.length?S.todos.map(r=>`<button class="mk-row" data-todo-session="${esc(r.sessionId||r.session_id||'')}" data-todo-kind="${todoKind(r)}" style="width:100%;text-align:left"><div><b>${esc(r.title||r.label||r.name||'待處理事項')}</b><small>${esc(r.sessionName||'')}</small></div><span class="mk-tag">處理</span></button>`).join(''):'<div class="mk-empty">目前沒有待辦。</div>';document.querySelectorAll('[data-todo-session]').forEach(b=>b.onclick=()=>{const id=b.dataset.todoSession,k=b.dataset.todoKind;if(!id)return;openSession(id,k==='review'?'pending':k==='payment'?'unpaid':'',k==='review'?'registrations':k==='payment'?'payments':k==='onsite'?'onsite':'overview')})}catch(e){$('todoList').innerHTML='<div class="mk-empty">'+esc(e.message)+'</div>'}}async function loadMembers(){try{const d=await api('getMembers');S.members=Array.isArray(d)?d:(d.rows||d.members||[]);renderMembers()}catch(e){$('memberList').innerHTML='<div class="mk-empty">'+esc(e.message)+'</div>'}}function renderMembers(){const q=$('memberSearch').value.trim().toLowerCase(),rows=S.members.filter(r=>!q||[r.brand,r.brandName,r.name,r.phone,r.mobile,r.email].filter(Boolean).join(' ').toLowerCase().includes(q));$('memberList').innerHTML=rows.length?rows.map(r=>`<article class="mk-row"><div><b>${esc(r.brand||r.brandName||r.name||'會員')}</b><small>${esc(r.name||'')} ${r.phone?'｜'+esc(r.phone):''} ${r.email?'｜'+esc(r.email):''}</small></div></article>`).join(''):'<div class="mk-empty">沒有符合的會員。</div>'}async function loadOnsite(){const id=$('onsiteSession').value;if(!id){$('onsiteResults').innerHTML='<div class="mk-empty">請先選場次。</div>';return}try{const d=await api('getSessionRegistrations',{sessionId:id,scope:S.scope}),rows=Array.isArray(d)?d:(d.rows||d.registrations||[]),q=$('onsiteSearch').value.trim().toLowerCase(),show=rows.filter(r=>!q||[r.brand,r.brandName,r.name,r.phone,r.mobile].filter(Boolean).join(' ').toLowerCase().includes(q));$('onsiteResults').innerHTML=show.length?show.map(r=>`<article class="mk-row"><div><b>${esc(r.brand||r.brandName||r.name||'報名')}</b><small>${esc(r.name||'')}｜${esc(r.phone||r.mobile||'')}</small></div><button class="mk-btn mint" data-checkin="${esc(r.id||r.regId||r.registrationId||'')}">${/已報到/.test(String(r.checkinStatus||r.checkin||''))?'已報到':'一鍵報到'}</button></article>`).join(''):'<div class="mk-empty">沒有符合的名單。</div>';document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=async()=>{if(b.textContent==='已報到')return;b.disabled=true;try{await api('checkin',{regId:b.dataset.checkin,sessionId:id},true);await loadOnsite();await loadSessions()}catch(e){alert(e.message)}finally{b.disabled=false}})}catch(e){$('onsiteResults').innerHTML='<div class="mk-empty">'+esc(e.message)+'</div>'}}async function loadBrand(){if(!T)return;try{const c=await api('getSiteConfig');$('brandLogo').value=c.logoUrl||'';$('brandHero').value=c.heroImg||'';$('brandIntro').value=c.infoText||'';if(c.logoUrl)$('adminLogo').src=c.logoUrl}catch(_){}}async function saveBrand(){const b=$('saveBrand');b.disabled=true;try{await api('saveSiteConfig',{logoUrl:$('brandLogo').value.trim(),heroImg:$('brandHero').value.trim(),infoText:$('brandIntro').value.trim()},true);alert('前台設定已儲存。')}catch(e){alert(e.message)}finally{b.disabled=false}}function openTab(id){document.querySelectorAll('.mk-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));document.querySelectorAll('.mk-panel').forEach(p=>p.classList.toggle('on',p.id===id));sessionStorage.setItem('doing-market-tab',id);if(id==='tasks')loadTodos();if(id==='members')loadMembers();if(id==='settings')loadBrand()}document.querySelectorAll('.mk-tab').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));$('reloadSessions').onclick=loadSessions;$('reloadTodos').onclick=loadTodos;$('reloadMembers').onclick=loadMembers;$('memberSearch').oninput=renderMembers;$('onsiteSearchBtn').onclick=loadOnsite;$('onsiteSearch').oninput=loadOnsite;$('onsiteSession').onchange=loadOnsite;document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('on',x===b));loadOnsite()});$('workspace').href=route('/workspace/');$('publicPreview').href=route('/market/public/');$('settingsPublic').href=route('/market/public/');$('settingsSessions').onclick=()=>openTab('sessions');$('saveBrand').onclick=saveBrand;$('newSession').onclick=()=>$('sessionDialog').showModal();$('createSession').onclick=async()=>{const b=$('createSession'),name=$('newName').value.trim();if(!name){alert('請填場次名稱');return}b.disabled=true;try{const body={name,venue:$('newVenue').value.trim(),fee:Number($('newFee').value)||0,limit:Number($('newLimit').value)||0,needReview:$('newReview').value==='yes',dates:$('newDate').value?[{date:$('newDate').value,label:$('newDate').value}]:[],status:'關閉'};const r=await api('createSession',body,true),id=String(r.id||r.session?.id||'');$('sessionDialog').close();await loadSessions();if(id)openSession(id,'','overview')}catch(e){alert(e.message)}finally{b.disabled=false}};window.addEventListener('pageshow',()=>loadSessions());loadSessions();const initial=P.get('tab')||sessionStorage.getItem('doing-market-tab')||'sessions';openTab(['sessions','tasks','onsite','members','settings'].includes(initial)?initial:'sessions');</script></body></html>
