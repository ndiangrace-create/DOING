<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DOING｜智慧申請 UAT v6</title>
<style>
:root{--bg:#f6faf9;--paper:#fff;--ink:#25343d;--muted:#687880;--line:#dfe9e7;--main:#4f8f9d;--mint:#eaf5f1;--sky:#edf5f8;--soft:#f9fbfb;--warn:#fff8e8;--shadow:0 14px 34px rgba(49,73,82,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.top img{width:40px;height:40px;object-fit:contain}.top b{font-size:18px}.badge{margin-left:auto;background:var(--mint);padding:6px 9px;border-radius:9px;color:#315e5a;font-size:12px;font-weight:900}.shell{max-width:980px;margin:auto;padding:16px 14px 72px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px}.hero small{font-weight:900;color:var(--main)}.hero h1{font-size:clamp(28px,5vw,43px);margin:6px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.7}.progress{display:flex;gap:6px;margin:14px 0}.progress i{height:7px;flex:1;background:#dfe7e6;border-radius:999px}.progress i.on{background:var(--main)}.card{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:24px}.head p{margin:5px 0 0;color:var(--muted);line-height:1.6}.count{white-space:nowrap;background:var(--sky);padding:7px 10px;border-radius:9px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:74px}.choice:has(input:checked){border-color:#9bc5cc;background:#f1f8f9}.choice input{width:21px;height:21px;margin-top:1px;accent-color:var(--main)}.choice b{display:block}.choice span span{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:4px}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:82px;resize:vertical}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--main);color:#fff}.btn.good{background:#315e5a;color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}.hint{font-size:13px;color:var(--muted)}.summary{display:grid;gap:12px}.summarybox{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--soft);line-height:1.75}.summarybox b{display:block;margin-bottom:6px}.painextras{margin-top:14px}.result{display:grid;gap:14px}.profile{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.profile h2{margin:0 0 8px;font-size:26px}.profile p{margin:0;color:var(--muted);line-height:1.7}.meterbox{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.meterbox h3{margin:0 0 14px}.meters{display:grid;gap:12px}.meterrow{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center}.track{height:12px;background:#edf2f2;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--main);border-radius:999px}.meterrow b{font-size:14px}.meterrow span{font-size:13px;color:var(--muted);text-align:right}.helpers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.helper{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;min-height:135px}.helper strong{font-size:18px;display:block;margin-bottom:7px}.helper p{margin:0;color:var(--muted);line-height:1.6}.details{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.details button{width:100%;border:0;background:#fff;padding:15px 16px;text-align:left;font-weight:900;cursor:pointer}.details .inside{display:none;padding:0 16px 16px;color:var(--muted);line-height:1.7}.details.open .inside{display:block}.confirm{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--mint)}.confirm h3{margin:0 0 8px}.warning{background:var(--warn);border-radius:12px;padding:11px 12px;line-height:1.55}.done{padding:18px;border-radius:16px;background:var(--mint);line-height:1.75}@media(max-width:700px){.choices,.helpers{grid-template-columns:1fr}.meterrow{grid-template-columns:92px 1fr 28px}.actions .btn{flex:1}.hero,.card{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><img src="doing-logo.png" alt="DOING"><b>智慧申請 UAT v6</b><span class="badge">分析體驗版｜不建立租戶</span></div></header>
<main class="shell"><section class="hero"><small>像心理測驗，但最後是實際工作規劃</small><h1>先讓 DOING 讀懂你，再告訴你會得到什麼幫助。</h1><p>這一版減少大量格子，結果改成白話分析、工作重心圖與少量大卡片。細節需要時再展開。</p></section><div id="progress" class="progress"></div><section id="stage" class="card"></section></main>
<script>
'use strict';
const state={step:0,works:new Set(),pains:new Set(),extras:new Set(),otherWork:'',otherPain:'',confirmedPain:false};
const works=[['beauty','美容美髮／美甲／按摩／SPA','需要安排服務時間的個人服務'],['course','自己開課／手作／教學','有日期、名額或多人一起參加'],['event','自己辦活動／講座／展演','我是主辦，不只是去參加'],['market','自己辦市集／招募攤商','需要管理品牌、付款或現場安排'],['vendor','擺攤／餐車／參加別人的市集','我是參加者，不是主辦'],['consign','百貨寄賣／通路合作','商品寄放在別人的場域販售，再做抽成或結算'],['commerce','團購／代購／商品販售','需要整理商品、訂單、數量或取貨'],['project','設計／網站／婚禮／接案','接到需求後持續一段時間完成'],['construction','室內設計／裝修／工程','會有設計、施工、驗收等階段'],['guide','導覽／帶團／戶外體驗','可能受天氣、潮汐、場地或成團人數影響'],['rental','場地／教室／設備出租','時間和資源不能重複使用'],['home','到府／照護／維修服務','到客戶指定地點工作'],['other','其他工作','找不到適合的再補充']];
const pains=[['schedule','不要再一直私訊喬時間'],['calendar','不同工作的行程想放在一起'],['payment','付款、訂金、對帳很分散'],['registration','報名、名單、通知常常分開'],['customer','客人資料和回訪不好整理'],['position','排位、座位或攤位很花時間'],['inventory','商品、庫存、寄賣數量不好追'],['settlement','抽成、分潤、通路結算不好對'],['condition','天氣、潮汐、場地等成行條件很麻煩'],['projectflow','專案階段、進度、驗收不好追'],['team','團隊分工、排班、權限很亂'],['files','照片、檔案、附件常常找不到'],['finance','想知道每份工作真正賺多少'],['checkin','現場報到／核銷很花時間']];
const extraPains=[['repeat','常常重複整理相同資料'],['remind','常常忘記提醒或要一直手動通知'],['change','臨時改期／取消時很難處理'],['progress','團隊或客人常不知道現在做到哪'],['scattered','資料散在 LINE、Excel、筆記或不同 App'],['other','還有其他沒有列到的麻煩']];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function progress(){ $('progress').innerHTML=[0,1,2,3].map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('') }
function cards(items,set){return '<div class="choices">'+items.map(([k,t,d])=>`<label class="choice"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}><span><b>${t}</b>${d?`<span>${d}</span>`:''}</span></label>`).join('')+'</div>'}
function bind(set){document.querySelectorAll('#stage input[type=checkbox]').forEach(x=>x.onchange=()=>x.checked?set.add(x.value):set.delete(x.value))}
function nav(next='下一步 →'){return `<div class="actions">${state.step?'<button class="btn alt" id="back">← 上一步</button>':'<span></span>'}<span class="hint">只勾真的有發生的。</span><button class="btn primary" id="next">${next}</button></div>`}
function workText(){const labels=works.filter(x=>state.works.has(x[0])).map(x=>x[1]);return labels.length?labels.join('、'):'你目前的工作';}
function painText(){const labels=[...pains.filter(x=>state.pains.has(x[0])).map(x=>x[1]),...extraPains.filter(x=>state.extras.has(x[0])).map(x=>x[1])];return labels.length?labels.join('、'):'目前沒有特別指定';}
function scores(){const s={時間安排:10,收款對帳:10,現場管理:8,顧客管理:8,商品寄賣:5,專案進度:5};const P=state.pains,W=state.works,E=state.extras;const bump=(k,n)=>s[k]=Math.min(100,s[k]+n);if(P.has('schedule')||P.has('calendar'))bump('時間安排',65);if(P.has('payment')||P.has('finance'))bump('收款對帳',65);if(P.has('registration')||P.has('position')||P.has('checkin'))bump('現場管理',60);if(P.has('customer'))bump('顧客管理',70);if(P.has('inventory')||P.has('settlement')||W.has('consign')||W.has('commerce'))bump('商品寄賣',70);if(P.has('projectflow')||W.has('project')||W.has('construction'))bump('專案進度',70);if(P.has('condition')||W.has('guide'))bump('時間安排',20);if(E.has('scattered'))Object.keys(s).forEach(k=>bump(k,10));return s;}
function helperCards(){const W=state.works,P=state.pains,out=[];const add=(t,d)=>{if(!out.some(x=>x[0]===t))out.push([t,d])};if(P.has('calendar')||P.has('schedule'))add('工作總日曆','把預約、活動、專案、寄賣或其他工作排在同一個地方，不用重複手動新增。');if(W.has('beauty')||W.has('home')||W.has('rental'))add('預約與時間安排','讓客人看可用時間、安排服務時段，也能避免人員或場地撞期。');if(W.has('market')||W.has('event')||W.has('course'))add('報名與現場整理','收報名、確認名單、通知參加者，需要時也能處理審核、排位或報到。');if(W.has('consign')||W.has('commerce'))add('商品與寄賣整理','記錄商品、庫存、上架、售出、退回，以及寄賣或通路後續結算。');if(P.has('payment')||P.has('finance')||P.has('settlement'))add('收款與對帳','把不同工作的收款、訂金、抽成、應收與損益集中整理。');if(W.has('project')||W.has('construction'))add('專案進度整理','把案件階段、照片、檔案、交接、收款與驗收放在同一份工作裡。');if(W.has('guide')||P.has('condition'))add('成行與異動提醒','遇到天氣、潮汐、場地或最低人數等條件時，可以一起管理確認、改期和通知。');if(P.has('customer'))add('顧客與回訪','保留客人過去紀錄、偏好與回訪資訊，不用每次重新找資料。');if(P.has('team'))add('團隊協作','讓不同工作人員各自處理需要的事情，排班和權限不再混在一起。');if(P.has('files'))add('照片與檔案整理','照片、附件與工作紀錄跟著同一份工作保存，之後找得到。');if(!out.length)add('整合工作空間','先把你不同工作的時間、資料和待辦集中整理，之後再依使用情況調整。');return out.slice(0,5);}
function profileTitle(){const W=state.works;const tags=[];if(W.has('beauty')||W.has('home')||W.has('rental'))tags.push('服務型');if(W.has('market')||W.has('event'))tags.push('主辦型');if(W.has('course')||W.has('guide'))tags.push('教學／帶領型');if(W.has('consign')||W.has('commerce')||W.has('vendor'))tags.push('販售／通路型');if(W.has('project')||W.has('construction'))tags.push('專案型');return tags.length?`你是「${tags.join('＋')}」工作組合`:'你有一組跨工作型態的工作方式';}
function render(){progress();const s=$('stage');if(state.step===0){s.innerHTML=`<div class="head"><div><h2>你現在同時在做哪些工作？</h2><p>可以多選。這不是要分類你，而是幫 DOING 理解你真正的工作組合。</p></div><span class="count">${state.works.size} 項</span></div>${cards(works,state.works)}<div class="field"><label>其他工作補充（選填）</label><textarea id="otherWork" placeholder="例如：平日正職，假日另外做團購"></textarea></div>${nav()}`;bind(state.works);$('otherWork').value=state.otherWork;$('otherWork').oninput=e=>state.otherWork=e.target.value;}
 else if(state.step===1){s.innerHTML=`<div class="head"><div><h2>你現在最想先改善哪些麻煩？</h2><p>先講困擾，不用想功能名稱。</p></div><span class="count">${state.pains.size} 項</span></div>${cards(pains,state.pains)}${nav('讓 DOING 整理看看 →')}`;bind(state.pains);}
 else if(state.step===2){s.innerHTML=`<div class="head"><div><h2>我先確認有沒有真的懂你</h2><p>先確認工作和痛點，再談之後會幫你準備什麼。</p></div></div><div class="summary"><div class="summarybox"><b>我理解你的工作是：</b>${esc(workText())}${state.otherWork?'；另外你補充：'+esc(state.otherWork):''}。</div><div class="summarybox"><b>你目前最想改善的是：</b>${esc(painText())}。</div></div><div class="painextras"><h3>還有其他讓你很麻煩、也希望一起改善的事情嗎？</h3>${cards(extraPains,state.extras)}<div class="field"><label>還想補充什麼？（選填）</label><textarea id="otherPain" placeholder="用自己的話補充就可以"></textarea></div></div><div class="actions"><button class="btn alt" id="back">← 修改前面</button><button class="btn good" id="confirmPain">對，這些就是我的問題 →</button></div>`;bind(state.extras);$('otherPain').value=state.otherPain;$('otherPain').oninput=e=>state.otherPain=e.target.value;}
 else if(state.step===3){const sc=scores(),helpers=helperCards();s.innerHTML=`<div class="result"><div class="profile"><small>DOING 對你的工作理解</small><h2>${esc(profileTitle())}</h2><p>你不是只有一種工作。DOING 會把不同工作分開整理，但把時間、收款、資料與提醒集中在一起。</p></div><div class="meterbox"><h3>你的工作重心分析</h3><div class="meters">${Object.entries(sc).map(([k,v])=>`<div class="meterrow"><b>${k}</b><div class="track"><div class="fill" style="width:${v}%"></div></div><span>${v}</span></div>`).join('')}</div></div><div><h3>依照你的需求，DOING 會先幫你準備這些幫手</h3><div class="helpers">${helpers.map(([t,d])=>`<div class="helper"><strong>${esc(t)}</strong><p>${esc(d)}</p></div>`).join('')}</div></div><div class="details" id="details"><button id="toggleDetails">看完整規劃 ▾</button><div class="inside"><b>你的工作：</b>${esc(workText())}<br><b>主要痛點：</b>${esc(painText())}${state.otherPain?'<br><b>你的補充：</b>'+esc(state.otherPain):''}<br><br>正式流程中，這些內容會轉成申請設定送平台核准；使用者不需要看到內部系統名稱。</div></div><div class="confirm"><h3>這樣的理解和規劃符合你嗎？</h3><p>確認後，正式版才會把這份規劃轉成你的申請設定。</p><div class="actions"><button class="btn good" id="yes">✓ 對，就是這樣</button><button class="btn alt" id="more">我還想補充</button><button class="btn alt" id="wrong">有些地方不對</button></div></div><div class="warning">UAT 目前只模擬確認，不建立租戶、不送出正式申請。</div></div>`;}
 if($('next'))$('next').onclick=()=>{if(state.step===0&&!state.works.size)return alert('請至少選一種工作');state.step++;render();};if($('back'))$('back').onclick=()=>{state.step=Math.max(0,state.step-1);render();};if($('confirmPain'))$('confirmPain').onclick=()=>{state.confirmedPain=true;state.step=3;render();};if($('toggleDetails'))$('toggleDetails').onclick=()=>$('details').classList.toggle('open');if($('more'))$('more').onclick=()=>{state.step=2;render();};if($('wrong'))$('wrong').onclick=()=>{state.step=0;render();};if($('yes'))$('yes').onclick=()=>{s.innerHTML='<div class="done"><b>確認完成。</b><br>正式流程中，這一步之後才會把你剛剛確認的工作與痛點轉成申請設定並送平台核准。<br><span class="hint">UAT 不建立租戶、不寫正式申請。</span><div class="actions"><button class="btn alt" id="restart">重新測一次</button></div></div>';$('restart').onclick=()=>location.reload();}}
render();
</script>
</body>
</html>
