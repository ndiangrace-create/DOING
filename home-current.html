<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8fb">
  <meta name="description" content="DOING 斜槓人生小幫手：目前提供市集活動、室內設計進度、美類預約三種工作系統。">
  <title>DOING｜斜槓人生小幫手</title>
  <link rel="stylesheet" href="/doing-home-v4.css?v=20260825-ready1">
</head>
<body>
  <div class="watercolor-surface" aria-hidden="true"></div>

  <header class="topbar">
    <nav class="top-actions" aria-label="帳號與申請">
      <a class="top-button top-button-apply" href="/apply/">申請使用</a>
      <a class="top-button top-button-login" href="/me/">租戶登入</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-logo" src="/doing-logo-current.webp?v=20260825-ready2" alt="DOING 營運管理系統">
      <p class="tagline"><span aria-hidden="true">♥</span> 斜槓人生小幫手 <span aria-hidden="true">♥</span></p>
      <h1 id="hero-title">選一套適合你的工作系統，直接開始整理每天要做的事</h1>
      <p class="hero-copy">目前先開放三種系統。看你正在做哪一種工作，就從那一套開始。</p>
    </section>

    <section class="system-grid" aria-label="目前開放的三種系統">
      <article class="system-card market-card">
        <div class="card-title-row">
          <div class="system-icon" aria-hidden="true">🏪</div>
          <div>
            <h2>市集活動系統</h2>
            <div class="dot-row" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <span class="sparkle" aria-hidden="true">✦</span>
        </div>
        <p>報名、審核、付款、排位、通知、現場與結案。</p>
        <a class="system-action" href="/apply/?system=market">申請市集活動系統 <span aria-hidden="true">→</span></a>
      </article>

      <article class="system-card project-card">
        <div class="card-title-row">
          <div class="system-icon" aria-hidden="true">🛋️</div>
          <div>
            <h2>室內設計進度系統</h2>
            <div class="dot-row" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <span class="sparkle" aria-hidden="true">✦</span>
        </div>
        <p>專案進度、階段、照片、報價、付款、支出與驗收。</p>
        <a class="system-action" href="/apply/?system=project">申請室內設計系統 <span aria-hidden="true">→</span></a>
      </article>

      <article class="system-card booking-card">
        <div class="card-title-row">
          <div class="system-icon" aria-hidden="true">💄</div>
          <div>
            <h2>美類預約系統</h2>
            <div class="dot-row" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <span class="sparkle" aria-hidden="true">✦</span>
        </div>
        <p>服務項目、可預約時段、人員排班、顧客預約與提醒。</p>
        <a class="system-action" href="/apply/?system=booking">申請美類預約系統 <span aria-hidden="true">→</span></a>
      </article>
    </section>

    <section id="support" class="support-note" aria-label="線上客服">
      <strong>不知道該申請哪一套？</strong>
      <span>直接告訴我們你現在怎麼工作，再一起確認適合哪一套。</span>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主要導覽">
    <a class="jelly green" href="/market/public/"><span aria-hidden="true">▣</span>報名活動</a>
    <a class="jelly purple" href="/me/"><span aria-hidden="true">♙</span>我的 DOING</a>
    <a class="jelly yellow" href="#support"><span aria-hidden="true">◌</span>線上客服</a>
  </nav>
</body>
</html>
