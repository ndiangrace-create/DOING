<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DOING｜活動拍照</title><style>
:root{--bg:#f7faf9;--paper:#fff;--ink:#20302f;--muted:#6f7e7c;--line:#dfe9e6;--main:#68b9bb;--shadow:0 18px 46px rgba(24,77,72,.13);--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;line-height:1.55}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 14px calc(28px + var(--safe))}.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.title{font-size:28px;line-height:1.25;margin:0 0 8px}.content{white-space:pre-wrap;color:var(--muted)}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#dff2ee;font-weight:900;margin:6px 6px 0 0}.frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.frame-choice{border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px}.frame-choice.active{border-color:var(--main);box-shadow:0 0 0 3px rgba(104,185,187,.18)}.frame-choice img{width:100%;aspect-ratio:9/16;object-fit:contain;background:#f3f5f4;border-radius:10px}.frame-choice b{display:block;margin-top:5px}.camera{position:relative;aspect-ratio:9/16;max-height:76vh;overflow:hidden;border-radius:24px;background:#111;margin:auto}.camera video,.camera img{position:absolute;inset:0;width:100%;height:100%}.camera .bg{object-fit:cover;filter:blur(22px) brightness(.62);transform:scale(1.12) scaleX(-1)}.camera .main{object-fit:contain;transform:scaleX(-1);z-index:2}.camera .frame{object-fit:contain;z-index:3;pointer-events:none}.camera .guide{position:absolute;z-index:4;inset:7% 5% 10%;border:1px dashed rgba(255,255,255,.65);border-radius:22px;pointer-events:none}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:999px;background:var(--main);color:#fff;padding:12px 18px;min-height:46px;font-weight:900;flex:1;text-align:center;text-decoration:none}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:900}.field input{border:1px solid var(--line);border-radius:13px;padding:11px}.hidden{display:none!important}.result{width:100%;border-radius:20px;display:block}.notice{background:#fff5cf;border-radius:15px;padding:11px 13px;font-weight:800;margin-top:10px}@media(max-width:620px){.wrap{padding:10px}.card{border-radius:19px;padding:14px}.title{font-size:24px}.form{grid-template-columns:1fr}}</style>
<style id="doing-accessible-type-system">
/* DOING 全系統老花友善字級基準
   正文/控制項 17-18px；小字最低 16px；手機不縮字，只改版面。 */
html{font-size:18px!important;-webkit-text-size-adjust:100%!important}
body{font-size:18px!important;line-height:1.7!important}
button,input,select,textarea{font:inherit!important;font-size:17px!important;line-height:1.45!important}
button,.btn,[role="button"]{min-height:44px!important;padding-top:10px!important;padding-bottom:10px!important}
input,select,textarea{min-height:46px!important;padding:10px 12px!important}
label{font-size:17px!important;line-height:1.5!important}

  font-size:16px!important;
  line-height:1.55!important;
}
h1{font-size:clamp(36px,4vw,58px)!important;line-height:1.16!important}
h2{font-size:clamp(28px,2.5vw,38px)!important;line-height:1.22!important}
h3{font-size:22px!important;line-height:1.3!important}

table,th,td{font-size:17px!important;line-height:1.5!important}
a{font-size:inherit}
::placeholder{font-size:16px!important;opacity:.78!important}
@media(max-width:760px){
  html,body{font-size:17px!important}
  button,input,select,textarea,label{font-size:17px!important}
  small,.small,.sub,.muted,.hint,.help,.desc,.eyebrow,.meta,.note{font-size:16px!important}
}
</style>

<link rel="stylesheet" href="doing-system.css?v=20260815-system">
</head><body class="doing-app doing-photo"><main class="wrap"><div class="actions" style="justify-content:flex-start;margin-bottom:12px"><button class="btn alt" id="photoReturnBtn" type="button">← 返回活動頁</button></div>
<section class="card"><h1 class="title" id="pageTitle">活動拍照</h1><div class="content" id="pageContent">載入中…</div><div id="tags"></div><div class="notice hidden" id="reward"></div></section>
<section class="card hidden" id="frameCard"><h2 style="margin-top:0">選擇拍照框</h2><div class="frame-grid" id="frameGrid"></div><div class="actions"><button class="btn" id="useFrameBtn">使用這個框</button></div></section>
<section class="card hidden" id="cameraCard"><div class="camera"><video id="videoBg" class="bg" autoplay muted playsinline></video><video id="video" class="main" autoplay muted playsinline></video><img id="frame" class="frame" alt="活動拍照框"><div class="guide"></div></div><div class="hint">使用一般手機自拍距離，可拍到胸口並容納兩人；不做數位放大或二次裁切。</div><div class="actions"><button class="btn alt" id="chooseBtn" type="button">換框</button><button class="btn alt" id="switchBtn" type="button">切換鏡頭</button><button class="btn" id="shootBtn" type="button">拍照</button></div></section>
<section class="card" id="leadCard"><div class="form"><div class="field"><label>姓名或暱稱</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>手機（選填）</label><input id="phone"></div><div class="field"><label>從哪裡知道活動（選填）</label><input id="source"></div></div></section>
<section class="card hidden" id="resultCard"><img id="result" class="result"><div class="actions"><button class="btn alt" id="againBtn">重拍</button><a class="btn" id="downloadBtn" download="DOING活動拍照.png">儲存照片</a></div></section></main><canvas id="canvas" width="1080" height="1920" class="hidden"></canvas><script>
const API='https://tobeloved-api.ndiangrace.workers.dev',$=id=>document.getElementById(id);let stream=null,front=true,activity=null,frames=[],selected=null;const q=new URL(location.href).searchParams,tenant=(q.get('tenant')||'').trim(),slug=(q.get('pf')||'').trim();
function photoReturnUrl(){if(q.get('from')==='admin'&&tenant)return 'admin.html?tenant='+encodeURIComponent(tenant);if(tenant)return 'register.html?tenant='+encodeURIComponent(tenant);return 'index.html'}
function stopPhotoCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$('photoReturnBtn').onclick=()=>{stopPhotoCamera();location.href=photoReturnUrl()};
async function apiGet(action,p={}){const u=new URL(API);u.searchParams.set('action',action);if(tenant)u.searchParams.set('tenant',tenant);Object.entries(p).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'讀取失敗');return d}async function apiPost(action,b={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tenant,...b})}),d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'操作失敗');return d}
async function load(){try{const d=await apiGet('getPhotoActivityBySlug',{slug});activity=d.activity;frames=d.frames||[];$('pageTitle').textContent=activity.pageTitle||activity.name;$('pageContent').textContent=activity.pageContent||'';if(activity.hashtag)$('tags').innerHTML='<span class="badge">'+activity.hashtag.replace(/</g,'&lt;')+'</span>';if(activity.rewardText){$('reward').textContent=activity.rewardText;$('reward').classList.remove('hidden')}selected=frames.find(f=>f.id===activity.defaultFrameId)||frames[0];renderFrames();if(activity.frameMode==='multiple'&&frames.length>1)$('frameCard').classList.remove('hidden');else await enterCamera()}catch(e){$('pageContent').textContent=e.message;$('leadCard').classList.add('hidden')}}
function renderFrames(){$('frameGrid').innerHTML=frames.map(f=>'<button type="button" class="frame-choice '+(selected&&selected.id===f.id?'active':'')+'" data-id="'+f.id+'"><img src="'+f.frameUrl+'"><b>'+String(f.name||'拍照框').replace(/</g,'&lt;')+'</b></button>').join('');document.querySelectorAll('.frame-choice').forEach(x=>x.onclick=()=>{selected=frames.find(f=>f.id===x.dataset.id);renderFrames()})}
async function enterCamera(){if(!selected)return;$('frame').src=selected.frameUrl;$('frameCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');await startCamera()}
async function startCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:front?'user':'environment'},width:{ideal:2560},height:{ideal:1440},resizeMode:'none'}});$('video').srcObject=stream;$('videoBg').srcObject=stream;await Promise.all([$ ('video').play(),$('videoBg').play()])}
$('useFrameBtn').onclick=enterCamera;$('chooseBtn').onclick=()=>{$('cameraCard').classList.add('hidden');$('frameCard').classList.remove('hidden')};$('switchBtn').onclick=async()=>{front=!front;await startCamera()};
function drawCover(ctx,v,w,h){const sw=v.videoWidth,sh=v.videoHeight,s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;let dx=(w-dw)/2,dy=(h-dh)/2;ctx.save();if(front){ctx.translate(w,0);ctx.scale(-1,1);dx=-dx-dw}ctx.filter='blur(28px) brightness(.65)';ctx.drawImage(v,dx,dy,dw,dh);ctx.restore();ctx.filter='none'}function drawContain(ctx,v,w,h){const sw=v.videoWidth,sh=v.videoHeight,s=Math.min(w/sw,h/sh),dw=sw*s,dh=sh*s,dx=(w-dw)/2,dy=(h-dh)/2;ctx.save();if(front){ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(v,-dx-dw,dy,dw,dh)}else ctx.drawImage(v,dx,dy,dw,dh);ctx.restore()}
async function submitLead(){const name=$('name').value.trim(),email=$('email').value.trim();if(!name||!email)return;try{await apiPost('submitPhotoLead',{activityId:activity.id,frameId:selected.id,name,email,phone:$('phone').value.trim(),source:$('source').value.trim()})}catch(e){}}
$('shootBtn').onclick=async()=>{const v=$('video'),c=$('canvas'),ctx=c.getContext('2d');drawCover(ctx,v,c.width,c.height);drawContain(ctx,v,c.width,c.height);if($('frame').complete&&$('frame').naturalWidth)ctx.drawImage($('frame'),0,0,c.width,c.height);const url=c.toDataURL('image/png',1);$('result').src=url;$('downloadBtn').href=url;$('resultCard').classList.remove('hidden');$('cameraCard').classList.add('hidden');await submitLead();scrollTo({top:$('resultCard').offsetTop-10,behavior:'smooth'})};$('againBtn').onclick=()=>{$('resultCard').classList.add('hidden');$('cameraCard').classList.remove('hidden')};load();
</script></body></html>
